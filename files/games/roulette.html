<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GOLD ROULETTE | Premium European Casino</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd966;
            --gold-bright: #ffe484;
            --gold-deep: #f5b042;
            --bg-deep: #0a0908;
            --card-bg: rgba(20, 18, 16, 0.75);
            --border-gold: rgba(255, 217, 102, 0.35);
            --shadow-gold: 0 0 30px rgba(255, 217, 102, 0.18);
            --red: #c0392b;
            --black-cell: #1a1a2e;
            --green-cell: #1a6b3c;
            --felt-green: #0f3d1f;
            --felt-dark: #082010;
            --radius-xl: 2.2rem;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --radius-full: 60px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-bg: rgba(18, 15, 11, 0.78);
            --glass-blur: 18px;
            --neon-gold: 0 0 18px rgba(255, 217, 102, 0.55), 0 0 40px rgba(255, 180, 40, 0.25);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0c0b0a 0%, #030202 100%);
            color: #f5f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        body.reduced-motion * {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0;
            animation: floatUp var(--dur, 7s) infinite ease-in;
            animation-delay: var(--delay, 0s);
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            12% { opacity: 0.55; transform: scale(1); }
            45% { transform: translateY(35vh) scale(0.5); opacity: 0.16; }
            100% { transform: translateY(-25vh) scale(0); opacity: 0; }
        }
        .game-container {
            max-width: 1250px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-full);
            padding: 0.6rem 1.6rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            gap: 0.5rem;
            animation: slideDown 0.6s var(--transition-bounce);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .back-home {
            text-decoration: none;
            color: var(--gold);
            font-weight: 600;
            background: rgba(255, 217, 102, 0.1);
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .back-home:hover {
            background: rgba(255, 217, 102, 0.2);
            transform: translateX(-3px);
        }
        .balance-tag {
            background: rgba(28, 24, 18, 0.9);
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid rgba(255, 217, 102, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }
        .balance-tag.pulse {
            animation: balancePulse 0.5s ease-out;
        }
        @keyframes balancePulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 217, 102, 0.5); }
            100% { box-shadow: 0 0 0 22px rgba(255, 217, 102, 0); }
        }
        .sound-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--gold);
            transition: transform 0.2s;
            padding: 0.3rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 217, 102, 0.06);
        }
        .sound-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 217, 102, 0.15);
        }
        .roulette-layout {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 1.5rem;
            align-items: start;
        }
        @media (max-width: 950px) {
            .roulette-layout { grid-template-columns: 1fr; }
        }
        .wheel-panel {
            background: linear-gradient(160deg, rgba(32, 24, 16, 0.96), rgba(12, 8, 4, 0.98));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 0 60px rgba(0,0,0,0.5), var(--shadow-gold);
            text-align: center;
            position: relative;
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 0.8rem;
            filter: drop-shadow(0 20px 35px rgba(0,0,0,0.8));
        }
        canvas#rouletteCanvas {
            width: 100%;
            height: auto;
            border-radius: 50%;
            display: block;
            transition: box-shadow 0.4s;
            cursor: pointer;
        }
        canvas#rouletteCanvas.spinning {
            box-shadow: 0 0 60px rgba(255, 217, 102, 0.5), 0 0 120px rgba(255, 180, 40, 0.25);
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 30px solid var(--gold);
            filter: drop-shadow(0 0 12px gold);
            z-index: 15;
            pointer-events: none;
        }
        .racetrack-overlay {
            position: absolute;
            inset: -18px;
            pointer-events: none;
            z-index: 8;
        }
        canvas#racetrackCanvas {
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }
        .game-notification {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.6rem 1.4rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.35s;
            pointer-events: none;
            border: 1px solid var(--border-gold);
            white-space: nowrap;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .game-notification.show { opacity: 1; }
        .last-numbers {
            display: flex;
            justify-content: center;
            gap: 0.35rem;
            flex-wrap: wrap;
            margin: 0.6rem 0;
            min-height: 30px;
            align-items: center;
        }
        .last-number-badge {
            border-radius: 30px;
            padding: 0.2rem 0.75rem;
            font-weight: 700;
            font-size: 0.8rem;
            animation: badgePop 0.35s var(--transition-bounce);
            border: 1px solid rgba(255,255,255,0.15);
        }
        @keyframes badgePop {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .hot-cold-row {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.7rem;
            margin: 0.3rem 0;
        }
        .hot-cold-row span {
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-weight: 600;
        }
        .chip-selector {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin: 0.6rem 0;
            align-items: center;
        }
        .chip {
            background: #2a2520;
            border: 2px solid rgba(255, 217, 102, 0.3);
            border-radius: 40px;
            padding: 0.35rem 0.9rem;
            font-weight: 700;
            color: var(--gold);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            min-width: 42px;
            text-align: center;
            position: relative;
        }
        .chip.selected {
            background: var(--gold-bright);
            color: #1a150e;
            border-color: var(--gold-bright);
            box-shadow: 0 0 18px var(--gold);
            transform: scale(1.08);
        }
        .chip:hover:not(.selected) {
            background: rgba(255, 217, 102, 0.2);
            border-color: rgba(255, 217, 102, 0.5);
        }
        .custom-bet {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            margin: 0.4rem 0;
        }
        .custom-bet input {
            background: #1f1b17;
            border: 2px solid rgba(255, 217, 102, 0.3);
            border-radius: 40px;
            padding: 0.5rem 1rem;
            width: 100px;
            text-align: center;
            color: #fff;
            font-weight: 700;
            outline: none;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .custom-bet input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255, 217, 102, 0.1);
        }
        .btn {
            border: none;
            border-radius: var(--radius-full);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.15s;
            padding: 0.65rem 1.4rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: none !important;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none !important;
            filter: grayscale(30%);
        }
        .btn-spin {
            background: linear-gradient(135deg, #f5b042, #ffd966);
            color: #1a150e;
            box-shadow: 0 4px 0 #a05f15, 0 6px 18px rgba(255, 180, 40, 0.3);
            width: 100%;
            margin-top: 0.6rem;
            font-size: 1.05rem;
            padding: 0.8rem;
        }
        .btn-spin:hover:not(:disabled) {
            box-shadow: 0 4px 0 #a05f15, 0 10px 28px rgba(255, 180, 40, 0.5);
            transform: translateY(-2px);
        }
        .btn-clear {
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid #ff8888;
            color: #ffaaaa;
            width: 100%;
            margin-top: 0.4rem;
        }
        .btn-clear:hover:not(:disabled) { background: rgba(255, 70, 70, 0.28); }
        .btn-auto {
            background: rgba(100, 149, 237, 0.18);
            border: 1px solid rgba(100, 149, 237, 0.5);
            color: #b8d4ff;
            font-size: 0.8rem;
            padding: 0.4rem 1rem;
        }
        .btn-auto.active {
            background: rgba(100, 149, 237, 0.4);
            border-color: #6495ed;
            animation: autoPulse 1s infinite;
        }
        @keyframes autoPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(100, 149, 237, 0.3); }
            50% { box-shadow: 0 0 22px rgba(100, 149, 237, 0.7); }
        }
        .btn-undo {
            background: rgba(255, 200, 100, 0.12);
            border: 1px solid rgba(255, 200, 100, 0.4);
            color: #ffcc80;
            font-size: 0.8rem;
            padding: 0.4rem 0.9rem;
        }
        .btn-undo:hover:not(:disabled) { background: rgba(255, 200, 100, 0.25); }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }
        .betting-panel {
            background: radial-gradient(circle at 30% 20%, #1a4a2a, var(--felt-dark));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 1.2rem;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(0,0,0,0.4);
            overflow-x: auto;
            animation: fadeInUp 0.55s ease-out;
            position: relative;
        }
        .bet-mode-row, .french-bets-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }
        .bet-mode-btn {
            font-size: 0.7rem;
            padding: 0.3rem 0.7rem;
            background: rgba(0,0,0,0.4);
            border-color: rgba(255,217,102,0.25);
        }
        .bet-mode-btn.active {
            background: var(--gold);
            color: #1a150e;
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(255,217,102,0.4);
        }
        .french-bet-btn {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(212,175,55,0.5);
            color: #e8d5a0;
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.68rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .french-bet-btn:hover {
            background: rgba(212,175,55,0.2);
            border-color: var(--gold);
            transform: translateY(-1px);
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-bottom: 8px;
            min-width: 300px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(212,175,55,0.25);
        }
        .number-cell {
            border-radius: 6px;
            padding: 7px 3px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            background: #1e1b16;
            min-height: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), inset 0 -1px 2px rgba(255,255,255,0.05);
        }
        .number-cell:hover {
            transform: scale(1.05);
            z-index: 2;
            box-shadow: 0 0 16px rgba(255, 217, 102, 0.4), inset 0 2px 4px rgba(0,0,0,0.6);
            border-color: var(--gold);
        }
        .number-cell .multiplier-badge {
            font-size: 0.55rem;
            color: var(--gold-bright);
            display: block;
            margin-top: 1px;
            font-weight: 600;
            opacity: 0.8;
        }
        .number-cell .chip-stack-visual {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            color: #ffed4e;
            pointer-events: none;
            text-shadow: 0 0 6px rgba(0,0,0,0.8);
        }
        .zero-cell {
            background: var(--green-cell);
            grid-column: span 3;
            font-size: 1.1rem;
            padding: 10px;
        }
        .zero-cell:hover { background: #1e8b4a; }
        .outside-bets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 10px 0;
            min-width: 300px;
        }
        .outside-bet,
        .dozen-bet,
        .column-bet {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.15s;
            font-weight: 600;
            font-size: 0.8rem;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .outside-bet:hover,
        .dozen-bet:hover,
        .column-bet:hover {
            background: rgba(255,217,102,0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 217, 102, 0.2);
            border-color: var(--gold);
        }
        .outside-bet .multiplier-badge,
        .dozen-bet .multiplier-badge,
        .column-bet .multiplier-badge {
            font-size: 0.55rem;
            color: var(--gold-bright);
            display: block;
            margin-top: 1px;
            font-weight: 600;
        }
        .dozens,
        .columns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 8px 0;
            min-width: 300px;
        }
        .bet-list-container {
            background: rgba(0, 0, 0, 0.55);
            border-radius: var(--radius-md);
            padding: 0.6rem;
            margin-top: 0.8rem;
            max-height: 140px;
            overflow-y: auto;
            border: 1px solid rgba(255, 217, 102, 0.15);
            backdrop-filter: blur(6px);
        }
        .bet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            padding: 4px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            transition: background 0.2s;
        }
        .bet-item:hover { background: rgba(255, 255, 255, 0.04); }
        .remove-bet {
            color: #ff8888;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .remove-bet:hover {
            color: #ff4444;
            transform: scale(1.2);
        }
        .total-bet-display {
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 0.6rem 0;
            flex-wrap: wrap;
        }
        .potential-win-display .multiplier {
            background: var(--gold);
            color: #000;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 0.3rem;
            font-weight: 800;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 0.7rem;
            background: rgba(0, 0, 0, 0.45);
            border-radius: var(--radius-md);
            padding: 1rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 217, 102, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .stat-cell { text-align: center; }
        .stat-value {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--gold);
            transition: all 0.3s;
        }
        .stat-value.pop { animation: statPop 0.4s var(--transition-bounce); }
        @keyframes statPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.45); color: #fff; }
            100% { transform: scale(1); }
        }
        .stat-label {
            font-size: 0.65rem;
            color: #9a9484;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .action-row {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 0.4rem;
        }
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: rgba(20, 16, 10, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-gold);
            border-radius: 1rem;
            padding: 0.65rem 1.1rem;
            color: #f5f0e6;
            font-weight: 600;
            font-size: 0.8rem;
            animation: toastIn 0.4s ease-out, toastOut 0.3s ease-in 2.6s forwards;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            max-width: 320px;
            pointer-events: auto;
        }
        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toastOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }
        .bet-mode-indicator {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 700;
            background: rgba(255, 217, 102, 0.15);
            color: var(--gold);
            margin-left: 0.5rem;
        }
        /* Locked state */

    <script>
        (function() {
            /* ═══════════════════════════════════════════════════════════════
               GOLD ROULETTE · PREMIUM EUROPEAN CASINO EDITION
               Fully refactored & enhanced: betting logic, animations,
               French bets, detailed stats, and luxury visual design.
               ═══════════════════════════════════════════════════════════════ */

            // ──────────────── AUDIO ENGINE ────────────────
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.masterGain = null;
                    this.musicGain = null;
                    this.sfxGain = null;
                    this.soundEnabled = true;
                    this.masterVolume = 0.8;
                    this.musicVolume = 0.4;
                    this.sfxVolume = 0.85;
                    this.initialized = false;
                    this.ambientOsc = null;
                }
                async init() {
                    if (this.initialized) return;
                    try {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = this.masterVolume;
                        this.masterGain.connect(this.ctx.destination);
                        this.musicGain = this.ctx.createGain();
                        this.musicGain.gain.value = this.musicVolume;
                        this.musicGain.connect(this.masterGain);
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.gain.value = this.sfxVolume;
                        this.sfxGain.connect(this.masterGain);
                        this.initialized = true;
                        this.startAmbient();
                    } catch (e) { /* silent */ }
                }
                async resume() {
                    if (!this.ctx || !this.soundEnabled) return;
                    if (this.ctx.state === 'suspended') await this.ctx.resume();
                }
                setMaster(v) { this.masterVolume = v; if (this.masterGain) this.masterGain.gain.value = v; }
                setMusic(v) { this.musicVolume = v; if (this.musicGain) this.musicGain.gain.value = v; }
                setSFX(v) { this.sfxVolume = v; if (this.sfxGain) this.sfxGain.gain.value = v; }
                startAmbient() {
                    if (!this.soundEnabled || !this.ctx || !this.initialized || this.ambientOsc) return;
                    this.resume();
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.connect(g);
                    g.connect(this.musicGain);
                    o.type = 'sine';
                    o.frequency.value = 48;
                    g.gain.value = 0.025;
                    o.start();
                    this.ambientOsc = { osc: o, gain: g };
                }
                stopAmbient() {
                    if (this.ambientOsc) { try { this.ambientOsc.osc.stop(); } catch (e) {} this.ambientOsc = null; }
                }
                play(type, detail = null) {
                    if (!this.soundEnabled || !this.initialized) return;
                    this.resume();
                    const now = this.ctx.currentTime;
                    const dest = this.sfxGain;
                    const mkOsc = (freq, type = 'sine', start = now, dur = 0.15, vol = 0.08) => {
                        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                        o.connect(g); g.connect(dest);
                        o.type = type; o.frequency.value = freq;
                        g.gain.setValueAtTime(vol, start);
                        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                        o.start(start); o.stop(start + dur);
                    };
                    switch (type) {
                        case 'chip': mkOsc(700 + Math.random() * 100, 'sine', now, 0.06, 0.06); break;
                        case 'spin_start': mkOsc(300, 'triangle', now, 0.4, 0.1); break;
                        case 'tick': mkOsc(1800 + Math.random() * 300, 'sine', now, 0.04, 0.03); break;
                        case 'ball_bounce': mkOsc(600 + Math.random() * 200, 'sine', now, 0.08, 0.05); break;
                        case 'land':
                            mkOsc(120, 'triangle', now, 0.35, 0.09);
                            mkOsc(80, 'sine', now + 0.05, 0.3, 0.06); break;
                        case 'win':
                            for (let i = 0; i < 4; i++) mkOsc(660 + i * 180, 'sine', now + i * 0.1, 0.4, 0.07);
                            break;
                        case 'loss': mkOsc(200, 'sawtooth', now, 0.4, 0.06); break;
                        case 'jackpot':
                            for (let i = 0; i < 5; i++) mkOsc(500 + i * 220, 'sine', now + i * 0.07, 0.5, 0.08);
                            break;
                        case 'click': mkOsc(500, 'sine', now, 0.05, 0.04); break;
                    }
                }
                destroy() {
                    this.stopAmbient();
                    if (this.ctx) { this.ctx.close().catch(() => {}); this.ctx = null; }
                    this.initialized = false;
                }
            }
            const audio = new AudioEngine();

            // ──────────────── TOASTS ────────────────
            function showToast(msg, icon = '✨') {

            // ──────────────── CONFETTI ────────────────
            function triggerConfetti(intensity = 'normal') {
                const canvas = document.getElementById('confettiCanvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                const particles = [];
                const count = intensity === 'jackpot' ? 400 : 200;
                const colors = ['#ffd966', '#f5b042', '#ffed4e', '#4caf50', '#ffaa00', '#ff6b6b', '#6495ed', '#fff'];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: -30 - Math.random() * 200,
                        size: Math.random() * 8 + 3,
                        speedY: Math.random() * 8 + 4,
                        speedX: (Math.random() - 0.5) * 6,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rot: Math.random() * 360,
                        rotSpeed: (Math.random() - 0.5) * 12,
                        shape: Math.random() > 0.5 ? 'coin' : 'diamond',
                        wobble: Math.random() * 3
                    });
                }
                let start = performance.now();
                let frame;
                function draw(now) {
                    if (now - start > 3000) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        cancelAnimationFrame(frame); return;
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.y += p.speedY;
                        p.x += p.speedX + Math.sin(now * 0.003 + p.wobble) * 1.5;
                        p.rot += p.rotSpeed;
                        p.speedY += 0.05;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, 1 - (now - start) / 3000);
                        if (p.shape === 'diamond') {
                            ctx.beginPath();
                            ctx.moveTo(0, -p.size);
                            ctx.lineTo(p.size / 2, 0);
                            ctx.lineTo(0, p.size);
                            ctx.lineTo(-p.size / 2, 0);
                            ctx.fill();
                        } else {
                            ctx.beginPath();
                            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    });
                    frame = requestAnimationFrame(draw);
                }
                frame = requestAnimationFrame(draw);
            }

            // ──────────────── WHEEL DATA ────────────────
            const wheelOrder = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
            const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

            function getColor(num) { if (num === 0) return 'green'; return redNumbers.includes(num) ? 'red' : 'black'; }

            // ──────────────── FRENCH BET PATTERNS ────────────────
            const frenchPatterns = {
                neighborsZero: { name: 'Neighbors of Zero', numbers: [3, 26, 0, 32, 15] },
                voisins: { name: 'Voisins du Zéro', numbers: [22, 18, 29, 7, 28, 12, 35, 3, 26, 0, 32, 15, 19, 4, 21, 2, 25] },
                jeuZero: { name: 'Jeu Zéro', numbers: [12, 35, 3, 26, 0, 32, 15] },
                tiers: { name: 'Tiers du Cylindre', numbers: [27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33] },
                orphelins: { name: 'Orphelins', numbers: [17, 34, 6, 1, 20, 14, 31, 9] }
            };

            // ──────────────── USER DATA ────────────────
            let currentUser = null;
            let sessionProfit = 0;
            let sessionTotalBet = 0;
            let sessionTotalWin = 0;
            let lastNumbers = [];
            let hotCounts = {};
            let bets = [];
            let selectedChip = 25;

            let lastBets = [];

            let autoSpinRemaining = 0;
            let autoSpinTimer = null;

            function deepMerge(target, defaults) {
                for (const key in defaults) {
                    if (defaults.hasOwnProperty(key)) {
                        if (target[key] === undefined) {
                            target[key] = defaults[key];
                        } else if (typeof defaults[key] === 'object' && defaults[key] !== null && !Array.isArray(defaults[key])) {
                            if (typeof target[key] !== 'object' || target[key] === null) target[key] = {};
                            deepMerge(target[key], defaults[key]);
                        }
                    }
                }
                return target;
            }

            function initUserStats(u) {
                const defaults = {
                    rouletteStats: {
                        gamesPlayed: 0, wins: 0, biggestWin: 0, totalBet: 0, totalWin: 0,
                        bestStreak: 0, currentStreak: 0, hotNumbers: {},
                        winningRounds: 0, profitableRounds: 0,

                deepMerge(u, defaults);
                if (!u.rouletteStats.hotNumbers) u.rouletteStats.hotNumbers = {};

            async function loadUser() {
                const sess = sessionStorage.getItem('gold_current_user');
                if (!sess) { window.location.href = '../../sign-in.html'; return false; }
                const su = JSON.parse(sess);
                const users = JSON.parse(localStorage.getItem('gold_users') || '{}');
                let user = users[su.username];
                if (!user) {
                    sessionStorage.removeItem('gold_current_user');
                    window.location.href = '../../sign-in.html';
                    return false;

                currentUser = initUserStats(user);
                hotCounts = { ...currentUser.rouletteStats.hotNumbers };

                updateStatsDisplay();
                updateHotColdDisplay();
                return true;

                const users = JSON.parse(localStorage.getItem('gold_users') || '{}');
                currentUser.rouletteStats.hotNumbers = hotCounts;
                users[currentUser.username] = currentUser;
                localStorage.setItem('gold_users', JSON.stringify(users));
                const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));

            function updateBalanceDisplay() {
                const el = document.getElementById('headerBalance');
                const prev = parseInt(el.textContent.replace(/,/g, '')) || 0;
                const next = currentUser.balance;
                if (prev !== next) {
                    animateNumber(el, prev, next, 400);
                    if (next > prev) document.getElementById('balanceTag').classList.add('pulse');
                    setTimeout(() => document.getElementById('balanceTag').classList.remove('pulse'), 500);
                } else el.textContent = next.toLocaleString();
            }

            function animateNumber(el, start, end, dur) {
                if (start === end) { el.textContent = end.toLocaleString(); return; }
                const range = end - start, st = performance.now();
                function step(now) {
                    const p = Math.min((now - st) / dur, 1),
                        eased = 1 - Math.pow(1 - p, 3);
                    el.textContent = Math.round(start + range * eased).toLocaleString();
                    if (p < 1) requestAnimationFrame(step);
                    else el.textContent = end.toLocaleString();
                }
                requestAnimationFrame(step);
            }

                const sorted = Object.entries(hotCounts).sort((a, b) => b[1] - a[1]);

                const cold = sorted.slice(-5).filter(([, c]) => c === 0 || (sorted.length > 10 && c <= 1));
                let html = '';

            function recordStats(winningNumber, totalBet, totalWin, netProfit) {
                sessionTotalBet += totalBet;
                sessionTotalWin += totalWin;
                const s = currentUser.rouletteStats;
                s.gamesPlayed = (s.gamesPlayed || 0) + 1;
                s.totalBet = (s.totalBet || 0) + totalBet;

                s.totalWagered = (s.totalWagered || 0) + totalBet;
                s.grossPayouts = (s.grossPayouts || 0) + totalWin;
                if (totalWin > 0) s.winningRounds = (s.winningRounds || 0) + 1;
                if (netProfit > 0) {
                    s.profitableRounds = (s.profitableRounds || 0) + 1;
                    s.wins = (s.wins || 0) + 1;
                    s.currentWinStreak = (s.currentWinStreak || 0) + 1;
                    s.currentLoseStreak = 0;
                    if (s.currentWinStreak > (s.bestWinStreak || 0)) s.bestWinStreak = s.currentWinStreak;
                    if (totalWin > (s.biggestWin || 0)) s.biggestWin = totalWin;
                } else if (netProfit < 0) {
                    s.currentLoseStreak = (s.currentLoseStreak || 0) + 1;
                    s.currentWinStreak = 0;
                    if (s.currentLoseStreak > (s.bestLoseStreak || 0)) s.bestLoseStreak = s.currentLoseStreak;
                } else {
                    s.currentWinStreak = 0;
                    s.currentLoseStreak = 0;
                }
                hotCounts[winningNumber] = (hotCounts[winningNumber] || 0) + 1;

                const g = currentUser.globalStats;
                g.totalGames = (g.totalGames || 0) + 1;
                g.totalWagered = (g.totalWagered || 0) + totalBet;
                g.totalWon = (g.totalWon || 0) + totalWin;
                if (netProfit > 0) {
                    g.totalWins = (g.totalWins || 0) + 1;
                    g.currentStreak = (g.currentStreak || 0) + 1;
                    if (g.currentStreak > (g.bestStreak || 0)) g.bestStreak = g.currentStreak;
                } else if (netProfit < 0) {
                    g.totalLosses = (g.totalLosses || 0) + 1;
                    g.currentStreak = 0;
                } else {
                    g.currentStreak = 0;
                }

                currentUser.xp = (currentUser.xp || 0) + Math.floor(totalBet * 0.5);
                checkLevelUp();
                currentUser.gamePlayCount['roulette'] = (currentUser.gamePlayCount['roulette'] || 0) + 1;
                currentUser.gameOutcomes.unshift({
                    game: 'Roulette',
                    result: netProfit > 0 ? 'win' : (netProfit < 0 ? 'loss' : 'push'),
                    profit: netProfit,
                    multiplier: totalBet > 0 ? totalWin / totalBet : 0,
                    bet: totalBet,
                    win: totalWin,
                    date: new Date().toISOString()
                });
                if (currentUser.gameOutcomes.length > 50) currentUser.gameOutcomes.pop();
                currentUser.transactions.unshift({
                    desc: `🎰 Roulette | ${netProfit >= 0 ? 'Won' : 'Lost'} ${Math.abs(netProfit)} (${winningNumber})`,
                    amount: netProfit,
                    type: netProfit >= 0 ? 'game_win' : 'game_loss',
                    date: new Date().toISOString()
                });
                if (currentUser.transactions.length > 30) currentUser.transactions.shift();
                checkAchievements(netProfit > 0, totalWin, totalBet);
                saveUser();
                updateStatsDisplay();
                updateHotColdDisplay();
            }

            function checkLevelUp() {

                if (currentUser.xp >= xpNeeded) {

            function checkAchievements(isWin, totalWin, totalBet) {
