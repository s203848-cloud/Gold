            // ──────────────── RACETRACK CLICK ────────────────
            racetrackCanvas.addEventListener('click', (e) => {
                if (spinning) return;
                const rc = racetrackCanvas;
                const rect = rc.getBoundingClientRect();
                const scaleX = rc.width / rect.width;
                const scaleY = rc.height / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                const cx = rc.width / 2,
                    cy = rc.height / 2;
                const dx = mx - cx,
                    dy = my - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const outerR = rc.width / 2 - 10;
                const innerR = outerR - 28;
                if (dist >= innerR && dist <= outerR) {
                    let angle = Math.atan2(dy, dx) + Math.PI / 2;
                    if (angle < 0) angle += Math.PI * 2;
                    const segIndex = Math.floor(angle / (Math.PI * 2 / 37)) % 37;
                    const num = wheelOrder[segIndex];
                    // Neighbors bet: num + 2 each side = 5 numbers
                    const neighbors = [];
                    for (let i = -2; i <= 2; i++) {
                        let idx = (segIndex + i + 37) % 37;
                        neighbors.push(wheelOrder[idx]);
                    }
                    const amount = getChipAmount();
                    const currentTotal = bets.reduce((s, b) => s + b.amount, 0);
                    const totalNeeded = amount * 5;
                    if (totalNeeded > currentUser.balance - currentTotal) {
                        showNotification('Not enough balance for neighbors bet!', false);
                        return;
                    }
                    neighbors.forEach(n => {
                        bets.push({
                            type: 'neighbors',
                            value: n,
                            key: 'neigh_' + num,
                            amount,
                            name: 'Neighbors of ' + num + ' (' + n + ')',
                            neighborNumbers: neighbors,
                            centerNumber: num
                        });
                    });
                    audio.play('chip');
                    renderBets();
                    updateBetTotals();
                    updateTableCellStacks();
                    updateRacetrackHighlight(num);
                    setTimeout(() => drawRacetrack(), 800);
                }
            });

            // ──────────────── BUILD TABLE ────────────────
            function buildTable() {
                const numbersGrid = document.getElementById('numbersGrid');
                numbersGrid.innerHTML = '';
                const zeroCell = document.createElement('div');
                zeroCell.className = 'number-cell zero-cell';
                zeroCell.dataset.num = '0';
                zeroCell.innerHTML = '0<span class="multiplier-badge">35:1</span>';
                zeroCell.addEventListener('click', () => handleNumberClick(0));
                numbersGrid.appendChild(zeroCell);
                for (let i = 1; i <= 36; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'number-cell';
                    cell.dataset.num = i;
                    cell.innerHTML = `${i}<span class="multiplier-badge">35:1</span>`;
                    cell.style.background = redNumbers.includes(i) ? '#8b2c2c' : '#1e3a3a';
                    cell.addEventListener('click', () => handleNumberClick(i));
                    cell.addEventListener('mouseenter', function() { this.style.boxShadow =
                            '0 0 12px var(--gold)'; });
                    cell.addEventListener('mouseleave', function() { this.style.boxShadow = ''; });
                    numbersGrid.appendChild(cell);
                }
                document.getElementById('outsideBetsContainer').innerHTML = outsideBetDefs.map(d =>
                    `<div class="outside-bet" data-key="${d.key}">${d.name}<span class="multiplier-badge">2:1</span></div>`
                ).join('');
                document.getElementById('dozensContainer').innerHTML = dozenDefs.map(d =>
                    `<div class="dozen-bet" data-key="${d.key}">${d.name}<span class="multiplier-badge">4:1</span></div>`
                ).join('');
                document.getElementById('columnsContainer').innerHTML = columnDefs.map(d =>
                    `<div class="column-bet" data-key="${d.key}">${d.name}<span class="multiplier-badge">4:1</span></div>`
                ).join('');

                document.querySelectorAll('.outside-bet').forEach(el => {
                    el.addEventListener('click', () => {
                        const key = el.dataset.key;
                        const def = outsideBetDefs.find(d => d.key === key);
                        if (def) addBet('outside', key, key, def.name);
                    });
                });
                document.querySelectorAll('.dozen-bet').forEach(el => {
                    el.addEventListener('click', () => {
                        const key = el.dataset.key;
                        const def = dozenDefs.find(d => d.key === key);
                        if (def) addBet('dozen', key, key, def.name);
                    });
                });
                document.querySelectorAll('.column-bet').forEach(el => {
                    el.addEventListener('click', () => {
                        const key = el.dataset.key;
                        const def = columnDefs.find(d => d.key === key);
                        if (def) addBet('column', key, key, def.name);
                    });
                });
            }

            function handleNumberClick(num) {
                if (spinning) return;
                switch (betMode) {
                    case 'straight':
                        addBet('number', num, num.toString(), num.toString());
                        break;
                    case 'split':
                        handleSplitBet(num);
                        break;
                    case 'street':
                        handleStreetBet(num);
                        break;
                    case 'corner':
                        handleCornerBet(num);
                        break;
                    default:
                        addBet('number', num, num.toString(), num.toString());
                }
            }

            function handleSplitBet(num) {
                if (num === 0) { addBet('number', 0, '0', '0'); return; }
                const row = Math.ceil(num / 3);
                const col = (num - 1) % 3;
                const adjacent = [];
                if (col < 2 && num + 1 <= 36) adjacent.push(num + 1);
                if (col > 0 && num - 1 >= 1) adjacent.push(num - 1);
                if (row < 12 && num + 3 <= 36) adjacent.push(num + 3);
                if (row > 1 && num - 3 >= 1) adjacent.push(num - 3);
                if (adjacent.length > 0) {
                    const partner = adjacent[0];
                    addBet('split', num, 'split_' + num + '_' + partner, 'Split ' + num + '/' + partner, {
                        splitNumbers: [num, partner],
                        partner
                    });
                } else {
                    addBet('number', num, num.toString(), num.toString());
                }
            }

            function handleStreetBet(num) {
                if (num === 0) { addBet('number', 0, '0', '0'); return; }
                const row = Math.ceil(num / 3);
                const start = (row - 1) * 3 + 1;
                const streetNums = [start, start + 1, start + 2];
                addBet('street', start, 'street_' + start, 'Street ' + start + '-' + (start + 2), {
                    streetNumbers: streetNums
                });
            }

            function handleCornerBet(num) {
                if (num === 0 || num > 33) { addBet('number', num, num.toString(), num.toString()); return; }
                const row = Math.ceil(num / 3);
                const col = (num - 1) % 3;
                if (col < 2 && row < 12) {
                    const cornerNums = [num, num + 1, num + 3, num + 4];
                    addBet('corner', num, 'corner_' + num, 'Corner ' + cornerNums.join('/'), { cornerNumbers: cornerNums });
                } else if (col === 2 && row < 12) {
                    const cornerNums = [num - 1, num, num + 2, num + 3];
                    addBet('corner', num, 'corner_' + num, 'Corner ' + cornerNums.join('/'), { cornerNumbers: cornerNums });
                } else {
                    addBet('number', num, num.toString(), num.toString());
                }
            }

            function addLastNumber(num) {
                lastNumbers.unshift(num);
                if (lastNumbers.length > 12) lastNumbers.pop();
                const container = document.getElementById('lastNumbersContainer');
                container.innerHTML = lastNumbers.map(n => {
                    const color = getColor(n);
                    const bg = color === 'red' ? '#8b2c2c' : (color === 'black' ? '#1e3a3a' : '#1a6b3c');
                    return `<span class="last-number-badge" style="background:${bg};color:#fff;">${n}</span>`;
                }).join('');
            }

            // ──────────────── EVENT BINDINGS ────────────────
            const spinBtn = document.getElementById('spinBtn');
            const clearBtn = document.getElementById('clearBetsBtn');
            spinBtn.addEventListener('click', (e) => { addRipple(e, spinBtn);
                spinWheel(); });
            clearBtn.addEventListener('click', (e) => { addRipple(e, clearBtn);
                clearAllBets();
                audio.play('click'); });
            document.getElementById('undoBtn').addEventListener('click', undoLastBet);
            document.getElementById('doubleBtn').addEventListener('click', doubleBets);
            document.getElementById('repeatBtn').addEventListener('click', repeatLastBets);
            document.getElementById('autoSpinBtn').addEventListener('click', toggleAutoSpin);

            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                audio.soundEnabled = !audio.soundEnabled;
                document.getElementById('soundToggleBtn').innerHTML = audio.soundEnabled ?
                    '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
                if (audio.soundEnabled) audio.startAmbient();
                else audio.stopAmbient();
                localStorage.setItem('gold_sound_enabled', audio.soundEnabled);
            });

            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove(
                    'selected'));
                    this.classList.add('selected');
                    selectedChip = parseInt(this.dataset.chip);
                    document.getElementById('customBetInput').value = selectedChip;
                    audio.play('click');
                });
            });

            document.getElementById('customBetInput').addEventListener('input', function() {
                const val = parseInt(this.value);
                if (!isNaN(val) && val > 0) selectedChip = val;
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            });

            document.querySelectorAll('.bet-mode-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.bet-mode-btn').forEach(b => b.classList.remove(
                        'active'));
                    this.classList.add('active');
                    betMode = this.dataset.mode;
                    const labels = { straight: 'Straight (35:1)', split: 'Split (17:1)',
                        street: 'Street (11:1)', corner: 'Corner (8:1)' };
                    document.getElementById('betModeIndicator').textContent = labels[
                        betMode] || 'Straight (35:1)';
                });
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.repeat && !spinning && !spinBtn.disabled) {
                    e.preventDefault();
                    spinWheel();
                }
                if (e.code === 'KeyC' && e.ctrlKey && !spinning) {
                    e.preventDefault();
                    clearAllBets();
                }
                if (e.code === 'KeyZ' && e.ctrlKey && !spinning) {
                    e.preventDefault();
                    undoLastBet();
                }
                if (e.code === 'KeyA' && e.ctrlKey && !spinning) {
                    e.preventDefault();
                    toggleAutoSpin();
                }
            });

            window.addEventListener('resize', () => {
                drawWheel();
                drawRacetrack();
            });

            // ──────────────── PARTICLES ────────────────
            function initParticles() {
                const container = document.getElementById('particlesContainer');
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = Math.random() * 5 + 2;
                    p.style.width = p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.setProperty('--delay', Math.random() * 8 + 's');
                    p.style.setProperty('--dur', (Math.random() * 6 + 5) + 's');
                    container.appendChild(p);
                }
            }

            // ──────────────── INIT ────────────────
            async function init() {
                initParticles();
                if (!(await loadUser())) return;
                drawWheel();
                drawRacetrack();
                buildTable();
                updateBetTotals();
                const savedSound = localStorage.getItem('gold_sound_enabled');
                if (savedSound === 'false') {
                    audio.soundEnabled = false;
                    document.getElementById('soundToggleBtn').innerHTML =
                    '<i class="fas fa-volume-mute"></i>';
                }
                await audio.init();
                document.body.addEventListener('click', () => audio.init(), { once: true });
                document.body.addEventListener('touchstart', () => audio.init(), { once: true });
                document.body.addEventListener('keydown', () => audio.init(), { once: true });
            }

            init();

            // Cleanup
            window.addEventListener('beforeunload', () => {
                if (autoSpinTimer) clearTimeout(autoSpinTimer);
                if (animationFrame) cancelAnimationFrame(animationFrame);
                audio.destroy();
            });

            console.log('%c🎰 GOLD ROULETTE %c| Premium Casino Edition %cLoaded',
                'color:#ffd966;font-size:1.1rem;',
                'color:#f5f0e6;',
                'color:#aaffaa;');
        })();
    </script>
</body>
</html>
