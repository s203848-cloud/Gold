            }

            // ──────────────── WHEEL ANIMATION ────────────────
            let wheelAngle = -Math.PI / 2; // aligned with racetrack
            let ballAngle = -Math.PI / 2;
            let ballOrbitRadius = 0;
            let spinning = false;
            let animationFrame = null;
            const canvas = document.getElementById('rouletteCanvas');
            const ctx = canvas.getContext('2d');
            const racetrackCanvas = document.getElementById('racetrackCanvas');
            const racetrackCtx = racetrackCanvas.getContext('2d');

            function drawWheel() {
                const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
                const r = w / 2 - 10;
                ctx.clearRect(0, 0, w, h);

                // Outer wood rim
                const woodGrad = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r + 10);
                woodGrad.addColorStop(0, '#5c3a1e');
                woodGrad.addColorStop(0.5, '#3a2210');
                woodGrad.addColorStop(1, '#1a0e05');
                ctx.beginPath();
                ctx.arc(cx, cy, r + 10, 0, Math.PI * 2);
                ctx.fillStyle = woodGrad;
                ctx.fill();
                ctx.strokeStyle = '#b8860b';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Brass rim
                const brassGrad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
                brassGrad.addColorStop(0, '#d4af37');
                brassGrad.addColorStop(0.3, '#f5e6a8');
                brassGrad.addColorStop(0.5, '#b8860b');
                brassGrad.addColorStop(0.7, '#f5e6a8');
                brassGrad.addColorStop(1, '#8b6508');
                ctx.beginPath();
                ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
                ctx.strokeStyle = brassGrad;
                ctx.lineWidth = 6;
                ctx.stroke();

                // Number pockets
                for (let i = 0; i < 37; i++) {
                    const start = i * (Math.PI * 2 / 37) + wheelAngle;
                    const end = start + Math.PI * 2 / 37;
                    const num = wheelOrder[i];
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, r, start, end);
                    ctx.closePath();
                    let color;
                    if (num === 0) color = '#1a6b3c';
                    else if (redNumbers.includes(num)) color = '#c0392b';
                    else color = '#1a1a2e';
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    // Brass fret
                    ctx.beginPath();
                    ctx.moveTo(cx + r * 0.25 * Math.cos(start), cy + r * 0.25 * Math.sin(start));
                    ctx.lineTo(cx + r * Math.cos(start), cy + r * Math.sin(start));
                    ctx.strokeStyle = '#d4af37';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // Number label
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(start + Math.PI / 37);
                    ctx.fillStyle = '#ffd966';
                    ctx.font = `bold ${r * 0.06}px 'Playfair Display', serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(num, r * 0.75, 0);
                    ctx.restore();
                }

                // Inner track ring
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.25, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(212,175,55,0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Center hub
                const hubGrad = ctx.createRadialGradient(cx, cy, r * 0.02, cx, cy, r * 0.18);
                hubGrad.addColorStop(0, '#fff8dc');
                hubGrad.addColorStop(0.4, '#d4af37');
                hubGrad.addColorStop(0.7, '#b8860b');
                hubGrad.addColorStop(1, '#5c3a1e');
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.18, 0, Math.PI * 2);
                ctx.fillStyle = hubGrad;
                ctx.fill();
                ctx.strokeStyle = '#f5e6a8';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Decorative cross on hub
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(wheelAngle * 0.5);
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    ctx.rotate(Math.PI / 2);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -r * 0.15);
                    ctx.stroke();
                }
                ctx.restore();

                // Outer glow
                ctx.beginPath();
                ctx.arc(cx, cy, r + 12, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255,217,102,0.15)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            function drawRacetrack() {
                const rc = racetrackCanvas, rctx = racetrackCtx;
                const w = rc.width, h = rc.height, cx = w / 2, cy = h / 2;
                rctx.clearRect(0, 0, w, h);
                const outerR = w / 2 - 10;
                const innerR = outerR - 28;
                rctx.beginPath();
                rctx.arc(cx, cy, outerR, 0, Math.PI * 2);
                rctx.arc(cx, cy, innerR, 0, Math.PI * 2, true);
                rctx.fillStyle = 'rgba(20,16,10,0.75)';
                rctx.fill();
                rctx.strokeStyle = 'rgba(255,217,102,0.4)';
                rctx.lineWidth = 2;
                rctx.stroke();
                for (let i = 0; i < 37; i++) {
                    const num = wheelOrder[i];
                    const startAngle = i * (Math.PI * 2 / 37) - Math.PI / 2;
                    const endAngle = (i + 1) * (Math.PI * 2 / 37) - Math.PI / 2;
                    const midAngle = (startAngle + endAngle) / 2;
                    const midR = (outerR + innerR) / 2;
                    rctx.save();
                    rctx.translate(cx, cy);
                    rctx.rotate(midAngle);
                    rctx.fillStyle = '#ffd966';
                    rctx.font = 'bold 9px Inter';
                    rctx.textAlign = 'center';
                    rctx.fillText(num, midR, 3);
                    rctx.restore();
                }
            }

            function drawBallAtAngle(angle, orbitR) {
                const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
                const bx = cx + orbitR * Math.cos(angle);
                const by = cy + orbitR * Math.sin(angle);
                const br = 9;
                ctx.beginPath();
                ctx.arc(bx + 2, by + 3, br, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();
                const glow = ctx.createRadialGradient(bx, by, br * 0.5, bx, by, br * 3);
                glow.addColorStop(0, 'rgba(255,255,255,0.5)');
                glow.addColorStop(0.5, 'rgba(255,220,100,0.15)');
                glow.addColorStop(1, 'rgba(255,180,40,0)');
                ctx.beginPath();
                ctx.arc(bx, by, br * 3, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();
                const ballGrad = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.4, br * 0.1, bx, by, br);
                ballGrad.addColorStop(0, '#ffffff');
                ballGrad.addColorStop(0.4, '#f0f0f0');
                ballGrad.addColorStop(0.8, '#b0b0b0');
                ballGrad.addColorStop(1, '#707070');
                ctx.beginPath();
                ctx.arc(bx, by, br, 0, Math.PI * 2);
                ctx.fillStyle = ballGrad;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(bx - br * 0.3, by - br * 0.3, br * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fill();
            }

            async function spinWheel() {
                if (spinning) return;
                const totalBet = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                if (totalBet === 0) {
                    showNotification('Place a bet first!', false);
                    if (autoSpinActive) stopAutoSpin();
                    return;
                }
                if (totalBet > currentUser.balance) {
                    showNotification('Insufficient balance!', false);
                    if (autoSpinActive) stopAutoSpin();
                    return;
                }

                spinning = true;
                setBettingLocked(true);
                spinBtn.disabled = true;
                clearBtn.disabled = true;
                canvas.classList.add('spinning');
                audio.play('spin_start');

                lastBets = cloneBets(bets);
                currentUser.balance -= totalBet;
                await saveUser();
                updateBalanceDisplay();

                const winningNumber = Math.floor(Math.random() * 37);
                const segIndex = wheelOrder.indexOf(winningNumber);
                const pointerAngle = -Math.PI / 2;
                const segmentCenter = segIndex * (Math.PI * 2 / 37) + (Math.PI / 37);
                const targetWheelAngle = pointerAngle - segmentCenter;

                const startWheelAngle = wheelAngle;
                let finalWheelAngle = targetWheelAngle;
                while (finalWheelAngle <= startWheelAngle) finalWheelAngle += Math.PI * 2;
                finalWheelAngle += (6 + Math.random() * 5) * Math.PI * 2;

                const spinStart = performance.now();
                const spinDuration = 5000 + Math.random() * 1500;
                const maxOrbitR = canvas.width / 2 - 22;
                const r = canvas.width / 2 - 10;
                const pocketR = r * 0.75;

                const finalBallAngle = pointerAngle;
                const startBallAngle = finalBallAngle + Math.PI * 2 * (10 + Math.random() * 8);
                const totalBallRotation = startBallAngle - finalBallAngle;

                let lastTickAngle = startBallAngle;
                const tickThreshold = Math.PI * 2 / 37;

                function animate(now) {
                    const elapsed = now - spinStart;
                    const t = Math.min(1, elapsed / spinDuration);

                    const wheelEase = 1 - Math.pow(1 - t, 4);
                    wheelAngle = startWheelAngle + (finalWheelAngle - startWheelAngle) * wheelEase;

                    const ballEase = 1 - Math.pow(1 - t, 5);
                    ballAngle = startBallAngle - totalBallRotation * ballEase;

                    let radiusT = Math.max(0, (t - 0.55) / 0.45);
                    radiusT = Math.min(1, radiusT);
                    const radiusEase = 1 - Math.pow(1 - radiusT, 2);
                    ballOrbitRadius = maxOrbitR - (maxOrbitR - pocketR) * radiusEase;

                    if (Math.abs(ballAngle - lastTickAngle) > tickThreshold && t < 0.9) {
                        audio.play('tick');
                        lastTickAngle = ballAngle;
                    }
                    if (t > 0.9 && Math.random() < 0.1) audio.play('ball_bounce');

                    drawWheel();
                    drawBallAtAngle(ballAngle, ballOrbitRadius);

                    if (t < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        wheelAngle = finalWheelAngle;
                        ballAngle = finalBallAngle;
                        ballOrbitRadius = pocketR;
                        drawWheel();
                        drawBallAtAngle(ballAngle, ballOrbitRadius);
                        audio.play('land');
                        setTimeout(() => finishSpin(winningNumber, totalBet), 400);
                    }
                }
                animationFrame = requestAnimationFrame(animate);
            }

            async function finishSpin(winningNumber, totalBet) {
                spinning = false;
                canvas.classList.remove('spinning');
                if (animationFrame) cancelAnimationFrame(animationFrame);

                let totalWin = 0;
                bets.forEach(bet => { totalWin += getPayoutForNumber(bet, winningNumber); });

                const netProfit = totalWin - totalBet;
                sessionProfit += netProfit;
                currentUser.balance += totalWin;
                await saveUser();
                recordStats(winningNumber, totalBet, totalWin, netProfit);
                addLastNumber(winningNumber);
                updateBalanceDisplay();
                updateStatsDisplay();

                if (totalWin > 0) {
                    if (totalWin >= totalBet * 10) {
                        audio.play('jackpot');
                        triggerConfetti('jackpot');
                        showNotification(`🎉 JACKPOT! Won ${totalWin} GOLD! (${winningNumber})`, true);
                        showToast(`Jackpot! +${totalWin} GOLD on ${winningNumber}!`, '💎');
                    } else {
                        audio.play('win');
                        triggerConfetti('normal');
                        showNotification(`🎉 Won ${totalWin} GOLD! (${winningNumber})`, true);
                    }
                } else {
                    audio.play('loss');
                    showNotification(`💥 Lost ${totalBet} GOLD (${winningNumber})`, false);
                }

                if (!autoSpinActive) {
                    bets = [];
                    renderBets();
                    updateBetTotals();
                    updateTableCellStacks();
                    setBettingLocked(false);
                    spinBtn.disabled = false;
                    clearBtn.disabled = false;
                } else {
                    updateBetTotals();
                }

                highlightWinningCells(winningNumber);
                updateRacetrackHighlight(winningNumber);

                if (autoSpinActive && autoSpinRemaining > 0) {
                    autoSpinRemaining--;
                    updateAutoSpinDisplay();
                    if (autoSpinRemaining <= 0) {
                        stopAutoSpin();
                    } else {
                        const nextTotalBet = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                        if (nextTotalBet > currentUser.balance) {
                            showNotification('Insufficient balance for next autoplay spin. Stopping.', false);
                            stopAutoSpin();
                        } else {
                            autoSpinTimer = setTimeout(() => spinWheel(), 1000);
                        }
                    }
                } else if (autoSpinActive && autoSpinRemaining <= 0) {
                    stopAutoSpin();
                }
            }

            function highlightWinningCells(winningNumber) {
                const cells = document.querySelectorAll('.number-cell');
                cells.forEach(cell => {
                    const cellNum = parseInt(cell.dataset.num);
                    if (cellNum === winningNumber) {
                        cell.style.boxShadow = '0 0 25px #ffed4e, 0 0 50px #ffd966';
                        cell.style.borderColor = '#ffed4e';
                        cell.style.zIndex = '5';
                        setTimeout(() => {
                            cell.style.boxShadow = '';
                            cell.style.borderColor = 'rgba(255,255,255,0.08)';
                            cell.style.zIndex = '';
                        }, 2500);
                    }
                });
            }

            function updateRacetrackHighlight(winningNumber) {
                drawRacetrack();
                const rc = racetrackCanvas, rctx = racetrackCtx;
                const w = rc.width, h = rc.height, cx = w / 2, cy = h / 2;
                const outerR = w / 2 - 10, innerR = outerR - 28;
                const segIndex = wheelOrder.indexOf(winningNumber);
                const startAngle = segIndex * (Math.PI * 2 / 37) - Math.PI / 2;
                const endAngle = (segIndex + 1) * (Math.PI * 2 / 37) - Math.PI / 2;
                rctx.beginPath();
                rctx.arc(cx, cy, outerR, startAngle, endAngle);
                rctx.arc(cx, cy, innerR, endAngle, startAngle, true);
                rctx.fillStyle = 'rgba(255,237,78,0.5)';
                rctx.fill();
                setTimeout(() => drawRacetrack(), 2500);
            }

            function showNotification(msg, isWin = true) {
                const notif = document.getElementById('gameNotification');
                notif.textContent = msg;
                notif.style.color = isWin ? '#aaffaa' : '#ff8888';
                notif.style.borderColor = isWin ? '#aaffaa' : '#ff8888';
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 3000);
            }

            // ──────────────── BETTING LOGIC ────────────────
            const outsideBetDefs = [
                { name: 'Red', key: 'red', condition: n => n !== 0 && redNumbers.includes(n), payout: 1 },
                { name: 'Black', key: 'black', condition: n => n !== 0 && !redNumbers.includes(n), payout: 1 },
                { name: 'Odd', key: 'odd', condition: n => n !== 0 && n % 2 === 1, payout: 1 },
                { name: 'Even', key: 'even', condition: n => n !== 0 && n % 2 === 0, payout: 1 },
                { name: '1-18', key: 'low', condition: n => n >= 1 && n <= 18, payout: 1 },
                { name: '19-36', key: 'high', condition: n => n >= 19 && n <= 36, payout: 1 }
            ];
            const dozenDefs = [
                { name: '1st 12', key: 'doz1', condition: n => n >= 1 && n <= 12, payout: 2 },
                { name: '2nd 12', key: 'doz2', condition: n => n >= 13 && n <= 24, payout: 2 },
                { name: '3rd 12', key: 'doz3', condition: n => n >= 25 && n <= 36, payout: 2 }
            ];
            const columnDefs = [
                { name: 'Col 1', key: 'col1', condition: n => n !== 0 && n % 3 === 1, payout: 2 },
                { name: 'Col 2', key: 'col2', condition: n => n !== 0 && n % 3 === 2, payout: 2 },
                { name: 'Col 3', key: 'col3', condition: n => n !== 0 && n % 3 === 0, payout: 2 }
            ];

            function getChipAmount() {
                const val = parseFloat(document.getElementById('customBetInput').value);
                return (isNaN(val) || val <= 0) ? selectedChip : Math.floor(val);
            }

            function getBetTotalAmount(bet) {
                if (bet.type === 'pattern') return bet.totalAmount;
                return bet.amount;
            }

            function getPayoutForNumber(bet, n) {
                switch (bet.type) {
                    case 'straight': return bet.number === n ? bet.amount * 36 : 0;
                    case 'split': return bet.numbers.includes(n) ? bet.amount * 18 : 0;
                    case 'street': return bet.numbers.includes(n) ? bet.amount * 12 : 0;
                    case 'corner': return bet.numbers.includes(n) ? bet.amount * 9 : 0;
                    case 'outside': {
                        const def = outsideBetDefs.find(d => d.key === bet.key);
                        return def && def.condition(n) ? bet.amount * (def.payout + 1) : 0;
                    }
                    case 'dozen': {
                        const def = dozenDefs.find(d => d.key === bet.key);
                        return def && def.condition(n) ? bet.amount * (def.payout + 1) : 0;
                    }
                    case 'column': {
                        const def = columnDefs.find(d => d.key === bet.key);
                        return def && def.condition(n) ? bet.amount * (def.payout + 1) : 0;
                    }
                    case 'pattern': return bet.numbers.includes(n) ? bet.amountPerNumber * 36 : 0;
                    default: return 0;
                }
            }

            function getPayoutString(bet) {
                switch (bet.type) {
                    case 'straight': return '35:1';
                    case 'split': return '17:1';
                    case 'street': return '11:1';
                    case 'corner': return '8:1';
                    case 'outside': return '1:1';
                    case 'dozen': return '2:1';
                    case 'column': return '2:1';
                    case 'pattern': return '35:1 each';
                    default: return '';
                }
            }

            function calculateMaxPotentialWin() {
                const totalBet = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                if (totalBet === 0) return { maxWin: 0, maxMultiplier: 0 };
                let maxWin = 0;
                for (let n = 0; n <= 36; n++) {
                    let win = 0;
                    bets.forEach(bet => { win += getPayoutForNumber(bet, n); });
                    if (win > maxWin) maxWin = win;
                }
                return { maxWin, maxMultiplier: maxWin / totalBet };
            }

            function canPlaceBet(amount) {
                const currentTotal = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                if (amount > currentUser.balance - currentTotal) {
                    showNotification('Not enough balance!', false);
                    return false;
                }
                return true;
            }

            function afterBetPlaced() {
                audio.play('chip');
                renderBets();
                updateBetTotals();
                updateTableCellStacks();
            }

            function addStraightBet(num) {
                if (bettingLocked) return;
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'straight', number: num, amount, name: num.toString() });
                afterBetPlaced();
            }

            function addSplitBet(num, partner) {
                if (bettingLocked) return;
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'split', numbers: [num, partner], amount, name: `Split ${num}/${partner}` });
                afterBetPlaced();
            }

            function addStreetBet(start) {
                if (bettingLocked) return;
                const numbers = [start, start + 1, start + 2];
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'street', numbers, amount, name: `Street ${start}-${start + 2}` });
                afterBetPlaced();
            }

            function addCornerBet(numbers, label) {
                if (bettingLocked) return;
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'corner', numbers, amount, name: `Corner ${label}` });
                afterBetPlaced();
            }

            function addOutsideBet(key) {
                if (bettingLocked) return;
                const def = outsideBetDefs.find(d => d.key === key);
                if (!def) return;
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'outside', key, amount, name: def.name });
                afterBetPlaced();
            }

            function addDozenBet(key) {
                if (bettingLocked) return;
                const def = dozenDefs.find(d => d.key === key);
                if (!def) return;
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'dozen', key, amount, name: def.name });
                afterBetPlaced();
            }

            function addColumnBet(key) {
                if (bettingLocked) return;
                const def = columnDefs.find(d => d.key === key);
                if (!def) return;
                const amount = getChipAmount();
                if (!canPlaceBet(amount)) return;
                bets.push({ type: 'column', key, amount, name: def.name });
                afterBetPlaced();
            }

            function addPatternBet(patternKey) {
                if (bettingLocked) return;
                const pattern = frenchPatterns[patternKey];
                if (!pattern) return;
                const amountPerNumber = getChipAmount();
                const totalAmount = amountPerNumber * pattern.numbers.length;
                if (totalAmount > currentUser.balance - bets.reduce((s, b) => s + getBetTotalAmount(b), 0)) {
                    showNotification('Not enough balance for this pattern!', false);
                    return;
                }
                bets.push({
                    type: 'pattern',
                    patternKey,
                    name: pattern.name,
                    numbers: [...pattern.numbers],
                    amountPerNumber,
                    totalAmount,
                    groupId: 'pattern_' + Date.now() + '_' + Math.random()
                });
                afterBetPlaced();
                showToast(`Placed ${pattern.name} (${pattern.numbers.length} numbers)`, '🎯');
            }

            function addNeighborsBet(centerNum) {
                if (bettingLocked) return;
                const segIndex = wheelOrder.indexOf(centerNum);
                const neighbors = [];
                for (let i = -2; i <= 2; i++) {
                    const idx = (segIndex + i + 37) % 37;
                    neighbors.push(wheelOrder[idx]);
                }
                const amountPerNumber = getChipAmount();
                const totalAmount = amountPerNumber * neighbors.length;
                if (totalAmount > currentUser.balance - bets.reduce((s, b) => s + getBetTotalAmount(b), 0)) {
                    showNotification('Not enough balance for neighbors bet!', false);
                    return;
                }
                bets.push({
                    type: 'pattern',
                    patternKey: 'neighbors_' + centerNum,
                    name: `Neighbors of ${centerNum}`,
                    numbers: neighbors,
                    amountPerNumber,
                    totalAmount,
                    groupId: 'neighbors_' + Date.now() + '_' + Math.random()
                });
                afterBetPlaced();
                showToast(`Neighbors of ${centerNum} placed`, '🎯');
            }

            function removeBet(index) {
                if (bettingLocked) return;
                bets.splice(index, 1);
                renderBets();
                updateBetTotals();
                updateTableCellStacks();
                audio.play('click');
            }

            function clearAllBets() {
                if (bettingLocked) return;
                bets = [];
                renderBets();
                updateBetTotals();
                updateTableCellStacks();
                document.querySelectorAll('.number-cell .chip-stack-visual').forEach(el => el.remove());
                audio.play('click');
            }

            function undoLastBet() {
                if (bettingLocked || bets.length === 0) return;
                bets.pop();
                renderBets();
                updateBetTotals();
                updateTableCellStacks();
                audio.play('click');
            }

            function doubleBets() {
                if (bettingLocked) return;
                const currentTotal = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                if (currentTotal * 2 > currentUser.balance) {
                    showNotification('Not enough balance to double!', false);
                    return;
                }
                bets.forEach(b => {
                    if (b.type === 'pattern') {
                        b.amountPerNumber *= 2;
                        b.totalAmount *= 2;
                    } else {
                        b.amount *= 2;
                    }
                });
                renderBets();
                updateBetTotals();
                updateTableCellStacks();
                audio.play('click');
                showToast('All bets doubled!', '📈');
            }

            function repeatLastBets() {
                if (bettingLocked || lastBets.length === 0) return;
                const total = lastBets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                if (total > currentUser.balance) {
                    showNotification('Not enough balance to repeat!', false);
                    return;
                }
                bets = cloneBets(lastBets);
                renderBets();
                updateBetTotals();
                updateTableCellStacks();
                audio.play('click');
                showToast('Last round bets repeated!', '🔁');
            }

            function cloneBets(betsArray) {
                return betsArray.map(b => {
                    const copy = { ...b };
                    if (b.numbers) copy.numbers = [...b.numbers];
                    return copy;
                });
            }

            function updateBetTotals() {
                const total = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                document.getElementById('totalBetDisplay').textContent = total;
                if (total === 0) {
                    document.getElementById('potentialWinDisplay').textContent = '0';
                    document.getElementById('maxMultiplierBadge').style.display = 'none';
                    return;
                }
                const { maxWin, maxMultiplier } = calculateMaxPotentialWin();
                document.getElementById('potentialWinDisplay').textContent = maxWin;
                const badge = document.getElementById('maxMultiplierBadge');
                badge.textContent = `Max x${maxMultiplier.toFixed(1)}`;
                badge.style.display = 'inline-block';
            }

            function renderBets() {
                const container = document.getElementById('betListContainer');
                if (bets.length === 0) {
                    container.innerHTML = '<div style="color:#aaa;text-align:center;">Your bets appear here</div>';
                    return;
                }
                container.innerHTML = bets.map((b, i) => {
                    let name = b.name, amount = getBetTotalAmount(b), payoutStr = getPayoutString(b);
                    return `<div class="bet-item">
                        <span>${name} <span style="color:var(--gold);">(${payoutStr})</span></span>
                        <span>${amount} GOLD <span class="remove-bet" data-index="${i}"><i class="fas fa-times-circle"></i></span></span>
                    </div>`;
                }).join('');
                document.querySelectorAll('.remove-bet').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeBet(parseInt(el.dataset.index));
                    });
                });
            }

            function updateTableCellStacks() {
                const cells = document.querySelectorAll('.number-cell');
                cells.forEach(cell => {
                    const num = parseInt(cell.dataset.num);
                    let totalOnCell = 0;
                    bets.forEach(b => {
                        if (b.type === 'straight' && b.number === num) totalOnCell += b.amount;
                        else if (b.type === 'split' && b.numbers.includes(num)) totalOnCell += b.amount;
                        else if (b.type === 'street' && b.numbers.includes(num)) totalOnCell += b.amount;
                        else if (b.type === 'corner' && b.numbers.includes(num)) totalOnCell += b.amount;
                        else if (b.type === 'pattern' && b.numbers.includes(num)) totalOnCell += b.amountPerNumber;
                    });
                    let indicator = cell.querySelector('.chip-stack-visual');
                    if (totalOnCell > 0) {
                        if (!indicator) {
                            indicator = document.createElement('span');
                            indicator.className = 'chip-stack-visual';
                            cell.appendChild(indicator);
                        }
                        indicator.textContent = '🪙' + (totalOnCell >= 1000 ? Math.floor(totalOnCell / 1000) + 'K' : totalOnCell);
                    } else if (indicator) {
                        indicator.remove();
                    }
                });
            }

            function handleNumberClick(num) {
                if (bettingLocked) return;
                switch (betMode) {
                    case 'straight': addStraightBet(num); break;
                    case 'split': {
                        if (num === 0) { addStraightBet(0); return; }
                        const row = Math.ceil(num / 3);
                        const col = (num - 1) % 3;
                        const adjacent = [];
                        if (col < 2 && num + 1 <= 36) adjacent.push(num + 1);
                        if (col > 0 && num - 1 >= 1) adjacent.push(num - 1);
                        if (row < 12 && num + 3 <= 36) adjacent.push(num + 3);
                        if (row > 1 && num - 3 >= 1) adjacent.push(num - 3);
                        if (adjacent.length > 0) addSplitBet(num, adjacent[0]);
                        else addStraightBet(num);
                        break;
                    }
                    case 'street': {
                        if (num === 0) { addStraightBet(0); return; }
                        const row = Math.ceil(num / 3);
                        const start = (row - 1) * 3 + 1;
                        addStreetBet(start);
                        break;
                    }
                    case 'corner': {
                        if (num === 0 || num > 33) { addStraightBet(num); return; }
                        const row = Math.ceil(num / 3);
                        const col = (num - 1) % 3;
                        if (col < 2 && row < 12) addCornerBet([num, num + 1, num + 3, num + 4], `${num}/${num + 1}/${num + 3}/${num + 4}`);
                        else if (col === 2 && row < 12) addCornerBet([num - 1, num, num + 2, num + 3], `${num - 1}/${num}/${num + 2}/${num + 3}`);
                        else addStraightBet(num);
                        break;
                    }
                    default: addStraightBet(num);
                }
            }

            function addLastNumber(num) {
                lastNumbers.unshift(num);
                if (lastNumbers.length > 12) lastNumbers.pop();
                const container = document.getElementById('lastNumbersContainer');
                container.innerHTML = lastNumbers.map(n => {
                    const color = getColor(n);
                    const bg = color === 'red' ? '#8b2c2c' : (color === 'black' ? '#1e3a3a' : '#1a6b3c');
                    return `<span class="last-number-badge" style="background:${bg};color:#fff;">${n}</span>`;
                }).join('');
            }

            // ──────────────── BETTING LOCK ────────────────
            function setBettingLocked(locked) {
                bettingLocked = locked;
                document.body.classList.toggle('locked', locked);
                document.getElementById('customBetInput').disabled = locked;
                document.getElementById('undoBtn').disabled = locked;
                document.getElementById('doubleBtn').disabled = locked;
                document.getElementById('repeatBtn').disabled = locked;
                document.getElementById('clearBetsBtn').disabled = locked;
            }

            // ──────────────── AUTO SPIN ────────────────
            function toggleAutoSpin() {
                if (autoSpinActive) { stopAutoSpin(); return; }
                const totalBet = bets.reduce((s, b) => s + getBetTotalAmount(b), 0);
                if (totalBet === 0) {
                    showNotification('Place bets first!', false);
                    return;
                }
                autoSpinActive = true;
                autoSpinRemaining = 10;
                document.getElementById('autoSpinBtn').classList.add('active');
                document.getElementById('autoSpinBtn').innerHTML = '<i class="fas fa-stop"></i> Stop Auto';
                updateAutoSpinDisplay();
                showToast('Auto-spin started (10 rounds)', '🤖');
                spinBtn.disabled = true;
                spinWheel();
            }

            function stopAutoSpin() {
                autoSpinActive = false;
                autoSpinRemaining = 0;
                if (autoSpinTimer) clearTimeout(autoSpinTimer);
                autoSpinTimer = null;
                document.getElementById('autoSpinBtn').classList.remove('active');
                document.getElementById('autoSpinBtn').innerHTML = '<i class="fas fa-robot"></i> Auto';
                document.getElementById('autoSpinCount').style.display = 'none';
                spinBtn.disabled = false;
                clearBtn.disabled = false;
                setBettingLocked(false);
            }

            function updateAutoSpinDisplay() {
                const el = document.getElementById('autoSpinCount');
                if (autoSpinActive && autoSpinRemaining > 0) {
                    el.style.display = 'inline';
                    el.textContent = '⏳ ' + autoSpinRemaining + ' left';
                } else {
                    el.style.display = 'none';
                }
            }

            // ──────────────── RACETRACK CLICK ────────────────
            racetrackCanvas.addEventListener('click', (e) => {
                if (spinning || bettingLocked) return;
                const rc = racetrackCanvas;
                const rect = rc.getBoundingClientRect();
                const scaleX = rc.width / rect.width;
                const scaleY = rc.height / rect.height;
                const mx = (e.clientX - rect.left) * scaleX;
                const my = (e.clientY - rect.top) * scaleY;
                const cx = rc.width / 2, cy = rc.height / 2;
                const dx = mx - cx, dy = my - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const outerR = rc.width / 2 - 10;
                const innerR = outerR - 28;
                if (dist >= innerR && dist <= outerR) {
                    let angle = Math.atan2(dy, dx) + Math.PI / 2;
                    if (angle < 0) angle += Math.PI * 2;
                    const segIndex = Math.floor(angle / (Math.PI * 2 / 37)) % 37;
                    const num = wheelOrder[segIndex];
                    addNeighborsBet(num);
                }
            });

            // ──────────────── BUILD TABLE ────────────────
            function buildTable() {
                const numbersGrid = document.getElementById('numbersGrid');
                numbersGrid.innerHTML = '';
                const zeroCell = document.createElement('div');
                zeroCell.className = 'number-cell zero-cell';
                zeroCell.dataset.num = '0';
                zeroCell.innerHTML = '0<span class="multiplier-badge">35:1</span>';
                zeroCell.addEventListener('click', () => handleNumberClick(0));
                numbersGrid.appendChild(zeroCell);
                for (let i = 1; i <= 36; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'number-cell';
                    cell.dataset.num = i;
                    cell.innerHTML = `${i}<span class="multiplier-badge">35:1</span>`;
                    cell.style.background = redNumbers.includes(i) ? '#8b2c2c' : '#1e3a3a';
                    cell.addEventListener('click', () => handleNumberClick(i));
                    numbersGrid.appendChild(cell);
                }

                const outsideContainer = document.getElementById('outsideBetsContainer');
                outsideContainer.innerHTML = outsideBetDefs.map(d =>
                    `<div class="outside-bet" data-key="${d.key}">${d.name}<span class="multiplier-badge">1:1</span></div>`
                ).join('');
                outsideContainer.querySelectorAll('.outside-bet').forEach(el => {
                    el.addEventListener('click', () => {
                        if (bettingLocked) return;
                        addOutsideBet(el.dataset.key);
                    });
                });

                const dozensContainer = document.getElementById('dozensContainer');
                dozensContainer.innerHTML = dozenDefs.map(d =>
                    `<div class="dozen-bet" data-key="${d.key}">${d.name}<span class="multiplier-badge">2:1</span></div>`
                ).join('');
                dozensContainer.querySelectorAll('.dozen-bet').forEach(el => {
                    el.addEventListener('click', () => {
                        if (bettingLocked) return;
                        addDozenBet(el.dataset.key);
                    });
                });

                const columnsContainer = document.getElementById('columnsContainer');
                columnsContainer.innerHTML = columnDefs.map(d =>
                    `<div class="column-bet" data-key="${d.key}">${d.name}<span class="multiplier-badge">2:1</span></div>`
                ).join('');
                columnsContainer.querySelectorAll('.column-bet').forEach(el => {
                    el.addEventListener('click', () => {
                        if (bettingLocked) return;
                        addColumnBet(el.dataset.key);
                    });
                });

                document.querySelectorAll('.french-bet-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (bettingLocked) return;
                        addPatternBet(btn.dataset.pattern);
                    });
                });
            }

            // ──────────────── EVENT BINDINGS ────────────────
            const spinBtn = document.getElementById('spinBtn');
            const clearBtn = document.getElementById('clearBetsBtn');
            spinBtn.addEventListener('click', (e) => { addRipple(e, spinBtn); spinWheel(); });
            clearBtn.addEventListener('click', (e) => { addRipple(e, clearBtn); clearAllBets(); audio.play('click'); });
            document.getElementById('undoBtn').addEventListener('click', undoLastBet);
            document.getElementById('doubleBtn').addEventListener('click', doubleBets);
            document.getElementById('repeatBtn').addEventListener('click', repeatLastBets);
            document.getElementById('autoSpinBtn').addEventListener('click', toggleAutoSpin);

            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                audio.soundEnabled = !audio.soundEnabled;
                document.getElementById('soundToggleBtn').innerHTML = audio.soundEnabled ?
                    '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
                if (audio.soundEnabled) audio.startAmbient();
                else audio.stopAmbient();
                localStorage.setItem('gold_sound_enabled', audio.soundEnabled);
            });

            document.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    if (bettingLocked) return;
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedChip = parseInt(this.dataset.chip);
                    document.getElementById('customBetInput').value = selectedChip;
                    audio.play('click');
                });
            });

            document.getElementById('customBetInput').addEventListener('input', function() {
                if (bettingLocked) return;
                const val = parseInt(this.value);
                if (!isNaN(val) && val > 0) selectedChip = val;
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            });

            document.querySelectorAll('.bet-mode-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    if (bettingLocked) return;
                    document.querySelectorAll('.bet-mode-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    betMode = this.dataset.mode;
                    const labels = { straight: 'Straight (35:1)', split: 'Split (17:1)', street: 'Street (11:1)', corner: 'Corner (8:1)' };
                    document.getElementById('betModeIndicator').textContent = labels[betMode] || 'Straight (35:1)';
                });
            });

            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.repeat && !spinning && !spinBtn.disabled && !bettingLocked) {
                    e.preventDefault();
                    spinWheel();
                }
                if (e.code === 'KeyC' && e.ctrlKey && !spinning && !bettingLocked) {
                    e.preventDefault();
                    clearAllBets();
                }
                if (e.code === 'KeyZ' && e.ctrlKey && !spinning && !bettingLocked) {
                    e.preventDefault();
                    undoLastBet();
                }
                if (e.code === 'KeyA' && e.ctrlKey && !spinning && !bettingLocked) {
                    e.preventDefault();
                    toggleAutoSpin();
                }
            });

            window.addEventListener('resize', () => {
                drawWheel();
                drawRacetrack();
            });

            function addRipple(e, btn) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
                ripple.style.top = e.clientY - rect.top - size / 2 + 'px';
                btn.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            }

            // ──────────────── PARTICLES ────────────────
            function initParticles() {
                const container = document.getElementById('particlesContainer');
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = Math.random() * 5 + 2;
                    p.style.width = p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.setProperty('--delay', Math.random() * 8 + 's');
                    p.style.setProperty('--dur', (Math.random() * 6 + 5) + 's');
                    container.appendChild(p);
                }
            }

            // ──────────────── INIT ────────────────
            async function init() {
                initParticles();
                if (!(await loadUser())) return;
                drawWheel();
                drawRacetrack();
                buildTable();
                updateBetTotals();
                const savedSound = localStorage.getItem('gold_sound_enabled');
                if (savedSound === 'false') {
                    audio.soundEnabled = false;
                    document.getElementById('soundToggleBtn').innerHTML = '<i class="fas fa-volume-mute"></i>';
                }
                await audio.init();
                document.body.addEventListener('click', () => audio.init(), { once: true });
                document.body.addEventListener('touchstart', () => audio.init(), { once: true });
                document.body.addEventListener('keydown', () => audio.init(), { once: true });
            }

            init();

            window.addEventListener('beforeunload', () => {
                if (autoSpinTimer) clearTimeout(autoSpinTimer);
                if (animationFrame) cancelAnimationFrame(animationFrame);
                audio.destroy();
            });

            console.log('%c🎰 GOLD ROULETTE %c| Premium European Casino %cLoaded',
                'color:#ffd966;font-size:1.1rem;',
                'color:#f5f0e6;',
                'color:#aaffaa;');
        })();
    </script>
</body>
</html>
