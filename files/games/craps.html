<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CRAPS | Roll the dice and win big!</title>
  <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #ffd966;
      --gold-bright: #ffe484;
      --gold-deep: #f5b042;
      --bg-deep: #0a0908;
      --card-bg: rgba(20, 18, 16, 0.85);
      --border-gold: rgba(255, 217, 102, 0.35);
      --radius-xl: 2rem;
      --radius-lg: 1.5rem;
      --radius-md: 1rem;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --danger: #ff6b6b;
      --success: #4caf50;
      --font-mono: 'Inter', monospace;
      --win-glow: rgba(255,217,102,0.8);
    }
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #14110c 0%, #030202 100%);
      color: #f5f0e6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      position: relative;
      overflow-x: hidden;
    }
    .bg-particles { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
    .sparkle {
      position:absolute; width:3px; height:3px;
      background:radial-gradient(circle, var(--gold-bright), transparent);
      border-radius:50%; opacity:0; animation:floatUp 5s infinite ease-in;
    }
    @keyframes floatUp {
      0% { transform:translateY(100vh) scale(0); opacity:0; }
      20% { opacity:0.8; transform:scale(1); }
      50% { transform:translateY(30vh) scale(0.5); opacity:0.3; }
      100% { transform:translateY(-20vh) scale(0); opacity:0; }
    }
    .game-container { max-width:800px; width:100%; position:relative; z-index:2; display:flex; flex-direction:column; gap:1rem; }
    .nav-bar {
      display:flex; justify-content:space-between; align-items:center;
      background:rgba(15,13,11,0.85); backdrop-filter:blur(20px);
      border-radius:60px; padding:0.7rem 1.5rem;
      border:1px solid var(--border-gold); box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    .back-home { text-decoration:none; color:var(--gold); font-weight:600; background:rgba(255,217,102,0.1); padding:0.4rem 1rem; border-radius:40px; transition:0.2s; display:flex; align-items:center; gap:0.5rem; }
    .back-home:hover { background:rgba(255,217,102,0.2); transform:translateX(-3px); }
    .balance-tag { background:rgba(31,28,24,0.9); padding:0.3rem 1.2rem; border-radius:40px; font-weight:700; border:1px solid rgba(255,217,102,0.4); display:flex; align-items:center; gap:0.5rem; }
    .sound-btn { background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--gold); transition:transform 0.2s; }
    .game-card {
      background:var(--card-bg); backdrop-filter:blur(20px);
      border-radius:var(--radius-xl); padding:1.8rem;
      border:1px solid var(--border-gold); box-shadow:0 20px 40px rgba(0,0,0,0.6);
    }
    .game-title { text-align:center; font-size:1.8rem; font-weight:800; letter-spacing:1px; color:var(--gold); margin-bottom:1rem; display:flex; align-items:center; justify-content:center; gap:0.5rem; }
    .dice-area { display:flex; justify-content:center; gap:2rem; margin:1rem 0; align-items:center; }
    canvas.dice-canvas { width:85px; height:85px; background:#2a241e; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.7); border:2px solid rgba(255,217,102,0.3); }
    .point-indicator {
      text-align:center; font-size:1.2rem; background:rgba(0,0,0,0.6); padding:0.5rem; border-radius:60px; margin:0.5rem 0;
      border:1px solid var(--border-gold); font-weight:600; letter-spacing:1px; position:relative;
    }
    .bet-panel { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; margin:1rem 0; }
    @media (max-width: 550px) { .bet-panel { grid-template-columns:1fr; } }
    .bet-group { background:rgba(0,0,0,0.3); border-radius:var(--radius-lg); padding:0.8rem; border:1px solid rgba(255,217,102,0.15); }
    .bet-label { font-size:0.7rem; color:var(--gold); letter-spacing:1px; margin-bottom:0.3rem; font-weight:600; }
    .bet-input { background:#1f1b17; border:2px solid rgba(255,217,102,0.2); border-radius:60px; padding:0.6rem; color:white; font-weight:700; width:100%; text-align:center; font-size:1rem; outline:none; transition:border-color 0.2s; }
    .bet-input:focus { border-color:var(--gold); }
    .action-row { display:flex; gap:0.8rem; flex-wrap:wrap; margin:1rem 0; align-items:center; }
    .btn {
      border:none; border-radius:60px; padding:0.7rem 1.4rem; font-weight:700; cursor:pointer;
      font-family:'Inter', sans-serif; transition:all 0.2s; display:inline-flex; align-items:center; gap:0.4rem;
      background:rgba(255,255,255,0.08); color:#f5f0e6; border:1px solid rgba(255,217,102,0.25);
    }
    .btn:hover:not(:disabled) { background:rgba(255,217,102,0.15); transform:translateY(-2px); }
    .btn:active:not(:disabled) { transform:translateY(1px); }
    .btn-primary {
      background:linear-gradient(135deg, #f5b042, #ffd966); color:#1a150e; border:none;
      box-shadow:0 4px 0 #a05f15; font-size:1.1rem;
    }
    .btn-primary:hover:not(:disabled) { box-shadow:0 6px 15px rgba(255,217,102,0.5); }
    .btn-success { background:linear-gradient(135deg, #4caf50, #81c784); color:#1a150e; border:none; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
    .extra-dice-btn.active { background:#4caf50; box-shadow:0 0 15px #4caf50; color:white; }
    .result-area {
      background:rgba(0,0,0,0.5); border-radius:var(--radius-lg); padding:1rem; margin:1rem 0; text-align:center;
      font-weight:600; min-height:80px; border:1px solid rgba(255,255,255,0.1); transition: all 0.3s;
    }
    .result-area.win { border-color: var(--win-glow); background: rgba(255,217,102,0.1); }
    .result-area.loss { border-color: var(--danger); background: rgba(255,107,107,0.1); }
    .stats-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin-top:1rem;
      text-align:center; font-size:0.75rem; background:rgba(0,0,0,0.4); border-radius:var(--radius-lg); padding:0.8rem;
    }
    .stats-grid div span { display:block; font-size:1.2rem; font-weight:800; color:var(--gold); }
    .history-scroll { max-height:120px; overflow-y:auto; background:rgba(0,0,0,0.3); border-radius:1rem; padding:0.5rem; margin-top:1rem; }
    .history-item { font-size:0.75rem; display:flex; justify-content:space-between; padding:0.2rem 0; border-bottom:1px solid rgba(255,255,255,0.05); }
    .win-text { color:#aaffaa; } .loss-text { color:#ffaaaa; } .push-text { color:#aaa; }
    .toast-msg {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px);
      background:#1c1916; border-left:4px solid var(--gold); padding:12px 20px;
      border-radius:30px; font-weight:600; z-index:2000; opacity:0; transition:0.3s;
      pointer-events:none; white-space:nowrap; backdrop-filter:blur(12px);
    }
    .toast-msg.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast-msg.error { border-left-color:var(--danger); }
    .gold-glow { text-shadow:0 0 20px var(--gold); }
    .mode-badge { background:rgba(0,0,0,0.6); padding:0.2rem 0.8rem; border-radius:20px; font-size:0.8rem; border:1px solid var(--gold); display:inline-flex; align-items:center; gap:0.3rem; }
    .progress-xp { height:6px; background:rgba(255,255,255,0.1); border-radius:6px; overflow:hidden; margin-top:0.5rem; }
    .progress-xp-fill { height:100%; background:var(--gold); border-radius:6px; transition:width 0.3s; }
    .sound-panel {
      background: rgba(0,0,0,0.8); border:1px solid var(--border-gold); border-radius:1rem; padding:0.8rem;
      position:absolute; top:60px; right:10px; display:none; flex-direction:column; gap:0.5rem; z-index:50; backdrop-filter:blur(8px);
    }
    .sound-panel label { font-size:0.8rem; color:var(--gold); }
    .volume-slider { width:100%; accent-color: var(--gold); }
  </style>
</head>
<body>
<div class="bg-particles" id="particles"></div>
<div class="game-container">
  <div class="nav-bar">
    <a href=".././home.html" class="back-home"><i class="fas fa-arrow-left"></i> Lobby</a>
    <div class="balance-tag"><i class="fas fa-coins"></i> <span id="balanceDisplay">0</span></div>
    <button id="soundToggle" class="sound-btn"><i class="fas fa-volume-up"></i></button>
  </div>

  <div class="game-card">
    <div class="game-title"><i class="fas fa-dice-d6"></i> GOLDEN POINT CRAPS</div>
    <div class="dice-area">
      <canvas id="die1Canvas" class="dice-canvas" width="120" height="120"></canvas>
      <canvas id="die2Canvas" class="dice-canvas" width="120" height="120"></canvas>
    </div>
    <div class="point-indicator" id="pointIndicator">🎲 COME-OUT ROLL</div>

    <div class="bet-panel">
      <div class="bet-group">
        <div class="bet-label"><i class="fas fa-passport"></i> PASS LINE</div>
        <input type="number" id="passBet" class="bet-input" value="50" step="10" min="0">
      </div>
      <div class="bet-group">
        <div class="bet-label"><i class="fas fa-chart-line"></i> FIELD (2×)</div>
        <input type="number" id="fieldBet" class="bet-input" value="0" step="10" min="0">
      </div>
      <div class="bet-group">
        <div class="bet-label"><i class="fas fa-gem"></i> HARDWAYS (8×)</div>
        <input type="number" id="hardwaysBet" class="bet-input" value="0" step="10" min="0">
      </div>
      <div class="bet-group">
        <div class="bet-label"><i class="fas fa-star"></i> COME BET</div>
        <input type="number" id="comeBet" class="bet-input" value="0" step="10" min="0">
      </div>
    </div>

    <div class="action-row">
      <button id="toggleAdvancedBtn" class="btn"><i class="fas fa-sliders-h"></i> Advanced</button>
      <span id="streakBadge" class="mode-badge" style="display:none;">🔥 Streak x<span id="streakMult">1</span></span>
      <span id="highRollerBadge" class="mode-badge" style="display:none;">💎 High Roller</span>
      <div style="flex:1;"></div>
      <button id="soundSettingsBtn" class="btn" style="padding:0.5rem;"><i class="fas fa-cog"></i></button>
    </div>
    <div id="advancedBets" style="display:none; grid-template-columns:1fr 1fr; gap:0.8rem; margin-bottom:1rem;">
      <div class="bet-group">
        <div class="bet-label"><i class="fas fa-ban"></i> DON'T PASS</div>
        <input type="number" id="dontPassBet" class="bet-input" value="0" step="10" min="0">
      </div>
      <div class="bet-group">
        <div class="bet-label"><i class="fas fa-skull"></i> ANY SEVEN (4×)</div>
        <input type="number" id="anySevenBet" class="bet-input" value="0" step="10" min="0">
      </div>
    </div>

    <div class="action-row" style="justify-content:center;">
      <button id="extraDiceBtn" class="btn extra-dice-btn" style="display:none;">💎 BUY EXTRA DICE (25% of Pass)</button>
      <button id="autoRollBtn" class="btn"><i class="fas fa-redo-alt"></i> Auto-Roll: OFF</button>
    </div>

    <button id="rollBtn" class="btn btn-primary" style="width:100%;"><i class="fas fa-dice"></i> ROLL</button>

    <div class="result-area" id="resultMessage">Place your bets and roll the dice!</div>

    <div class="progress-xp" style="margin:0.5rem 0;">
      <div class="progress-xp-fill" id="xpFill" style="width:0%;"></div>
      <div style="font-size:0.7rem; text-align:center;">Level <span id="playerLevel">1</span> · XP <span id="xpText">0</span>/<span id="xpNext">100</span></div>
    </div>

    <div class="stats-grid">
      <div><span id="crapsWins">0</span> Wins</div>
      <div><span id="crapsLosses">0</span> Losses</div>
      <div><span id="crapsStreak">0</span> Streak</div>
      <div><span id="bestStreak">0</span> Best</div>
    </div>

    <div class="history-scroll" id="rollHistory"></div>
  </div>
</div>
<div id="toastMsg" class="toast-msg"></div>
<div id="soundPanel" class="sound-panel">
  <label><i class="fas fa-volume-up"></i> Volume</label>
  <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="50">
</div>

<script>
  (() => {
    // =================================================
    // GOLDEN POINT CRAPS – ADVANCED CASINO ENGINE v2.0
    // Refactored, bug-fixed, performance-optimized.
    // =================================================

    // ---------- CONFIG ----------
    const CONFIG = {
      FIELD_PAYOUT: 2,
      HARDWAYS_PAYOUT: 8,
      ANY_SEVEN_PAYOUT: 4,
      PASS_PAYOUT: 1,
      DONT_PASS_PAYOUT: 1,
      COME_PAYOUT: 1,
      EXTRA_DICE_COST_RATIO: 0.25,
      JACKPOT_CHANCE: 0.001,
      JACKPOT_CONTRIBUTION: 0.02,
      STREAK_MULTIPLIER_STEP: 0.1,
      MAX_STREAK_MULT: 3.0,
      XP_PER_BET: 0.05,
      LEVEL_XP_BASE: 100,
      LEVEL_XP_GROWTH: 1.5,
      DEFAULT_VOLUME: 0.5,
    };

    // ---------- AUDIO ENGINE ----------
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.enabled = true;
        this._init();
      }
      _init() {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = CONFIG.DEFAULT_VOLUME;
          this.masterGain.connect(this.ctx.destination);
        } catch(e) { this.ctx = null; }
      }
      resume() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      setVolume(val) {
        if (this.masterGain) this.masterGain.gain.value = val;
      }
      play(type) {
        if (!this.enabled || !this.ctx || !this.masterGain) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.masterGain);
        try {
          switch(type) {
            case 'roll': osc.type='sine'; osc.frequency.setValueAtTime(440,now); osc.frequency.exponentialRampToValueAtTime(550,now+0.1); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.2); osc.start(now); osc.stop(now+0.3); break;
            case 'win': osc.type='square'; osc.frequency.setValueAtTime(660,now); osc.frequency.exponentialRampToValueAtTime(1200,now+0.3); gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.4); osc.start(now); osc.stop(now+0.5); break;
            case 'bigwin': osc.type='triangle'; osc.frequency.setValueAtTime(880,now); osc.frequency.setValueAtTime(1200,now+0.2); gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.6); osc.start(now); osc.stop(now+0.7); break;
            case 'lose': osc.type='sawtooth'; osc.frequency.setValueAtTime(200,now); osc.frequency.exponentialRampToValueAtTime(80,now+0.4); gain.gain.setValueAtTime(0.1,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.5); osc.start(now); osc.stop(now+0.6); break;
            case 'jackpot': osc.type='triangle'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(1600,now+0.5); gain.gain.setValueAtTime(0.25,now); gain.gain.exponentialRampToValueAtTime(0.001,now+1.0); osc.start(now); osc.stop(now+1.1); break;
          }
        } catch(e) {}
      }
    }

    // ---------- PARTICLE SYSTEM ----------
    function createSparkles() {
      const container = document.getElementById('particles');
      for (let i=0;i<40;i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random()*100+'%';
        s.style.bottom = -(Math.random()*30+5)+'%';
        s.style.animationDelay = Math.random()*8+'s';
        s.style.animationDuration = (Math.random()*6+4)+'s';
        container.appendChild(s);
      }
    }

    // ---------- TOAST NOTIFICATIONS ----------
    const toast = {
      timer: null,
      show(msg, isErr=false) {
        const el = document.getElementById('toastMsg');
        if (this.timer) clearTimeout(this.timer);
        el.textContent = msg;
        el.classList.remove('show','error');
        if (isErr) el.classList.add('error');
        void el.offsetWidth;
        el.classList.add('show');
        this.timer = setTimeout(() => el.classList.remove('show'), 3000);
      }
    };

    // ---------- STORAGE MANAGER ----------
    class StorageManager {
      getUsers() { try { return JSON.parse(localStorage.getItem('gold_users')||'{}'); } catch(e) { return {}; } }
      saveUsers(users) { localStorage.setItem('gold_users', JSON.stringify(users)); }
      loadUser() {
        const sess = sessionStorage.getItem('gold_current_user');
        if (!sess) { window.location.href = '../../sign-in.html'; return null; }
        const su = JSON.parse(sess);
        const users = this.getUsers();
        let user = users[su.username];
        if (!user) { sessionStorage.removeItem('gold_current_user'); window.location.href = '../../sign-in.html'; return null; }
        user.crapsStats = user.crapsStats || { wins:0, losses:0, totalBet:0, totalWin:0, bestStreak:0, currentStreak:0, jackpots:0 };
        user.globalStats = user.globalStats || { totalWagered:0, totalWon:0, totalGames:0, totalWins:0, currentStreak:0, bestStreak:0 };
        user.gamePlayCount = user.gamePlayCount || {};
        user.gameOutcomes = user.gameOutcomes || [];
        user.transactions = user.transactions || [];
        user.activeEffects = user.activeEffects || {};
        user.earnedAchievements = user.earnedAchievements || [];
        user.xp = user.xp || 0;
        user.level = user.level || 1;
        user.jackpotPool = user.jackpotPool || 0;
        user.dailyBonusClaimed = user.dailyBonusClaimed || null;
        return user;
      }
      saveUser(user) {
        const users = this.getUsers();
        users[user.username] = user;
        this.saveUsers(users);
        const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
        if (sess) { sess.balance = user.balance; sessionStorage.setItem('gold_current_user', JSON.stringify(sess)); }
      }
    }

    // ---------- DICE RENDERER (Promise‑based) ----------
    class DiceRenderer {
      constructor() {
        this.canvas1 = document.getElementById('die1Canvas');
        this.canvas2 = document.getElementById('die2Canvas');
        this.ctx1 = this.canvas1.getContext('2d');
        this.ctx2 = this.canvas2.getContext('2d');
        this.current = { d1:1, d2:1 };
        this.animationTimer = null;
      }
      _drawDie(ctx, value, glow = false) {
        const w = ctx.canvas.width, h = ctx.canvas.height;
        ctx.clearRect(0,0,w,h);
        ctx.fillStyle = '#2c241c';
        ctx.fillRect(0,0,w,h);
        ctx.fillStyle = '#fff3e0';
        ctx.fillRect(3,3,w-6,h-6);
        if (glow) {
          ctx.shadowBlur = 15;
          ctx.shadowColor = 'var(--gold)';
        }
        const dotR = w * 0.12;
        const dots = {
          1:[[0.5,0.5]],
          2:[[0.2,0.2],[0.8,0.8]],
          3:[[0.2,0.2],[0.5,0.5],[0.8,0.8]],
          4:[[0.2,0.2],[0.2,0.8],[0.8,0.2],[0.8,0.8]],
          5:[[0.2,0.2],[0.2,0.8],[0.5,0.5],[0.8,0.2],[0.8,0.8]],
          6:[[0.2,0.2],[0.2,0.5],[0.2,0.8],[0.8,0.2],[0.8,0.5],[0.8,0.8]]
        }[value] || [[0.5,0.5]];
        dots.forEach(([px,py]) => {
          ctx.beginPath();
          ctx.arc(px*w, py*h, dotR, 0, Math.PI*2);
          ctx.fillStyle = '#c97a1a';
          ctx.fill();
          ctx.fillStyle = '#f5b042';
          ctx.arc(px*w, py*h, dotR*0.7, 0, Math.PI*2);
          ctx.fill();
        });
        ctx.shadowBlur = 0;
      }
      animateRoll(finalD1, finalD2) {
        return new Promise(resolve => {
          this._cancelAnimation();
          let frameCount = 0;
          const maxFrames = 10;
          const interval = 50;
          const step = () => {
            if (frameCount >= maxFrames) {
              this.current.d1 = finalD1;
              this.current.d2 = finalD2;
              this._drawDie(this.ctx1, finalD1, false);
              this._drawDie(this.ctx2, finalD2, false);
              resolve();
              return;
            }
            const r1 = Math.floor(Math.random()*6)+1;
            const r2 = Math.floor(Math.random()*6)+1;
            this._drawDie(this.ctx1, r1, false);
            this._drawDie(this.ctx2, r2, false);
            frameCount++;
            this.animationTimer = setTimeout(step, interval);
          };
          step();
        });
      }
      _cancelAnimation() {
        if (this.animationTimer) {
          clearTimeout(this.animationTimer);
          this.animationTimer = null;
        }
      }
    }

    // ---------- UI UPDATER ----------
    class UI {
      constructor(gameRef) { this.game = gameRef; }
      updateBalance() {
        document.getElementById('balanceDisplay').textContent = this.game.user.balance.toLocaleString();
      }
      updateStats() {
        const s = this.game.user.crapsStats;
        document.getElementById('crapsWins').textContent = s.wins || 0;
        document.getElementById('crapsLosses').textContent = s.losses || 0;
        document.getElementById('crapsStreak').textContent = s.currentStreak || 0;
        document.getElementById('bestStreak').textContent = s.bestStreak || 0;
      }
      updateXP() {
        const user = this.game.user;
        const xpNeeded = this.game.getXPForNextLevel();
        const fill = Math.min(100, (user.xp / xpNeeded) * 100);
        document.getElementById('xpFill').style.width = fill + '%';
        document.getElementById('playerLevel').textContent = user.level || 1;
        document.getElementById('xpText').textContent = Math.floor(user.xp);
        document.getElementById('xpNext').textContent = Math.floor(xpNeeded);
      }
      setPointIndicator(text) {
        document.getElementById('pointIndicator').innerHTML = text;
      }
      showResult(msg, type = '') {
        const el = document.getElementById('resultMessage');
        el.innerHTML = msg;
        el.classList.remove('win','loss');
        if (type) el.classList.add(type);
      }
      addRollHistory(roll, outcome, profit) {
        const container = document.getElementById('rollHistory');
        const item = document.createElement('div');
        item.className = 'history-item';
        const profitClass = profit > 0 ? 'win-text' : (profit < 0 ? 'loss-text' : 'push-text');
        item.innerHTML = `<span>🎲 ${roll.d1}+${roll.d2}=${roll.sum} (${roll.phase})</span> <span class="${profitClass}">${profit>0?'+':''}${profit.toFixed(0)}</span>`;
        container.prepend(item);
        if (container.children.length > 20) container.lastChild.remove();
      }
      updateStreakBadge() {
        const badge = document.getElementById('streakBadge');
        if (this.game.state.consecutiveWins > 1) {
          badge.style.display = 'inline-flex';
          document.getElementById('streakMult').textContent = (1 + this.game.state.consecutiveWins * CONFIG.STREAK_MULTIPLIER_STEP).toFixed(2);
        } else {
          badge.style.display = 'none';
        }
      }
      updateHighRollerBadge(active) {
        document.getElementById('highRollerBadge').style.display = active ? 'inline-flex' : 'none';
      }
    }

    // ---------- GAME STATE & LOGIC ----------
    class CrapsGame {
      constructor(user, audioEngine, storage, ui) {
        this.user = user;
        this.audio = audioEngine;
        this.storage = storage;
        this.ui = ui;
        this.diceRenderer = new DiceRenderer();
        this.state = {
          phase: 'comeout',
          point: null,
          pendingPassBet: 0,
          pendingComeBet: 0,
          pendingComePoint: null,    // the come bet's own point
          pendingDontPass: 0,
          extraDiceActive: false,
          autoRollEnabled: false,
          autoRollTimer: null,
          consecutiveWins: 0,
          rollInProgress: false,
        };
        this.initDailyBonus();
      }

      // ---------- HELPERS ----------
      getBetInput(id) { const v=parseInt(document.getElementById(id).value); return isNaN(v)||v<0 ? 0 : v; }

      getPayoutMultiplier() {
        let mult = 1.0;
        if (this.user.activeEffects?.payout_amp) mult += this.user.activeEffects.payout_amp.bonus||0;
        if (this.state.consecutiveWins > 0) {
          mult += this.state.consecutiveWins * CONFIG.STREAK_MULTIPLIER_STEP;
          if (mult > CONFIG.MAX_STREAK_MULT) mult = CONFIG.MAX_STREAK_MULT;
        }
        return mult;
      }

      getXPBoost() {
        let boost = 1;
        if (this.user.activeEffects?.xp_multiplier) boost = this.user.activeEffects.xp_multiplier.multiplier || 2;
        return boost;
      }

      getXPForNextLevel() {
        return Math.floor(CONFIG.LEVEL_XP_BASE * Math.pow(CONFIG.LEVEL_XP_GROWTH, (this.user.level||1)-1));
      }

      addXP(amount) {
        this.user.xp = (this.user.xp||0) + amount * this.getXPBoost();
        while (this.user.xp >= this.getXPForNextLevel()) {
          this.user.xp -= this.getXPForNextLevel();
          this.user.level = (this.user.level||1) + 1;
          toast.show(`🎉 Level Up! Now level ${this.user.level}`);
          this.audio.play('bigwin');
        }
      }

      // ---------- BET DEDUCTION ----------
      deductBets() {
        const passBet = this.getBetInput('passBet');
        const fieldBet = this.getBetInput('fieldBet');
        const hardwaysBet = this.getBetInput('hardwaysBet');
        const comeBet = this.getBetInput('comeBet');
        const dontPassBet = this.getBetInput('dontPassBet');
        const anySevenBet = this.getBetInput('anySevenBet');
        let totalWager = 0;

        if (this.state.phase === 'comeout') {
          totalWager = passBet + fieldBet + hardwaysBet + comeBet + dontPassBet + anySevenBet;
          if (totalWager > this.user.balance) throw new Error('Insufficient balance');
          this.user.balance -= totalWager;
          this.state.pendingPassBet = passBet;
          this.state.pendingComeBet = comeBet;
          this.state.pendingDontPass = dontPassBet;
        } else {
          // point phase: pass & dont pass already deducted; only one‑roll & new bets
          totalWager = fieldBet + hardwaysBet + comeBet + anySevenBet;
          // new come bet can be placed, even if one already active (override)
          if (totalWager > this.user.balance) throw new Error('Insufficient balance');
          this.user.balance -= totalWager;
          this.state.pendingComeBet = comeBet;
        }
        return { passBet, fieldBet, hardwaysBet, comeBet, dontPassBet, anySevenBet, totalWager };
      }

      // ---------- RECORD OUTCOME ----------
      recordOutcome(netProfit, totalWagered, details) {
        const isWin = netProfit > 0;
        const isLoss = netProfit < 0;
        const craps = this.user.crapsStats;
        if (isWin) {
          craps.wins++;
          craps.currentStreak = (craps.currentStreak||0) + 1;
          if (craps.currentStreak > craps.bestStreak) craps.bestStreak = craps.currentStreak;
          this.state.consecutiveWins++;
        } else if (isLoss) {
          craps.losses++;
          craps.currentStreak = 0;
          this.state.consecutiveWins = 0;
        }
        // push leaves streak unchanged
        craps.totalBet += totalWagered;
        craps.totalWin += isWin ? netProfit : 0;

        const gs = this.user.globalStats;
        gs.totalWagered += totalWagered;
        gs.totalWon += isWin ? netProfit : 0;
        gs.totalGames++;
        if (isWin) {
          gs.totalWins++;
          gs.currentStreak = (gs.currentStreak||0) + 1;
          if (gs.currentStreak > (gs.bestStreak||0)) gs.bestStreak = gs.currentStreak;
        } else if (isLoss) {
          gs.currentStreak = 0;
        }

        this.addXP(totalWagered * CONFIG.XP_PER_BET);

        this.user.transactions.unshift({
          desc: `🎲 Craps: ${isWin?'WIN':isLoss?'LOSS':'PUSH'} | Net ${netProfit>=0?'+':''}${netProfit.toFixed(2)} GOLD`,
          amount: netProfit,
          type: isWin ? 'game_win' : 'game_loss',
          date: new Date().toISOString()
        });
        if (this.user.transactions.length > 100) this.user.transactions.pop();

        this.user.gameOutcomes.unshift({
          game: 'Craps', result: isWin?'win':isLoss?'loss':'push', profit: netProfit,
          bet: details, date: new Date().toISOString()
        });
        if (this.user.gameOutcomes.length > 50) this.user.gameOutcomes.pop();
        this.user.gamePlayCount['craps'] = (this.user.gamePlayCount['craps'] || 0) + 1;

        // jackpot contribution
        if (totalWagered > 0) {
          this.user.jackpotPool = (this.user.jackpotPool||0) + totalWagered * CONFIG.JACKPOT_CONTRIBUTION;
        }
        // jackpot win check
        if (Math.random() < CONFIG.JACKPOT_CHANCE && this.user.jackpotPool > 50) {
          const winAmount = this.user.jackpotPool;
          this.user.balance += winAmount;
          this.user.jackpotPool = 0;
          toast.show(`💰 JACKPOT! You won ${winAmount.toFixed(0)} GOLD!`);
          this.audio.play('jackpot');
        }
        this.ui.updateStreakBadge();
        this.ui.updateXP();
      }

      // ---------- DAILY BONUS ----------
      initDailyBonus() {
        const today = new Date().toDateString();
        if (this.user.dailyBonusClaimed !== today) {
          this.user.dailyBonusClaimed = today;
          this.user.balance += 25;
          toast.show('📅 Daily bonus: +25 GOLD');
          this.audio.play('win');
          this.storage.saveUser(this.user);
          this.ui.updateBalance();
        }
      }

      // ---------- RESOLVE COME BET ----------
      resolveComeBet(sum, payoutMult) {
        let comeWin = false, comePayout = 0;
        const comeBet = this.state.pendingComeBet;
        if (!comeBet) return {comeWin, comePayout, comePoint: null};
        const isComeOut = !this.state.pendingComePoint;
        if (isComeOut) {
          // first roll after come bet placed
          if (sum === 7 || sum === 11) {
            comeWin = true; comePayout = comeBet * CONFIG.COME_PAYOUT * payoutMult;
            this.state.pendingComePoint = null;
          } else if (sum === 2 || sum === 3 || sum === 12) {
            comeWin = false;
            this.state.pendingComePoint = null;
          } else {
            // establish come point
            this.state.pendingComePoint = sum;
          }
        } else {
          // come point already set
          const cp = this.state.pendingComePoint;
          if (sum === cp) {
            comeWin = true; comePayout = comeBet * CONFIG.COME_PAYOUT * payoutMult;
            this.state.pendingComePoint = null;
          } else if (sum === 7) {
            comeWin = false;
            this.state.pendingComePoint = null;
          }
        }
        return { comeWin, comePayout, comePoint: this.state.pendingComePoint };
      }

      // ---------- MAIN ROLL PROCESS ----------
      async processRoll() {
        if (this.state.rollInProgress) return;
        this.state.rollInProgress = true;
        try {
          const bets = this.deductBets(); // may throw
          const { passBet, fieldBet, hardwaysBet, comeBet, dontPassBet, anySevenBet, totalWager } = bets;

          // generate dice
          const d1 = Math.floor(Math.random()*6)+1;
          const d2 = Math.floor(Math.random()*6)+1;
          const sum = d1+d2;
          const isHard = (d1===d2 && (d1===2||d1===4||d1===6));

          // animate and wait
          await this.diceRenderer.animateRoll(d1, d2);

          let passWin = false, fieldWin = false, hardwaysWin = false, dontPassWin = false, anySevenWin = false;
          let passPayout = 0, fieldPayout = 0, hardwaysPayout = 0, dontPassPayout = 0, anySevenPayout = 0;
          const payoutMult = this.getPayoutMultiplier();
          let resultMsg = '';

          // --- COME‑OUT PHASE ---
          if (this.state.phase === 'comeout') {
            // Pass Line
            if (sum === 7 || sum === 11) {
              passWin = true;
              passPayout = passBet * CONFIG.PASS_PAYOUT * payoutMult;
              resultMsg = `🎲 Come‑out ${sum}! PASS LINE WINS +${passPayout.toFixed(0)}`;
              this.audio.play('win');
            } else if (sum === 2 || sum === 3 || sum === 12) {
              passWin = false;
              resultMsg = `💥 Come‑out ${sum} — CRAPS! Pass line loses.`;
              this.audio.play('lose');
            } else {
              this.state.point = sum;
              this.state.phase = 'point';
              resultMsg = `🎯 Point set: ${sum}. Keep rolling!`;
              this.audio.play('roll');
              this.ui.setPointIndicator(`🎲 POINT: ${sum} 🎲`);
              document.getElementById('extraDiceBtn').style.display = 'inline-block';
              this.state.pendingPassBet = passBet; // keep pending
            }

            // Don't Pass (only resolved here)
            if (dontPassBet > 0) {
              if (sum === 2 || sum === 3) {
                dontPassWin = true;
                dontPassPayout = dontPassBet * CONFIG.DONT_PASS_PAYOUT * payoutMult;
                resultMsg += ` | DON'T PASS WINS +${dontPassPayout}`;
              } else if (sum === 12) {
                // push
                resultMsg += ` | DON'T PASS PUSH`;
              } else if (sum === 7 || sum === 11) {
                dontPassWin = false;
                resultMsg += ` | DON'T PASS loses`;
              }
            }
            // Come bet first roll
            const cr = this.resolveComeBet(sum, payoutMult);
            if (comeBet > 0) {
              if (cr.comeWin) { resultMsg += ` | COME BET WINS +${cr.comePayout.toFixed(0)}`; }
              else if (cr.comePoint) { resultMsg += ` | COME point ${cr.comePoint}`; }
              else { resultMsg += ` | COME BET loses`; }
            }
          }
          // --- POINT PHASE ---
          else if (this.state.phase === 'point') {
            const point = this.state.point;
            const pendingPass = this.state.pendingPassBet;
            // Pass line resolution
            if (sum === point) {
              passWin = true;
              passPayout = pendingPass * CONFIG.PASS_PAYOUT * payoutMult;
              resultMsg = `🎯 Point ${point} HIT! PASS LINE WINS +${passPayout.toFixed(0)}`;
              this.audio.play('win');
              this._resetToComeOut();
            } else if (sum === 7) {
              if (this.state.extraDiceActive) {
                const refund = Math.floor(pendingPass / 2);
                this.user.balance += refund;
                passPayout = 0;
                resultMsg = `😨 7 with extra dice! Half returned (+${refund} GOLD). Lost ${pendingPass-refund}.`;
                this.audio.play('lose');
              } else {
                passWin = false;
                resultMsg = `💀 7 out! Point lost. Pass line loses ${pendingPass} GOLD.`;
                this.audio.play('lose');
              }
              this._resetToComeOut();
            } else {
              resultMsg = `🔄 Roll ${sum}. Point ${point} stands.`;
              this.audio.play('roll');
            }

            // Don't Pass (in point phase) – win on 7, lose on point
            if (this.state.pendingDontPass > 0) {
              if (sum === 7) {
                dontPassWin = true;
                dontPassPayout = this.state.pendingDontPass * CONFIG.DONT_PASS_PAYOUT * payoutMult;
                resultMsg += ` | DON'T PASS WINS +${dontPassPayout.toFixed(0)}`;
                this.state.pendingDontPass = 0;
              } else if (sum === point) {
                dontPassWin = false;
                resultMsg += ` | DON'T PASS loses`;
                this.state.pendingDontPass = 0;
              }
            }

            // Come bet (existing come point)
            const cr = this.resolveComeBet(sum, payoutMult);
            if (this.state.pendingComeBet > 0 || this.state.pendingComePoint) {
              if (cr.comeWin) { resultMsg += ` | COME BET WINS +${cr.comePayout.toFixed(0)}`; }
              else if (cr.comePoint) { resultMsg += ` | COME point ${cr.comePoint}`; }
              else { resultMsg += ` | COME BET loses`; }
            }
          }

          // --- ONE‑ROLL BETS ---
          if (fieldBet > 0 && [2,3,4,9,10,11,12].includes(sum)) {
            fieldWin = true;
            fieldPayout = fieldBet * CONFIG.FIELD_PAYOUT * payoutMult;
            resultMsg += ` | FIELD wins +${fieldPayout.toFixed(0)}`;
            this.audio.play('win');
          }
          if (hardwaysBet > 0 && isHard && [4,6,8].includes(sum)) {
            hardwaysWin = true;
            hardwaysPayout = hardwaysBet * CONFIG.HARDWAYS_PAYOUT * payoutMult;
            resultMsg += ` | HARDWAYS wins +${hardwaysPayout.toFixed(0)}`;
            this.audio.play('win');
          }
          if (anySevenBet > 0 && sum === 7) {
            anySevenWin = true;
            anySevenPayout = anySevenBet * CONFIG.ANY_SEVEN_PAYOUT * payoutMult;
            resultMsg += ` | ANY SEVEN +${anySevenPayout.toFixed(0)}`;
            this.audio.play('win');
          }

          // total win and net
          const totalWin = passPayout + fieldPayout + hardwaysPayout + dontPassPayout + anySevenPayout;
          if (totalWin > 0) this.user.balance += totalWin;
          const netProfit = totalWin - totalWager;
          this.recordOutcome(netProfit, totalWager, { passBet, fieldBet, hardwaysBet, comeBet, dontPassBet });

          // save and update UI
          this.storage.saveUser(this.user);
          this.ui.updateBalance();
          this.ui.updateStats();
          this.ui.showResult(resultMsg + (netProfit>0?` 🎉 +${netProfit.toFixed(0)}`:` ❌ ${netProfit.toFixed(0)}`), netProfit>0?'win':(netProfit<0?'loss':''));
          this.ui.addRollHistory({d1,d2,sum, phase:this.state.phase}, netProfit>0?'win':(netProfit<0?'loss':'push'), netProfit);

          // auto‑roll
          if (this.state.autoRollEnabled && this.user.balance > 0) {
            this.state.autoRollTimer = setTimeout(() => this.processRoll(), 800);
          }
        } catch (e) {
          toast.show(e.message, true);
        } finally {
          this.state.rollInProgress = false;
        }
      }

      _resetToComeOut() {
        this.state.phase = 'comeout';
        this.state.point = null;
        this.state.extraDiceActive = false;
        document.getElementById('extraDiceBtn').style.display = 'none';
        document.getElementById('extraDiceBtn').classList.remove('active');
        this.ui.setPointIndicator('🎲 COME-OUT ROLL');
      }

      // ---------- EXTRA DICE ----------
      buyExtraDice() {
        if (this.state.phase !== 'point') return toast.show('Only available after point established', true);
        if (this.state.extraDiceActive) return toast.show('Already active', true);
        const passBet = this.state.pendingPassBet;
        if (passBet <= 0) return;
        const cost = Math.floor(passBet * CONFIG.EXTRA_DICE_COST_RATIO);
        if (cost > this.user.balance) return toast.show(`Need ${cost} GOLD`, true);
        this.user.balance -= cost;
        this.state.extraDiceActive = true;
        this.user.transactions.unshift({ desc:'🔮 Extra Dice', amount:-cost, type:'withdraw', date: new Date().toISOString() });
        this.storage.saveUser(this.user);
        this.ui.updateBalance();
        toast.show('Extra dice active! 7 loses only half.');
        document.getElementById('extraDiceBtn').classList.add('active');
        document.getElementById('extraDiceBtn').innerHTML = '✨ EXTRA DICE ACTIVE ✨';
      }

      toggleAutoRoll() {
        this.state.autoRollEnabled = !this.state.autoRollEnabled;
        document.getElementById('autoRollBtn').innerHTML = this.state.autoRollEnabled ?
          '<i class="fas fa-redo-alt"></i> Auto-Roll: ON' : '<i class="fas fa-redo-alt"></i> Auto-Roll: OFF';
        if (this.state.autoRollEnabled) {
          toast.show('Auto-roll enabled');
          if (!this.state.rollInProgress) this.processRoll();
        } else {
          if (this.state.autoRollTimer) { clearTimeout(this.state.autoRollTimer); this.state.autoRollTimer = null; }
        }
      }
    }

    // ---------- INITIALIZATION ----------
    window.addEventListener('load', async () => {
      createSparkles();
      const audioEngine = new AudioEngine();
      const storage = new StorageManager();
      const user = storage.loadUser();
      if (!user) return;

      const game = new CrapsGame(user, audioEngine, storage, null);
      const ui = new UI(game);
      game.ui = ui;
      window.game = game; // for debugging

      // load sound prefs
      const soundEnabled = localStorage.getItem('gold_sound_enabled') !== 'false';
      audioEngine.enabled = soundEnabled;
      document.getElementById('soundToggle').innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';

      ui.updateBalance();
      ui.updateStats();
      ui.updateXP();
      game.diceRenderer._drawDie(game.diceRenderer.ctx1, 1);
      game.diceRenderer._drawDie(game.diceRenderer.ctx2, 1);

      // ---------- EVENT LISTENERS ----------
      document.getElementById('rollBtn').addEventListener('click', () => game.processRoll());
      document.getElementById('extraDiceBtn').addEventListener('click', () => game.buyExtraDice());
      document.getElementById('autoRollBtn').addEventListener('click', () => game.toggleAutoRoll());
      document.getElementById('toggleAdvancedBtn').addEventListener('click', () => {
        const adv = document.getElementById('advancedBets');
        adv.style.display = adv.style.display === 'none' ? 'grid' : 'none';
      });
      document.getElementById('soundToggle').addEventListener('click', () => {
        audioEngine.enabled = !audioEngine.enabled;
        document.getElementById('soundToggle').innerHTML = audioEngine.enabled ?
          '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
        localStorage.setItem('gold_sound_enabled', audioEngine.enabled);
      });

      // Sound settings panel
      const soundPanel = document.getElementById('soundPanel');
      const volumeSlider = document.getElementById('volumeSlider');
      volumeSlider.value = CONFIG.DEFAULT_VOLUME * 100;
      volumeSlider.addEventListener('input', (e) => {
        audioEngine.setVolume(e.target.value / 100);
      });
      document.getElementById('soundSettingsBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        soundPanel.style.display = soundPanel.style.display === 'flex' ? 'none' : 'flex';
      });
      document.addEventListener('click', () => { soundPanel.style.display = 'none'; });

      // Keyboard: Enter on bet inputs triggers roll
      document.querySelectorAll('.bet-input').forEach(input => {
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') game.processRoll(); });
      });

      // Unlock audio
      const unlock = () => { audioEngine.resume(); document.body.removeEventListener('click', unlock); };
      document.body.addEventListener('click', unlock);
      document.body.addEventListener('touchstart', unlock);
    });

    window.addEventListener('beforeunload', () => {
      if (window.game && window.game.state.autoRollTimer) clearTimeout(window.game.state.autoRollTimer);
    });
  })();
</script>
</body>
</html>
