            const riskPercent = $('riskPercent');
            const multiplierValue = $('multiplierValue');
            const difficultySelector = $('difficultySelector');
            const diffInfo = $('diffInfo');
            const gameCard = $('gameCard');
            const dangerFlash = $('dangerFlash');
            const goldenFlash = $('goldenFlash');
            const fairHash = $('fairHash');
            const levelBadge = $('levelBadge');
            const prestigeBadge = $('prestigeBadge');
            const xpBarInner = $('xpBarInner');
            const xpText = $('xpText');
            const mkCost = $('mkCost');
            const difficultyLabel = $('difficultyLabel');
            const gameWrapper = $('gameWrapper');

            // ── AUDIO SYSTEM ──────────────────────────────────────────
            function initAudio() {
                if (!audioCtx && soundEnabled) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
                }
            }

            function resumeAudio() {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playTone(type, freqOpt = null) {
                if (!soundEnabled) return;
                try {
                    initAudio();
                    if (!audioCtx) return;
                    resumeAudio();
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);
                    switch (type) {
                        case 'reveal':
                            osc.type = 'sine';
                            osc.frequency.value = 880;
                            gain.gain.value = 0.07;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                            osc.start(now);
                            osc.stop(now + 0.25);
                            break;
                        case 'revealSpecial':
                            osc.type = 'sine';
                            osc.frequency.value = 1100;
                            osc.frequency.exponentialRampToValueAtTime(1600, now + 0.2);
                            gain.gain.value = 0.10;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                            osc.start(now);
                            osc.stop(now + 0.4);
                            break;
                        case 'collect':
                            osc.type = 'triangle';
                            osc.frequency.value = 660;
                            osc.frequency.exponentialRampToValueAtTime(1400, now + 0.35);
                            gain.gain.value = 0.11;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
                            osc.start(now);
                            osc.stop(now + 0.6);
                            break;
                        case 'jackpot':
                            osc.type = 'triangle';
                            osc.frequency.value = 800;
                            osc.frequency.exponentialRampToValueAtTime(2000, now + 0.5);
                            gain.gain.value = 0.14;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
                            osc.start(now);
                            osc.stop(now + 0.75);
                            // second osc for richness
                            const osc2 = audioCtx.createOscillator();
                            const gain2 = audioCtx.createGain();
                            osc2.type = 'sine';
                            osc2.frequency.value = 1200;
                            osc2.frequency.exponentialRampToValueAtTime(2400, now + 0.4);
                            gain2.gain.value = 0.06;
                            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                            osc2.connect(gain2);
                            gain2.connect(audioCtx.destination);
                            osc2.start(now);
                            osc2.stop(now + 0.65);
                            break;
                        case 'skeleton':
                            osc.type = 'sawtooth';
                            osc.frequency.value = 140;
                            osc.frequency.exponentialRampToValueAtTime(55, now + 0.5);
                            filter.type = 'lowpass';
                            filter.frequency.value = 400;
                            filter.frequency.exponentialRampToValueAtTime(60, now + 0.5);
                            gain.gain.value = 0.13;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                            osc.start(now);
                            osc.stop(now + 0.65);
                            break;
                        case 'start':
                            osc.type = 'square';
                            osc.frequency.value = 440;
                            gain.gain.value = 0.05;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                            osc.start(now);
                            osc.stop(now + 0.25);
                            break;
                        case 'tick':
                            osc.type = 'sine';
                            osc.frequency.value = freqOpt || 600;
                            gain.gain.value = 0.03;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                            osc.start(now);
                            osc.stop(now + 0.1);
                            break;
                        case 'shieldActivate':
                            osc.type = 'sine';
                            osc.frequency.value = 900;
                            osc.frequency.exponentialRampToValueAtTime(1800, now + 0.25);
                            gain.gain.value = 0.08;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                            osc.start(now);
                            osc.stop(now + 0.4);
                            break;
                        case 'curse':
                            osc.type = 'sawtooth';
                            osc.frequency.value = 200;
                            osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
                            gain.gain.value = 0.07;
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                            osc.start(now);
                            osc.stop(now + 0.5);
                            break;
                    }
                } catch (e) {}
            }

            // ── STORAGE & USER ────────────────────────────────────────
            function getUsers() {
                try { return JSON.parse(localStorage.getItem('gold_users') || '{}'); } catch (e) { return {}; }
            }

            function saveUsers(users) {
                try { localStorage.setItem('gold_users', JSON.stringify(users)); } catch (e) { showToast(
                        'Failed to save data.', true); }
            }

            function ensureUserStats() {
                currentUser.goldenKeysStats = currentUser.goldenKeysStats || {
                    gamesPlayed: 0,
                    chestsUnlocked: 0,
                    totalGoldCollected: 0,
                    bestPot: 0,
                    skeletonHits: 0,
                    masterKeysPurchased: 0,
                    biggestJackpot: 0,
                    bestStreak: 0,
                    totalSkeletonsAvoided: 0,
                    difficultyWins: {},
                    mostProfitableSession: 0,
                    longestSurvivalStreak: 0,
                };
                currentUser.globalStats = currentUser.globalStats || {
                    totalWagered: 0,
                    totalWon: 0,
                    totalGames: 0,
                    totalWins: 0,
                    currentStreak: 0,
                    bestStreak: 0,
                };
                currentUser.gamePlayCount = currentUser.gamePlayCount || {};
                currentUser.gameOutcomes = currentUser.gameOutcomes || [];
                currentUser.transactions = currentUser.transactions || [];
                currentUser.earnedAchievements = currentUser.earnedAchievements || [];
                currentUser.xp = currentUser.xp || 0;
                currentUser.level = currentUser.level || 1;
                currentUser.prestige = currentUser.prestige || 0;
                currentUser.hasMasterKey = currentUser.hasMasterKey || false;
                currentUser.unlockedThemes = currentUser.unlockedThemes || [];
                currentUser.dailyChallengeDate = currentUser.dailyChallengeDate || '';
            }

            async function loadUser() {
                const sess = sessionStorage.getItem('gold_current_user');
                if (!sess) { window.location.href = '../../sign-in.html'; return false; }
                const su = JSON.parse(sess);
                const users = getUsers();
                let user = users[su.username];
                if (!user) {
                    sessionStorage.removeItem('gold_current_user');
                    window.location.href = '../../sign-in.html';
                    return false;
                }
                currentUser = user;
                ensureUserStats();
                masterKeyOwned = currentUser.hasMasterKey || false;
                updateBalanceUI();
                updateStatsUI();
                updateMasterKeyStatus();
                updateXPUI();
                updatePrestigeUI();
                checkDailyChallenge();
                return true;
            }

            async function saveUser() {
                const users = getUsers();
                users[currentUser.username] = currentUser;
                saveUsers(users);
                const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
                if (sess) { sess.balance = currentUser.balance;
                    sessionStorage.setItem('gold_current_user', JSON.stringify(sess)); }
            }

            function updateBalanceUI() {
                balanceDisplay.textContent = currentUser.balance.toLocaleString();
            }

            function updateStatsUI() {
                const s = currentUser.goldenKeysStats;
                $('gamesPlayed').textContent = (s.gamesPlayed || 0).toLocaleString();
                $('winsCount').textContent = (s.chestsUnlocked || 0).toLocaleString();
                $('bestPot').textContent = (s.bestPot || 0).toLocaleString();
                $('totalGold').textContent = (s.totalGoldCollected || 0).toLocaleString();
            }

            function updateMasterKeyStatus() {
                if (gameActive && masterKeyOwned && !masterKeyUsedThisRound) {
                    masterKeyStatus.innerHTML =
                        '<i class="fas fa-crown" aria-hidden="true"></i> Master Key READY (1 skeleton skip)';
                } else if (masterKeyOwned) {
                    masterKeyStatus.innerHTML =
                        '<i class="fas fa-crown" aria-hidden="true"></i> Master Key OWNED (available next round)';
                } else {
                    masterKeyStatus.innerHTML = '<i class="fas fa-star" aria-hidden="true"></i> No Master Key';
                }
                currentUser.hasMasterKey = masterKeyOwned;
            }

            function updateXPUI() {
                const level = currentUser.level || 1;
                const xp = currentUser.xp || 0;
                const xpForNext = XP_PER_LEVEL * level;
                const progress = Math.min(100, Math.floor((xp / xpForNext) * 100));
                levelBadge.textContent = 'LVL ' + level;
                xpBarInner.style.width = progress + '%';
                xpText.textContent = xp.toLocaleString() + ' / ' + xpForNext.toLocaleString() + ' XP';
            }

            function updatePrestigeUI() {
                const p = currentUser.prestige || 0;
                if (p > 0) {
                    prestigeBadge.style.display = 'inline-block';
                    prestigeBadge.textContent = 'P' + p + ' · ' + (PRESTIGE_TITLES[Math.min(p - 1, 9)] || '');
                } else {
                    prestigeBadge.style.display = 'none';
                }
            }

            function addXP(amount) {
                currentUser.xp = (currentUser.xp || 0) + amount;
                let level = currentUser.level || 1;
                while (currentUser.xp >= XP_PER_LEVEL * level && level < MAX_LEVEL) {
                    currentUser.xp -= XP_PER_LEVEL * level;
                    level++;
                    showToast('🎉 LEVEL UP! You reached Level ' + level + '!', false);
                    playTone('collect');
                }
                currentUser.level = level;
                updateXPUI();
                if (level >= MAX_LEVEL && (currentUser.prestige || 0) < 10) {
                    showToast('🌟 MAX LEVEL! Prestige available! Check your stats.', false);
                }
            }

            function prestigeUser() {
                if ((currentUser.level || 1) < MAX_LEVEL) {
                    showToast('Reach level ' + MAX_LEVEL + ' to prestige!', true);
                    return;
                }
                if ((currentUser.prestige || 0) >= 10) {
                    showToast('Maximum prestige reached!', true);
                    return;
                }
                currentUser.prestige = (currentUser.prestige || 0) + 1;
                currentUser.level = 1;
                currentUser.xp = 0;
                const bonus = (currentUser.prestige || 0) * 5;
                showToast('🌟 PRESTIGE ' + currentUser.prestige + '! +' + bonus + '% permanent reward bonus!',
                false);
                updateXPUI();
                updatePrestigeUI();
                saveUser();
                playTone('jackpot');
            }

            function checkDailyChallenge() {
                const today = new Date().toISOString().split('T')[0];
                dailyChallengeCompleted = (currentUser.dailyChallengeDate === today);
            }

            function markDailyChallenge() {
                const today = new Date().toISOString().split('T')[0];
                currentUser.dailyChallengeDate = today;
                dailyChallengeCompleted = true;
                saveUser();
            }

            // ── TOAST ──────────────────────────────────────────────────
            function showToast(msg, isErr = false, isEpic = false) {
                const t = toastMsg;
                t.textContent = msg;
                t.classList.remove('show', 'error', 'epic');
                if (isErr) t.classList.add('error');
                if (isEpic) t.classList.add('epic');
                void t.offsetWidth;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3200);
            }

            // ── VISUAL EFFECTS ────────────────────────────────────────
            function triggerDangerFlash() {
                dangerFlash.classList.add('active');
                setTimeout(() => dangerFlash.classList.remove('active'), 300);
            }

            function triggerGoldenFlash() {
                goldenFlash.classList.add('active');
                setTimeout(() => goldenFlash.classList.remove('active'), 400);
            }

            function triggerScreenShake() {
                gameWrapper.classList.add('shaking');
                setTimeout(() => gameWrapper.classList.remove('shaking'), 600);
            }

            function spawnFloatReward(text, color, x, y) {
                const el = document.createElement('div');
                el.className = 'float-reward';
                el.textContent = text;
                el.style.color = color || 'var(--gold)';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                document.body.appendChild(el);
                el.addEventListener('animationend', () => el.remove());
                setTimeout(() => { if (el.parentNode) el.remove(); }, 1600);
            }

            function getKeyCardCenter(index) {
                const card = keysGrid.children[index];
                if (!card) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                const rect = card.getBoundingClientRect();
                return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            }

            // ── RNG & FAIRNESS ────────────────────────────────────────
            function seededRandom(seed) {
                let h = 0;
                for (let i = 0; i < seed.length; i++) {
                    h = ((h << 5) - h) + seed.charCodeAt(i);
                    h |= 0;
                }
                return function() {
                    h = (h * 1103515245 + 12345) | 0;
                    return (h >>> 0) / 4294967296;
                };
            }

            function generateRoundSeed() {
                const entropy = Date.now().toString() + Math.random().toString() + navigator.userAgent;
                return entropy.split('').sort(() => Math.random() - 0.5).join('').substring(0, 48);
            }

            async function generateFairHash(seed) {
                const encoder = new TextEncoder();
                const data = encoder.encode(seed);
                try {
                    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (e) {
                    return seed.split('').reduce((a, c) => a + c.charCodeAt(0).toString(16), '');
                }
            }

            // ── WEIGHTED RNG ──────────────────────────────────────────
            function getWeightedRandomTier(weights) {
                const r = Math.random();
                let cumulative = 0;
                for (const [tier, weight] of Object.entries(weights)) {
                    cumulative += weight;
                    if (r <= cumulative) return tier;
                }
                return 'small';
            }

            function getRandomInRange(range) {
                const [min, max] = range;
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function generatePayout(tier, config) {
                const range = config.payoutRange[tier];
                if (!range) return getRandomInRange([25, 150]);
                return getRandomInRange(range);
            }

            // ── SPECIAL KEY EFFECTS ───────────────────────────────────
            function applySpecialKeyEffect(keyType, keyIndex) {
                const config = DIFFICULTY_CONFIG[currentDifficulty];
                switch (keyType) {
                    case 'jackpot':
                        const jpRange = config.payoutRange.jackpot;
                        const jpAmount = getRandomInRange([jpRange[0] * 2, jpRange[1] * 2]);
                        currentPot += jpAmount;
                        triggerGoldenFlash();
                        showToast('💎 JACKPOT KEY! +' + jpAmount.toLocaleString() + ' GOLD!', false, true);
                        playTone('jackpot');
                        if (jpAmount > (currentUser.goldenKeysStats.biggestJackpot || 0)) {
                            currentUser.goldenKeysStats.biggestJackpot = jpAmount;
                        }
                        return { msg: '💎 JACKPOT! +' + jpAmount.toLocaleString() + ' GOLD', amount: jpAmount,
                            epic: true };
                    case 'double':
                        const beforeDouble = currentPot;
                        currentPot = Math.floor(currentPot * 2);
                        triggerGoldenFlash();
                        showToast('🔄 DOUBLE POT! ' + beforeDouble.toLocaleString() + ' → ' + currentPot
                            .toLocaleString() + ' GOLD!', false, true);
                        playTone('revealSpecial');
                        return { msg: '🔄 POT DOUBLED!', amount: currentPot - beforeDouble, epic: true };
                    case 'shield':
                        shieldActive = true;
                        showToast('🛡️ SHIELD KEY! Protected from next skeleton!', false);
                        playTone('shieldActivate');
                        return { msg: '🛡️ SHIELD ACTIVE!', amount: 0, epic: false };
                    case 'curse':
                        const curseLoss = Math.floor(currentPot * (0.15 + Math.random() * 0.3));
                        currentPot = Math.max(0, currentPot - curseLoss);
                        showToast('🔥 CURSE KEY! Lost ' + curseLoss.toLocaleString() + ' GOLD from pot!', true);
                        playTone('curse');
                        return { msg: '🔥 CURSE! -' + curseLoss.toLocaleString() + ' GOLD', amount: -curseLoss,
                            epic: false };
                    case 'mimic':
                        const mimicLoss = Math.floor(currentPot * (0.08 + Math.random() * 0.15));
                        currentPot = Math.max(0, currentPot - mimicLoss);
                        showToast('🎭 MIMIC KEY! It stole ' + mimicLoss.toLocaleString() + ' GOLD!', true);
                        playTone('skeleton');
                        return { msg: '🎭 MIMIC! -' + mimicLoss.toLocaleString() + ' GOLD', amount: -mimicLoss,
                            epic: false };
                    case 'chain':
                        const revealed = [];
                        for (let offset = -1; offset <= 1; offset += 2) {
                            const adjIdx = keyIndex + offset;
                            if (adjIdx >= 0 && adjIdx < keysData.length && !keysData[adjIdx].revealed) {
                                keysData[adjIdx].revealed = true;
                                remainingKeys--;
                                if (!keysData[adjIdx].isSkeleton && !keysData[adjIdx].isSpecial) {
                                    const val = keysData[adjIdx].value || 0;
                                    currentPot += val;
                                    revealed.push(val);
                                }
                            }
                        }
                        if (revealed.length > 0) {
                            const sum = revealed.reduce((a, b) => a + b, 0);
                            showToast('⛓️ CHAIN KEY! Revealed adjacent keys for +' + sum.toLocaleString() +
                                ' GOLD!', false);
                            playTone('revealSpecial');
                            return { msg: '⛓️ CHAIN! +' + sum.toLocaleString() + ' GOLD', amount: sum,
                            epic: false };
                        }
                        return { msg: '⛓️ CHAIN KEY!', amount: 0, epic: false };
                    case 'lucky':
                        const luckyBonus = getRandomInRange([500, 5000]);
                        currentPot += luckyBonus;
                        safeRevealCount += 2;
                        updateMultiplier();
                        showToast('🍀 LUCKY KEY! +' + luckyBonus.toLocaleString() +
                            ' GOLD & multiplier boost!', false, true);
                        playTone('revealSpecial');
                        return { msg: '🍀 LUCKY! +' + luckyBonus.toLocaleString() + ' GOLD', amount: luckyBonus,
                            epic: true };
                    case 'corrupted':
                        const roll = Math.random();
                        if (roll < 0.45) {
                            const bonus = getRandomInRange([300, 3000]);
                            currentPot += bonus;
                            showToast('⚠️ CORRUPTED KEY turned BLESSED! +' + bonus.toLocaleString() + ' GOLD!',
                                false);
                            playTone('revealSpecial');
                            return { msg: '⚠️ BLESSED! +' + bonus.toLocaleString() + ' GOLD', amount: bonus,
                                epic: false };
                        } else if (roll < 0.85) {
                            const loss = Math.floor(currentPot * (0.1 + Math.random() * 0.25));
                            currentPot = Math.max(0, currentPot - loss);
                            showToast('⚠️ CORRUPTED KEY! Lost ' + loss.toLocaleString() + ' GOLD!', true);
                            playTone('curse');
                            return { msg: '⚠️ CORRUPTED! -' + loss.toLocaleString() + ' GOLD', amount: -loss,
                                epic: false };
                        } else {
                            const mega = getRandomInRange([2000, 15000]);
                            currentPot += mega;
                            triggerGoldenFlash();
                            showToast('⚠️ CORRUPTED KEY turned LEGENDARY! +' + mega.toLocaleString() + ' GOLD!',
                                false, true);
                            playTone('jackpot');
                            return { msg: '⚠️ LEGENDARY! +' + mega.toLocaleString() + ' GOLD', amount: mega,
                                epic: true };
                        }
                    default:
                        return { msg: '', amount: 0, epic: false };
                }
            }

            // ── MULTIPLIER & RISK ─────────────────────────────────────
            function updateMultiplier() {
                const config = DIFFICULTY_CONFIG[currentDifficulty];
                const growth = config.multiplierGrowth;
                const idx = Math.min(safeRevealCount, growth.length - 1);
                currentMultiplier = growth[idx];
                multiplierValue.textContent = currentMultiplier.toFixed(2) + 'x';
                if (safeRevealCount >= 3) {
                    multiplierValue.classList.add('booming');
                    setTimeout(() => multiplierValue.classList.remove('booming'), 450);
                }
            }

            function updateRiskMeter() {
                const config = DIFFICULTY_CONFIG[currentDifficulty];
                const totalKeys = keysData.length;
                const revealedCount = totalKeys - remainingKeys;
                const maxRevealable = totalKeys - config.skeletons;
                const progress = Math.min(1, revealedCount / Math.max(1, maxRevealable));
                const riskPercentVal = Math.floor((config.riskStart + progress * config.riskIncrement * 15) * 100);
                const clampedRisk = Math.min(95, Math.max(3, riskPercentVal));
                riskBarInner.style.width = clampedRisk + '%';
                riskBarInner.style.backgroundPosition = (clampedRisk) + '% 50%';
                riskPercent.textContent = clampedRisk + '%';
                if (clampedRisk > 65) {
                    riskPercent.style.color = '#ff6b6b';
                } else if (clampedRisk > 35) {
                    riskPercent.style.color = '#f39c12';
                } else {
                    riskPercent.style.color = 'var(--gold)';
                }
            }

            // ── GAME LOGIC ────────────────────────────────────────────
            function getCurrentSkeletonChance() {
                const config = DIFFICULTY_CONFIG[currentDifficulty];
                const totalKeys = keysData.length;
                const revealedCount = totalKeys - remainingKeys;
                const maxRevealable = totalKeys - config.skeletons;
                const progress = Math.min(1, revealedCount / Math.max(1, maxRevealable));
                return config.skeletonBaseChance + progress * config.riskIncrement * 10;
            }

            function initializeKeys() {
                const config = DIFFICULTY_CONFIG[currentDifficulty];
                const totalKeys = 12;
                const numSkeletons = config.skeletons;
                const numSpecialKeys = Math.floor(Math.random() * 2) + (config.specialKeyChance > 0.15 ? 2 : config
                    .specialKeyChance > 0.1 ? 1 : 0);
                const numRegularGold = totalKeys - numSkeletons - numSpecialKeys;

                keysData = [];
                // Create gold keys
                for (let i = 0; i < numRegularGold; i++) {
                    const tier = getWeightedRandomTier(config.weightTiers);
                    const value = generatePayout(tier, config);
                    keysData.push({ value, revealed: false, isSkeleton: false, isSpecial: false, specialType: null,
                        tier });
                }
                // Create special keys
                for (let i = 0; i < numSpecialKeys; i++) {
                    const sType = SPECIAL_KEY_TYPES[Math.floor(Math.random() * SPECIAL_KEY_TYPES.length)];
                    const tier = getWeightedRandomTier(config.weightTiers);
                    const value = generatePayout(tier, config);
                    keysData.push({ value, revealed: false, isSkeleton: false, isSpecial: true, specialType: sType,
                        tier });
                }
                // Create skeleton keys
                for (let i = 0; i < numSkeletons; i++) {
                    keysData.push({ value: 0, revealed: false, isSkeleton: true, isSpecial: false, specialType: null,
                        tier: 'skeleton' });
                }
                // Shuffle
                for (let i = keysData.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [keysData[i], keysData[j]] = [keysData[j], keysData[i]];
                }
                remainingKeys = totalKeys;
                currentPot = 0;
                safeRevealCount = 0;
                currentMultiplier = 1.0;
                shieldActive = false;
                masterKeyUsedThisRound = false;
                updatePotDisplay();
                updateMultiplier();
                updateRiskMeter();
                keysLeft.textContent = remainingKeys;
                updateMasterKeyStatus();
            }

            function updatePotDisplay() {
                potAmount.textContent = currentPot.toLocaleString();
                potAmount.classList.add('epic');
                setTimeout(() => potAmount.classList.remove('epic'), 500);
            }

            async function startRound() {
                if (gameActive) { showToast('Game already in progress!', true); return; }
                const bet = parseInt(betInput.value);
                if (isNaN(bet) || bet < 10) { showToast('Minimum bet 10 GOLD', true); return; }
                if (bet > currentUser.balance) { showToast('Insufficient balance', true); return; }
                betAmount = bet;
                currentUser.balance -= betAmount;
                addTransaction('Golden Keys - Bet ' + betAmount + ' GOLD [' + DIFFICULTY_CONFIG[currentDifficulty].label +
                    ']', -betAmount, 'withdraw');
                await saveUser();
                updateBalanceUI();
                gameActive = true;
                roundStarted = true;
                roundSeed = generateRoundSeed();
                roundHash = await generateFairHash(roundSeed);
                fairHash.textContent = 'Fair Hash: ' + roundHash.substring(0, 32) + '...';
                initializeKeys();
                renderKeysGrid();
                collectBtn.disabled = false;
                startRoundBtn.disabled = true;
                buyMasterKeyBtn.disabled = true;
                maxBetBtn.disabled = true;
                difficultySelector.querySelectorAll('.diff-btn').forEach(b => b.disabled = true);
                gameMessage.innerHTML =
                    '🔑 Pick keys to build your pot. <b>Collect anytime</b>. Avoid the SKELETON KEY!';
                updateRiskMeter();
                updateMultiplier();
                playTone('start');
            }

            async function buyMasterKey() {
                if (gameActive) { showToast('Cannot buy during an active round', true); return; }
                const cost = DIFFICULTY_CONFIG[currentDifficulty].masterKeyCost;
                if (currentUser.balance < cost) { showToast('Need ' + cost + ' GOLD for Master Key', true); return; }
                currentUser.balance -= cost;
                masterKeyOwned = true;
                currentUser.goldenKeysStats.masterKeysPurchased = (currentUser.goldenKeysStats.masterKeysPurchased || 0) + 1;
                addTransaction('Golden Keys - Master Key purchased (-' + cost + ' GOLD)', -cost, 'withdraw');
                await saveUser();
                updateBalanceUI();
                updateMasterKeyStatus();
                showToast('Master Key purchased! Protects from one skeleton.', false);
                playTone('reveal');
            }

            async function revealKey(index) {
                if (!gameActive || !roundStarted) return;
                if (keysData[index].revealed) return;

                keysData[index].revealed = true;
                remainingKeys--;
                keysLeft.textContent = remainingKeys;

                const center = getKeyCardCenter(index);

                if (keysData[index].isSkeleton) {
                    // Check shield first
                    if (shieldActive) {
                        shieldActive = false;
                        const randomGold = getRandomInRange(DIFFICULTY_CONFIG[currentDifficulty].payoutRange.medium);
                        keysData[index] = { value: randomGold, revealed: true, isSkeleton: false, isSpecial: false,
                            specialType: null, tier: 'medium' };
                        currentPot += randomGold;
                        updatePotDisplay();
                        currentUser.goldenKeysStats.totalSkeletonsAvoided = (currentUser.goldenKeysStats
                            .totalSkeletonsAvoided || 0) + 1;
                        gameMessage.innerHTML = '🛡️ Shield absorbed the skeleton! +' + randomGold +
                            ' GOLD added to pot.';
                        showToast('🛡️ Shield saved you! +' + randomGold + ' GOLD', false);
                        playTone('shieldActivate');
                        safeRevealCount++;
                        updateMultiplier();
                        updateRiskMeter();
                        renderKeysGrid();
                        await saveUser();
                        return;
                    }
                    // Check master key
                    if (masterKeyOwned && !masterKeyUsedThisRound) {
                        masterKeyUsedThisRound = true;
                        masterKeyOwned = false;
                        const randomGold = getRandomInRange(DIFFICULTY_CONFIG[currentDifficulty].payoutRange.large);
                        keysData[index] = { value: randomGold, revealed: true, isSkeleton: false, isSpecial: false,
                            specialType: null, tier: 'large' };
                        currentPot += randomGold;
                        updatePotDisplay();
                        updateMasterKeyStatus();
                        currentUser.goldenKeysStats.totalSkeletonsAvoided = (currentUser.goldenKeysStats
                            .totalSkeletonsAvoided || 0) + 1;
                        gameMessage.innerHTML = '💀 Skeleton avoided! Master key turned it into ' + randomGold +
                            ' GOLD.';
                        showToast('Master key used! +' + randomGold + ' GOLD', false);
                        playTone('reveal');
                        safeRevealCount++;
                        updateMultiplier();
                        updateRiskMeter();
                        renderKeysGrid();
                        addTransaction('Golden Keys - Master Key saved, +' + randomGold + ' to pot', 0, 'game_win');
                        await saveUser();
                        return;
                    }
                    // GAME OVER
                    gameActive = false;
                    roundStarted = false;
                    keysData.forEach(k => k.revealed = true);
                    renderKeysGrid();
                    triggerDangerFlash();
                    triggerScreenShake();
                    collectBtn.disabled = true;
                    startRoundBtn.disabled = false;
                    buyMasterKeyBtn.disabled = false;
                    maxBetBtn.disabled = false;
                    difficultySelector.querySelectorAll('.diff-btn').forEach(b => b.disabled = false);
                    gameMessage.innerHTML = '💀 <b>SKELETON KEY!</b> Pot lost: ' + currentPot.toLocaleString() +
                        ' GOLD. Game over.';
                    playTone('skeleton');
                    spawnFloatReward('💀 SKELETON!', '#ff4444', center.x, center.y);
                    currentUser.goldenKeysStats.skeletonHits = (currentUser.goldenKeysStats.skeletonHits || 0) + 1;
                    currentUser.globalStats.totalWagered += betAmount;
                    currentUser.globalStats.totalGames++;
                    currentUser.globalStats.currentStreak = 0;
                    currentUser.goldenKeysStats.gamesPlayed++;
                    recordGamePlay();
                    currentUser.gameOutcomes.unshift({
                        game: 'Golden Keys',
                        result: 'loss',
                        profit: -betAmount,
                        bet: betAmount,
                        potLost: currentPot,
                        skeleton: true,
                        difficulty: currentDifficulty,
                        date: new Date().toISOString(),
                    });
                    if (currentUser.gameOutcomes.length > 80) currentUser.gameOutcomes.pop();
                    fairHash.textContent = 'Seed: ' + roundSeed.substring(0, 24) + '... (verify at end)';
                    updateRiskMeterReset();
                    await saveUser();
                    updateStatsUI();
                    updateMasterKeyStatus();
                    return;
                }

                // Safe key revealed
                if (keysData[index].isSpecial) {
                    const effect = applySpecialKeyEffect(keysData[index].specialType, index);
                    gameMessage.innerHTML = effect.msg;
                    spawnFloatReward(effect.msg, effect.epic ? '#ffb347' : 'var(--gold)', center.x, center.y);
                } else {
                    currentPot += keysData[index].value;
                    updatePotDisplay();
                    gameMessage.innerHTML = '🔑 +' + keysData[index].value.toLocaleString() + ' GOLD! Pot: ' + currentPot
                        .toLocaleString() + ' GOLD';
                    spawnFloatReward('+' + keysData[index].value.toLocaleString() + ' GOLD', 'var(--gold)', center.x,
                        center.y);
                }
                safeRevealCount++;
                updateMultiplier();
                updateRiskMeter();
                playTone(keysData[index].isSpecial ? 'revealSpecial' : 'reveal');
                renderKeysGrid();
                updatePotDisplay();

                // Auto-collect if no hidden non-skeleton keys remain
                const anyHiddenSafe = keysData.some(k => !k.revealed && !k.isSkeleton);
                if (!anyHiddenSafe && remainingKeys > 0) {
                    await collectPot(true);
                }
            }

            async function collectPot(force = false) {
                if (!gameActive || !roundStarted) return;
                if (currentPot === 0 && !force) { showToast('Pot is empty! Pick some keys first.', true); return; }
                gameActive = false;
                roundStarted = false;
                const collected = Math.floor(currentPot * currentMultiplier);
                const basePot = currentPot;
                currentUser.balance += collected;
                const stats = currentUser.goldenKeysStats;
                stats.gamesPlayed++;
                stats.chestsUnlocked++;
                stats.totalGoldCollected += collected;
                if (collected > stats.bestPot) stats.bestPot = collected;
                if (collected > (stats.mostProfitableSession || 0)) stats.mostProfitableSession = collected;
                if (safeRevealCount > (stats.longestSurvivalStreak || 0)) stats.longestSurvivalStreak = safeRevealCount;
                currentUser.globalStats.totalWagered += betAmount;
                currentUser.globalStats.totalWon += collected;
                currentUser.globalStats.totalGames++;
                currentUser.globalStats.totalWins++;
                currentUser.globalStats.currentStreak = (currentUser.globalStats.currentStreak || 0) + 1;
                if (currentUser.globalStats.currentStreak > (currentUser.globalStats.bestStreak || 0))
                    currentUser.globalStats.bestStreak = currentUser.globalStats.currentStreak;
                if (currentUser.globalStats.currentStreak > (stats.bestStreak || 0))
                    stats.bestStreak = currentUser.globalStats.currentStreak;
                // Difficulty win tracking
                stats.difficultyWins = stats.difficultyWins || {};
                stats.difficultyWins[currentDifficulty] = (stats.difficultyWins[currentDifficulty] || 0) + 1;
                // XP
                const config = DIFFICULTY_CONFIG[currentDifficulty];
                const prestigeBonus = 1 + ((currentUser.prestige || 0) * 0.05);
                let xpGain = Math.floor((betAmount / 8 + collected / 15) * config.xpMultiplier * prestigeBonus);
                addXP(xpGain);
                // Achievements
                if (collected >= 5000 && !currentUser.earnedAchievements.includes('gold_baron')) {
                    currentUser.earnedAchievements.push('gold_baron');
                    showToast('🏆 ACHIEVEMENT: GOLD BARON! (5,000+ in one game) +300 XP', false, true);
                    addXP(300);
                }
                if (collected >= 200 && !currentUser.earnedAchievements.includes('gold_digger')) {
                    currentUser.earnedAchievements.push('gold_digger');
                    showToast('🏆 ACHIEVEMENT: GOLD DIGGER! (200+ in one game) +150 XP', false);
                    addXP(150);
                }
                if (safeRevealCount >= 8 && !currentUser.earnedAchievements.includes('risk_taker')) {
                    currentUser.earnedAchievements.push('risk_taker');
                    showToast('🏆 ACHIEVEMENT: RISK TAKER! (8+ safe reveals) +250 XP', false, true);
                    addXP(250);
                }
                if (collected >= 25000 && !currentUser.earnedAchievements.includes('legendary_haul')) {
                    currentUser.earnedAchievements.push('legendary_haul');
                    showToast('🏆 ACHIEVEMENT: LEGENDARY HAUL! (25,000+ in one game) +1000 XP', false, true);
                    addXP(1000);
                }
                // Daily challenge bonus
                if (!dailyChallengeCompleted && collected > 0) {
                    markDailyChallenge();
                    const dailyBonus = Math.floor(collected * 0.1);
                    currentUser.balance += dailyBonus;
                    showToast('📅 DAILY CHALLENGE BONUS! +' + dailyBonus.toLocaleString() + ' GOLD extra!', false,
                    true);
                }
                addTransaction('Golden Keys - Collected ' + collected.toLocaleString() + ' GOLD (' + currentMultiplier
                    .toFixed(2) + 'x multiplier) [' + config.label + ']', collected, 'game_win');
                recordGamePlay();
                currentUser.gameOutcomes.unshift({
                    game: 'Golden Keys',
                    result: 'win',
                    profit: collected - betAmount,
                    bet: betAmount,
                    potCollected: collected,
                    basePot: basePot,
                    multiplier: currentMultiplier,
                    safeReveals: safeRevealCount,
                    difficulty: currentDifficulty,
                    date: new Date().toISOString(),
                });
                if (currentUser.gameOutcomes.length > 80) currentUser.gameOutcomes.pop();
                await saveUser();
                updateBalanceUI();
                updateStatsUI();
                triggerGoldenFlash();
                gameMessage.innerHTML = '🏆 <b>CHEST UNLOCKED!</b> ' + collected.toLocaleString() +
                    ' GOLD collected! (' + currentMultiplier.toFixed(2) + 'x multiplier)';
                playTone('collect');
                spawnFloatReward('+' + collected.toLocaleString() + ' GOLD!', '#ffd966', window.innerWidth / 2, window
                    .innerHeight / 2);
                keysData.forEach(k => k.revealed = true);
                renderKeysGrid();
                collectBtn.disabled = true;
                startRoundBtn.disabled = false;
                buyMasterKeyBtn.disabled = false;
                maxBetBtn.disabled = false;
                difficultySelector.querySelectorAll('.diff-btn').forEach(b => b.disabled = false);
                fairHash.textContent = 'Seed: ' + roundSeed.substring(0, 24) +
                    '... | Verify with SHA-256 online';
                updateRiskMeterReset();
                updateMultiplier();
                if (masterKeyUsedThisRound) {
                    masterKeyOwned = false;
                    masterKeyUsedThisRound = false;
                    updateMasterKeyStatus();
                    await saveUser();
                }
            }

            function updateRiskMeterReset() {
                riskBarInner.style.width = '5%';
                riskBarInner.style.backgroundPosition = '0% 50%';
                riskPercent.textContent = '5%';
                riskPercent.style.color = 'var(--gold)';
                multiplierValue.textContent = '1.00x';
                currentMultiplier = 1.0;
                safeRevealCount = 0;
            }

            function recordGamePlay() {
                currentUser.gamePlayCount['goldenkeys'] = (currentUser.gamePlayCount['goldenkeys'] || 0) + 1;
            }

            function addTransaction(desc, amount, type) {
                currentUser.transactions.unshift({ desc, amount, type, date: new Date().toISOString() });
                if (currentUser.transactions.length > 120) currentUser.transactions.pop();
            }

            // ── RENDER ────────────────────────────────────────────────
            function renderKeysGrid() {
                keysGrid.innerHTML = '';
                keysData.forEach((key, i) => {
                    const card = document.createElement('div');
                    card.className = 'key-card';
                    if (key.revealed) {
                        card.classList.add('revealed');
                        if (key.isSkeleton) card.classList.add('skeleton');
                        if (key.isSpecial) {
                            card.classList.add('special-reveal');
                            card.setAttribute('data-key-type', key.specialType);
                        }
                    }
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', key.revealed || !gameActive || !roundStarted ? '-1' : '0');
                    card.setAttribute('aria-label', key.revealed ?
                        (key.isSkeleton ? 'Skeleton key revealed' :
                            key.isSpecial ? 'Special ' + (SPECIAL_KEY_LABELS[key.specialType] || 'key') + ' worth ' +
                            key.value :
                            'Gold key worth ' + key.value) :
                        'Hidden key');
                    let innerHtml = '';
                    if (!key.revealed) {
                        innerHtml =
                            '<i class="fas fa-key" aria-hidden="true"></i><div class="key-value">???</div>';
                    } else if (key.isSkeleton) {
                        innerHtml =
                            '<i class="fas fa-skull" aria-hidden="true"></i><div class="key-value">💀 SKELETON</div>';
                    } else if (key.isSpecial) {
                        const iconClass = SPECIAL_KEY_ICONS[key.specialType] || 'fa-star';
                        innerHtml = '<i class="fas ' + iconClass +
                            '" aria-hidden="true"></i><div class="key-value">' + (SPECIAL_KEY_LABELS[key
                                .specialType] || 'SPECIAL') + '<br><small>' + key.value.toLocaleString() +
                            ' GOLD</small></div>';
                    } else {
                        innerHtml =
                            '<i class="fas fa-coins" aria-hidden="true"></i><div class="key-value">' + key.value
                            .toLocaleString() + ' GOLD</div>';
                    }
                    card.innerHTML = innerHtml;
                    card.addEventListener('click', (e) => {
                        e.stopPropagation();
                        revealKey(i);
                    });
                    card.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            revealKey(i);
                        }
                    });
                    keysGrid.appendChild(card);
                });
            }

            // ── DIFFICULTY UI ─────────────────────────────────────────
            function setDifficulty(diff) {
                if (gameActive) { showToast('Cannot change difficulty during a round', true); return; }
                currentDifficulty = diff;
                const config = DIFFICULTY_CONFIG[diff];
                // Update buttons
                difficultySelector.querySelectorAll('.diff-btn').forEach(b => {
                    b.classList.remove('active', 'danger-active');
                    b.setAttribute('aria-checked', 'false');
                    if (b.dataset.diff === diff) {
                        b.classList.add('active');
                        if (diff === 'nightmare') b.classList.add('danger-active');
                        b.setAttribute('aria-checked', 'true');
                    }
                });
                // Update info
                const infoMap = {
                    easy: '🟢 Safer · Lower payouts · 1 skeleton · Great for learning',
                    normal: '🟡 Balanced risk & reward · 1 skeleton · Standard payouts',
                    hard: '🟠 High risk · 2 skeletons · Bigger payouts · Intense',
                    nightmare: '🔴 Extreme risk · 3 skeletons · Massive jackpots · Deadly',
                };
                diffInfo.textContent = infoMap[diff] || '';
                // Update master key cost display
                mkCost.textContent = config.masterKeyCost;
                // Update body & card classes
                document.body.classList.remove('hard-mode', 'nightmare-mode');
                gameCard.classList.remove('hard-border', 'nightmare-border');
                if (config.bodyClass) document.body.classList.add(config.bodyClass);
                if (config.colorClass) gameCard.classList.add(config.colorClass);
                difficultyLabel.textContent = config.label.toUpperCase() + ' MODE';
                updateRiskMeterReset();
                updateMasterKeyStatus();
                // Update MK button cost
                buyMasterKeyBtn.innerHTML =
                    '<i class="fas fa-crown" aria-hidden="true"></i> Master Key (' + config.masterKeyCost +
                    ' GOLD)';
                showToast('Difficulty: ' + config.label, false);
            }

            // ── SPARKLES ──────────────────────────────────────────────
            function createSparkles() {
                const container = $('particles');
                for (let i = 0; i < 40; i++) {
                    const s = document.createElement('div');
                    s.className = 'sparkle';
                    s.setAttribute('aria-hidden', 'true');
                    s.style.left = Math.random() * 100 + '%';
                    s.style.bottom = -(Math.random() * 35 + 5) + '%';
                    s.style.animationDelay = Math.random() * 9 + 's';
                    s.style.animationDuration = (Math.random() * 6 + 4) + 's';
                    if (Math.random() < 0.15) s.classList.add('danger-spark');
                    container.appendChild(s);
                }
            }

            // ── EVENT BINDINGS ────────────────────────────────────────
            startRoundBtn.addEventListener('click', startRound);
            buyMasterKeyBtn.addEventListener('click', buyMasterKey);
            collectBtn.addEventListener('click', () => collectPot());
            soundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                soundToggle.innerHTML = soundEnabled ?
                    '<i class="fas fa-volume-up" aria-hidden="true"></i>' :
                    '<i class="fas fa-volume-mute" aria-hidden="true"></i>';
                soundToggle.setAttribute('aria-label', soundEnabled ? 'Mute sound' : 'Unmute sound');
                localStorage.setItem('gold_sound_enabled', soundEnabled);
            });

            betInput.addEventListener('input', function() {
                let val = parseInt(this.value);
                if (isNaN(val) || val < 10) this.value = 10;
                if (currentUser && val > currentUser.balance) this.value = currentUser.balance;
            });

            maxBetBtn.addEventListener('click', () => {
                if (currentUser) betInput.value = currentUser.balance;
                betInput.dispatchEvent(new Event('input'));
            });

            difficultySelector.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => setDifficulty(btn.dataset.diff));
            });

            // Prestige on level badge double-click
            levelBadge.addEventListener('dblclick', () => {
                if ((currentUser.level || 1) >= MAX_LEVEL) {
                    prestigeUser();
                } else {
                    showToast('Reach level ' + MAX_LEVEL + ' to prestige. Double-click then.', true);
                }
            });
            levelBadge.style.cursor = 'pointer';
            levelBadge.title = 'Double-click to prestige when level ' + MAX_LEVEL;

            // ── INIT ──────────────────────────────────────────────────
            async function init() {
                createSparkles();
                const soundPref = localStorage.getItem('gold_sound_enabled');
                if (soundPref === 'false') {
                    soundEnabled = false;
                    soundToggle.innerHTML = '<i class="fas fa-volume-mute" aria-hidden="true"></i>';
                    soundToggle.setAttribute('aria-label', 'Unmute sound');
                }
                const loggedIn = await loadUser();
                if (!loggedIn) return;
                const resumeAudioOnGesture = () => {
                    initAudio();
                    resumeAudio();
                    document.body.removeEventListener('click', resumeAudioOnGesture);
                    document.body.removeEventListener('touchstart', resumeAudioOnGesture);
                };
                document.body.addEventListener('click', resumeAudioOnGesture);
                document.body.addEventListener('touchstart', resumeAudioOnGesture);
                collectBtn.disabled = true;
                startRoundBtn.disabled = false;
                buyMasterKeyBtn.disabled = false;
                maxBetBtn.disabled = false;
                setDifficulty('normal');
                renderKeysGrid();
                updateXPUI();
                updatePrestigeUI();
                mkCost.textContent = DIFFICULTY_CONFIG['normal'].masterKeyCost;
                fairHash.textContent = '';
                if ((currentUser.level || 1) >= MAX_LEVEL && (currentUser.prestige || 0) < 10) {
                    showToast('🌟 You can prestige! Double-click your level badge.', false);
                }
            }

            init();
        })();
    </script>
</body>
</html>
