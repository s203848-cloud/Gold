<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GOLD | GOLDEN KEYS | Pick the key that matches, and earn big!</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd966;
            --gold-bright: #ffe9a0;
            --gold-dim: #c9a840;
            --bg-deep: #0a0908;
            --bg-card: rgba(20, 18, 16, 0.85);
            --border-gold: rgba(255, 217, 102, 0.3);
            --danger: #ff4444;
            --danger-glow: #ff6b6b;
            --success: #4caf50;
            --text-muted: #9a9484;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --transition-fast: 0.15s;
            --transition-soft: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font-display: 'Orbitron', 'Inter', sans-serif;
            --jackpot-glow: #ffb347;
            --shield-blue: #5b9bd5;
            --curse-purple: #9b59b6;
            --mimic-teal: #1abc9c;
            --chain-cyan: #00d4ff;
            --lucky-green: #2ecc71;
            --corrupted-red: #e74c3c;
            --double-orange: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #14110c 0%, #030202 100%);
            color: #f5f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }
        body.nightmare-mode {
            background: radial-gradient(circle at 20% 30%, #1a0808 0%, #050000 100%);
        }
        body.hard-mode {
            background: radial-gradient(circle at 20% 30%, #18100c 0%, #040101 100%);
        }

        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold);
            border-radius: 50%;
            animation: floatSparkle 6s infinite ease-in;
            opacity: 0;
        }
        .sparkle.danger-spark {
            background: var(--danger);
            animation-duration: 4s;
        }
        @keyframes floatSparkle {
            0% {
                transform: translateY(0) translateX(0) scale(0);
                opacity: 0;
            }
            12% {
                opacity: 0.9;
                transform: scale(1.3);
            }
            35% {
                transform: translateY(-160px) translateX(25px) scale(1);
                opacity: 0.4;
            }
            65% {
                transform: translateY(-340px) translateX(-18px) scale(0.5);
                opacity: 0.08;
            }
            100% {
                transform: translateY(-500px) translateX(12px) scale(0);
                opacity: 0;
            }
        }

        /* ── Screen Shake ── */
        @keyframes screenShake {
            0%,
            100% {
                transform: translate(0, 0);
            }
            10% {
                transform: translate(-6px, 3px);
            }
            20% {
                transform: translate(5px, -4px);
            }
            30% {
                transform: translate(-4px, -2px);
            }
            40% {
                transform: translate(3px, 5px);
            }
            50% {
                transform: translate(-5px, -1px);
            }
            60% {
                transform: translate(2px, -3px);
            }
            70% {
                transform: translate(-3px, 4px);
            }
            80% {
                transform: translate(4px, 1px);
            }
            90% {
                transform: translate(-2px, -5px);
            }
        }
        .shaking {
            animation: screenShake 0.55s ease-out;
        }

        /* ── Red Flash Overlay ── */
        .danger-flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
            background: radial-gradient(ellipse at center, rgba(255, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.85) 100%);
            opacity: 0;
            transition: opacity 0.1s ease-out;
        }
        .danger-flash.active {
            opacity: 1;
            transition: opacity 0.05s ease-in;
        }

        /* ── Golden Glow Overlay ── */
        .golden-flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 998;
            background: radial-gradient(ellipse at center, rgba(255, 217, 102, 0.35) 0%, rgba(0, 0, 0, 0.7) 100%);
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }
        .golden-flash.active {
            opacity: 1;
            transition: opacity 0.06s ease-in;
        }

        .game-wrapper {
            max-width: 880px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* ── Nav ── */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 13, 11, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 0.6rem 1.4rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-gold);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .back-home {
            text-decoration: none;
            color: var(--gold);
            font-weight: 600;
            background: rgba(255, 217, 102, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        .back-home:hover {
            background: rgba(255, 217, 102, 0.2);
            transform: translateX(-3px);
        }
        .balance-tag {
            background: rgba(31, 28, 24, 0.9);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid rgba(255, 217, 102, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .sound-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--gold);
            border-radius: 50%;
            padding: 0.3rem;
            transition: var(--transition-fast);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sound-btn:hover {
            background: rgba(255, 217, 102, 0.15);
        }

        /* ── Game Card ── */
        .game-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 1.3rem 1.5rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .game-card.nightmare-border {
            border-color: rgba(255, 68, 68, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 0, 0, 0.15);
        }
        .game-card.hard-border {
            border-color: rgba(255, 150, 50, 0.45);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 140, 0, 0.1);
        }

        .game-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 0.3rem;
            text-shadow: 0 0 10px rgba(255, 217, 102, 0.3);
            font-family: var(--font-display);
        }
        .game-subtitle {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        /* ── Difficulty Selector ── */
        .difficulty-selector {
            display: flex;
            gap: 0.4rem;
            justify-content: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .diff-btn {
            background: rgba(30, 26, 22, 0.8);
            border: 2px solid rgba(255, 217, 102, 0.2);
            border-radius: 30px;
            padding: 0.45rem 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-soft);
            color: #a09888;
            font-size: 0.75rem;
            letter-spacing: 1px;
            outline: none;
            position: relative;
            font-family: var(--font-display);
        }
        .diff-btn:hover {
            border-color: var(--gold-dim);
            color: #d4c9a8;
            transform: translateY(-2px);
        }
        .diff-btn:focus-visible {
            box-shadow: 0 0 0 3px var(--gold-dim);
        }
        .diff-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(255, 217, 102, 0.12);
            box-shadow: 0 0 15px rgba(255, 217, 102, 0.2);
            text-shadow: 0 0 8px rgba(255, 217, 102, 0.4);
        }
        .diff-btn.danger-active {
            border-color: var(--danger);
            color: #ff8888;
            background: rgba(255, 68, 68, 0.12);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.25);
            text-shadow: 0 0 8px rgba(255, 100, 100, 0.4);
            animation: pulseDanger 2s infinite;
        }
        @keyframes pulseDanger {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(255, 68, 68, 0.25);
            }
            50% {
                box-shadow: 0 0 28px rgba(255, 68, 68, 0.5);
            }
        }
        .diff-info {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            min-height: 1.2em;
            transition: color 0.3s;
        }

        /* ── Risk Meter & Multiplier ── */
        .risk-multiplier-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .risk-meter-wrap {
            flex: 1;
            min-width: 140px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 0.5rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .risk-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            font-weight: 600;
        }
        .risk-bar-outer {
            flex: 1;
            height: 8px;
            background: #1a1815;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .risk-bar-inner {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease, background 0.5s ease;
            background: linear-gradient(90deg, #4caf50, #ffd966, #f39c12, #e74c3c, #8b0000);
            background-size: 300% 100%;
            background-position: 0% 50%;
        }
        .risk-percent {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--gold);
            min-width: 38px;
            text-align: right;
            font-family: var(--font-display);
        }
        .multiplier-wrap {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 0.5rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            min-width: 100px;
        }
        .multiplier-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .multiplier-value {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--gold-bright);
            font-family: var(--font-display);
            text-shadow: 0 0 10px rgba(255, 217, 102, 0.5);
            transition: all 0.3s ease;
        }
        .multiplier-value.booming {
            animation: multBoom 0.4s ease-out;
        }
        @keyframes multBoom {
            0% {
                transform: scale(1.6);
                color: #fff;
            }
            100% {
                transform: scale(1);
            }
        }

        /* ── Keys Grid ── */
        .keys-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.7rem;
            margin: 1rem 0;
        }
        .key-card {
            background: #2c241c;
            border: 2px solid var(--border-gold);
            border-radius: 18px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-soft);
            font-size: 1.8rem;
            position: relative;
            outline: none;
            overflow: hidden;
        }
        .key-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: radial-gradient(circle at 50% 30%, rgba(255, 217, 102, 0.08) 0%, transparent 70%);
            pointer-events: none;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .key-card:hover:not(.revealed)::after {
            opacity: 1;
        }
        .key-card:focus-visible {
            box-shadow: 0 0 0 3px var(--gold), 0 0 16px var(--gold);
            border-color: var(--gold);
            transform: scale(1.06);
        }
        .key-card:hover:not(.revealed) {
            transform: translateY(-6px);
            border-color: var(--gold);
            background: #3a3026;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .key-card:active:not(.revealed) {
            transform: scale(0.94);
            transition: transform 0.1s;
        }
        .key-card.revealed {
            cursor: default;
            background: #1f1b17;
            border-color: #444;
            opacity: 0.85;
        }
        .key-card.revealed::after {
            opacity: 0;
        }
        .key-card.skeleton {
            background: #2a1010;
            border-color: var(--danger);
            color: var(--danger);
            animation: skeletonPulse 0.6s ease-out;
        }
        @keyframes skeletonPulse {
            0% {
                transform: scale(1.3);
                background: #4a0000;
                border-color: #ff0000;
            }
            100% {
                transform: scale(1);
                background: #2a1010;
            }
        }
        .key-card.special-reveal {
            animation: specialPop 0.5s ease-out;
        }
        @keyframes specialPop {
            0% {
                transform: scale(1.35);
                filter: brightness(2);
            }
            60% {
                transform: scale(0.92);
                filter: brightness(1.3);
            }
            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }
        .key-value {
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }
        .key-card .fa-key {
            font-size: 2rem;
            color: var(--gold);
            transition: all 0.3s;
        }
        .key-card:hover:not(.revealed) .fa-key {
            color: var(--gold-bright);
            filter: drop-shadow(0 0 6px rgba(255, 217, 102, 0.6));
        }
        .key-card.skeleton .fa-skull {
            color: var(--danger);
            font-size: 2rem;
            animation: skullThrob 0.5s ease-out;
        }
        @keyframes skullThrob {
            0% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }
        .key-card .fa-coins {
            font-size: 2rem;
            color: var(--gold);
        }
        .key-card .fa-gem {
            font-size: 2rem;
            color: #ff69b4;
        }

        /* ── Special Key Type Styles ── */
        .key-card[data-key-type="jackpot"] .fa-coins,
        .key-card[data-key-type="jackpot"] .fa-gem {
            color: #ffb347;
            filter: drop-shadow(0 0 10px rgba(255, 179, 71, 0.8));
            animation: jackpotGlow 0.8s infinite alternate;
        }
        @keyframes jackpotGlow {
            0% {
                filter: drop-shadow(0 0 8px rgba(255, 179, 71, 0.6));
            }
            100% {
                filter: drop-shadow(0 0 20px rgba(255, 200, 100, 1));
            }
        }
        .key-card[data-key-type="double"] .fa-coins {
            color: #f39c12;
            filter: drop-shadow(0 0 8px rgba(243, 156, 18, 0.7));
        }
        .key-card[data-key-type="shield"] .fa-shield-halved {
            color: var(--shield-blue);
            filter: drop-shadow(0 0 8px rgba(91, 155, 213, 0.7));
        }
        .key-card[data-key-type="curse"] .fa-fire {
            color: var(--curse-purple);
            filter: drop-shadow(0 0 8px rgba(155, 89, 182, 0.7));
        }
        .key-card[data-key-type="mimic"] .fa-mask {
            color: var(--mimic-teal);
        }
        .key-card[data-key-type="chain"] .fa-link {
            color: var(--chain-cyan);
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.7));
        }
        .key-card[data-key-type="lucky"] .fa-clover {
            color: var(--lucky-green);
            filter: drop-shadow(0 0 10px rgba(46, 204, 113, 0.8));
        }
        .key-card[data-key-type="corrupted"] .fa-question {
            color: var(--corrupted-red);
        }

        /* ── Floating reward text ── */
        .float-reward {
            position: fixed;
            pointer-events: none;
            z-index: 1500;
            font-weight: 900;
            font-size: 1.2rem;
            animation: floatUp 1.4s ease-out forwards;
            text-shadow: 0 0 12px currentColor;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(0.8);
            }
            30% {
                opacity: 1;
                transform: translateY(-30px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.6);
            }
        }

        /* ── Stats Bar ── */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-md);
            padding: 0.7rem 1rem;
            margin: 0.8rem 0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .pot-display {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 8px rgba(255, 217, 102, 0.5);
            font-family: var(--font-display);
        }
        .pot-display.epic {
            animation: potEpic 0.5s ease-out;
        }
        @keyframes potEpic {
            0% {
                transform: scale(1.25);
                color: #fff;
            }
            100% {
                transform: scale(1);
            }
        }
        .remaining {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ── Controls ── */
        .control-panel {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin: 0.8rem 0;
            align-items: center;
        }
        .bet-group {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .bet-input {
            background: #1f1b17;
            border: 2px solid rgba(255, 217, 102, 0.2);
            border-radius: 60px;
            padding: 0.55rem 0.9rem;
            color: white;
            font-weight: 700;
            width: 90px;
            text-align: center;
            outline: none;
            font-size: 0.85rem;
            transition: var(--transition-fast);
            font-family: var(--font-display);
        }
        .bet-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-dim);
        }
        .max-bet-btn {
            background: rgba(255, 217, 102, 0.15);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            color: var(--gold);
            padding: 0.35rem 0.7rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            transition: var(--transition-fast);
        }
        .max-bet-btn:hover {
            background: rgba(255, 217, 102, 0.28);
        }
        .btn {
            background: rgba(255, 217, 102, 0.1);
            border: 1px solid var(--border-gold);
            border-radius: 60px;
            padding: 0.55rem 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            color: var(--gold);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            outline: none;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .btn:focus-visible {
            box-shadow: 0 0 0 3px var(--gold-dim);
        }
        .btn-primary {
            background: linear-gradient(135deg, #f5a623, #ffd966);
            color: #1a150e;
            border: none;
            box-shadow: 0 3px 0 #a05f15;
            font-weight: 800;
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #a05f15;
        }
        .btn-success {
            background: #4caf50;
            color: white;
            border: none;
            box-shadow: 0 3px 0 #2e7d32;
        }
        .btn-success:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2e7d32;
        }
        .btn-danger {
            background: rgba(255, 107, 107, 0.2);
            color: #ffab91;
            border-color: #ff6b6b;
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-highlight {
            animation: btnGlow 1.5s infinite;
        }
        @keyframes btnGlow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 217, 102, 0.3);
            }
            50% {
                box-shadow: 0 0 22px rgba(255, 217, 102, 0.7);
            }
        }

        /* ── Info Panel ── */
        .info-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 0.7rem;
            text-align: center;
            margin-top: 0.8rem;
        }
        .info-value {
            font-size: 1rem;
            font-weight: 800;

    <script>
        (function() {
            /* ================================================================

               ================================================================ */

            // ── CONFIGURATION ──────────────────────────────────────────
            const DIFFICULTY_CONFIG = {

            const SPECIAL_KEY_TYPES = ['jackpot', 'double', 'shield', 'curse', 'mimic', 'chain', 'lucky', 'corrupted'];
            const SPECIAL_KEY_ICONS = {

                chain: 'fa-link',

            };
            const SPECIAL_KEY_LABELS = {
                jackpot: 'JACKPOT!',
                double: 'DOUBLE POT',
                shield: 'SHIELD',
                curse: 'CURSE',
                mimic: 'MIMIC',
                chain: 'CHAIN',
                lucky: 'LUCKY',
                corrupted: 'CORRUPTED',
            };
            const PRESTIGE_TITLES = [
                'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond',

            ];
            const XP_PER_LEVEL = 100;
            const MAX_LEVEL = 50;
            const LEVELS_PER_PRESTIGE = 50;

            // ── STATE ──────────────────────────────────────────────────
            let audioCtx = null;
            let soundEnabled = true;
            let currentUser = null;
            let gameActive = false;
            let roundStarted = false;
            let currentPot = 0;
            let keysData = [];
            let masterKeyOwned = false;
            let masterKeyUsedThisRound = false;
            let remainingKeys = 0;
            let betAmount = 0;
            let currentDifficulty = 'normal';
            let safeRevealCount = 0;
            let currentMultiplier = 1.0;
            let roundSeed = '';
            let roundHash = '';

            let dailyChallengeCompleted = false;

            // ── DOM REFS ──────────────────────────────────────────────
            const $ = (id) => document.getElementById(id);
            const balanceDisplay = $('balanceDisplay');
            const potAmount = $('potAmount');
            const keysLeft = $('keysLeft');
            const masterKeyStatus = $('masterKeyStatus');
            const gameMessage = $('gameMessage');
            const toastMsg = $('toastMsg');

            const startRoundBtn = $('startRoundBtn');
            const buyMasterKeyBtn = $('buyMasterKeyBtn');
            const maxBetBtn = $('maxBetBtn');
            const betInput = $('betAmount');
