                    contentDiv.innerHTML = `
                        <p style="margin-bottom:0.8rem;color:var(--text-muted);">👆 Replicate the fingerprint sequence:</p>
                        <div style="font-size:1.4rem;letter-spacing:6px;margin-bottom:1rem;font-weight:800;color:var(--gold-bright);" id="fpSequence">
                            ${seq.map(i => fingerNames[i]).join(' → ')}
                        </div>
                        <div style="display:flex;gap:0.7rem;justify-content:center;flex-wrap:wrap;" id="fpButtons">
                            ${[1,2,3,4].map(i => `
                                <button class="wire-btn" data-finger="${i}" style="min-width:70px;padding:0.6rem 1rem;">
                                    ${['','👍','👆','🖕','💍'][i]}<br><small>${fingerNames[i]}</small>
                                </button>
                            `).join('')}
                        </div>
                        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;" id="fpProgress">Tap the first finger...</p>
                    `;
                    const progEl = document.getElementById('fpProgress');
                    contentDiv.querySelectorAll('[data-finger]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (!this.state.active) return;
                            const finger = parseInt(btn.dataset.finger);
                            if (finger === this.stageData.seq[this.stageData.playerPos]) {
                                this.stageData.playerPos++;
                                this.audio.play('click');
                                haptic('light');
                                if (this.stageData.playerPos >= 3) {
                                    this.handleStageSuccess(resultDiv,
                                        '✅ Fingerprint accepted! Access granted.',
                                        'stageClear');
                                } else {
                                    progEl.textContent =
                                        `Good! Now tap finger ${this.stageData.playerPos + 1} of 3...`;
                                }
                            } else {
                                this.handleStageFailure(resultDiv,
                                    '❌ Wrong fingerprint! Biometric lock engaged.');
                            }
                        });
                    });
                }

                // ── Stage: Safe Crack ──
                buildSafeCrackStage(contentDiv, resultDiv) {
                    const seq = Array.from({ length: 4 }, () => Math.floor(Math.random() * 10));
                    this.stageData = { seq, playerPos: 0, type: 'safe_crack' };
                    contentDiv.innerHTML = `
                        <div class="vault-door-container" id="vaultDoor">
                            <div class="vault-spinner"></div>
                        </div>
                        <div class="memory-display" id="memDisplay">${seq.join(' ')}</div>
                        <p style="margin-bottom:1rem;color:var(--text-muted);">🔒 Memorize the code...</p>
                        <div id="memDigits" style="display:none;" class="digit-grid"></div>
                    `;
                    const memDiv = document.getElementById('memDisplay');
                    setTimeout(() => {
                        if (!this.state.active) return;
                        if (memDiv) memDiv.style.opacity = '0';
                        setTimeout(() => {
                            if (!this.state.active) return;
                            const gridDiv = document.getElementById('memDigits');
                            if (gridDiv) {
                                gridDiv.style.display = 'grid';
                                gridDiv.innerHTML = '';
                                for (let i = 0; i <= 9; i++) {
                                    const btn = document.createElement('button');
                                    btn.textContent = i;
                                    btn.classList.add('digit-btn');
                                    btn.dataset.digit = i;
                                    btn.addEventListener('click', () => {
                                        if (!this.state.active) return;
                                        const digit = parseInt(btn.dataset
                                            .digit);
                                        if (digit === this.stageData.seq[this
                                                .stageData.playerPos
                                            ]) {
                                            this.stageData.playerPos++;
                                            btn.classList.add(
                                            'correct-press');
                                            this.audio.play('click');
                                            haptic('light');
                                            if (this.stageData.playerPos >=
                                                4) {
                                                const vaultDoor = document
                                                    .getElementById(
                                                        'vaultDoor');
                                                if (vaultDoor) vaultDoor
                                                    .classList.add(
                                                        'vault-open');
                                                this.handleStageSuccess(
                                                    resultDiv,
                                                    '✅ Vault cracked open! Moving to escape...',
                                                    'stageClear');
                                            }
                                        } else {
                                            btn.classList.add('wrong-press');
                                            this.handleStageFailure(
                                                resultDiv,
                                                '💥 Wrong digit! Security lockdown initiated.'
                                                );
                                        }
                                    });
                                    gridDiv.appendChild(btn);
                                }
                            }
                        }, 200);
                    }, 2200);
                }

                // ── Stage: Laser Dodge ──
                buildLaserDodgeStage(contentDiv, resultDiv) {
                    const safePaths = [Math.floor(Math.random() * 3)];
                    this.stageData = { safePaths, type: 'laser_dodge' };
                    const pathNames = ['Crawl Under', 'Slide Through Middle', 'Jump Over'];
                    contentDiv.innerHTML = `
                        <p style="margin-bottom:0.8rem;color:var(--text-muted);">🔴 Navigate the laser grid — choose a path:</p>
                        <div style="font-size:3rem;margin:0.5rem 0;">🔴🔴🔴</div>
                        <div style="display:flex;gap:0.8rem;justify-content:center;flex-wrap:wrap;">
                            ${pathNames.map((name, i) => `
                                <button class="wire-btn" data-path="${i}" style="min-width:100px;">
                                    <i class="fas fa-${i===0?'person-walking':i===1?'arrows-left-right':'person-running'}"></i>
                                    ${name}
                                </button>
                            `).join('')}
                        </div>
                    `;
                    contentDiv.querySelectorAll('[data-path]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (!this.state.active) return;
                            const path = parseInt(btn.dataset.path);
                            if (path === safePaths[0]) {
                                this.handleStageSuccess(resultDiv,
                                    '✅ Clean pass through the lasers!', 'stageClear');
                            } else {
                                this.handleStageFailure(resultDiv,
                                    '🔴 LASER TRIPPED! Alarms blaring!');
                            }
                        });
                    });
                }

                // ── Stage: Thermal Sensor ──
                buildThermalStage(contentDiv, resultDiv) {
                    const targetTemp = 35 + Math.floor(Math.random() * 30);
                    this.stageData = { targetTemp, type: 'thermal' };
                    contentDiv.innerHTML = `
                        <p style="margin-bottom:0.8rem;color:var(--text-muted);">🌡️ Match the thermal signature: <strong>${targetTemp}°C</strong></p>
                        <input type="range" id="thermalSlider" min="20" max="80" value="50" style="width:80%;accent-color:var(--gold);">
                        <div style="font-size:1.5rem;font-weight:800;color:var(--gold-bright);" id="thermalValue">50°C</div>
                        <button id="thermalConfirm" class="escape-btn" style="width:auto;padding:0.6rem 1.5rem;margin-top:0.5rem;">🌡️ CONFIRM TEMP</button>
                    `;
                    const slider = document.getElementById('thermalSlider');
                    const valDisplay = document.getElementById('thermalValue');
                    slider.addEventListener('input', () => {
                        valDisplay.textContent = slider.value + '°C';
                    });
                    document.getElementById('thermalConfirm').addEventListener('click', () => {
                        if (!this.state.active) return;
                        const diff = Math.abs(parseInt(slider.value) - targetTemp);
                        if (diff <= 3) {
                            this.handleStageSuccess(resultDiv,
                                '✅ Thermal signature matched! Sensors bypassed.',
                                'stageClear');
                        } else if (diff <= 8) {
                            this.handleStageSuccess(resultDiv,
                                '⚠️ Close enough — sensors momentarily confused. Go!',
                                'stageClear');
                        } else {
                            this.handleStageFailure(resultDiv,
                                '🔥 Thermal spike detected! Security alerted!');
                        }
                    });
                }

                // ── Stage: Camera Avoidance ──
                buildCameraAvoidStage(contentDiv, resultDiv) {
                    const safeWindows = [Math.floor(Math.random() * 4)];
                    this.stageData = { safeWindows, type: 'camera_avoid' };
                    const windows = ['North Hall', 'East Wing', 'South Corridor', 'West Entrance'];
                    contentDiv.innerHTML = `
                        <p style="margin-bottom:0.8rem;color:var(--text-muted);">📸 Cameras are rotating — pick the safe moment:</p>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;max-width:350px;margin:0 auto;">
                            ${windows.map((w, i) => `
                                <button class="wire-btn" data-window="${i}" style="min-width:80px;padding:0.7rem;">
                                    <i class="fas fa-camera"></i> ${w}
                                </button>
                            `).join('')}
                        </div>
                    `;
                    contentDiv.querySelectorAll('[data-window]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            if (!this.state.active) return;
                            const win = parseInt(btn.dataset.window);
                            if (win === safeWindows[0]) {
                                this.handleStageSuccess(resultDiv,
                                    '✅ Slipped past while cameras were away!',
                                    'stageClear');
                            } else {
                                this.handleStageFailure(resultDiv,
                                    '📸 SPOTTED! Camera caught your movement!');
                            }
                        });
                    });
                }

                // ── Stage: Grab Bags (Escape) ──
                buildGrabBagsStage(contentDiv, resultDiv) {
                    const diffMult = this.state.difficultyMult;
                    let bagValue, riskPerBag;
                    if (diffMult <= 1.5) { bagValue = 0.5;
                        riskPerBag = 0.12; } else if (diffMult <= 3.0) { bagValue = 1.5;
                        riskPerBag = 0.20; } else { bagValue = 2.5;
                        riskPerBag = 0.28; }

                    // Apply event modifiers
                    if (this.currentEvent && this.currentEvent.effect === 'reduceRisk') riskPerBag *= (1 - this
                        .currentEvent.value);
                    if (this.currentEvent && this.currentEvent.effect === 'increaseRisk') riskPerBag *= (1 + this
                        .currentEvent.value);
                    riskPerBag += this.state.heatRiskBonus;

                    let selectedBags = 0;
                    const maxBags = 5;
                    this.stageData = { bagValue, riskPerBag, selectedBags, maxBags, type: 'grab_bags' };

                    const renderUI = () => {
                        const extraMult = selectedBags * bagValue;
                        const totalBaseMult = this.state.difficultyMult + extraMult + (this.currentEvent
                            ?.effect === 'bonusMult' ? this.currentEvent.value : 0);
                        const nuggetBonus = this.state.nugget ? 1.25 : 1;
                        const heatBonus = 1 + this.state.heatRewardBonus;
                        const finalPayoutMult = totalBaseMult * nuggetBonus * heatBonus;
                        const catchChance = Math.min(0.94, selectedBags * riskPerBag);
                        const isDangerous = catchChance > 0.6;

                        contentDiv.innerHTML = `
                            <div class="bag-control">
                                <div style="font-weight:700;"><i class="fas fa-sack-dollar"></i> HOW MANY BAGS?</div>
                                <div class="bag-counter">
                                    <button id="bagDec">−</button>
                                    <span class="bag-count">${selectedBags}</span>
                                    <button id="bagInc">+</button>
                                </div>
                                <div class="multiplier-preview">
                                    <div>📦 Each bag: <strong>+${bagValue.toFixed(1)}×</strong></div>
                                    <div>✨ Total: <strong class="glow-text">${totalBaseMult.toFixed(2)}×</strong>${this.state.nugget?' (nugget +25% → '+(totalBaseMult*nuggetBonus).toFixed(2)+'×)':''}${heatBonus>1?' 🔥Heat +'+(heatBonus-1)*100+'%':''}</div>
                                    <div>💰 Payout: <strong>${Math.floor(this.state.baseBet * finalPayoutMult).toLocaleString()} GOLD</strong></div>
                                </div>
                                <div>⚠️ CATCH RISK: <span style="color:${isDangerous?'var(--danger)':'var(--warning)'};font-weight:800;">${(catchChance*100).toFixed(0)}%</span></div>
                                <div class="risk-bar"><div class="risk-fill${isDangerous?' dangerous':''}" style="width:${catchChance*100}%;"></div></div>
                                <button id="escapeFinalBtn" class="escape-btn"><i class="fas fa-running"></i> ESCAPE WITH ${selectedBags} BAG${selectedBags!==1?'S':''}</button>
                            </div>
                        `;
                        document.getElementById('bagDec').addEventListener('click', () => {
                            if (selectedBags > 0) { selectedBags--;
                                this.stageData.selectedBags = selectedBags;
                                renderUI();
                                haptic('light'); }
                        });
                        document.getElementById('bagInc').addEventListener('click', () => {
                            if (selectedBags < maxBags) { selectedBags++;
                                this.stageData.selectedBags = selectedBags;
                                renderUI();
                                haptic('light'); }
                        });
                        document.getElementById('escapeFinalBtn').addEventListener('click', () => {
                            if (!this.state.active) return;
                            const catchProb = Math.min(0.94, selectedBags * riskPerBag);
                            const roll = Math.random();
                            // Jackpot check
                            const jackpotChance = (this.currentEvent?.effect ===
                                'jackpotChance') ? this.currentEvent.value : 0.01;
                            if (roll < jackpotChance && selectedBags >= 3) {
                                this.handleJackpot(resultDiv, extraMult);
                                return;
                            }
                            if (roll < catchProb) {
                                this.handleStageFailure(resultDiv,
                                    '🚔 GUARDS CAUGHT YOU! Bags too heavy...', true);
                            } else {
                                this.handleStageSuccess(resultDiv,
                                    `🏃‍♂️ ESCAPED! ${selectedBags} bag${selectedBags!==1?'s':''} secured! +${extraMult.toFixed(1)}× bonus.`,
                                    'win', extraMult);
                            }
                        });
                    };
                    renderUI();
                }

                // ── Stage: Timed Vault ──
                buildTimedVaultStage(contentDiv, resultDiv) {
                    let timeLeft = 5;
                    this.stageData = { timeLeft, type: 'timed_vault' };
                    const renderUI = () => {
                        contentDiv.innerHTML = `
                            <div class="vault-door-container">
                                <div class="vault-spinner" style="animation-duration:1s;"></div>
                            </div>
                            <p style="font-weight:800;color:var(--danger);font-size:1.3rem;" id="timerDisplay">⏱️ ${timeLeft}s</p>
                            <p style="color:var(--text-muted);">The vault is sealing! Grab what you can!</p>
                            <button id="grabNowBtn" class="escape-btn">💰 GRAB NOW!</button>
                        `;
                        document.getElementById('grabNowBtn').addEventListener('click', () => {
                            if (!this.state.active) return;
                            const bonusMult = timeLeft * 0.3;
                            if (timeLeft >= 3) {
                                this.handleStageSuccess(resultDiv,
                                    `✅ Grabbed with ${timeLeft}s to spare! +${bonusMult.toFixed(1)}× bonus.`,
                                    'stageClear', bonusMult);
                            } else if (timeLeft >= 1) {
                                this.handleStageSuccess(resultDiv,
                                    `⚠️ Close call! Grabbed at ${timeLeft}s. +${bonusMult.toFixed(1)}×.`,
                                    'stageClear', bonusMult);
                            } else {
                                this.handleStageFailure(resultDiv,
                                    '💥 Too late! Vault sealed shut!');
                            }
                        });
                    };
                    renderUI();
                    const timer = setInterval(() => {
                        if (!this.state.active) { clearInterval(timer); return; }
                        timeLeft--;
                        this.stageData.timeLeft = timeLeft;
                        const display = document.getElementById('timerDisplay');
                        if (display) display.textContent = '⏱️ ' + timeLeft + 's';
                        if (timeLeft <= 0) {
                            clearInterval(timer);
                            this.handleStageFailure(resultDiv,
                            '💥 TIME RAN OUT! Vault sealed!');
                        }
                        if (timeLeft <= 2 && display) display.style.color = 'var(--danger)';
                    }, 1000);
                    this._vaultTimer = timer;
                }

                // ── Stage Success Handler ──
                handleStageSuccess(resultDiv, message, audioType = 'stageClear', bonusMult = 0) {
                    if (!this.state.active) return;
                    this.stagesCompletedCleanly++;
                    this.comboMultiplier = 1 + (this.stagesCompletedCleanly * 0.15);
                    resultDiv.innerHTML = `<span style="color:var(--success);">${message}</span>`;
                    resultDiv.className = 'result-msg success';
                    this.audio.play(audioType);
                    haptic('success');
                    this.state.stageResults.push(true);

                    if (this.state.currentStage >= this.state.totalStages) {
                        this.endHeist(true, bonusMult);
                    } else {
                        setTimeout(() => this.showStage(this.state.currentStage + 1), 900);
                    }
                }

                // ── Stage Failure Handler ──
                handleStageFailure(resultDiv, message, isEscape = false) {
                    if (!this.state.active) return;
                    resultDiv.innerHTML = `<span style="color:var(--danger);">${message}</span>`;
                    resultDiv.className = 'result-msg failure';
                    this.audio.play('fail');
                    haptic('failure');
                    this.state.stageResults.push(false);
                    this.updateStageDots();
                    if (isEscape) {
                        this.endHeist(false, 0);
                    } else {
                        this.endHeist(false, 0);
                    }
                }

                // ── Jackpot Handler ──
                handleJackpot(resultDiv, extraMult) {
                    if (!this.state.active) return;
                    const jackpotMult = this.state.difficultyMult * 3 + extraMult;
                    resultDiv.innerHTML =
                        `<span style="color:var(--gold-bright);font-size:1.2rem;">🎰 JACKPOT! GOLD EXPLOSION! 🎰</span>`;
                    resultDiv.className = 'result-msg success';
                    this.audio.play('bigWin');
                    haptic('heavy');
                    this.showCinematicBriefly('💰 JACKPOT! 💰');
                    this.endHeist(true, jackpotMult, true);
                }

                // ── End Heist ──
                async endHeist(win, extraBagMult = 0, isJackpot = false) {
                    if (!this.state.active) return;
                    if (this._vaultTimer) clearInterval(this._vaultTimer);

                    const stats = this.um.user.bankHeistStats;
                    const baseMult = this.state.difficultyMult;
                    const finalExtra = extraBagMult || 0;
                    const eventBonus = (this.currentEvent?.effect === 'bonusMult') ? this.currentEvent.value :
                    0;
                    let totalBaseMult = baseMult + finalExtra + eventBonus;
                    const nuggetFactor = this.state.nugget ? 1.25 : 1;
                    const heatBonus = 1 + this.state.heatRewardBonus;
                    const comboBonus = win ? this.comboMultiplier : 1;
                    const finalWinAmount = win ? Math.floor(this.state.baseBet * totalBaseMult * nuggetFactor *
                        heatBonus * comboBonus) : 0;
                    const netProfit = win ? (finalWinAmount - this.state.totalCost) : (-this.state.totalCost);

                    // Update stats
                    stats.totalBet += this.state.totalCost;
                    if (win) {
                        stats.wins++;
                        stats.totalWin += finalWinAmount;
                        stats.consecutiveWins = (stats.consecutiveWins || 0) + 1;
                        if (stats.consecutiveWins > (stats.maxConsecutiveWins || 0)) stats
                            .maxConsecutiveWins = stats.consecutiveWins;
                        if (this.stagesCompletedCleanly >= 3) stats.perfectHeists = (stats.perfectHeists || 0) +
                            1;
                        if (this.stagesCompletedCleanly >= 3 && extraBagMult === 0) stats.silentHeists = (stats
                            .silentHeists || 0) + 1;
                        this.um.user.balance += finalWinAmount;
                        this.um.addTransaction(
                            `🏆 HEIST WIN (${this.state.difficulty}) +${finalWinAmount} GOLD`,
                            finalWinAmount, 'game_win');
                        showToast(
                            `💰 ESCAPE SUCCESS! +${finalWinAmount.toLocaleString()} GOLD (${totalBaseMult.toFixed(2)}×)`,
                            '');
                        this.audio.play('win');
                        this.increaseHeat(win ? 1 : 0);
                        this.addRankXp(Math.floor(this.state.totalCost * 1.5));
                    } else {
                        stats.losses++;
                        stats.consecutiveWins = 0;
                        this.um.addTransaction(
                            `💀 HEIST LOSS (${this.state.difficulty}) -${this.state.totalCost} GOLD`, -this
                            .state.totalCost, 'game_loss');
                        showToast(`💔 CAUGHT! Lost ${this.state.totalCost.toLocaleString()} GOLD`, 'error');
                        this.audio.play('fail');
                        this.decreaseHeat(0.5);
                        this.addRankXp(Math.floor(this.state.totalCost * 0.3));
                    }

                    // Global stats
                    this.um.user.globalStats.totalWagered += this.state.totalCost;
                    this.um.user.globalStats.totalWon += win ? finalWinAmount : 0;
                    this.um.user.globalStats.totalGames++;
                    if (win) {
                        this.um.user.globalStats.totalWins++;
                        this.um.user.globalStats.currentStreak = (this.um.user.globalStats.currentStreak || 0) +
                            1;
                        if (this.um.user.globalStats.currentStreak > (this.um.user.globalStats.bestStreak || 0))
                            this.um.user.globalStats.bestStreak = this.um.user.globalStats.currentStreak;
                    } else {
                        this.um.user.globalStats.currentStreak = 0;
                    }

                    // Game outcomes
                    this.um.user.gamePlayCount['bank-heist'] = (this.um.user.gamePlayCount['bank-heist'] || 0) +
                        1;
                    this.um.user.gameOutcomes.unshift({
                        game: 'Bank Heist',
                        result: win ? 'win' : 'loss',
                        profit: netProfit,
                        multiplier: totalBaseMult,
                        bet: this.state.baseBet,
                        difficulty: this.state.difficulty,
                        nugget: this.state.nugget,
                        jackpot: isJackpot,
                        date: new Date().toISOString(),
                    });
                    if (this.um.user.gameOutcomes.length > 80) this.um.user.gameOutcomes.pop();

                    // Track best multiplier
                    if (totalBaseMult > (stats.bestMultiplier || 1)) stats.bestMultiplier = totalBaseMult;

                    // Missions
                    this.updateMissions();

                    // Loot roll on win
                    if (win && Math.random() < 0.35) {
                        const luckBonus = this.stagesCompletedCleanly;
                        const loot = rollLoot(luckBonus);
                        stats.totalLootCollected = (stats.totalLootCollected || 0) + 1;
                        if (loot.type === 'currency') {
                            this.um.user.balance += loot.value;
                            showToast(`${loot.icon} LOOT: ${loot.name} (+${loot.value} GOLD)!`, 'loot');
                        }
                        if (!this.um.user.bankHeistInventory) this.um.user.bankHeistInventory = [];
                        this.um.user.bankHeistInventory.push({ ...loot, date: new Date().toISOString() });
                        if (this.um.user.bankHeistInventory.length > 200) this.um.user.bankHeistInventory
                            .shift();
                        showLootPopup(loot, (collectedLoot) => {
                            if (collectedLoot.type === 'cosmetic' && collectedLoot.cosmeticId &&
                                !this.um.user.unlockedAvatars.includes(collectedLoot.cosmeticId)) {
                                this.um.user.unlockedAvatars.push(collectedLoot.cosmeticId);
                                showToast(
                                    `🎭 COSMETIC UNLOCKED: ${collectedLoot.name}!`,
                                    'loot');
                            }
                        });
                    }

                    // Check achievements
                    this.checkAchievements(totalBaseMult);
                    this.checkPrestige();

                    await this.um.save();
                    this.um.updateBalanceUI();
                    this.updateHeatDisplay();
                    this.updateRankDisplay();

                    // Display result
                    this.state.active = false;
                    document.getElementById('startHeistBtn').disabled = false;
                    document.getElementById('resetHeistBtn').style.display = 'block';
                    document.getElementById('stageContent').innerHTML = win ?
                        `<div style="text-align:center;padding:1rem;">
                                <i class="fas fa-trophy" style="font-size:3.5rem;color:var(--gold);animation:maskBob 1s infinite ease-in-out;"></i>
                                <p style="font-size:1.2rem;font-weight:800;margin-top:0.5rem;">🎉 HEIST TRIUMPH! 🎉</p>
                                <p>Net: <span style="color:${netProfit>=0?'var(--success)':'var(--danger)'};font-weight:800;">${netProfit>=0?'+'+netProfit.toLocaleString():netProfit.toLocaleString()}</span> GOLD</p>
                                <p>Multiplier: <span class="glow-text">${totalBaseMult.toFixed(2)}×</span>${isJackpot?' 🎰 JACKPOT!':''}</p>
                                ${this.comboMultiplier>1?`<p style="color:var(--warning);">🔥 Combo: ${this.comboMultiplier.toFixed(2)}×</p>`:''}
                            </div>` :
                        `<div style="text-align:center;padding:1rem;">
                                <i class="fas fa-handcuffs" style="font-size:3rem;color:#ff8888;"></i>
                                <p style="font-weight:800;">🚨 ARRESTED!</p>
                                <p>Lost ${this.state.totalCost.toLocaleString()} GOLD</p>
                            </div>`;
                    document.getElementById('stageResult').innerHTML = '';
                    document.getElementById('stageResult').className = 'result-msg';
                    const consec = stats.consecutiveWins;
                    if (consec >= 2) document.getElementById('stageTitle').innerHTML =
                        `🔥 HEIST STREAK: ${consec} 🔥`;
                    this.updateStageDots();
                }

                // ── Achievements ──
                checkAchievements(usedMultiplier) {
                    const stats = this.um.user.bankHeistStats;
                    const achievements = this.um.user.bankHeistAchievements || [];
                    const earned = this.um.user.earnedAchievements || [];

                    const checkAndAward = (id, condition, name, reward) => {
                        if (!achievements.includes(id) && condition) {
                            achievements.push(id);
                            earned.push(id);
                            this.um.user.bankHeistAchievements = achievements;
                            this.um.user.earnedAchievements = earned;
                            this.um.user.balance += reward;
                            showToast(`🏆 ACHIEVEMENT: ${name}! (+${reward} GOLD)`, '');
                            this.audio.play('bigWin');
                        }
                    };

                    checkAndAward('first_heist', stats.wins >= 1, 'First Heist', 100);
                    checkAndAward('streak_3', stats.consecutiveWins >= 3, 'Hot Streak (3 wins)', 500);
                    checkAndAward('streak_5', stats.consecutiveWins >= 5, 'Unstoppable (5 wins)', 2000);
                    checkAndAward('big_score', usedMultiplier >= 8, 'Big Score (8×+)', 1000);
                    checkAndAward('perfect_heist', stats.perfectHeists >= 1, 'Perfect Heist', 800);
                    checkAndAward('high_roller', stats.totalBet >= 50000, 'High Roller', 3000);
                    checkAndAward('jackpot_hit', stats.totalLootCollected >= 10, 'Loot Hunter', 1500);

                    if (stats.consecutiveWins >= 3 && !this.um.user.unlockedAvatars.includes('gold-mask')) {
                        this.um.user.unlockedAvatars.push('gold-mask');
                        showToast('🎭 UNLOCKED: Gold Mask avatar!', 'loot');
                    }
                }

                // ── Reset Heist ──
                resetHeist() {
                    if (this.state.active) return;
                    if (this._vaultTimer) clearInterval(this._vaultTimer);
                    document.getElementById('stageContainer').style.display = 'none';
                    document.getElementById('startHeistBtn').disabled = false;
                    document.getElementById('stageContent').innerHTML = '';
                    document.getElementById('stageResult').innerHTML = '';
                    document.getElementById('stageResult').className = 'result-msg';
                    this.state = this.defaultState();
                    this.stageData = {};
                    this.comboMultiplier = 1;
                    this.stagesCompletedCleanly = 0;
                    this.currentEvent = null;
                    this.updateStageDots();
                }
            }

            // ═══════════════════════════════════════
            //  INITIALIZATION
            // ═══════════════════════════════════════
            async function init() {
                const audioEngine = new AudioEngine();
                const userManager = new UserManager();

                // Sound preference
                const soundPref = localStorage.getItem('gold_sound_enabled');
                if (soundPref === 'false') {
                    audioEngine.enabled = false;
                    document.getElementById('soundToggle').innerHTML =
                    '<i class="fas fa-volume-mute"></i>';
                }

                // Load user
                if (!userManager.loadUser()) return;
                userManager.updateBalanceUI();

                // Initialize audio on interaction
                const unlockAudio = () => {
                    audioEngine.init();
                    document.body.removeEventListener('click', unlockAudio);
                    document.body.removeEventListener('touchstart', unlockAudio);
                };
                document.body.addEventListener('click', unlockAudio);
                document.body.addEventListener('touchstart', unlockAudio);

                // Start game
                const game = new BankHeistGame(userManager, audioEngine);

                // Expose for debugging (remove in production)
                // window.__heistGame = game;

                // Handle page visibility for timer cleanup
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && game._vaultTimer) {
                        clearInterval(game._vaultTimer);
                    }
                });
            }

            // Start
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
