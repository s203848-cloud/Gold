            function getDiffConfig() { return DIFFICULTIES[currentDifficulty]; }

            function getTotalCards() { const d = getDiffConfig(); return d.pairs * 2 + d.bombs; }

            function getMaxMultiplier() {
                const d = getDiffConfig();
                if (d.pairs === 0) return d.baseMultiplier;
                return d.baseMultiplier * Math.pow(2, d.pairs - 1);
            }

            function getCurrentMultiplier() {
                if (pairsFound === 0) return goldRushActive ? goldRushMultiplier : 1;
                const d = getDiffConfig();
                const base = d.baseMultiplier * Math.pow(2, pairsFound - 1);
                return goldRushActive ? base * goldRushMultiplier : base;
            }

            function formatMultiplier(val) {
                if (val >= 1e9) return (val / 1e9).toFixed(1) + 'Bx';
                if (val >= 1e6) return (val / 1e6).toFixed(1) + 'Mx';
                if (val >= 1e4) return Math.round(val).toLocaleString() + 'x';
                if (Number.isInteger(val)) return val + 'x';
                return val.toFixed(1) + 'x';
            }

            // ── USER DATA ──
            function initializeUserStats(user) {
                const defaults = {
                    globalStats: { totalWagered: 0, totalWon: 0, totalLosses: 0, totalGames: 0, currentStreak: 0,
                        bestStreak: 0, lastGameWin: null, totalWins: 0 },
                    transactions: [],
                    gameOutcomes: [],
                    gamePlayCount: {},
                    bankBalance: 0,
                    balance: 1000,
                    xp: 0,
                    level: 1,
                    avatar: 'fas fa-crown',
                    theme: 'royal-gold',
                    autoTransfer: false,
                    earnedAchievements: [],
                    dailyBalanceSnapshots: [],
                    cardMatchStats: { gamesPlayed: 0, totalBet: 0, totalWin: 0, biggestWin: 0, pairsFound: 0,
                        bombsHit: 0, bestCombo: 0, perfectRuns: 0, specialsFound: 0, jackpotsHit: 0 },
                    unlockedThemes: ['royal-gold'],
                    lastDailyReward: null,
                    prestigeLevel: 0,
                    prestigeBoosts: { xpBoost: 0, goldBoost: 0 }
                };
                for (const [k, v] of Object.entries(defaults)) {
                    if (user[k] === undefined) user[k] = v;
                }
                if (!user.cardMatchStats) user.cardMatchStats = { ...defaults.cardMatchStats };
                if (!user.unlockedThemes) user.unlockedThemes = ['royal-gold'];
                if (!user.prestigeBoosts) user.prestigeBoosts = { xpBoost: 0, goldBoost: 0 };
                if (!user.level) user.level = 1;
                if (!user.prestigeLevel) user.prestigeLevel = 0;
                return user;
            }
            async function loadUser() {
                const sess = sessionStorage.getItem('gold_current_user');
                if (!sess) { window.location.href = '../../sign-in.html'; return false; }
                const sessionUser = JSON.parse(sess);
                const users = JSON.parse(localStorage.getItem('gold_users') || '{}');
                const user = users[sessionUser.username];
                if (!user) { sessionStorage.removeItem('gold_current_user');
                    window.location.href = '../../sign-in.html'; return false; }
                currentUser = initializeUserStats(user);
                if (currentUser.balance === undefined || currentUser.balance === 0) currentUser.balance = 1000;
                sessionUser.balance = currentUser.balance;
                sessionStorage.setItem('gold_current_user', JSON.stringify(sessionUser));
                // Load saved theme
                if (currentUser.theme && THEMES.includes(currentUser.theme)) {
                    currentTheme = currentUser.theme;
                }
                applyTheme(currentTheme);
                // Check daily reward
                checkDailyReward();
                return true;
            }
            async function saveUser() {
                const users = JSON.parse(localStorage.getItem('gold_users') || '{}');
                currentUser.theme = currentTheme;
                users[currentUser.username] = currentUser;
                localStorage.setItem('gold_users', JSON.stringify(users));
                const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
                if (sess) { sess.balance = currentUser.balance;
                    sessionStorage.setItem('gold_current_user', JSON.stringify(sess)); }
            }

            function updateBalanceDisplay() {
                const balEl = document.getElementById('headerBalance');
                const prev = parseInt(balEl.textContent.replace(/,/g, '')) || 0;
                const next = currentUser.balance;
                if (prev !== next) {
                    animateNumber(balEl, prev, next, 400);
                    if (next > prev) {
                        balanceTag.classList.add(next - prev > 500 ? 'mega-pulse' : 'pulse');
                        setTimeout(() => {
                            balanceTag.classList.remove('pulse', 'mega-pulse');
                        }, 600);
                    }
                } else balEl.textContent = next.toLocaleString();
                validateBet();
            }

            function animateNumber(el, start, end, duration) {
                if (start === end) { el.textContent = end.toLocaleString(); return; }
                const range = end - start;
                const startTime = performance.now();

                function step(now) {
                    const progress = Math.min((now - startTime) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    el.textContent = Math.round(start + range * eased).toLocaleString();
                    if (progress < 1) requestAnimationFrame(step);
                    else el.textContent = end.toLocaleString();
                }
                requestAnimationFrame(step);
            }

            function validateBet() {
                const b = parseFloat(betInput.value);
                const invalid = b <= 0 || b > (currentUser?.balance || 0);
                betInput.classList.toggle('invalid', invalid);
                playBtn.disabled = gameActive || invalid;
            }

            function checkDailyReward() {
                const today = new Date().toDateString();
                if (currentUser.lastDailyReward === today) {
                    dailyRewardClaimed = true;
                } else {
                    dailyRewardClaimed = false;
                    // Auto-claim daily reward on first load of the day
                    if (currentUser.lastDailyReward !== today && currentUser.lastDailyReward !== null) {
                        claimDailyReward();
                    }
                }
            }

            function claimDailyReward() {
                const today = new Date().toDateString();
                if (currentUser.lastDailyReward === today) return;
                const reward = 25 + Math.floor(Math.random() * 50) + (currentUser.prestigeBoosts?.goldBoost || 0) * 10;
                currentUser.balance += reward;
                currentUser.lastDailyReward = today;
                dailyRewardClaimed = true;
                saveUser().then(() => updateBalanceDisplay());
                showNotification(`Daily Reward: +${reward} GOLD! 🎁`, '📅');
                triggerConfetti(0.5);
            }

            // ── THEME SYSTEM ──
            function applyTheme(themeName) {
                currentTheme = themeName;
                document.body.className = '';
                document.body.classList.add('theme-' + themeName);
                updateThemeDots();
                if (currentUser) {
                    currentUser.theme = themeName;
                    saveUser();
                }
            }

            function cycleTheme() {
                const currentIdx = THEMES.indexOf(currentTheme);
                const nextIdx = (currentIdx + 1) % THEMES.length;
                const nextTheme = THEMES[nextIdx];
                // Check if unlocked
                if (currentUser?.unlockedThemes?.includes(nextTheme) || nextTheme === 'royal-gold') {
                    applyTheme(nextTheme);
                    showNotification(`Theme: ${nextTheme.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}`, '🎨');
                } else {
                    // Try to unlock
                    if (currentUser && currentUser.cardMatchStats.gamesPlayed >= 10 * (nextIdx + 1)) {
                        currentUser.unlockedThemes.push(nextTheme);
                        applyTheme(nextTheme);
                        showNotification(`Theme Unlocked: ${nextTheme.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}!`,
                            '🔓');
                    } else {
                        showNotification(
                            `Locked! Play ${10*(nextIdx+1)} games to unlock.`,
                            '🔒');
                    }
                }
            }

            function updateThemeDots() {
                const dots = document.querySelectorAll('.theme-dot');
                dots.forEach(dot => {
                    const theme = dot.dataset.theme;
                    dot.classList.toggle('active-theme', theme === currentTheme);
                });
            }

            // ── CARDS ──
            function generateCards() {
                const d = getDiffConfig();
                let deck = [];
                // Symbol pairs
                for (let i = 0; i < d.pairs; i++) {
                    deck.push({ type: 'symbol', symbolIndex: i, matched: false, flipped: false, bomb: false,
                        specialType: null });
                    deck.push({ type: 'symbol', symbolIndex: i, matched: false, flipped: false, bomb: false,
                        specialType: null });
                }
                // Bombs
                for (let i = 0; i < d.bombs; i++) {
                    deck.push({ type: 'bomb', matched: false, flipped: false, bomb: true, specialType: null });
                }
                totalBombsOnBoard = d.bombs;
                // Inject special cards (replace random non-bomb cards)
                const specialCount = Math.min(d.maxSpecials, Math.floor(Math.random() * d.maxSpecials + 1));
                const nonBombIndices = [];
                deck.forEach((card, idx) => { if (!card.bomb) nonBombIndices.push(idx); });
                // Shuffle non-bomb indices
                for (let i = nonBombIndices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [nonBombIndices[i], nonBombIndices[j]] = [nonBombIndices[j], nonBombIndices[i]];
                }
                const specialKeys = Object.keys(SPECIAL_TYPES);
                for (let i = 0; i < Math.min(specialCount, nonBombIndices.length); i++) {
                    if (Math.random() < d.specialCardChance) {
                        const idx = nonBombIndices[i];
                        const sType = specialKeys[Math.floor(Math.random() * specialKeys.length)];
                        deck[idx].specialType = sType;
                        deck[idx].type = 'special';
                    }
                }
                // Shuffle entire deck
                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }
                // Track bomb positions
                revealedBombPositions = new Set();
                deck.forEach((card, idx) => { if (card.bomb) revealedBombPositions.add(idx); });
                return deck;
            }

            function renderCards() {
                const d = getDiffConfig();
                cardsGrid.style.gridTemplateColumns = `repeat(${d.gridCols}, 1fr)`;
                cardsGrid.innerHTML = '';
                const iconSize = d.gridCols >= 8 ? '0.85rem' : d.gridCols >= 6 ? '1.2rem' : d.gridCols >= 5 ? '1.4rem' :
                    '1.7rem';
                const backIconSize = d.gridCols >= 8 ? '0.7rem' : d.gridCols >= 6 ? '0.9rem' : d.gridCols >= 5 ? '1.1rem' :
                    '1.4rem';
                cards.forEach((card, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'card';
                    if (card.flipped) cardDiv.classList.add('flipped');
                    if (card.matched) cardDiv.classList.add('matched');
                    if (card.bomb) cardDiv.classList.add('bomb-card');
                    if (card.specialType) cardDiv.classList.add('special-card');
                    cardDiv.dataset.index = index;
                    let frontContent = '';
                    if (card.bomb) {
                        frontContent = '<i class="fas fa-bomb" style="color:#ff6b6b;"></i>';
                    } else if (card.specialType && card.flipped) {
                        const sInfo = SPECIAL_TYPES[card.specialType];
                        frontContent =
                            `<i class="fas ${sInfo.icon}" style="color:${sInfo.color};font-size:${parseFloat(iconSize)*1.3}rem;"></i>`;
                    } else if (card.specialType && !card.flipped) {
                        frontContent =
                            `<i class="fas ${SYMBOLS[card.symbolIndex] || 'fa-star'}" style="color:var(--theme-accent);"></i>`;
                    } else {
                        frontContent =
                            `<i class="fas ${SYMBOLS[card.symbolIndex] || 'fa-star'}" style="color:var(--theme-accent);"></i>`;
                    }
                    cardDiv.innerHTML = `
                    <div class="card-face card-back" style="font-size:${backIconSize};"><i class="fas fa-question"></i></div>
                    <div class="card-face card-front" style="font-size:${iconSize};">${frontContent}</div>
                `;
                    cardDiv.addEventListener('click', () => handleCardClick(index));
                    // Touch support
                    cardDiv.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        handleCardClick(index);
                    });
                    cardsGrid.appendChild(cardDiv);
                });
            }

            function updateCardVisual(index) {
                const cardDiv = cardsGrid.querySelector(`[data-index="${index}"]`);
                if (!cardDiv) return;
                cardDiv.classList.toggle('flipped', cards[index].flipped);
                cardDiv.classList.toggle('matched', cards[index].matched);
                if (cards[index].specialType && cards[index].flipped) {
                    cardDiv.classList.add('special-card');
                    cardDiv.classList.add('glow-trail');
                    setTimeout(() => cardDiv.classList.remove('glow-trail'), 600);
                }
                if (cards[index].matched && cards[index].specialType) {
                    cardDiv.classList.add('matched-golden');
                }
                // Update front face for special cards
                if (cards[index].flipped && cards[index].specialType) {
                    const frontFace = cardDiv.querySelector('.card-front');
                    if (frontFace) {
                        const sInfo = SPECIAL_TYPES[cards[index].specialType];
                        const d = getDiffConfig();
                        const iconSize = d.gridCols >= 8 ? '0.85rem' : d.gridCols >= 6 ? '1.2rem' : '1.7rem';
                        frontFace.innerHTML =
                            `<i class="fas ${sInfo.icon}" style="color:${sInfo.color};font-size:${parseFloat(iconSize)*1.3}rem;filter:drop-shadow(0 0 14px ${sInfo.color});"></i>`;
                    }
                }
            }

            // ── DANGER METER ──
            function updateDangerMeter() {
                const d = getDiffConfig();
                const totalCards = getTotalCards();
                const flippedCount = cards.filter(c => c.flipped && !c.matched && !c.bomb).length;
                const bombProximity = totalBombsOnBoard / Math.max(1, totalCards - flippedCount - pairsFound * 2);
                dangerLevel = Math.min(100, bombProximity * 100 * 3 + flippedCount * 2);
                dangerMeterFill.style.width = dangerLevel + '%';
                if (dangerLevel > 70) {
                    dangerMeterFill.classList.add('critical');
                    mainCard.classList.add('danger-zone');
                    topNav.classList.add('danger-pulse');
                    startHeartbeat();
                } else {
                    dangerMeterFill.classList.remove('critical');
                    mainCard.classList.remove('danger-zone');
                    topNav.classList.remove('danger-pulse');
                    stopHeartbeat();
                }
            }

            // ── MULTIPLIER UI ──
            function updateMultiplierDisplay() {
                const d = getDiffConfig();
                const currentMult = getCurrentMultiplier();
                const maxMult = getMaxMultiplier();
                currentMultiDisplay.textContent = formatMultiplier(currentMult);
                const highThreshold = Math.ceil(d.pairs * 0.5);
                currentMultiDisplay.classList.toggle('high', pairsFound >= highThreshold && pairsFound < d.pairs);
                currentMultiDisplay.classList.toggle('mythic', pairsFound >= d.pairs - 1 && d.pairs > 2 && pairsFound < d
                    .pairs);
                targetMultiDisplay.textContent = formatMultiplier(maxMult);
                const progress = d.pairs > 0 ? (pairsFound / d.pairs) * 100 : 0;
                multiplierProgressFill.style.width = progress + '%';
                multiplierProgressFill.classList.toggle('near-max', pairsFound >= d.pairs - 1 && d.pairs > 1 && pairsFound < d
                    .pairs);
                // Update streak display
                if (comboStreak >= 3) {
                    streakText.textContent = `🔥 ${comboStreak} STREAK! +${comboStreak*5}% XP`;
                    streakDisplay.classList.toggle('on-fire', comboStreak >= 5);
                } else if (comboStreak > 0) {
                    streakText.textContent = `✨ ${comboStreak} streak`;
                    streakDisplay.classList.remove('on-fire');
                } else {
                    streakText.textContent = '';
                    streakDisplay.classList.remove('on-fire');
                }
            }

            function updateMaxMultiplierDisplay() {
                targetMultiDisplay.textContent = formatMultiplier(getMaxMultiplier());
            }

            function pulseWinnings() {
                winningsDisplay.classList.add('pulse');
                setTimeout(() => winningsDisplay.classList.remove('pulse'), 250);
            }

            // ── DIFFICULTY SELECTION ──
            function setDifficulty(diffKey) {
                if (gameActive) return;
                if (!DIFFICULTIES[diffKey]) return;
                currentDifficulty = diffKey;
                updateDifficultyButtons();
                updateMaxMultiplierDisplay();
                updateMultiplierDisplay();
                resetGameState();
                cardsGrid.innerHTML = '';
                cardsGrid.style.gridTemplateColumns = `repeat(${getDiffConfig().gridCols}, 1fr)`;
                multiplierProgressFill.style.width = '0%';
                multiplierProgressFill.classList.remove('near-max');
                currentMultiDisplay.textContent = '1x';
                currentMultiDisplay.classList.remove('high', 'mythic');
                dangerMeterFill.style.width = '0%';
                dangerMeterFill.classList.remove('critical');
                mainCard.classList.remove('danger-zone');
                topNav.classList.remove('danger-pulse');
                stopHeartbeat();
                streakText.textContent = '';
                streakDisplay.classList.remove('on-fire');
                peekBtn.style.display = 'none';
                validateBet();
            }

            function resetGameState() {
                cards = [];
                pairsFound = 0;
                winnings = 0;
                flippedIndices = [];
                gameActive = false;
                canFlip = true;
                comboStreak = 0;
                perfectRunActive = true;
                shieldActive = false;
                goldRushActive = false;
                goldRushMultiplier = 1;
                frozenUntil = 0;
                peekAvailable = false;
                dangerLevel = 0;
                nearMissCount = 0;
                updateWinningsDisplay();
                updateSessionDisplay();
                collectBtn.style.display = 'none';
                peekBtn.style.display = 'none';
                bigWinDisplay.style.display = 'none';
                resultMessage.innerHTML = '✨ Place bet and play';
                playBtn.disabled = false;
                betInput.disabled = false;
                updateMultiplierDisplay();
                updateDangerMeter();
            }

            function updateDifficultyButtons() {
                const buttons = difficultyRow.querySelectorAll('.diff-btn');
                buttons.forEach(btn => {
                    const diff = btn.dataset.diff;
                    btn.classList.toggle('active', diff === currentDifficulty);
                    btn.disabled = gameActive;
                });
            }

            difficultyRow.addEventListener('click', (e) => {
                const btn = e.target.closest('.diff-btn');
                if (!btn || gameActive) return;
                const diff = btn.dataset.diff;
                if (diff && diff !== currentDifficulty) setDifficulty(diff);
            });

            // ── GAME FLOW ──
            function startGame() {
                bet = parseFloat(betInput.value);
                if (isNaN(bet) || bet <= 0) bet = 50;
                bet = Math.floor(bet * 100) / 100;
                if (bet < 1) bet = 1;
                if (bet > currentUser.balance) {
                    resultMessage.textContent = '❌ Insufficient balance!';
                    shakeElement(betInput);
                    return;
                }
                currentUser.balance -= bet;
                saveUser().then(() => updateBalanceDisplay());
                sessionProfit -= bet;
                cards = generateCards();
                pairsFound = 0;
                winnings = 0;
                flippedIndices = [];
                gameActive = true;
                canFlip = true;
                comboStreak = 0;
                perfectRunActive = true;
                shieldActive = false;
                goldRushActive = false;
                goldRushMultiplier = 1;
                frozenUntil = 0;
                peekAvailable = false;
                dangerLevel = 0;
                nearMissCount = 0;
                totalBombsOnBoard = getDiffConfig().bombs;
                revealedBombPositions = new Set();
                cards.forEach((c, i) => { if (c.bomb) revealedBombPositions.add(i); });

                renderCards();
                updateWinningsDisplay();
                updateMultiplierDisplay();
                updateDangerMeter();
                updateDifficultyButtons();
                resultMessage.innerHTML = '🔍 Find pairs, avoid bombs!';
                bigWinDisplay.style.display = 'none';
                collectBtn.style.display = 'none';
                peekBtn.style.display = 'none';
                playBtn.disabled = true;
                betInput.disabled = true;
                mainCard.classList.remove('danger-zone');
                topNav.classList.remove('danger-pulse');
                stopHeartbeat();
                streakText.textContent = '';
                streakDisplay.classList.remove('on-fire');
                dangerMeterFill.style.width = '0%';
                dangerMeterFill.classList.remove('critical');
                playTone('flip', 0.6);
            }

            function handleCardClick(index) {
                if (!gameActive || !canFlip) return;
                if (frozenUntil > Date.now()) {
                    resultMessage.innerHTML = '❄️ Board is frozen! Wait...';
                    return;
                }
                const card = cards[index];
                if (card.flipped || card.matched) return;
                card.flipped = true;
                updateCardVisual(index);
                flippedIndices.push(index);
                playTone('flip');
                updateDangerMeter();
                // Near-miss detection: check if adjacent to bomb
                checkNearMiss(index);
                if (flippedIndices.length === 2) {
                    canFlip = false;
                    const delay = frozenUntil > Date.now() ? 1000 : 450;
                    setTimeout(() => evaluateTwoCards(), delay);
                }
            }

            function checkNearMiss(index) {
                const d = getDiffConfig();
                const cols = d.gridCols;
                const row = Math.floor(index / cols);
                const col = index % cols;
                const adjacentIndices = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = row + dr;
                        const nc = col + dc;
                        if (nr >= 0 && nr < d.gridRows && nc >= 0 && nc < cols) {
                            adjacentIndices.push(nr * cols + nc);
                        }
                    }
                }
                const nearBomb = adjacentIndices.some(ai => cards[ai] && cards[ai].bomb && !cards[ai].flipped);
                if (nearBomb && !cards[index].bomb) {
                    nearMissCount++;
                    dangerLevel = Math.min(100, dangerLevel + 15);
                    updateDangerMeter();
                    if (nearMissCount >= 3) startHeartbeat();
                }
            }

            function evaluateTwoCards() {
                const [idx1, idx2] = flippedIndices;
                const card1 = cards[idx1];
                const card2 = cards[idx2];
                const d = getDiffConfig();

                // ── SPECIAL CARD HANDLING ──
                const specialsInFlip = [];
                if (card1.specialType) specialsInFlip.push({ card: card1, index: idx1 });
                if (card2.specialType) specialsInFlip.push({ card: card2, index: idx2 });

                // Process special cards that are revealed (even if not matched)
                for (const sp of specialsInFlip) {
                    processSpecialCard(sp.card, sp.index);
                }

                // ── BOMB CHECK ──
                if (card1.bomb || card2.bomb) {
                    if (shieldActive) {
                        // Shield protects
                        shieldActive = false;
                        const bombIdx = card1.bomb ? idx1 : idx2;
                        cards[bombIdx].matched = true;
                        cards[bombIdx].flipped = true;
                        updateCardVisual(bombIdx);
                        playTone('shield_activate');
                        resultMessage.innerHTML = '🛡️ SHIELD BLOCKED A BOMB! You\'re safe.';
                        showNotification('Shield absorbed a bomb! 🛡️', '🛡️');
                        flippedIndices = [];
                        canFlip = true;
                        updateDangerMeter();
                        if (pairsFound > 0) collectBtn.style.display = 'inline-flex';
                        return;
                    }
                    // Bomb explodes
                    gameActive = false;
                    canFlip = false;
                    playTone('bomb', 1.5);
                    triggerExplosionEffect();
                    comboStreak = 0;
                    perfectRunActive = false;
                    resultMessage.innerHTML =
                        '<span style="color:#ff6b6b;font-size:1.2rem;">💣 BOMB! You lost your bet.</span>';
                    bigWinDisplay.style.display = 'none';
                    revealAllCards();
                    recordGame(false, 0);
                    stopHeartbeat();
                    resetAfterDelay();
                    return;
                }

                // ── MATCH CHECK ──
                const isSymbolMatch = card1.type === 'symbol' && card2.type === 'symbol' && card1.symbolIndex === card2
                    .symbolIndex;
                const isSpecialMatch = card1.specialType && card2.specialType && card1.specialType === card2.specialType;
                const isValidMatch = isSymbolMatch || (card1.specialType && card2.specialType && isSpecialMatch) || (
                    isSymbolMatch && (card1.specialType || card2.specialType));

                if (isSymbolMatch || (card1.type !== 'bomb' && card2.type !== 'bomb' && card1.symbolIndex === card2
                        .symbolIndex)) {
                    // Successful match
                    card1.matched = true;
                    card2.matched = true;
                    pairsFound++;
                    comboStreak++;
                    if (comboStreak > bestComboStreak) bestComboStreak = comboStreak;
                    if (comboStreak > (currentUser.cardMatchStats.bestCombo || 0)) {
                        currentUser.cardMatchStats.bestCombo = comboStreak;
                    }
                    winnings = getCurrentMultiplier() * bet;
                    // Jackpot check (rare huge payout)
                    let jackpotTriggered = false;
                    if (pairsFound >= d.pairs - 1 && Math.random() < jackpotChance && comboStreak >= 3) {
                        jackpotTriggered = true;
                        winnings *= (5 + Math.floor(Math.random() * 15));
                        currentUser.cardMatchStats.jackpotsHit = (currentUser.cardMatchStats.jackpotsHit || 0) + 1;
                    }
                    playTone(comboStreak >= 4 ? 'golden_match' : 'match');
                    if (jackpotTriggered) playTone('jackpot', 1.8);
                    updateWinningsDisplay();
                    pulseWinnings();
                    updateMultiplierDisplay();
                    updateCardVisual(idx1);
                    updateCardVisual(idx2);
                    // Spark burst at card positions
                    const cardEl1 = cardsGrid.querySelector(`[data-index="${idx1}"]`);
                    const cardEl2 = cardsGrid.querySelector(`[data-index="${idx2}"]`);
                    if (cardEl1) {
                        const rect = cardEl1.getBoundingClientRect();
                        triggerSparkBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 12);
                    }
                    if (cardEl2 && idx1 !== idx2) {
                        const rect = cardEl2.getBoundingClientRect();
                        triggerSparkBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 12);
                    }
                    flippedIndices = [];
                    canFlip = true;
                    dangerLevel = Math.max(0, dangerLevel - 8);
                    updateDangerMeter();
                    if (pairsFound > 0) collectBtn.style.display = 'inline-flex';
                    // Check for peek availability
                    if (comboStreak >= 3 && !peekAvailable && pairsFound < d.pairs) {
                        peekAvailable = true;
                        peekBtn.style.display = 'inline-flex';
                    }
                    if (pairsFound === d.pairs) {
                        // All pairs found!
                        gameActive = false;
                        perfectRunActive = true;
                        playTone('win', 1.3);
                        triggerConfetti(1.5);
                        if (jackpotTriggered) triggerCashoutSequence(winnings, formatMultiplier(getCurrentMultiplier()));
                        resultMessage.innerHTML =
                            '<span style="color:#aaffaa;font-size:1.1rem;">🎉 ALL PAIRS FOUND! Perfect!</span>';
                        bigWinDisplay.style.display = 'block';
                        bigWinDisplay.textContent = formatMultiplier(getCurrentMultiplier());
                        if (perfectRunActive) {
                            currentUser.cardMatchStats.perfectRuns = (currentUser.cardMatchStats.perfectRuns || 0) + 1;
                            showNotification('PERFECT RUN! 🏆 Extra XP awarded!', '🏆');
                        }
                        cashoutWinnings();
                        stopHeartbeat();
                    } else {
                        const nextMult = getCurrentMultiplier() * 2;
                        resultMessage.innerHTML =
                            `✅ Pair! <b>${formatMultiplier(getCurrentMultiplier())}</b> · Next: ${formatMultiplier(nextMult)}. Collect or keep going!`;
                        if (jackpotTriggered) {
                            showNotification('🎰 JACKPOT TRIGGERED! Massive payout!', '🎰');
                        }
                    }
                } else {
                    // No match – flip back
                    comboStreak = 0;
                    perfectRunActive = false;
                    playTone('flip', 0.5);
                    updateMultiplierDisplay();
                    setTimeout(() => {
                        card1.flipped = false;
                        card2.flipped = false;
                        updateCardVisual(idx1);
                        updateCardVisual(idx2);
                        flippedIndices = [];
                        canFlip = true;
                        updateDangerMeter();
                    }, 750);
                }
            }

            function processSpecialCard(card, index) {
                if (!card.specialType) return;
                const sType = card.specialType;
                playTone('special_reveal');
                currentUser.cardMatchStats.specialsFound = (currentUser.cardMatchStats.specialsFound || 0) + 1;
                switch (sType) {
                    case 'shield':
                        shieldActive = true;
                        showNotification('🛡️ Shield Activated! Next bomb is blocked.', '🛡️');
                        resultMessage.innerHTML = '🛡️ SHIELD found! You\'re protected from one bomb.';
                        break;
                    case 'double':
                        winnings *= 2;
                        updateWinningsDisplay();
                        pulseWinnings();
                        showNotification('💎 DOUBLE! Winnings multiplied by 2!', '💎');
                        resultMessage.innerHTML = '💎 DOUBLE CARD! Current winnings doubled!';
                        break;
                    case 'freeze':
                        frozenUntil = Date.now() + 4000;
                        dangerLevel = Math.max(0, dangerLevel - 30);
                        updateDangerMeter();
                        stopHeartbeat();
                        showNotification('❄️ FREEZE! Danger reduced, bombs slowed.', '❄️');
                        resultMessage.innerHTML = '❄️ Board frozen! Danger reduced for 4 seconds.';
                        break;
                    case 'luckyPeek':
                        revealRandomCards(3);
                        showNotification('👁️ LUCKY PEEK! Random cards revealed briefly.', '👁️');
                        resultMessage.innerHTML = '👁️ Peek! Some cards revealed temporarily.';
                        break;
                    case 'goldRush':
                        goldRushActive = true;
                        goldRushMultiplier = 2 + Math.floor(Math.random() * 3);
                        showNotification(`⚡ GOLD RUSH! Next match gets ${goldRushMultiplier}x boost!`, '⚡');
                        resultMessage.innerHTML = `⚡ GOLD RUSH! ${goldRushMultiplier}x multiplier on next match!`;
                        break;
                }
                // Special card is consumed (treated as matched/flipped for cleanup)
                card.specialType = null;
                updateCardVisual(index);
            }

            function revealRandomCards(count) {
                const unrevealed = [];
                cards.forEach((card, idx) => {
                    if (!card.flipped && !card.matched) unrevealed.push(idx);
                });
                const toReveal = [];
                for (let i = 0; i < Math.min(count, unrevealed.length); i++) {
                    const randIdx = unrevealed[Math.floor(Math.random() * unrevealed.length)];
                    if (!toReveal.includes(randIdx)) toReveal.push(randIdx);
                }
                toReveal.forEach(idx => {
                    cards[idx].flipped = true;
                    updateCardVisual(idx);
                });
                // Hide after delay
                setTimeout(() => {
                    toReveal.forEach(idx => {
                        if (!cards[idx].matched) {
                            cards[idx].flipped = false;
                            updateCardVisual(idx);
                        }
                    });
                }, 1500);
            }

            function revealAllCards() {
                cards.forEach(card => { card.flipped = true; });
                for (let i = 0; i < cards.length; i++) updateCardVisual(i);
            }

            function cashoutWinnings() {
                if (!gameActive && winnings === 0 && pairsFound === 0) return;
                const winAmount = winnings > 0 ? winnings : (pairsFound > 0 ? getCurrentMultiplier() * bet : 0);
                const actualWin = winAmount > 0 ? winAmount : 0;
                if (actualWin > 0) {
                    currentUser.balance += actualWin;
                    sessionProfit += actualWin;
                    // XP bonus from combos
                    const xpBonus = Math.floor(actualWin * 0.1 * (1 + comboStreak * 0.05) * (1 + (currentUser
                        .prestigeBoosts?.xpBoost || 0) * 0.1));
                    currentUser.xp = (currentUser.xp || 0) + xpBonus;
                    // Level up check
                    const newLevel = Math.floor(Math.sqrt(currentUser.xp / 100)) + 1;
                    if (newLevel > (currentUser.level || 1)) {
                        currentUser.level = newLevel;
                        showNotification(`🎖️ Level Up! You're now Level ${newLevel}!`, '🎖️');
                        triggerConfetti(0.8);
                    }
                    recordGame(true, actualWin);
                    if (actualWin >= bet * 10) {
                        triggerCashoutSequence(actualWin, formatMultiplier(actualWin / bet));
                    } else if (actualWin >= bet * 5) {
                        triggerConfetti(1.2);
                        playTone('collect', 1.2);
                    } else {
                        playTone('collect');
                    }
                }
                saveUser().then(() => updateBalanceDisplay());
                updateSessionDisplay();
                winnings = 0;
                updateWinningsDisplay();
                collectBtn.style.display = 'none';
                peekBtn.style.display = 'none';
                gameActive = false;
                betInput.disabled = false;
                playBtn.disabled = false;
                updateDifficultyButtons();
                validateBet();
                updateMultiplierDisplay();
                updateDangerMeter();
                stopHeartbeat();
                // Check achievements
                checkAchievements();
            }

            function collectManually() {
                if (!gameActive || pairsFound === 0) return;
                const d = getDiffConfig();
                const winAmount = getCurrentMultiplier() * bet;
                winnings = winAmount;
                cashoutWinnings();
                resultMessage.innerHTML =
                    `<span style="color:#aaffaa;">💰 Cashed out: ${winAmount.toFixed(2)} GOLD (${formatMultiplier(getCurrentMultiplier())})</span>`;
                bigWinDisplay.style.display = 'block';
                bigWinDisplay.textContent = formatMultiplier(getCurrentMultiplier());
                triggerConfetti(1);
                revealAllCards();
                resetAfterDelay();
            }

            function resetAfterDelay() {
                setTimeout(() => {
                    if (!gameActive) {
                        betInput.disabled = false;
                        playBtn.disabled = false;
                        updateDifficultyButtons();
                        validateBet();
                        resultMessage.innerHTML = '✨ Place bet and play';
                        bigWinDisplay.style.display = 'none';
                        collectBtn.style.display = 'none';
                        peekBtn.style.display = 'none';
                        multiplierProgressFill.style.width = '0%';
                        multiplierProgressFill.classList.remove('near-max');
                        currentMultiDisplay.textContent = '1x';
                        currentMultiDisplay.classList.remove('high', 'mythic');
                        dangerMeterFill.style.width = '0%';
                        dangerMeterFill.classList.remove('critical');
                        mainCard.classList.remove('danger-zone');
                        topNav.classList.remove('danger-pulse');
                        stopHeartbeat();
                        streakText.textContent = '';
                        streakDisplay.classList.remove('on-fire');
                        comboStreak = 0;
                        shieldActive = false;
                        goldRushActive = false;
                        goldRushMultiplier = 1;
                        frozenUntil = 0;
                        peekAvailable = false;
                    }
                }, 2500);
            }

            function recordGame(won, winAmount) {
                const net = winAmount - bet;
                currentUser.globalStats.totalGames++;
                currentUser.globalStats.totalWagered += bet;
                currentUser.globalStats.totalWon += winAmount;
                if (net > 0) {
                    currentUser.globalStats.currentStreak = (currentUser.globalStats.currentStreak || 0) + 1;
                    if (currentUser.globalStats.currentStreak > currentUser.globalStats.bestStreak) currentUser.globalStats
                        .bestStreak = currentUser.globalStats.currentStreak;
                    currentUser.globalStats.totalWins = (currentUser.globalStats.totalWins || 0) + 1;
                } else if (net < 0) {
                    currentUser.globalStats.currentStreak = 0;
                }
                const xpGain = Math.floor(bet * (won ? 1.5 : 0.3) * (1 + comboStreak * 0.05));
                currentUser.xp = (currentUser.xp || 0) + xpGain;
                currentUser.gamePlayCount['card-match'] = (currentUser.gamePlayCount['card-match'] || 0) + 1;
                const cs = currentUser.cardMatchStats;
                cs.gamesPlayed++;
                cs.totalBet += bet;
                cs.totalWin += winAmount;
                if (winAmount > cs.biggestWin) cs.biggestWin = winAmount;
                cs.pairsFound += pairsFound;
                if (!won) cs.bombsHit++;
                if (comboStreak > (cs.bestCombo || 0)) cs.bestCombo = comboStreak;
                currentUser.gameOutcomes.unshift({
                    game: 'CardMatch',
                    result: net > 0 ? 'win' : (net < 0 ? 'loss' : 'push'),
                    profit: net,
                    multiplier: winAmount > 0 ? winAmount / bet : 0,
                    bet,
                    win: winAmount,
                    difficulty: currentDifficulty,
                    pairsFound: pairsFound,
                    comboStreak: comboStreak,
                    perfectRun: perfectRunActive && pairsFound === getDiffConfig().pairs,
                    date: new Date().toISOString()
                });
                if (currentUser.gameOutcomes.length > 50) currentUser.gameOutcomes.pop();
                currentUser.transactions.unshift({
                    desc: `🃏 CardMatch [${getDiffConfig().label}] | Bet ${bet} → ${winAmount>0?'Won '+winAmount.toFixed(2):'Bombed'} | Streak: ${comboStreak}`,
                    amount: net,
                    type: net > 0 ? 'game_win' : 'game_loss',
                    date: new Date().toISOString()
                });
                if (currentUser.transactions.length > 30) currentUser.transactions.shift();
                // Prestige check
                if (currentUser.level >= 50 && currentUser.prestigeLevel === 0) {
                    currentUser.prestigeLevel = 1;
                    currentUser.prestigeBoosts = { xpBoost: 1, goldBoost: 1 };
                    currentUser.level = 1;
                    currentUser.xp = 0;
                    showNotification('🌟 PRESTIGE! You\'ve ascended! Permanent boosts unlocked!', '🌟');
                    triggerConfetti(2);
                    playTone('jackpot', 2);
                }
                saveUser();
            }

            function checkAchievements() {
                const cs = currentUser.cardMatchStats;
                const newAchievements = [];
                const achievementDefs = [
                    { id: 'first_win', name: 'First Win', desc: 'Win your first game', check: () => cs.totalWin > 0,
                        icon: '🏅' },
                    { id: '10_games', name: 'Card Shark', desc: 'Play 10 games', check: () => cs.gamesPlayed >= 10,
                        icon: '🃏' },
                    { id: 'big_win_500', name: 'High Roller', desc: 'Win 500+ GOLD in one game', check: () => cs
                            .biggestWin >= 500, icon: '💎' },
                    { id: 'combo_5', name: 'On Fire', desc: 'Get a 5+ combo streak', check: () => cs.bestCombo >= 5,
                        icon: '🔥' },
                    { id: 'perfect_run', name: 'Flawless', desc: 'Complete a perfect run', check: () => cs
                            .perfectRuns > 0, icon: '🏆' },
                    { id: 'specials_10', name: 'Specialist', desc: 'Find 10 special cards', check: () => cs
                            .specialsFound >= 10, icon: '✨' },
                    { id: 'jackpot', name: 'Jackpot!', desc: 'Hit a jackpot', check: () => (cs.jackpotsHit || 0) > 0,
                        icon: '🎰' },
                ];
                achievementDefs.forEach(ach => {
                    if (!currentUser.earnedAchievements.includes(ach.id) && ach.check()) {
                        currentUser.earnedAchievements.push(ach.id);
                        newAchievements.push(ach);
                    }
                });
                newAchievements.forEach(ach => {
                    showNotification(`${ach.icon} Achievement: ${ach.name} - ${ach.desc}`, ach.icon);
                });
                if (newAchievements.length > 0) saveUser();
            }

            function updateWinningsDisplay() {
                winningsDisplay.textContent = `💰 Current win: ${winnings.toFixed(2)} GOLD`;
            }

            function updateSessionDisplay() {
                sessionDisplay.textContent =
                    `📊 Session P/L: ${sessionProfit>=0?'+':''}${sessionProfit.toFixed(2)} GOLD | Level ${currentUser?.level||1}`;
            }

            function shakeElement(el) {
                el.style.animation = 'none';
                el.offsetHeight;
                el.style.animation = 'screenShake 0.4s ease-out';
                setTimeout(() => el.style.animation = '', 400);
            }

            // ── AMBIENT PARTICLES & FLOATING CARDS ──
            function initParticles() {
                const container = document.getElementById('particlesContainer');
                container.innerHTML = '';
                for (let i = 0; i < 35; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = Math.random() * 6 + 2;
                    p.style.width = p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.animationDelay = Math.random() * 9 + 's';
                    p.style.animationDuration = (Math.random() * 7 + 5) + 's';
                    container.appendChild(p);
                }
            }

            function initAmbientCards() {
                const layer = document.getElementById('ambientCardsLayer');
                layer.innerHTML = '';
                for (let i = 0; i < 8; i++) {
                    const card = document.createElement('div');
                    card.className = 'floating-amb-card';
                    card.style.left = Math.random() * 90 + '%';
                    card.style.top = Math.random() * 90 + '%';
                    card.style.animationDelay = Math.random() * 12 + 's';
                    card.style.animationDuration = (Math.random() * 10 + 8) + 's';
                    card.style.width = (Math.random() * 30 + 20) + 'px';
                    card.style.height = (Math.random() * 40 + 28) + 'px';
                    layer.appendChild(card);
                }
            }

            // ── EVENT BINDINGS ──
            playBtn.addEventListener('click', startGame);
            collectBtn.addEventListener('click', collectManually);
            peekBtn.addEventListener('click', () => {
                if (peekAvailable && gameActive) {
                    revealRandomCards(4);
                    peekAvailable = false;
                    peekBtn.style.display = 'none';
                    playTone('special_reveal');
                }
            });
            betInput.addEventListener('input', validateBet);
            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.getElementById('soundToggleBtn').innerHTML = soundEnabled ?
                    '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
                localStorage.setItem('gold_sound_enabled', soundEnabled);
                if (!soundEnabled) stopHeartbeat();
            });
            document.getElementById('themeCycleBtn').addEventListener('click', cycleTheme);
            // Theme dot clicks
            document.getElementById('themeMiniRow').addEventListener('click', (e) => {
                const dot = e.target.closest('.theme-dot');
                if (!dot || gameActive) return;
                const theme = dot.dataset.theme;
                if (theme && (currentUser?.unlockedThemes?.includes(theme) || theme === 'royal-gold')) {
                    applyTheme(theme);
                    showNotification(
                        `Theme: ${theme.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}`, '🎨');
                } else if (theme && currentUser && currentUser.cardMatchStats.gamesPlayed >= 10 * (THEMES.indexOf(
                        theme) + 1)) {
                    currentUser.unlockedThemes.push(theme);
                    applyTheme(theme);
                    saveUser();
                    showNotification(
                        `Theme Unlocked: ${theme.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}!`, '🔓');
                } else if (theme) {
                    showNotification(`Locked! Play more games to unlock.`, '🔒');
                }
            });
            window.addEventListener('focus', async () => {
                if (currentUser) { await loadUser();
                    updateBalanceDisplay();
                    updateSessionDisplay(); }
            });
            window.addEventListener('resize', () => {
                if (gameActive) renderCards();
            });
            // Keyboard shortcut for collect
            window.addEventListener('keydown', (e) => {
                if (e.key === 'c' && gameActive && pairsFound > 0 && collectBtn.style.display !== 'none') {
                    collectManually();
                }
                if (e.key === 'Enter' && !gameActive && !playBtn.disabled) {
                    startGame();
                }
            });

            // ── INIT ──
            async function init() {
                initParticles();
                initAmbientCards();
                if (!(await loadUser())) return;
                updateBalanceDisplay();
                updateSessionDisplay();
                validateBet();
                updateMultiplierDisplay();
                updateMaxMultiplierDisplay();
                updateDifficultyButtons();
                updateDangerMeter();
                cardsGrid.style.gridTemplateColumns = `repeat(${getDiffConfig().gridCols}, 1fr)`;
                const savedSound = localStorage.getItem('gold_sound_enabled');
