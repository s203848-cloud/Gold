<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GOLD SNAKE EYES | Bet on any total. Rare doubles pay huge!</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd966;
            --gold-bright: #ffe484;
            --gold-deep: #f5b042;
            --bg-deep: #0a0908;
            --card-bg: rgba(20, 18, 16, 0.78);
            --border-gold: rgba(255, 217, 102, 0.4);
            --shadow-gold: 0 0 35px rgba(255, 217, 102, 0.18);
            --radius-xl: 2rem;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --radius-full: 60px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-bg: rgba(18, 15, 11, 0.72);
            --glass-blur: 18px;
            --dice-size: 100px;
            --danger: #ff6b6b;
            --success: #4caf50;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0c0b0a 0%, #020101 100%);
            color: #f5f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.5s;
        }
        .particles-container { position: fixed; inset:0; pointer-events:none; z-index:0; overflow: hidden; }
        .particle {
            position: absolute; border-radius: 50%; background: var(--gold);
            opacity: 0; animation: floatUp var(--dur, 7s) infinite ease-in; animation-delay: var(--delay, 0s);
            box-shadow: 0 0 6px rgba(255,217,102,0.5);
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            12% { opacity: 0.6; transform: scale(1.1); }
            45% { transform: translateY(35vh) scale(0.5); opacity: 0.18; }
            100% { transform: translateY(-25vh) scale(0); opacity: 0; }
        }
        .game-container { max-width: 750px; width:100%; display:flex; flex-direction:column; gap:1rem; position:relative; z-index:1; }
        .top-nav {
            display:flex; justify-content:space-between; align-items:center;
            background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-full); padding:0.6rem 1.5rem;
            border:1px solid var(--border-gold); box-shadow:0 8px 28px rgba(0,0,0,0.5);
            flex-wrap:wrap; gap:0.5rem;
        }
        .back-home {
            text-decoration:none; color:var(--gold); font-weight:600; font-size:0.9rem;
            background:rgba(255,217,102,0.1); padding:0.4rem 1.1rem; border-radius:40px;
            display:flex; align-items:center; gap:0.45rem; transition:0.3s; border:1px solid transparent;
        }
        .back-home:hover { background:rgba(255,217,102,0.2); transform:translateX(-3px); }
        .balance-tag {
            background:rgba(28,24,18,0.9); padding:0.35rem 1.1rem; border-radius:40px;
            font-weight:700; border:1px solid rgba(255,217,102,0.4);
            display:flex; align-items:center; gap:0.5rem; font-size:0.9rem; transition:box-shadow 0.3s;
        }
        .balance-tag.pulse { animation:balancePulse 0.5s ease-out; }
        @keyframes balancePulse { 0%{box-shadow:0 0 0 0 rgba(255,217,102,0.5)} 100%{box-shadow:0 0 0 22px rgba(255,217,102,0)} }
        .sound-btn {
            background:rgba(255,217,102,0.08); border:1px solid rgba(255,217,102,0.25);
            border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
            cursor:pointer; color:var(--gold-bright); font-size:1.2rem; transition:all 0.2s;
        }
        .sound-btn:hover { background:rgba(255,217,102,0.2); transform:scale(1.08); }
        .main-card {
            background: linear-gradient(160deg, rgba(26,22,17,0.94) 0%, rgba(10,8,5,0.97) 100%);
            backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            border-radius: var(--radius-xl); padding:1.5rem 1.3rem;
            border:1px solid var(--border-gold);
            box-shadow:0 30px 55px rgba(0,0,0,0.6), var(--shadow-gold);
            position:relative;
        }
        .main-card::before {
            content:''; position:absolute; inset:-1px; border-radius:var(--radius-xl); padding:1px;
            background: linear-gradient(135deg, rgba(255,217,102,0.35), transparent 40%, transparent 60%, rgba(255,217,102,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none; z-index:0;
        }
        .main-card > * { position:relative; z-index:1; }
        .game-title { font-family:'Playfair Display', serif; font-size:1.5rem; font-weight:800; color:var(--gold-bright); text-align:center; letter-spacing:0.04em; text-shadow:0 2px 14px rgba(255,200,60,0.5); margin-bottom:0.3rem; }
        .odds-grid { display:grid; grid-template-columns: repeat(6, 1fr); gap:0.5rem; margin:0.8rem 0; }
        .odd-item {
            background:rgba(0,0,0,0.4); border:2px solid rgba(255,217,102,0.2);
            border-radius:1rem; padding:0.5rem 0.2rem; text-align:center;
            cursor:pointer; transition:all 0.2s; font-weight:600;
        }
        .odd-item:hover { border-color:var(--gold-bright); background:rgba(255,217,102,0.1); transform:translateY(-3px); }
        .odd-item.selected { border-color:var(--gold-bright); box-shadow:0 0 25px rgba(255,217,102,0.5); background:rgba(255,217,102,0.18); }
        .odd-value { font-size:1.2rem; color:var(--gold-bright); }
        .odd-multiplier { font-size:0.75rem; color:#bfb6a4; margin-top:2px; }
        .dice-area { display:flex; justify-content:center; gap:1.5rem; margin:1.2rem 0; perspective: 600px; }
        .die {
            width: var(--dice-size); height: var(--dice-size);
            background: #fefefe; border-radius:1.2rem;
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 8px 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,217,102,0.2);
            color:#1a150e; transition: transform 0.15s; border:2px solid #ccc;
            font-size:4rem; font-weight:700; position:relative;
            transform-style: preserve-3d;
        }
        .die.rolling { animation: diceShake 0.12s infinite alternate; }
        @keyframes diceShake { 0% { transform: rotateX(-8deg) rotateY(-8deg) translateY(-4px); } 100% { transform: rotateX(8deg) rotateY(8deg) translateY(4px); } }
        .die .dots { position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:8px; }
        .dot { width:12px; height:12px; background:#1a150e; border-radius:50%; align-self:center; justify-self:center; }
        .sum-display { text-align:center; font-size:1.4rem; margin-top:-0.5rem; min-height:2rem; font-weight:600; }
        .bet-panel {
            display:flex; flex-wrap:wrap; gap:0.8rem; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.3); border-radius:2rem; padding:0.6rem 1rem;
            margin:0.8rem 0; border:1px solid rgba(255,217,102,0.2);
        }
        .bet-input { width:80px; background:#0f0d0b; border:2px solid var(--gold); border-radius:20px; padding:0.4rem; text-align:center; color:var(--gold-bright); font-weight:700; font-family:'Inter', sans-serif; transition:0.2s; }
        .bet-input:focus { box-shadow:0 0 0 4px rgba(255,217,102,0.1); }
        .btn {
            border:none; border-radius:var(--radius-full); font-weight:700; cursor:pointer;
            transition: all 0.15s; display:inline-flex; align-items:center; gap:0.4rem;
            padding:0.55rem 1.3rem; font-size:0.9rem; font-family:'Inter', sans-serif;
            position:relative; overflow:hidden; letter-spacing:0.02em; white-space:nowrap;
        }
        .btn:active { transform:translateY(2px); box-shadow:none !important; }
        .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; filter:grayscale(30%); }
        .btn-roll {
            background: linear-gradient(135deg, #f5b042, #ffd966); color:#1a150e;
            box-shadow: 0 4px 0 #a05f15, 0 6px 18px rgba(255,180,40,0.3);
            font-size:1.1rem; padding:0.65rem 2rem;
        }
        .btn-roll:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 4px 0 #a05f15, 0 10px 28px rgba(255,180,40,0.5); }
        .btn-outline { background:rgba(255,217,102,0.08); border:1px solid var(--border-gold); color:var(--gold); }
        .btn-outline:hover:not(:disabled) { background:rgba(255,217,102,0.2); }
        .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,0.35); transform:scale(0); animation:rippleEffect 0.6s ease-out; pointer-events:none; }
        @keyframes rippleEffect { to { transform:scale(4); opacity:0; } }
        .result-area { background:rgba(0,0,0,0.5); backdrop-filter:blur(10px); border-radius:1.2rem; padding:0.6rem; text-align:center; font-weight:600; min-height:2.5rem; margin:0.4rem 0; transition:all 0.3s; }
        .big-win { font-family:'Playfair Display', serif; font-size:2.5rem; font-weight:900; color:var(--gold-bright); text-shadow:0 0 25px rgba(255,217,102,0.8); display:none; margin:0.3rem; animation:popIn 0.5s var(--transition-bounce); }
        @keyframes popIn { 0%{transform:scale(0.2);opacity:0} 70%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }
        .stats-panel { display:grid; grid-template-columns: repeat(4,1fr); gap:0.5rem; background:rgba(0,0,0,0.3); border-radius:1rem; padding:0.8rem; margin-top:0.5rem; font-size:0.75rem; }
        .stat-item { text-align:center; }
        .stat-value { font-weight:800; color:var(--gold); font-size:1rem; }
        .streak-badge { background:rgba(255,180,40,0.2); padding:0.2rem 0.6rem; border-radius:20px; display:inline-block; font-size:0.7rem; margin-left:0.5rem; }
        .toast-container { position:fixed; top:1rem; right:1rem; z-index:2000; display:flex; flex-direction:column; gap:0.5rem; pointer-events:none; }
        .toast {
            background:rgba(20,16,10,0.9); backdrop-filter:blur(14px); border:1px solid var(--border-gold);
            border-radius:1rem; padding:0.6rem 1.1rem; color:#f5f0e6; font-weight:600; font-size:0.8rem;
            animation:toastIn 0.4s ease-out, toastOut 0.3s ease-in 2.6s forwards;
            box-shadow:0 8px 25px rgba(0,0,0,0.5); max-width:300px; pointer-events:auto;
        }
        @keyframes toastIn { from{transform:translateX(120%);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes toastOut { from{transform:translateX(0);opacity:1} to{transform:translateX(120%);opacity:0} }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); z-index:1000; display:none; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal-content {
            background:linear-gradient(160deg, rgba(26,22,17,0.97), rgba(10,8,5,0.98));
            border-radius:var(--radius-xl); padding:1.5rem; max-width:450px; width:90%;
            border:1px solid var(--border-gold); box-shadow:0 25px 55px rgba(0,0,0,0.7);
            text-align:center; position:relative; max-height:85vh; overflow-y:auto;
        }
        .modal-close { position:absolute; top:0.5rem; right:0.8rem; background:none; border:none; color:var(--gold); font-size:1.3rem; cursor:pointer; }
        @media (max-width:500px) {
            :root { --dice-size: 75px; }
            .die { font-size:3rem; }
            .odds-grid { grid-template-columns: repeat(3, 1fr); }
            .btn-roll { padding:0.5rem 1.5rem; font-size:0.95rem; }
        }
    </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="particles-container" id="particlesContainer"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="game-container">
    <div class="top-nav">
        <a href=".././home.html" class="back-home"><i class="fas fa-arrow-left"></i> Lobby</a>
        <div class="balance-tag" id="balanceTag"><i class="fas fa-coins"></i> <span id="headerBalance">0</span></div>
        <button id="soundToggleBtn" class="sound-btn"><i class="fas fa-volume-up"></i></button>
    </div>

    <div class="main-card">
        <div class="game-title"><i class="fas fa-dice"></i> SNAKE EYES <span style="font-size:0.9rem;">RISK ARENA</span></div>
        <div class="odds-grid" id="oddsGrid"></div>
        <div class="dice-area">
            <div class="die" id="die1"></div>
            <div class="die" id="die2"></div>
        </div>
        <div class="sum-display" id="sumDisplay">Sum: ?</div>

        <div class="bet-panel">
            <div style="display:flex; flex-direction:column; align-items:center;">
                <span style="color:var(--gold); font-size:0.8rem;">BET</span>
                <input type="number" id="betAmountInput" class="bet-input" value="50" min="1" step="1">
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <label style="color:var(--gold-bright); font-size:0.8rem; display:flex; align-items:center; gap:0.2rem;">
                    <input type="checkbox" id="snakeEyesBet"> 🐍 Snake Eyes
                </label>
                <input type="number" id="sideBetAmount" class="bet-input" value="10" min="1" step="1" style="width:70px;">
            </div>
            <button class="btn btn-roll" id="rollBtn"><i class="fas fa-dice"></i> ROLL</button>
        </div>
        <div style="display:flex; gap:0.4rem; justify-content:center; margin-bottom:0.5rem;">
            <button class="btn btn-outline" id="autoBtn"><i class="fas fa-robot"></i> Auto</button>
            <button class="btn btn-outline" id="settingsBtn"><i class="fas fa-cog"></i> Settings</button>
            <button class="btn btn-outline" id="statsBtn"><i class="fas fa-chart-bar"></i> Stats</button>
        </div>
        <div class="result-area">
            <span id="resultMessage">✨ Select target & roll the dice</span>
            <div id="bigWinDisplay" class="big-win"></div>
            <div id="potentialWinDisplay" style="font-size:0.8rem; color:#bfb6a4;"></div>
            <div id="sessionProfitDisplay" style="font-size:0.8rem; color:#bfb6a4;"></div>
        </div>
        <div class="stats-panel" id="statsPanel">
            <div class="stat-item"><div class="stat-value" id="gamesStat">0</div><small>Games</small></div>
            <div class="stat-item"><div class="stat-value" id="winRateStat">0%</div><small>Win Rate</small></div>
            <div class="stat-item"><div class="stat-value" id="bestStreakStat">0</div><small>Best Streak</small></div>
            <div class="stat-item"><div class="stat-value" id="jackpotPoolStat">0</div><small>Jackpot</small></div>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <button class="modal-close" id="closeSettingsBtn">&times;</button>
        <h3><i class="fas fa-sliders-h"></i> Settings</h3>
        <div style="margin:0.8rem 0; text-align:left;">
            <label>Master Volume</label>
            <input type="range" id="masterVolume" min="0" max="100" value="80" style="width:100%">
            <label>SFX Volume</label>
            <input type="range" id="sfxVolume" min="0" max="100" value="85" style="width:100%">
            <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.5rem;">
                <input type="checkbox" id="reducedMotion"> Reduced Motion
            </label>
        </div>
        <button class="btn btn-outline" id="closeSettingsBtn2">Close</button>
    </div>
</div>

<!-- Autoplay Modal -->
<div class="modal-overlay" id="autoModal">
    <div class="modal-content">
        <button class="modal-close" id="closeAutoBtn">&times;</button>
        <h3><i class="fas fa-robot"></i> Autoplay</h3>
        <p>Number of rolls: <input type="number" id="autoCount" value="10" min="1" max="100" style="width:60px;"></p>
        <p>Strategy:
            <select id="autoStrategy">
                <option value="fixed">Fixed Bet</option>
                <option value="martingale">Martingale (double after loss)</option>
                <option value="reverse">Reverse Martingale (double after win)</option>
            </select>
        </p>
        <button class="btn btn-roll" id="startAutoBtn">Start Autoplay</button>
        <button class="btn btn-outline" id="stopAutoBtn" style="display:none;">Stop Autoplay</button>
    </div>
</div>

<script>
(() => {
    /* ═══════════════════════════════════════════════
       GOLD SNAKE EYES · PREMIUM CASINO EDITION
       Fully enhanced with advanced mechanics & effects
       ═══════════════════════════════════════════════ */

    // ──────────────── AUDIO ENGINE ────────────────
    class AudioEngine {
        constructor() {
            this.ctx = null; this.masterGain = null; this.sfxGain = null;
            this.soundEnabled = true; this.masterVolume = 0.8; this.sfxVolume = 0.85;
            this.initialized = false;
        }
        async init() {
            if (this.initialized) return;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = this.masterVolume;
                this.masterGain.connect(this.ctx.destination);
                this.sfxGain = this.ctx.createGain();
                this.sfxGain.gain.value = this.sfxVolume;
                this.sfxGain.connect(this.masterGain);
                this.initialized = true;
            } catch(e) {}
        }
        async resume() { if (this.ctx?.state === 'suspended') await this.ctx.resume(); }
        setMaster(v) { this.masterVolume = v; if(this.masterGain) this.masterGain.gain.value = v; }
        setSFX(v) { this.sfxVolume = v; if(this.sfxGain) this.sfxGain.gain.value = v; }
        play(type) {
            if (!this.soundEnabled || !this.initialized) return;
            this.resume();
            const now = this.ctx.currentTime, dest = this.sfxGain;
            const mk = (freq, wtype='sine', dur=0.15, vol=0.08, delay=0) => {
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.connect(g); g.connect(dest); o.type = wtype; o.frequency.value = freq;
                g.gain.setValueAtTime(vol, now+delay); g.gain.exponentialRampToValueAtTime(0.0001, now+delay+dur);
                o.start(now+delay); o.stop(now+delay+dur);
            };
            switch(type) {
                case 'click': mk(600, 'sine', 0.05, 0.04); break;
                case 'roll': for(let i=0;i<6;i++) mk(200+Math.random()*100, 'triangle', 0.1, 0.03, i*0.02); break;
                case 'win': mk(880, 'sine', 0.4, 0.08); mk(1100, 'sine', 0.35, 0.06, 0.1); break;
                case 'bigwin': for(let i=0;i<4;i++) mk(660+i*200, 'sine', 0.5, 0.07, i*0.1); break;
                case 'jackpot': for(let i=0;i<6;i++) mk(400+i*150, 'sine', 0.6, 0.08, i*0.08); break;
                case 'lose': mk(250, 'sawtooth', 0.35, 0.05); break;
            }
        }
    }
    const audio = new AudioEngine();

    // ──────────────── UTILS ────────────────
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    function showToast(msg, icon='✨') {
        const c = document.getElementById('toastContainer');
        const t = document.createElement('div'); t.className = 'toast';
        t.innerHTML = `${icon} ${msg}`; c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
    function triggerConfetti(intensity='normal') {
        const canvas = document.getElementById('confettiCanvas');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d'); const particles = [];
        const count = intensity==='jackpot'?400:150;
        const colors = ['#ffd966','#f5b042','#ffed4e','#4caf50','#ffaa00','#fff'];
        for(let i=0;i<count;i++) particles.push({
            x:Math.random()*canvas.width, y:-30, size:Math.random()*8+3,
            speedY:Math.random()*8+5, speedX:(Math.random()-0.5)*7,
            color:colors[Math.floor(Math.random()*colors.length)],
            rot:Math.random()*360, rotSpeed:(Math.random()-0.5)*14,
            shape:Math.random()>0.5?'star':'rect', opacity:1
        });
        let start=performance.now(), frame;
        function draw(now) {
            if(now-start>3000) { ctx.clearRect(0,0,canvas.width,canvas.height); cancelAnimationFrame(frame); return; }
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p=>{
                p.y+=p.speedY; p.x+=p.speedX; p.rot+=p.rotSpeed; p.speedY+=0.05;
                p.opacity = Math.max(0, 1-(now-start)/3000);
                ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
                ctx.globalAlpha=p.opacity; ctx.fillStyle=p.color;
                if(p.shape==='star'){ ctx.beginPath(); for(let i=0;i<5;i++){ const a=(i*72-90)*Math.PI/180; const x1=Math.cos(a)*p.size/2,y1=Math.sin(a)*p.size/2; i===0?ctx.moveTo(x1,y1):ctx.lineTo(x1,y1); } ctx.closePath(); ctx.fill(); }
                else ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
                ctx.restore();
            });
            frame=requestAnimationFrame(draw);
        }
        frame=requestAnimationFrame(draw);
    }

    // ──────────────── USER DATA ────────────────
    let currentUser = null;
    function initUserStats(u) {
        const defaults = {
            globalStats: { totalWagered:0, totalWon:0, totalLosses:0, totalGames:0, currentStreak:0, bestStreak:0, totalWins:0 },
            transactions:[], gameOutcomes:[], gamePlayCount:{}, balance:0, xp:0, level:1, prestige:0,
            avatar:'fas fa-crown', theme:'theme-gold', earnedAchievements:[],
            snakeEyesStats: { gamesPlayed:0, wins:0, totalBet:0, totalWin:0, snakeEyeWins:0, bestStreak:0, currentStreak:0, jackpotHits:0 },
            lastDailyReward: null, dailyStreak:0
        };
        for(let k in defaults) if(u[k]===undefined) u[k]=defaults[k];
        if(!u.snakeEyesStats.bestStreak) u.snakeEyesStats.bestStreak=0;
        if(!u.snakeEyesStats.currentStreak) u.snakeEyesStats.currentStreak=0;
        return u;
    }
    async function loadUser() {
        const sess = sessionStorage.getItem('gold_current_user');
        if(!sess) { window.location.href='../../sign-in.html'; return false; }
        const su = JSON.parse(sess);
        const users = JSON.parse(localStorage.getItem('gold_users')||'{}');
        let user = users[su.username];
        if(!user) { sessionStorage.removeItem('gold_current_user'); window.location.href='../../sign-in.html'; return false; }
        currentUser = initUserStats(user);
        su.balance = currentUser.balance;
        sessionStorage.setItem('gold_current_user', JSON.stringify(su));
        return true;
    }
    async function saveUser() {
        const users = JSON.parse(localStorage.getItem('gold_users')||'{}');
        users[currentUser.username] = currentUser;
        localStorage.setItem('gold_users', JSON.stringify(users));
        const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
        if(sess) { sess.balance = currentUser.balance; sessionStorage.setItem('gold_current_user', JSON.stringify(sess)); }
    }
    function updateBalanceDisplay() {
        const el = $('#headerBalance');
        const prev = parseInt(el.textContent.replace(/,/g,''))||0;
        const next = currentUser.balance;
        if(prev!==next) {
            animateNumber(el, prev, next, 400);
            if(next>prev) { $('#balanceTag').classList.add('pulse'); setTimeout(()=>$('#balanceTag').classList.remove('pulse'),500); }
        } else el.textContent = next.toLocaleString();
    }
    function animateNumber(el, start, end, dur) {
        if(start===end) return;
        const range=end-start, st=performance.now();
        function step(now){ const p=Math.min((now-st)/dur,1), eased=1-Math.pow(1-p,3); el.textContent=Math.round(start+range*eased).toLocaleString(); if(p<1) requestAnimationFrame(step); else el.textContent=end.toLocaleString(); }
        requestAnimationFrame(step);
    }

    // ──────────────── GAME STATE & CONFIG ────────────────
    const PAYOUTS = { 2:30, 3:15, 4:10, 5:8, 6:5, 7:3, 8:5, 9:8, 10:10, 11:15, 12:30 };
    const SNAKE_EYES_MULT = 100;
    let selectedTarget = 7;
    let rolling = false;
    let sessionProfit = 0;
    let jackpotPool = parseFloat(localStorage.getItem('gold_snake_jackpot')||'500');
    let comboStreak = 0;
    let streakMultiplier = 1.0;
    let eventActive = null; // 'golden', 'double', etc.
    let autoMode = false, autoTimer = null;
    let autoConfig = { count:0, strategy:'fixed', baseBet:50, currentMultiplier:1 };

    // DOM refs
    const diceEl1 = $('#die1'), diceEl2 = $('#die2');
    const sumDisplay = $('#sumDisplay');
    const rollBtn = $('#rollBtn');
    const betInput = $('#betAmountInput');
    const sideBetCheck = $('#snakeEyesBet');
    const sideBetInput = $('#sideBetAmount');
    const resultMessage = $('#resultMessage');
    const bigWinDisplay = $('#bigWinDisplay');
    const potentialWinEl = $('#potentialWinDisplay');
    const sessionProfitEl = $('#sessionProfitDisplay');

    function renderDiceFace(dieEl, value) {
        dieEl.innerHTML = '';
        const dotMap = { 1:[5], 2:[3,7], 3:[3,5,7], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
        const positions = dotMap[value] || [];
        dieEl.innerHTML = '<div class="dots"></div>';
        const dotsGrid = dieEl.querySelector('.dots');
        for (let i=1; i<=9; i++) {
            const dot = document.createElement('div');
            if (positions.includes(i)) dot.classList.add('dot');
            dotsGrid.appendChild(dot);
        }
    }

    function renderOddsGrid() {
        const grid = $('#oddsGrid');
        grid.innerHTML = '';
        for (let sum=2; sum<=12; sum++) {
            const item = document.createElement('div');
            item.className = `odd-item ${selectedTarget===sum?'selected':''}`;
            item.innerHTML = `<div class="odd-value">${sum}</div><div class="odd-multiplier">${PAYOUTS[sum]}x</div>`;
            item.addEventListener('click', () => selectTarget(sum));
            grid.appendChild(item);
        }
        updatePotentialWin();
    }

    function selectTarget(sum) {
        if (rolling) return;
        selectedTarget = sum;
        renderOddsGrid();
        audio.play('click');
        updatePotentialWin();
    }

    function updatePotentialWin() {
        const bet = parseFloat(betInput.value) || 0;
        const mult = PAYOUTS[selectedTarget] || 1;
        const eventMult = eventActive==='golden' ? 2 : 1;
        const comboMult = comboStreak >= 3 ? 1 + comboStreak*0.2 : 1;
        const totalMult = mult * eventMult * comboMult * streakMultiplier;
        potentialWinEl.textContent = `💰 Potential: ${Math.floor(bet * totalMult)} GOLD (x${totalMult.toFixed(1)})`;
    }

    function validateRollBtn() {
        const bet = parseFloat(betInput.value) || 0;
        const side = sideBetCheck.checked ? (parseFloat(sideBetInput.value) || 0) : 0;
        const totalBet = bet + side;
        rollBtn.disabled = rolling || totalBet <= 0 || totalBet > currentUser.balance;
        betInput.classList.toggle('invalid', totalBet > currentUser.balance);
    }

    function updateStatsPanel() {
        const s = currentUser.snakeEyesStats;
        $('#gamesStat').textContent = s.gamesPlayed || 0;
        const rate = s.gamesPlayed > 0 ? ((s.wins / s.gamesPlayed)*100).toFixed(1) : '0.0';
        $('#winRateStat').textContent = rate + '%';
        $('#bestStreakStat').textContent = s.bestStreak || 0;
        $('#jackpotPoolStat').textContent = Math.floor(jackpotPool).toLocaleString();
    }

    function recordStats(bet, winAmount, features={}) {
        const s = currentUser.snakeEyesStats;
        s.gamesPlayed++; s.totalBet += bet; s.totalWin += winAmount;
        if (winAmount > 0) {
            s.wins++; s.currentStreak++; if (s.currentStreak > s.bestStreak) s.bestStreak = s.currentStreak;
            if (winAmount > (s.biggestWin||0)) s.biggestWin = winAmount;
        } else s.currentStreak = 0;
        currentUser.globalStats.totalGames++; currentUser.globalStats.totalWagered += bet; currentUser.globalStats.totalWon += winAmount;
        if (winAmount>0) { currentUser.globalStats.currentStreak=(currentUser.globalStats.currentStreak||0)+1; if(currentUser.globalStats.currentStreak>(currentUser.globalStats.bestStreak||0)) currentUser.globalStats.bestStreak=currentUser.globalStats.currentStreak; currentUser.globalStats.totalWins++; }
        else currentUser.globalStats.currentStreak=0;
        currentUser.xp = (currentUser.xp||0) + Math.floor(bet*0.5);
        checkLevelUp();
        currentUser.gamePlayCount['snake-eyes'] = (currentUser.gamePlayCount['snake-eyes']||0)+1;
        currentUser.gameOutcomes.unshift({game:'SnakeEyes',result:winAmount>0?'win':'loss',profit:winAmount-bet,multiplier:winAmount/bet,bet,win:winAmount,date:new Date().toISOString()});
        if(currentUser.gameOutcomes.length>50) currentUser.gameOutcomes.pop();
        currentUser.transactions.unshift({desc:`🎲 Snake Eyes | ${winAmount>0?`Won ${winAmount}`:`Lost ${bet}`}`,amount:winAmount-bet,type:winAmount>0?'game_win':'game_loss',date:new Date().toISOString()});
        if(currentUser.transactions.length>30) currentUser.transactions.shift();
        saveUser();
    }

    function checkLevelUp() {
        const xpNeeded = Math.floor(100*Math.pow(1.5, (currentUser.level||1)-1));
        if((currentUser.xp||0) >= xpNeeded) { currentUser.xp-=xpNeeded; currentUser.level++; showToast(`Level Up! Now level ${currentUser.level}`, '⬆️'); }
    }

    // ──────────────── RANDOM EVENTS ────────────────
    function checkRandomEvent() {
        if (Math.random() < 0.03) {
            eventActive = 'golden';
            showToast('🌟 Golden Roll! All wins doubled for next roll!', '✨');
        } else if (Math.random() < 0.02) {
            eventActive = 'double';
            showToast('🎲 Double Dice! Extra die rolls.', '🎲');
        } else eventActive = null;
    }

    // ──────────────── DICE ROLL ANIMATION ────────────────
    async function rollDiceAnimation(finalDie1, finalDie2) {
        diceEl1.classList.add('rolling');
        diceEl2.classList.add('rolling');
        const startTime = performance.now();
        const duration = 1400;
        return new Promise(resolve => {
            function animate(now) {
                const elapsed = now - startTime;
                if (elapsed < duration) {
                    const r1 = Math.floor(Math.random()*6)+1;
                    const r2 = Math.floor(Math.random()*6)+1;
                    renderDiceFace(diceEl1, r1);
                    renderDiceFace(diceEl2, r2);
                    requestAnimationFrame(animate);
                } else {
                    diceEl1.classList.remove('rolling');
                    diceEl2.classList.remove('rolling');
                    renderDiceFace(diceEl1, finalDie1);
                    renderDiceFace(diceEl2, finalDie2);
                    // Bounce effect
                    diceEl1.style.transform = 'translateY(-10px)';
                    diceEl2.style.transform = 'translateY(-10px)';
                    setTimeout(() => { diceEl1.style.transform = ''; diceEl2.style.transform = ''; }, 200);
                    resolve();
                }
            }
            requestAnimationFrame(animate);
        });
    }

    // ──────────────── MAIN GAME FLOW ────────────────
    async function executeRoll() {
        if (rolling) return;
        let bet = parseFloat(betInput.value);
        if (isNaN(bet) || bet <= 0) bet = 50;
        bet = Math.floor(bet);
        let sideBet = sideBetCheck.checked ? parseFloat(sideBetInput.value) || 0 : 0;
        const totalBet = bet + sideBet;
        if (totalBet > currentUser.balance) {
            resultMessage.innerHTML = '❌ Insufficient balance!';
            return;
        }
        // Deduct bet
        currentUser.balance -= totalBet;
        sessionProfit -= totalBet;
        // Contribute to jackpot
        jackpotPool += totalBet * 0.005;
        localStorage.setItem('gold_snake_jackpot', jackpotPool);
        saveUser().then(updateBalanceDisplay);
        updateSessionDisplay();
        updateStatsPanel();

        rolling = true;
        rollBtn.disabled = true;
        resultMessage.innerHTML = '🎲 Rolling...';
        bigWinDisplay.style.display = 'none';
        audio.play('roll');

        checkRandomEvent();
        const die1 = Math.floor(Math.random()*6)+1;
        const die2 = (eventActive==='double' ? Math.floor(Math.random()*6)+1 : Math.floor(Math.random()*6)+1);
        await rollDiceAnimation(die1, die2);
        const sum = die1 + die2;
        sumDisplay.textContent = `Sum: ${sum}`;

        let totalWin = 0;
        let winDetails = [];
        let maxMultiplier = 0;

        // Main bet
        if (sum === selectedTarget) {
            let baseMult = PAYOUTS[sum];
            if (eventActive==='golden') baseMult *= 2;
            if (comboStreak >= 3) baseMult *= (1 + comboStreak*0.2);
            baseMult *= streakMultiplier;
            const winMain = Math.floor(bet * baseMult);
            totalWin += winMain;
            maxMultiplier = Math.max(maxMultiplier, baseMult);
            winDetails.push(`🎯 Target ${sum}: +${winMain} GOLD (x${baseMult})`);
        }
        // Snake eyes side bet
        if (sideBet && die1===1 && die2===1) {
            const winSide = Math.floor(sideBet * SNAKE_EYES_MULT);
            totalWin += winSide;
            maxMultiplier = SNAKE_EYES_MULT;
            currentUser.snakeEyesStats.snakeEyeWins++;
            winDetails.push(`🐍 SNAKE EYES: +${winSide} GOLD (100x)`);
            audio.play('jackpot');
            triggerConfetti('jackpot');
        }
        // Jackpot chance (1 in 200)
        if (Math.random() < 0.005 && totalWin > 0) {
            totalWin += jackpotPool;
            winDetails.push(`💰 JACKPOT! +${Math.floor(jackpotPool)} GOLD`);
            jackpotPool = 500;
            localStorage.setItem('gold_snake_jackpot', jackpotPool);
            currentUser.snakeEyesStats.jackpotHits++;
            audio.play('jackpot');
            triggerConfetti('jackpot');
        }

        if (totalWin > 0) {
            currentUser.balance += totalWin;
            sessionProfit += totalWin;
            comboStreak++;
            if (comboStreak >= 3) streakMultiplier = 1 + comboStreak*0.15;
            else streakMultiplier = 1;
            resultMessage.innerHTML = winDetails.join('<br>');
            bigWinDisplay.style.display = 'block';
            bigWinDisplay.textContent = `+${totalWin} GOLD`;
            audio.play(totalWin >= bet*20 ? 'bigwin' : 'win');
            if (totalWin >= bet*50) triggerConfetti('jackpot');
            // Update stats
            currentUser.snakeEyesStats.currentStreak = (currentUser.snakeEyesStats.currentStreak||0)+1;
            if (currentUser.snakeEyesStats.currentStreak > currentUser.snakeEyesStats.bestStreak) currentUser.snakeEyesStats.bestStreak = currentUser.snakeEyesStats.currentStreak;
        } else {
            comboStreak = 0;
            streakMultiplier = 1;
            currentUser.snakeEyesStats.currentStreak = 0;
            resultMessage.innerHTML = '💔 No win this time.';
            audio.play('lose');
        }
        recordStats(totalBet, totalWin, {});
        saveUser().then(updateBalanceDisplay);
        updateSessionDisplay();
        updateStatsPanel();
        rolling = false;
        rollBtn.disabled = false;
        validateRollBtn();
        updatePotentialWin();
        if (autoMode && autoConfig.count > 0) {
            autoConfig.count--;
            if (autoConfig.count <= 0) stopAuto();
            else {
                if (autoConfig.strategy === 'martingale' && totalWin===0) autoConfig.currentMultiplier *= 2;
                else if (autoConfig.strategy === 'reverse' && totalWin>0) autoConfig.currentMultiplier *= 2;
                else autoConfig.currentMultiplier = 1;
                betInput.value = Math.min(autoConfig.baseBet * autoConfig.currentMultiplier, currentUser.balance);
                validateRollBtn();
                autoTimer = setTimeout(() => executeRoll(), 800);
            }
        }
    }

    function updateSessionDisplay() {
        sessionProfitEl.textContent = `📊 Session P/L: ${sessionProfit>=0?'+':''}${sessionProfit.toFixed(2)} GOLD`;
    }

    // ──────────────── AUTOPLAY ────────────────
    function startAuto() {
        const count = parseInt($('#autoCount').value) || 10;
        autoConfig = { count, strategy: $('#autoStrategy').value, baseBet: parseFloat(betInput.value)||50, currentMultiplier:1 };
        autoMode = true;
        $('#startAutoBtn').style.display = 'none';
        $('#stopAutoBtn').style.display = 'inline-block';
        $('#autoModal').classList.remove('active');
        executeRoll();
    }
    function stopAuto() {
        autoMode = false;
        if (autoTimer) clearTimeout(autoTimer);
        $('#startAutoBtn').style.display = 'inline-block';
        $('#stopAutoBtn').style.display = 'none';
    }

    // ──────────────── EVENT BINDINGS ────────────────
    rollBtn.addEventListener('click', (e) => { if (!rolling) executeRoll(); });
    betInput.addEventListener('input', () => { validateRollBtn(); updatePotentialWin(); });
    sideBetInput.addEventListener('input', validateRollBtn);
    sideBetCheck.addEventListener('change', () => { sideBetInput.disabled = !sideBetCheck.checked; validateRollBtn(); });
    document.getElementById('soundToggleBtn').addEventListener('click', () => {
        audio.soundEnabled = !audio.soundEnabled;
        $('#soundToggleBtn').innerHTML = audio.soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
        localStorage.setItem('gold_sound_enabled', audio.soundEnabled);
    });
    document.getElementById('autoBtn').addEventListener('click', () => $('#autoModal').classList.add('active'));
    document.getElementById('closeAutoBtn').addEventListener('click', () => $('#autoModal').classList.remove('active'));
    document.getElementById('startAutoBtn').addEventListener('click', startAuto);
    document.getElementById('stopAutoBtn').addEventListener('click', stopAuto);

    // Settings modal
    $('#settingsBtn').addEventListener('click', () => $('#settingsModal').classList.add('active'));
    $('#closeSettingsBtn').addEventListener('click', () => $('#settingsModal').classList.remove('active'));
    $('#closeSettingsBtn2').addEventListener('click', () => $('#settingsModal').classList.remove('active'));
    $('#masterVolume').addEventListener('input', function() { audio.setMaster(this.value/100); });
    $('#sfxVolume').addEventListener('input', function() { audio.setSFX(this.value/100); });

    // ──────────────── INIT ────────────────
    async function init() {
        // Particles
        const pc = document.getElementById('particlesContainer');
        for(let i=0;i<30;i++) { const p=document.createElement('div'); p.className='particle'; p.style.width=p.style.height=(Math.random()*5+2)+'px'; p.style.left=Math.random()*100+'%'; p.style.setProperty('--delay',Math.random()*8+'s'); p.style.setProperty('--dur',(Math.random()*6+5)+'s'); pc.appendChild(p); }
        if (!(await loadUser())) return;
        renderOddsGrid();
        renderDiceFace(diceEl1, 1); renderDiceFace(diceEl2, 1);
        updateBalanceDisplay();
        updateSessionDisplay();
        updateStatsPanel();
        validateRollBtn();
        updatePotentialWin();
        const savedSound = localStorage.getItem('gold_sound_enabled');
        if (savedSound === 'false') { audio.soundEnabled = false; $('#soundToggleBtn').innerHTML = '<i class="fas fa-volume-mute"></i>'; }
        await audio.init();
    }
    init();
})();
</script>
</body>
