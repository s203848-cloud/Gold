<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>WHEEL | Stake Originals Style</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #F5B042;
            --gold-bright: #ffe478;
            --gold-deep: #b89830;
            --bg-deep: #0a0908;
            --card-bg: rgba(12, 10, 10, 0.75);
            --border-gold: rgba(245, 176, 66, 0.35);
            --border-gold-strong: rgba(245, 176, 66, 0.6);
            --shadow-card: 0 25px 40px rgba(0, 0, 0, 0.6);
            --shadow-gold: 0 0 30px rgba(245, 176, 66, 0.15);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-full: 50px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-mono: 'Inter', monospace;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 40% 30%, #0e0c08 0%, #050505 60%, #000000 100%);
            min-height: 100vh;
            min-height: 100dvh;
            color: #e8e4dc;
            padding: clamp(0.5rem, 1.5vw, 1rem);
            padding-bottom: calc(clamp(0.5rem, 1.5vw, 1rem) + var(--safe-bottom));
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            line-height: 1.5;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }
        canvas#particleCanvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
        }
        .game-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* ── TOP BAR ─────────────────────── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-full);
            padding: 0.45rem 1.4rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .back-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(245, 176, 66, 0.08);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .back-link:hover {
            background: rgba(245, 176, 66, 0.18);
            color: var(--gold-bright);
        }
        .balance-chip {
            background: #1a1712;
            border: 1px solid var(--border-gold);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-weight: 800;
            font-size: 0.82rem;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
            letter-spacing: -0.3px;
        }
        .jackpot-badge {
            background: linear-gradient(135deg, #e63946, #f77f00);
            color: #fff;
            font-weight: 800;
            border-radius: 40px;
            padding: 0.25rem 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.72rem;
            white-space: nowrap;
            box-shadow: 0 0 16px rgba(230, 57, 70, 0.35);
            animation: jackpotPulse 2s ease-in-out infinite;
        }
        @keyframes jackpotPulse {
            0%,
            100% {
                box-shadow: 0 0 16px rgba(230, 57, 70, 0.35);
            }
            50% {
                box-shadow: 0 0 28px rgba(247, 127, 0, 0.55);
            }
        }
        .sound-toggle {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0.3rem;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sound-toggle:hover {
            transform: scale(1.1);
            background: rgba(245, 176, 66, 0.1);
        }
        .sound-toggle:active {
            transform: scale(0.9);
        }

        /* ── MAIN LAYOUT ────────────────── */
        .main-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .wheel-panel {
            flex: 1.6;
            min-width: 280px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-gold);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .wheel-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 176, 66, 0.3), transparent);
            pointer-events: none;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            margin: 0.2rem 0;
        }
        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            cursor: pointer;
            transition: filter 0.3s;
            will-change: transform;
        }
        canvas#wheelCanvas.spinning {
            filter: brightness(1.12) saturate(1.15);
        }
        canvas#wheelCanvas:active:not(.spinning) {
            transform: scale(0.96);
        }
        .wheel-pointer {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.7));
            pointer-events: none;
            transition: transform 0.08s;
        }
        .wheel-pointer.bounce {
            animation: pointerBounce 0.35s ease;
        }
        @keyframes pointerBounce {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }
            35% {
                transform: translateX(-50%) translateY(7px);
            }
            65% {
                transform: translateX(-50%) translateY(-3px);
            }
        }
        .betting-panel {
            flex: 3;
            min-width: 320px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-gold);
            padding: 1rem;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .betting-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 176, 66, 0.3), transparent);
            pointer-events: none;
        }

        /* ── INPUT GROUP ────────────────── */
        .input-group {
            background: rgba(0, 0, 0, 0.28);
            border-radius: var(--radius-lg);
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.7rem;
            border: 1px solid rgba(245, 176, 66, 0.1);
            transition: var(--transition);
        }
        .input-group:focus-within {
            border-color: var(--border-gold-strong);
            box-shadow: 0 0 14px rgba(245, 176, 66, 0.06);
        }
        .input-label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #8a8278;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .bet-control {
            display: flex;
            gap: 0.35rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .bet-input {
            background: #1b1712;
            border: 2px solid rgba(245, 176, 66, 0.2);
            border-radius: var(--radius-full);
            padding: 0.35rem 0.55rem;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            width: 90px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: var(--font-mono);
        }
        .bet-input:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 12px rgba(245, 176, 66, 0.15);
        }
        .bet-input.invalid {
            border-color: #ff5252;
            animation: shakeInput 0.3s ease;
        }
        @keyframes shakeInput {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }
        .preset-btn {
            background: rgba(245, 176, 66, 0.06);
            border: 1px solid rgba(245, 176, 66, 0.2);
            border-radius: 24px;
            padding: 0.2rem 0.65rem;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            color: #b8b2a6;
            white-space: nowrap;
            user-select: none;
        }
        .preset-btn:hover {
            background: rgba(245, 176, 66, 0.18);
            color: #fff;
            border-color: var(--border-gold-strong);
        }
        .preset-btn:active {
            transform: scale(0.9);
            background: rgba(245, 176, 66, 0.28);
        }
        .preset-btn.max-btn {
            background: rgba(255, 82, 82, 0.1);
            border-color: rgba(255, 82, 82, 0.25);
            color: #ff8a8a;
        }

        /* ── CHIPS GRID ──────────────────── */
        .segment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 0.45rem;
            margin: 0.6rem 0;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 4px;
            scroll-behavior: smooth;
        }
        .segment-grid::-webkit-scrollbar {
            width: 4px;
        }
        .segment-grid::-webkit-scrollbar-thumb {
            background: rgba(245, 176, 66, 0.2);
            border-radius: 4px;
        }
        .chip-option {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(245, 176, 66, 0.15);
            border-radius: var(--radius-md);
            padding: 0.4rem 0.3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            position: relative;
            gap: 0.15rem;
        }
        .chip-option:hover {
            border-color: var(--border-gold-strong);
            background: rgba(245, 176, 66, 0.08);
            transform: translateY(-2px);
        }
        .chip-option:active {
            transform: scale(0.92);
        }
        .chip-option.selected {
            background: rgba(245, 176, 66, 0.2);
            border-color: var(--gold);
            box-shadow: 0 0 18px rgba(245, 176, 66, 0.3);
            animation: selectedGlow 2s ease-in-out infinite;
        }
        @keyframes selectedGlow {
            0%,
            100% {
                box-shadow: 0 0 18px rgba(245, 176, 66, 0.3);
            }
            50% {
                box-shadow: 0 0 28px rgba(245, 176, 66, 0.5);
            }
        }
        .chip-option.win-flash {
            animation: chipWinFlash 0.7s ease;
            border-color: #4caf50 !important;
            box-shadow: 0 0 28px rgba(76, 175, 80, 0.55) !important;
        }
        @keyframes chipWinFlash {
            0%,
            100% {
                background: rgba(0, 0, 0, 0.5);
            }
            40% {
                background: rgba(76, 175, 80, 0.4);
            }
        }
        .chip-mult {
            font-weight: 800;
            font-size: 1rem;
            color: var(--gold-bright);
            letter-spacing: -0.5px;
        }
        .chip-label {
            font-size: 0.58rem;
            color: #8a8278;
            text-transform: uppercase;
        }
        .chip-bet-indicator {
            font-size: 0.55rem;
            color: #a5d6a7;
            font-weight: 600;
            margin-top: 2px;
        }

        /* ── BUTTONS ────────────────────── */
        .action-buttons {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            margin: 0.7rem 0;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.55rem 1.5rem;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: -0.2px;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.93);
        }
        .btn-spin {
            background: linear-gradient(135deg, #c8960c, #e8b830, #f5d060);
            color: #1a1510;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            font-size: 0.88rem;
            padding: 0.6rem 2rem;
            font-weight: 800;
        }
        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45), 0 0 35px rgba(245, 176, 66, 0.25);
        }
        .btn-spin.spinning-anim {
            animation: spinBtnPulse 0.5s ease-in-out infinite;
        }
        @keyframes spinBtnPulse {
            0%,
            100% {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
            50% {
                box-shadow: 0 4px 30px rgba(245, 176, 66, 0.5), 0 0 50px rgba(245, 176, 66, 0.3);
            }
        }
        .btn-outline {
            background: transparent;
            border: 2px solid rgba(245, 176, 66, 0.4);
            color: #d5cec4;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(245, 176, 66, 0.7);
        }
        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            filter: grayscale(0.25);
        }
        .btn-auto {
            background: rgba(100, 149, 237, 0.15);
            border: 1px solid rgba(100, 149, 237, 0.4);
            color: #b8d4ff;
        }
        .btn-auto:hover {
            background: rgba(100, 149, 237, 0.28);
        }
        .btn-auto.active {
            background: rgba(255, 152, 0, 0.25);
            border-color: rgba(255, 152, 0, 0.6);
            color: #ffcc80;
            animation: autoActivePulse 1s ease-in-out infinite;
        }
        @keyframes autoActivePulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 152, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
            }
        }

        /* ── RESULT PANEL ──────────────── */
        .result-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-md);
            padding: 0.6rem 0.8rem;
            text-align: center;
            margin: 0.5rem 0;
            font-weight: 700;
            font-size: 0.78rem;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .result-panel.win {
            background: rgba(76, 175, 80, 0.14);
            border-color: rgba(76, 175, 80, 0.45);
            color: #a5d6a7;
        }
        .result-panel.loss {
            background: rgba(255, 82, 82, 0.09);
            border-color: rgba(255, 82, 82, 0.3);
            color: #ef9a9a;
        }
        .result-panel.jackpot {
            background: rgba(255, 140, 66, 0.2);
            border-color: rgba(255, 140, 66, 0.55);
            animation: jackpotResultGlow 0.5s ease-in-out 4;
        }
        @keyframes jackpotResultGlow {
            0%,
            100% {
                box-shadow: 0 0 18px rgba(255, 140, 66, 0.3);
            }
            50% {
                box-shadow: 0 0 45px rgba(255, 200, 50, 0.7);
            }
        }

        /* ── STATS ROW ──────────────────── */
        .stats-row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.4rem 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 0.35rem 0.6rem;
            border-radius: var(--radius-sm);
            flex: 1;
            text-align: center;
            min-width: 55px;
            font-size: 0.65rem;
            letter-spacing: -0.2px;
            border: 1px solid rgba(245, 176, 66, 0.08);
        }
        .stat-card strong {
            display: block;
            font-size: 0.82rem;
            color: var(--gold);
            margin-top: 2px;
        }
        .session-reset {
            font-size: 0.6rem;
            background: none;
            border: 1px solid rgba(245, 176, 66, 0.2);
            color: #8a8278;
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .session-reset:hover {
            background: rgba(255, 82, 82, 0.12);
            color: #ff5252;
        }

        /* ── HISTORY MARQUEE ────────────── */
        .history-marquee {
            display: flex;
            gap: 0.3rem;
            overflow-x: auto;
            padding: 0.3rem 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .history-marquee::-webkit-scrollbar {
            height: 3px;
        }
        .history-marquee::-webkit-scrollbar-thumb {
            background: rgba(245, 176, 66, 0.2);
            border-radius: 3px;
        }
        .history-dot {
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.6rem;
            flex-shrink: 0;
        }
        .history-dot.win {
            background: rgba(76, 175, 80, 0.3);
            color: #a5d6a7;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }
        .history-dot.loss {
            background: rgba(255, 82, 82, 0.2);
            color: #ef9a9a;
            border: 1px solid rgba(255, 82, 82, 0.35);
        }
        .history-dot.jackpot {
            background: rgba(255, 140, 66, 0.35);
            color: #ffcc80;
            border: 1px solid rgba(255, 140, 66, 0.6);
        }

        /* ── AUTO-SPIN MODAL ────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9990;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-dialog {
            background: #1a1712;
            border: 1px solid var(--border-gold-strong);
            border-radius: var(--radius-xl);
            padding: 1.2rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        .modal-dialog h3 {
            color: var(--gold-bright);
            margin-bottom: 0.8rem;
        }
        .modal-input {
            background: #0f0d0b;
            border: 2px solid rgba(245, 176, 66, 0.3);
            border-radius: 25px;
            padding: 0.4rem 0.7rem;
            color: #fff;
            font-weight: 700;
            width: 80px;
            text-align: center;
            font-family: var(--font-mono);
        }
        .modal-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin: 0.5rem 0;
            flex-wrap: wrap;
        }
        .modal-row label {
            font-size: 0.75rem;
            color: #b8b2a6;
        }

        /* ── JACKPOT OVERLAY ────────────── */
        .jackpot-overlay {
            position: fixed;
            inset: 0;
            z-index: 9998;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .jackpot-overlay.active {
            opacity: 1;
            animation: jackpotScreen 1.8s ease-out;
        }
        @keyframes jackpotScreen {
            0% {
                background: rgba(255, 200, 50, 0.55);
            }
            100% {
                background: rgba(255, 200, 50, 0);
            }
        }
        .jackpot-text {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 60px rgba(255, 200, 50, 0.9), 0 0 120px rgba(255, 150, 0, 0.6);
            animation: jackpotTextPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes jackpotTextPop {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            60% {
                transform: scale(1.15);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ── PROVABLY FAIR ──────────────── */
