<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
<title>GOLD CRASH | Royal Crash Rocket</title>
<link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
  :root{
    --gold:#ffd966;--gold-bright:#ffed4e;--gold-deep:#f5b042;--gold-dark:#a05f15;
    --bg-deep:#080706;--bg-1:#0f0d0a;--bg-2:#161310;--bg-3:#1f1b17;
    --border-gold:rgba(255,217,102,0.18);--border-strong:rgba(255,217,102,0.55);
    --danger:#ff6b6b;--danger-deep:#c62828;--success:#4caf50;--success-deep:#1b5e20;
    --info:#4cc9f0;--violet:#b388ff;
    --text:#f5f0e6;--muted:#9a9484;--dim:#5a5448;
    --r-xl:1.6rem;--r-lg:1.1rem;--r-md:0.75rem;--r-full:999px;
    --t-fast:.15s ease;--t-med:.28s cubic-bezier(.2,.9,.2,1);
    --shadow-lg:0 30px 60px -20px rgba(0,0,0,0.8);
    --shadow-gold:0 0 40px rgba(255,217,102,0.15);
  }
  html,body{height:100%}
  body{
    font-family:'Inter',sans-serif;background:radial-gradient(ellipse at 20% 0%,#1a150e 0%,#050403 55%,#000 100%);
    color:var(--text);min-height:100vh;overflow-x:hidden;position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(600px 400px at 80% 10%,rgba(255,217,102,0.06),transparent 60%),
      radial-gradient(800px 500px at 10% 90%,rgba(245,176,66,0.04),transparent 60%);
  }

  .bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .star{position:absolute;border-radius:50%;background:rgba(255,245,200,0.7);animation:twinkle 4s infinite alternate}
  @keyframes twinkle{0%{opacity:.1;transform:scale(.6)}100%{opacity:.9;transform:scale(1.1)}}

  .app{max-width:1240px;margin:0 auto;padding:12px 16px 32px;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}

  /* ============ TOPBAR ============ */
  .topbar{
    display:flex;align-items:center;gap:10px;padding:10px 14px;
    background:linear-gradient(180deg,rgba(24,20,16,.9),rgba(14,12,10,.85));
    border:1px solid var(--border-gold);border-radius:var(--r-full);
    backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;
    letter-spacing:.14em;color:var(--gold);
    background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    text-shadow:0 0 24px rgba(255,217,102,.25);
    padding:0 8px;white-space:nowrap;
  }
  .brand small{font-size:.55rem;letter-spacing:.3em;opacity:.7;display:block;-webkit-text-fill-color:var(--gold-deep)}
  .nav-btn{
    text-decoration:none;color:var(--gold);font-weight:600;font-size:.82rem;
    background:rgba(255,217,102,.07);padding:8px 14px;border-radius:var(--r-full);
    border:1px solid var(--border-gold);transition:all var(--t-fast);
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .nav-btn:hover{background:rgba(255,217,102,.16);transform:translateX(-2px)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:var(--r-full);
    background:rgba(0,0,0,.5);border:1px solid var(--border-gold);font-weight:700;font-size:.85rem;
  }
  .chip.balance{border-color:rgba(255,217,102,.6);color:var(--gold)}
  .chip.balance .val{font-variant-numeric:tabular-nums}
  .chip .lvl{font-size:.7rem;color:var(--muted);font-weight:600}
  .chip .xpbar{width:64px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
  .chip .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));width:0%;transition:width .4s}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--border-gold);
    background:rgba(255,217,102,.05);color:var(--gold);cursor:pointer;font-size:.95rem;
    display:grid;place-items:center;transition:all var(--t-fast);
  }
  .icon-btn:hover{background:rgba(255,217,102,.16);transform:scale(1.05)}
  .icon-btn:active{transform:scale(.94)}

  /* ============ MODE BAR ============ */
  .mode-bar{
    display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;
  }
  .mode-bar::-webkit-scrollbar{display:none}
  .mode-btn{
    flex:0 0 auto;padding:8px 16px;border-radius:var(--r-full);border:1px solid var(--border-gold);
    background:rgba(20,17,14,.7);color:var(--muted);font-weight:600;font-size:.78rem;cursor:pointer;
    transition:all var(--t-fast);display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .mode-btn i{font-size:.75rem}
  .mode-btn:hover{color:var(--gold);border-color:var(--border-strong)}
  .mode-btn.active{
    background:linear-gradient(135deg,rgba(255,217,102,.22),rgba(245,176,66,.12));
    color:var(--gold);border-color:var(--border-strong);
    box-shadow:0 0 20px rgba(255,217,102,.18),inset 0 0 12px rgba(255,217,102,.06);
  }

  /* ============ GRAPH ============ */
  .graph-section{
    position:relative;border-radius:var(--r-xl);overflow:hidden;
    background:linear-gradient(180deg,rgba(10,8,6,.9),rgba(5,4,3,.95));
    border:1px solid var(--border-gold);box-shadow:var(--shadow-lg),var(--shadow-gold);
    height:clamp(280px,44vh,560px);
  }
  #gameCanvas{width:100%;height:100%;display:block}
  .multiplier{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(2.4rem,6vw,4rem);letter-spacing:-.02em;
    color:var(--gold);text-shadow:0 0 30px rgba(255,217,102,.7),0 4px 12px rgba(0,0,0,.8);
    pointer-events:none;z-index:8;white-space:nowrap;
    transition:color .2s,text-shadow .2s;
    animation:multGlow 2s ease-in-out infinite alternate;
  }
  @keyframes multGlow{0%{filter:brightness(1)}100%{filter:brightness(1.15)}}
  .multiplier.pulse{animation:multPulse .5s ease}
  @keyframes multPulse{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}

  .countdown{
    position:absolute;inset:0;display:grid;place-items:center;z-index:15;pointer-events:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(4rem,14vw,9rem);color:var(--gold-bright);
    text-shadow:0 0 60px rgba(255,217,102,.9),0 8px 24px rgba(0,0,0,.9);
    opacity:0;transition:opacity .25s;
  }
  .countdown.show{opacity:1}
  .countdown span{display:inline-block;animation:cdPop .9s ease-out}
  @keyframes cdPop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}

  .crash-overlay{
    position:absolute;inset:0;display:grid;place-items:center;z-index:14;pointer-events:none;
    background:radial-gradient(circle at center,rgba(255,80,80,.35),transparent 60%);
    opacity:0;transition:opacity .15s;
  }
  .crash-overlay.show{opacity:1}
  .crash-overlay .label{
    font-family:'Space Grotesk',sans-serif;font-weight:700;
    font-size:clamp(2rem,5vw,3.5rem);color:#ff7a7a;letter-spacing:.1em;
    text-shadow:0 0 40px rgba(255,80,80,.9),0 6px 20px rgba(0,0,0,.9);
    animation:crashShake .5s ease;
  }
  @keyframes crashShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  .shake{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  .graph-tag{
    position:absolute;bottom:12px;left:16px;z-index:6;display:flex;gap:8px;
    font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.08em;
    pointer-events:none;
  }
  .graph-tag span{
    background:rgba(0,0,0,.5);padding:3px 10px;border-radius:var(--r-full);
    border:1px solid rgba(255,217,102,.15);
  }

  /* ============ BET SECTION ============ */
  .bet-section{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.bet-section{grid-template-columns:1fr}}
  .slot{
    background:linear-gradient(180deg,rgba(28,24,19,.9),rgba(14,12,10,.9));
    border:1px solid var(--border-gold);border-radius:var(--r-lg);
    padding:14px;display:flex;flex-direction:column;gap:10px;
    transition:border-color var(--t-med),box-shadow var(--t-med);
  }
  .slot.active{border-color:rgba(76,175,80,.6);box-shadow:0 0 30px rgba(76,175,80,.15)}
  .slot.cashed{border-color:rgba(76,175,80,.6);box-shadow:0 0 30px rgba(76,175,80,.25)}
  .slot.lost{border-color:rgba(255,107,107,.5)}
  .slot.queued{border-color:var(--border-strong);box-shadow:0 0 24px rgba(255,217,102,.15)}
  .slot-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .slot-title{font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
  .slot-title b{color:var(--gold)}
  .slot-status{font-size:.68rem;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:var(--r-full);background:rgba(0,0,0,.4);color:var(--muted)}
  .slot-status.queued{color:var(--gold);background:rgba(255,217,102,.12)}
  .slot-status.active{color:#8aff8a;background:rgba(76,175,80,.15)}
  .slot-status.cashed{color:#8aff8a;background:rgba(76,175,80,.2)}
  .slot-status.lost{color:#ff9a9a;background:rgba(255,107,107,.15)}

  .amount-row{display:flex;gap:8px;align-items:center}
  .amount-input{
    flex:1;min-width:0;background:#0d0b08;border:2px solid rgba(255,217,102,.18);
    border-radius:var(--r-md);padding:10px 12px;color:var(--gold);
    font-weight:800;font-size:1.05rem;text-align:center;outline:none;
    font-family:'Space Grotesk',sans-serif;
    transition:border-color var(--t-fast),box-shadow var(--t-fast);
  }
  .amount-input:focus{border-color:var(--border-strong);box-shadow:0 0 0 3px rgba(255,217,102,.08)}
  .amount-input.invalid{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(255,107,107,.12)}
  .amount-input:disabled{opacity:.5}

  .pct-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .pct-btn{
    background:rgba(255,217,102,.06);border:1px solid rgba(255,217,102,.18);
    border-radius:8px;padding:6px 2px;color:var(--gold);font-weight:700;font-size:.72rem;
    cursor:pointer;transition:all var(--t-fast);
  }
  .pct-btn:hover{background:rgba(255,217,102,.16);transform:translateY(-1px)}
  .pct-btn:active{transform:scale(.94)}
  .pct-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .auto-row{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);flex-wrap:wrap}
  .auto-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
  .auto-row input[type=checkbox]{
    appearance:none;width:32px;height:18px;background:rgba(255,255,255,.08);
    border-radius:var(--r-full);position:relative;cursor:pointer;transition:background var(--t-fast);
  }
  .auto-row input[type=checkbox]::after{
    content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:var(--muted);transition:all var(--t-fast);
  }
  .auto-row input[type=checkbox]:checked{background:rgba(255,217,102,.35)}
  .auto-row input[type=checkbox]:checked::after{left:16px;background:var(--gold)}
  .auto-input{
    width:62px;background:#0d0b08;border:1.5px solid rgba(255,217,102,.2);
    border-radius:8px;padding:5px 6px;color:var(--gold);font-weight:700;font-size:.8rem;
    text-align:center;outline:none;font-family:'Space Grotesk',sans-serif;
  }
  .auto-input:focus{border-color:var(--border-strong)}

  .slot-action{
    width:100%;border:none;border-radius:var(--r-md);padding:14px;
    font-weight:800;font-size:.92rem;letter-spacing:.1em;cursor:pointer;
    transition:all var(--t-fast);text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:8px;
    position:relative;overflow:hidden;
  }
  .slot-action.place{background:linear-gradient(135deg,var(--gold-deep),var(--gold));color:#1a150e;box-shadow:0 4px 0 var(--gold-dark)}
  .slot-action.place:hover{filter:brightness(1.08)}
  .slot-action.place:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark)}
  .slot-action.cancel{background:rgba(255,107,107,.16);color:#ff9a9a;border:1px solid rgba(255,107,107,.4)}
  .slot-action.cashout{background:linear-gradient(135deg,#2e7d32,#4caf50);color:#fff;box-shadow:0 4px 0 var(--success-deep);animation:cashPulse 1.2s ease-in-out infinite}
  .slot-action.cashout .mult{font-family:'Space Grotesk',sans-serif}
  @keyframes cashPulse{0%,100%{box-shadow:0 4px 0 var(--success-deep),0 0 0 0 rgba(76,175,80,.4)}50%{box-shadow:0 4px 0 var(--success-deep),0 0 20px 6px rgba(76,175,80,.15)}}
  .slot-action:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none;animation:none}
  .slot-action.cashed-out{background:rgba(76,175,80,.2);color:#8aff8a;border:1px solid rgba(76,175,80,.5);cursor:default}
  .slot-action.lost-out{background:rgba(255,107,107,.12);color:#ff9a9a;border:1px solid rgba(255,107,107,.3);cursor:default}

  .slot-result{
    font-size:.78rem;font-weight:700;text-align:center;color:var(--muted);
    min-height:1.1em;font-variant-numeric:tabular-nums;
  }
  .slot-result.win{color:#8aff8a}
  .slot-result.loss{color:#ff9a9a}

  /* ============ PANEL ============ */
  .panel-section{
    background:linear-gradient(180deg,rgba(20,17,13,.85),rgba(10,8,6,.9));
    border:1px solid var(--border-gold);border-radius:var(--r-lg);overflow:hidden;
  }
  .tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border-gold);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:12px 18px;background:none;border:none;color:var(--muted);
    font-weight:600;font-size:.82rem;cursor:pointer;border-bottom:2px solid transparent;
    transition:all var(--t-fast);display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .tab:hover{color:var(--gold)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(255,217,102,.04)}
  .tab-body{padding:16px}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat-card{
    background:rgba(0,0,0,.4);border:1px solid rgba(255,217,102,.1);
    border-radius:var(--r-md);padding:12px;text-align:center;
  }
  .stat-card .label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:4px}
  .stat-card .value{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.25rem;color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .stat-card .value.pos{color:#8aff8a}
  .stat-card .value.neg{color:#ff9a9a}
  .stat-sub{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);padding:6px 2px;border-bottom:1px dashed rgba(255,255,255,.05)}
  .stat-sub:last-child{border-bottom:none}
  .stat-sub b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}

  .history-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
  .history-row{
    display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
    padding:8px 10px;background:rgba(0,0,0,.3);border-radius:8px;font-size:.8rem;
    border-left:3px solid transparent;cursor:pointer;transition:background var(--t-fast);
  }
  .history-row:hover{background:rgba(0,0,0,.5)}
  .history-row.win{border-left-color:var(--success)}
  .history-row.loss{border-left-color:var(--danger)}
  .history-row .mult-badge{
    padding:2px 10px;border-radius:var(--r-full);font-weight:800;font-size:.78rem;
    font-variant-numeric:tabular-nums;min-width:66px;text-align:center;
  }
  .history-row .mult-badge.tier-low{background:rgba(255,107,107,.18);color:#ff9a9a}
  .history-row .mult-badge.tier-mid{background:rgba(245,176,66,.18);color:var(--gold)}
  .history-row .mult-badge.tier-high{background:rgba(76,175,80,.2);color:#8aff8a}
  .history-row .mult-badge.tier-mega{background:linear-gradient(135deg,var(--violet),var(--info));color:#fff;text-shadow:0 0 12px rgba(179,136,255,.6)}
  .history-row .date{color:var(--muted);font-size:.7rem}
  .history-row .pnl{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:70px}
  .history-row .pnl.pos{color:#8aff8a}
  .history-row .pnl.neg{color:#ff9a9a}
  .history-row .mode-tag{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

  .recent-strip{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .recent-badge{
    padding:4px 10px;border-radius:var(--r-full);font-size:.75rem;font-weight:700;
    font-variant-numeric:tabular-nums;border:1px solid transparent;
  }
  .recent-badge.tier-low{background:rgba(255,107,107,.14);color:#ff9a9a;border-color:rgba(255,107,107,.3)}
  .recent-badge.tier-mid{background:rgba(245,176,66,.14);color:var(--gold);border-color:rgba(245,176,66,.3)}
  .recent-badge.tier-high{background:rgba(76,175,80,.16);color:#8aff8a;border-color:rgba(76,175,80,.35)}
  .recent-badge.tier-mega{background:linear-gradient(135deg,rgba(179,136,255,.3),rgba(76,201,240,.25));color:#fff;border-color:rgba(179,136,255,.5);text-shadow:0 0 10px rgba(179,136,255,.5)}

  .achievements-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .ach-card{
    background:rgba(0,0,0,.35);border:1px solid rgba(255,217,102,.12);
    border-radius:var(--r-md);padding:12px;display:flex;gap:10px;align-items:flex-start;
    opacity:.5;transition:all var(--t-med);
  }
  .ach-card.unlocked{opacity:1;border-color:var(--border-strong);background:linear-gradient(135deg,rgba(255,217,102,.08),rgba(245,176,66,.04))}
  .ach-icon{
    width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
    background:rgba(255,217,102,.12);color:var(--gold);font-size:.9rem;flex-shrink:0;
  }
  .ach-card.unlocked .ach-icon{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a150e}
  .ach-name{font-weight:700;font-size:.82rem;color:var(--text)}
  .ach-desc{font-size:.7rem;color:var(--muted);margin-top:2px;line-height:1.3}

  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);gap:12px}
  .settings-row:last-child{border-bottom:none}
  .settings-row .lbl{font-size:.85rem;font-weight:600}
  .settings-row .lbl small{display:block;color:var(--muted);font-size:.7rem;font-weight:400;margin-top:2px}
  .settings-input{
    width:100px;background:#0d0b08;border:1.5px solid rgba(255,217,102,.2);
    border-radius:8px;padding:7px 10px;color:var(--gold);font-weight:700;font-size:.85rem;
    text-align:center;outline:none;font-family:'Space Grotesk',sans-serif;
  }
  .settings-input:focus{border-color:var(--border-strong)}

  .skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .skin-card{
    background:rgba(0,0,0,.35);border:1px solid rgba(255,217,102,.15);
    border-radius:var(--r-md);padding:10px 8px;text-align:center;cursor:pointer;
    transition:all var(--t-fast);font-size:.72rem;font-weight:600;color:var(--muted);
  }
  .skin-card:hover{border-color:var(--border-strong);color:var(--gold)}
  .skin-card.owned{opacity:1;color:var(--text)}
  .skin-card.equipped{border-color:var(--gold);background:rgba(255,217,102,.1);color:var(--gold);box-shadow:0 0 20px rgba(255,217,102,.15)}
  .skin-card.locked{opacity:.4;cursor:not-allowed}
  .skin-preview{

/* ============================================================

   ============================================================ */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const fmt = n => Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const fmtX = n => Number(n).toFixed(2)+'x';

function safeJSON(str, fb={}){ try{ const v = JSON.parse(str); return v==null?fb:v; }catch(e){ return fb; } }
function safeFloat(v, fb=0){ const n = parseFloat(v); return isNaN(n)?fb:n; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dateSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
function tierFor(mult){ if(mult>=10) return 'mega'; if(mult>=3) return 'high'; if(mult>=1.5) return 'mid'; return 'low'; }
function levelFromXp(xp){ return 1 + Math.floor(Math.sqrt(Math.max(0,xp)/500)); }
function xpForLevel(l){ return 500 * (l-1) * (l-1); }

/* ============================================================
   STATE
   ============================================================ */
const state = {
  user: null,
  mode: 'classic',
  phase: 'idle',            // idle | countdown | running | crashed
  roundId: 0,
  startTime: 0,
  currentMult: 1,
  crashPoint: 2,
  crashTime: 0,
  displayMaxMult: 4,
  targetMaxMult: 4,
  autoCashWarned: false,
  slots: [createSlot(), createSlot()],
  particles: [],
  rocketAngle: 0,
  session: {
    rounds:0, wins:0, losses:0, wagered:0, won:0, net:0,
    bestMult:0, biggestWin:0, streak:0, bestStreak:0,
    sumCrash:0, crashCount:0,
  },
  history: [],              // {mult, bet, win, slot, mode, date}
  countdownTimer: null,
  rafId: null,
  confettiId: null,
  audio: null,
  soundEnabled: true,
  reducedMotion: false,
  autoLaunchTimer: null,
  lastTick: 0,
  tickSecond: 0,
};

function createSlot(){
  return {
    id: 0,
    amount: 25,
    autoCashEnabled: true,
    autoCashTarget: 2.0,
    autoRebet: false,
    status: 'idle',        // idle | queued | active | cashed | lost
    bet: 0,
    cashedAt: 0,
    win: 0,
  };
}

const dom = {};
function cacheDom(){
  [
    'gameCanvas','graphSection','multiplierDisplay','countdownDisplay','countdownNum',
    'crashOverlay','modeTag','roundTag','slot0','slot1','tabs','tabBody','headerBalance',
    'levelNum','xpFill','soundToggle','fullscreenBtn','menuBtn','modeBar','confettiCanvas',
    'bgParticles','toastStack','levelChip'
  ].forEach(k=>{ dom[k]=$(k); });
  dom.ctx = dom.gameCanvas.getContext('2d');
  dom.confettiCtx = dom.confettiCanvas.getContext('2d');
}

/* ============================================================
   AUDIO
   ============================================================ */
function initAudio(){
  if(state.audio || !state.soundEnabled) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    state.audio = new AC();
    state.masterGain = state.audio.createGain();
    state.masterGain.gain.value = 0.5;
    state.masterGain.connect(state.audio.destination);
  }catch(e){ /* ignore */ }
}
function resumeAudio(){
  if(state.audio && state.audio.state === 'suspended') state.audio.resume().catch(()=>{});
}
function tone(freq, dur, type, vol, endFreq){
  if(!state.soundEnabled || !state.audio || !state.masterGain) return;
  try{
    const t = state.audio.currentTime;
    const osc = state.audio.createOscillator();
    const g = state.audio.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if(endFreq != null) osc.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq), t+dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(state.masterGain);
    osc.start(t); osc.stop(t+dur+0.02);
  }catch(e){ /* ignore */ }
}
const SFX = {
  countdown: ()=>tone(700,0.14,'sine',0.1),
  go:        ()=>tone(1100,0.2,'triangle',0.14),
  launch:    ()=>{ tone(500,0.4,'triangle',0.14,1400); setTimeout(()=>tone(180,0.5,'sawtooth',0.06,60),80); },
  cashout:   ()=>{ tone(880,0.12,'sine',0.16,1700); setTimeout(()=>tone(1320,0.18,'sine',0.12,1980),90); },
  crash:     ()=>{ tone(300,0.5,'sawtooth',0.18,50); setTimeout(()=>tone(120,0.5,'sawtooth',0.1,40),50); },
  tick:      ()=>tone(1200,0.05,'sine',0.04),
  click:     ()=>tone(600,0.05,'sine',0.06),
  win:       ()=>{ tone(660,0.1,'sine',0.14,880); setTimeout(()=>tone(880,0.14,'sine',0.14,1100),80); setTimeout(()=>tone(1320,0.2,'sine',0.14,1760),180); },
  levelUp:   ()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.14),i*90)); },
  milestone: ()=>{ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'sine',0.12),i*70)); },
};

/* ============================================================
   CONFETTI
   ============================================================ */
function spawnConfetti(){
  if(state.reducedMotion) return;
  const canvas = dom.confettiCanvas;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = dom.confettiCtx;
  const parts = [];
  const colors = ['#ffd966','#ffb347','#ffed4e','#4caf50','#ffaa33','#ffffff','#b388ff','#4cc9f0'];
  for(let i=0;i<120;i++){
    parts.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*60,
      size: Math.random()*7+3,
      vy: Math.random()*5+4,
      vx: (Math.random()-0.5)*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      rotV: (Math.random()-0.5)*14,
    });
  }
  const start = now();
  function draw(t){
    if(t-start>2600){ ctx.clearRect(0,0,canvas.width,canvas.height); state.confettiId=null; return; }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      p.y += p.vy; p.x += p.vx; p.rot += p.rotV;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size/1.5);
      ctx.restore();
    });
    state.confettiId = requestAnimationFrame(draw);
  }
  if(state.confettiId) cancelAnimationFrame(state.confettiId);
  state.confettiId = requestAnimationFrame(draw);
}

function toast(msg, icon){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i class="fas ${icon||'fa-info-circle'}"></i> ${msg}`;
  dom.toastStack.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

/* ============================================================
   CANVAS / RENDER
   ============================================================ */
let dpr = Math.max(1, window.devicePixelRatio || 1);
const canvasState = { w:0, h:0, pad:{l:0,r:0,t:0,b:0} };

function resizeCanvas(){
  const rect = dom.graphSection.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  if(w<10||h<10) return;
  dpr = Math.max(1, window.devicePixelRatio || 1);
  dom.gameCanvas.width = Math.round(w*dpr);
  dom.gameCanvas.height = Math.round(h*dpr);
  dom.gameCanvas.style.width = w+'px';
  dom.gameCanvas.style.height = h+'px';
  dom.ctx.setTransform(1,0,0,1,0,0);
  dom.ctx.scale(dpr,dpr);
  canvasState.w = w;
  canvasState.h = h;
  canvasState.pad = { l:56, r:28, t:70, b:38 };
  render();
}

function multFromTime(sec, mode){
  const m = MODES[mode] || MODES.classic;
  return 1 + Math.pow(sec * m.k, m.pow);
}
function timeFromMult(mult, mode){
  if(mult<=1) return 0;
  const m = MODES[mode] || MODES.classic;
  return Math.pow(mult-1, 1/m.pow) / m.k;
}

function curveXY(t, m, maxMult, mode){
  const {w,h,pad} = canvasState;
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  const maxTime = Math.max(0.001, timeFromMult(Math.max(maxMult,1.01), mode));
  const x = pad.l + (t/maxTime)*plotW;
  const y = pad.t + plotH - ((m-1)/(maxMult-1))*plotH;
  return [x,y];
}

function drawGrid(ctx, w, h, pad, maxMult){
  // vertical fine grid
  ctx.strokeStyle = 'rgba(255,240,180,0.04)';
  ctx.lineWidth = 1;
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;
  for(let i=0;i<=10;i++){
    const x = pad.l + (i/10)*plotW;
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h-pad.b); ctx.stroke();
  }
  // horizontal grid + labels
  const steps = 5;
  const topMult = maxMult;
  for(let i=0;i<=steps;i++){
    const mult = 1 + (topMult-1) * (i/steps);
    const y = pad.t + plotH - (i/steps)*plotH;
    ctx.strokeStyle = i===0 ? 'rgba(255,240,180,0.15)' : 'rgba(255,240,180,0.07)';
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w-pad.r, y); ctx.stroke();
    ctx.fillStyle = '#8a8470';
    ctx.font = '600 11px Inter, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(mult.toFixed(mult<10?1:0)+'x', pad.l-10, y);
  }
}

function drawCurve(ctx){
  const {w,h,pad} = canvasState;
  const mode = state.mode;
  const isRunning = state.phase === 'running';
  const maxMult = Math.max(1.05, state.displayMaxMult);

  if(state.phase === 'idle'){
    return;
  }

  // Collect points based on phase
  let uptoMult, uptoTime;
  if(isRunning){
    uptoMult = state.currentMult;
    uptoTime = (now() - state.startTime)/1000;
  } else {
    uptoMult = state.crashPoint;
    uptoTime = state.crashTime;
  }
  if(uptoMult <= 1.0001) return;

  const N = 160;
  const maxTime = uptoTime;
  const pts = [];
  for(let i=0;i<=N;i++){
    const t = (i/N)*maxTime;
    const m = multFromTime(t, mode);
    const [x,y] = curveXY(t, m, maxMult, mode);
    pts.push([x,y,m]);
  }

  // Glow trail
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const skinColor = getSkin().color;

  if(!state.reducedMotion){
    ctx.shadowBlur = 22;
    ctx.shadowColor = isRunning ? skinColor : '#ff5555';
    ctx.strokeStyle = isRunning ? 'rgba(255,217,102,0.22)' : 'rgba(255,90,90,0.18)';
    ctx.lineWidth = 12;
    ctx.beginPath();
    pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Main curve gradient
  const grad = ctx.createLinearGradient(pad.l, h-pad.b, w-pad.r, pad.t);
  if(isRunning){
    grad.addColorStop(0, '#4caf50');
    grad.addColorStop(0.5, '#ffd966');
    grad.addColorStop(1, '#ffed4e');
  } else {
    grad.addColorStop(0, '#8a2828');
    grad.addColorStop(1, '#ff6b6b');
  }
  ctx.strokeStyle = grad;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.stroke();

  // Area fill under curve
  const last = pts[pts.length-1];
  const grad2 = ctx.createLinearGradient(0, pad.t, 0, h-pad.b);
  if(isRunning){
    grad2.addColorStop(0, 'rgba(255,217,102,0.18)');
    grad2.addColorStop(1, 'rgba(255,217,102,0.0)');
  } else {
    grad2.addColorStop(0, 'rgba(255,107,107,0.14)');
    grad2.addColorStop(1, 'rgba(255,107,107,0.0)');
  }
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], h-pad.b);
  pts.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(last[0], h-pad.b);
  ctx.closePath();
  ctx.fill();

  // Crash line if ended
  if(state.phase === 'crashed'){
    const cy = last[1];
    ctx.save();
    ctx.setLineDash([8,6]);
    ctx.strokeStyle = 'rgba(255,80,80,0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad.l, cy); ctx.lineTo(w-pad.r, cy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#ff9a9a';
    ctx.font = '700 11px Inter, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('CRASH ' + state.crashPoint.toFixed(2) + 'x', w-pad.r, cy-6);
  }

  // Rocket at tip
  if(isRunning || state.phase === 'countdown'){
    if(state.phase === 'running'){
      // tangent angle
      const p2 = pts[Math.max(0, pts.length-3)];
      const p1 = last;
      const ang = Math.atan2(p1[1]-p2[1], p1[0]-p2[0]);
      state.rocketAngle = ang;
      drawRocket(ctx, last[0], last[1], ang, getSkin());
    }
  }
  ctx.restore();
}

function drawRocket(ctx, x, y, angle, skin){
  const t = now()/1000;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  const scale = 1.0;

  // Flame
  const flick = 0.75 + Math.sin(t*32)*0.25;
  const flameLen = 22 * flick;
  const fg = ctx.createLinearGradient(-8,0,-8-flameLen,0);
  fg.addColorStop(0,'rgba(255,255,220,1)');
  fg.addColorStop(0.25, skin.flame);
  fg.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-8,-5);
  ctx.quadraticCurveTo(-14-flameLen*0.4,-3,-8-flameLen,0);
  ctx.quadraticCurveTo(-14-flameLen*0.4,3,-8,5);
  ctx.closePath();
  ctx.fill();

  // glow
  if(!state.reducedMotion){
    ctx.shadowBlur = 22;
    ctx.shadowColor = skin.color;
  }

  // Body
  ctx.fillStyle = skin.color;
  ctx.beginPath();
  ctx.moveTo(16,0);
  ctx.quadraticCurveTo(9,-6,-6,-5);
  ctx.lineTo(-6,5);
  ctx.quadraticCurveTo(9,6,16,0);
  ctx.closePath();
  ctx.fill();

  // Nose highlight
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.moveTo(14,0);
  ctx.quadraticCurveTo(7,-2.5,0,-1);
  ctx.lineTo(0,1);
  ctx.quadraticCurveTo(7,2.5,14,0);
  ctx.closePath();
  ctx.fill();

  // Fins
  ctx.shadowBlur = 0;
  ctx.fillStyle = skin.flame;
  ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(-11,-10); ctx.lineTo(-6,-3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4,5);  ctx.lineTo(-11,10);  ctx.lineTo(-6,3);  ctx.closePath(); ctx.fill();

  // Window
  ctx.fillStyle = '#4cc9f0';
  ctx.beginPath(); ctx.arc(4,0,2.6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  ctx.restore();

  // Exhaust particles
  if(!state.reducedMotion){
    const cx = x - Math.cos(angle)*20;
    const cy = y - Math.sin(angle)*20;
    spawnExhaust(cx, cy, angle, skin);
  }
}

function spawnExhaust(x, y, angle, skin){
  if(state.particles.length > 220) return;
  // smoke
  if(Math.random()<0.7){
    state.particles.push({
      type:'smoke',
      x: x + (Math.random()-0.5)*6,
      y: y + (Math.random()-0.5)*6,
      vx: -Math.cos(angle)*(30+Math.random()*40) + (Math.random()-0.5)*25,
      vy: -Math.sin(angle)*(30+Math.random()*40) + (Math.random()-0.5)*25 + 18,
      life:1, maxLife:1.1+Math.random()*0.4,
      size: 5+Math.random()*6,
      color: '200,200,200',
    });
  }
  // spark
  if(Math.random()<0.5){
    state.particles.push({
      type:'spark',
      x, y,
      vx: -Math.cos(angle)*(70+Math.random()*80) + (Math.random()-0.5)*50,
      vy: -Math.sin(angle)*(70+Math.random()*80) + (Math.random()-0.5)*50,
      life:1, maxLife:0.6+Math.random()*0.4,
      size: 1.5+Math.random()*2,
      color: skin.flame,
    });
  }
}

function updateParticles(dt){
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.life -= dt / p.maxLife;
    if(p.life <= 0){ state.particles.splice(i,1); continue; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    if(p.type === 'smoke'){
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.size += dt * 22;
    }
  }
}

function drawParticles(ctx){
  ctx.save();
  for(const p of state.particles){
    const a = clamp(p.life,0,1);
    if(p.type === 'smoke'){
      ctx.fillStyle = `rgba(${p.color},${a*0.35})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      if(!state.reducedMotion){ ctx.shadowBlur = 8; ctx.shadowColor = p.color; }
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

function render(){
  const ctx = dom.ctx;
  const w = canvasState.w, h = canvasState.h;
  if(w<10||h<10) return;
  ctx.clearRect(0,0,w,h);

  const pad = canvasState.pad;
  const maxMult = Math.max(1.05, state.displayMaxMult);

  // subtle top glow
  const bgGrad = ctx.createLinearGradient(0,0,0,h);
  bgGrad.addColorStop(0,'rgba(30,24,16,0.6)');
  bgGrad.addColorStop(1,'rgba(5,4,3,0.0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,w,h);

  drawGrid(ctx, w, h, pad, maxMult);
  drawParticles(ctx);
  drawCurve(ctx);

  // Axis labels
  ctx.fillStyle = '#6a6458';
  ctx.font = '600 10px Inter, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('MULTIPLIER OVER TIME', w/2, h-22);
}

/* ============================================================
   GAME LOOP
   ============================================================ */
function startLoop(){
  if(state.rafId) return;
  state.lastTick = now();
  state.tickSecond = 0;
  const loop = (t)=>{
    if(state.phase !== 'running'){ state.rafId = null; return; }
    const dt = Math.min(0.05, (t - state.lastTick)/1000);
    state.lastTick = t;

    const elapsed = (t - state.startTime)/1000;
    const mult = multFromTime(elapsed, state.mode);

    // tick sound each second
    if(Math.floor(elapsed) > state.tickSecond){
      state.tickSecond = Math.floor(elapsed);
      SFX.tick();
    }

    if(mult >= state.crashPoint){
      state.crashPoint = mult;
      state.crashTime = elapsed;
      endRoundCrash();
      return;
    }

    state.currentMult = mult;
    updateParticles(dt);

    // smooth display scaling
    const target = Math.max(3.0, mult * 1.15);
    if(target > state.targetMaxMult) state.targetMaxMult = target;
    state.displayMaxMult = lerp(state.displayMaxMult, state.targetMaxMult, 0.08);
    if(state.displayMaxMult < 1.05) state.displayMaxMult = 1.05;

    // Auto cashout checks
    for(const s of state.slots){
      if(s.status === 'active' && s.autoCashEnabled && s.autoCashTarget > 1.005 && mult >= s.autoCashTarget){
        cashoutSlot(s.id, true);
      }
    }

    // Milestone flash
    checkMilestone(mult);

    updateMultiplierUI(mult);
    render();
    state.rafId = requestAnimationFrame(loop);
  };
  state.rafId = requestAnimationFrame(loop);
}

let lastMilestone = 0;
function checkMilestone(mult){
  const marks = [2,3,5,10,20,50,100];
  for(const m of marks){
    if(mult >= m && lastMilestone < m){
      lastMilestone = m;
      SFX.milestone();
      dom.multiplierDisplay.classList.add('pulse');
      setTimeout(()=>dom.multiplierDisplay.classList.remove('pulse'), 500);
      break;
    }
  }
}

function updateMultiplierUI(mult){
  const el = dom.multiplierDisplay;
  el.textContent = fmtX(mult);
  const t = clamp((mult-1) / Math.max(0.5, (state.crashPoint-1)), 0, 1);
  const r = Math.min(255, Math.floor(120 + t*135));
  const g = Math.max(0, Math.floor(255 - t*180));
  const color = `rgb(${r},${g},80)`;
  el.style.color = color;
  el.style.textShadow = `0 0 30px ${color}, 0 4px 12px rgba(0,0,0,.8)`;
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function generateCrashPoint(modeKey){
  const m = MODES[modeKey] || MODES.classic;
  const u = Math.random();
  // distribution adjusted by house edge
  const he = m.houseEdge;
  if(u < 0.55 * he){
    return 1 + Math.random() * 1.0;
  } else if(u < 0.85 * he){
    return 2 + Math.random() * 3;
  } else if(u < 0.97 * he){
    return 5 + Math.random() * 10;
  } else {
    return 15 + Math.random() * (m.maxCrash - 15);
  }
}

function attemptPlaceBet(slotIdx){
  const s = state.slots[slotIdx];
  if(!s) return;
  if(state.phase !== 'idle') {
    // allow during countdown if slot is idle
    if(state.phase !== 'countdown' || s.status !== 'idle') return;
  }

  const amount = Math.floor(safeFloat(s.amountEl?.value ?? s.amount, 0) * 100) / 100;
  const mode = MODES[state.mode];
  if(amount < mode.minBet){
    toast(`Minimum bet is ${mode.minBet} for ${mode.name}`, 'fa-exclamation-triangle');
    flashInvalid(s);
    return;
  }
  if(amount > state.user.balance){
    toast('Insufficient balance', 'fa-ban');
    flashInvalid(s);
    return;
  }
  s.bet = amount;
  s.status = 'queued';
  s.win = 0; s.cashedAt = 0;
  updateSlotUI(slotIdx);
  SFX.click();

  if(state.phase === 'idle'){
    startCountdown();
  }
}

function flashInvalid(slot){
  if(!slot.amountEl) return;
  slot.amountEl.classList.add('invalid');
  setTimeout(()=>slot.amountEl.classList.remove('invalid'), 800);
}

function cancelBet(slotIdx){
  const s = state.slots[slotIdx];
  if(!s || s.status !== 'queued') return;
  s.status = 'idle';
  s.bet = 0;
  updateSlotUI(slotIdx);
  SFX.click();
  // If both slots are idle and we're in countdown, cancel countdown
  if(state.phase === 'countdown' && state.slots.every(x=>x.status !== 'queued')){
    cancelCountdown();
  }
}

function startCountdown(){
  if(state.phase !== 'idle') return;
  state.phase = 'countdown';
  state.countdownStart = now();
  state.countdownValue = 3;
  dom.countdownDisplay.classList.add('show');
  dom.countdownNum.textContent = '3';
  dom.countdownNum.style.animation = 'none';
  void dom.countdownNum.offsetWidth;
  dom.countdownNum.style.animation = '';
  SFX.countdown();
  updateAllSlotUI();

  const tickFn = ()=>{
    const elapsed = (now() - state.countdownStart)/1000;
    const remaining = 3 - elapsed;
    if(remaining <= 0){
      dom.countdownDisplay.classList.remove('show');
      launchRound();
      return;
    }
    const v = Math.ceil(remaining);
    if(v !== state.countdownValue && v > 0){
      state.countdownValue = v;
      dom.countdownNum.textContent = String(v);
      dom.countdownNum.style.animation = 'none';
      void dom.countdownNum.offsetWidth;
      dom.countdownNum.style.animation = '';
      SFX.countdown();
    }
    state.countdownTimer = requestAnimationFrame(tickFn);
  };
  state.countdownTimer = requestAnimationFrame(tickFn);
}

function cancelCountdown(){
  if(state.countdownTimer) cancelAnimationFrame(state.countdownTimer);
  state.countdownTimer = null;
  state.phase = 'idle';
  dom.countdownDisplay.classList.remove('show');
  updateAllSlotUI();
}

function launchRound(){
  if(state.countdownTimer){ cancelAnimationFrame(state.countdownTimer); state.countdownTimer = null; }

  // validate queued slots
  const mode = MODES[state.mode];
  let totalBet = 0;
  const activeIdx = [];
  for(const s of state.slots){
    if(s.status === 'queued'){
      if(s.bet >= mode.minBet && s.bet <= state.user.balance - totalBet){
        s.status = 'active';
        totalBet += s.bet;
        activeIdx.push(s.id);
      } else {
        s.status = 'idle';
        s.bet = 0;
      }
    }
  }
  if(activeIdx.length === 0){
    state.phase = 'idle';
    updateAllSlotUI();
    return;
  }

  // Deduct balance
  state.user.balance -= totalBet;
  saveUser();
  updateBalanceUI();

  state.roundId++;
  state.crashPoint = generateCrashPoint(state.mode);
  state.crashTime = timeFromMult(state.crashPoint, state.mode);
  state.currentMult = 1;
  state.startTime = now();
  state.phase = 'running';
  state.displayMaxMult = 3;
  state.targetMaxMult = 3;
  state.particles.length = 0;
  state.rocketAngle = 0;
  lastMilestone = 0;

  dom.crashOverlay.classList.remove('show');
  dom.roundTag.textContent = 'ROUND #' + state.roundId;
  SFX.launch();
  updateAllSlotUI();
  startLoop();
}

function cashoutSlot(slotIdx, silent){
  const s = state.slots[slotIdx];
  if(!s || s.status !== 'active') return;
  const mult = state.currentMult;
  const win = s.bet * mult;
  s.status = 'cashed';
  s.cashedAt = mult;
  s.win = win;
  state.user.balance += win;
  saveUser();
  updateBalanceUI();

  // Session stats
  state.session.wins++;
  state.session.won += win;
  state.session.net += (win - s.bet);
  if(mult > state.session.bestMult) state.session.bestMult = mult;
  if(win > state.session.biggestWin) state.session.biggestWin = win;
  state.session.streak++;
  if(state.session.streak > state.session.bestStreak) state.session.bestStreak = state.session.streak;

  recordHistory({ mult, bet:s.bet, win, slot:slotIdx, mode:state.mode, date:Date.now() });

  if(!silent) SFX.cashout();
  spawnConfetti();
  SFX.win();

  updateSlotUI(slotIdx);
  toast(`Slot ${slotIdx+1}: Cashed out ${fmtX(mult)} for ${fmt(win)}`, 'fa-hand-holding-usd');
  recordRoundInUser({ win: true, bet:s.bet, win, mult, slot:slotIdx });
  updateBalanceUI();
  updateStatsUI();

  // If all active slots done, stop the round (player can relax)
  const anyActive = state.slots.some(x=>x.status === 'active');
  if(!anyActive){
    // Let the round continue for visual only — crash will end it normally
  }
}

function endRoundCrash(){
  state.phase = 'crashed';
  if(state.rafId){ cancelAnimationFrame(state.rafId); state.rafId = null; }
  if(state.countdownTimer){ cancelAnimationFrame(state.countdownTimer); state.countdownTimer = null; }

  SFX.crash();
  dom.crashOverlay.classList.add('show');
  dom.graphSection.classList.add('shake');
  setTimeout(()=>dom.graphSection.classList.remove('shake'), 500);
  dom.crashOverlay.querySelector('.label').textContent = 'CRASHED @ ' + fmtX(state.crashPoint);

  // Explosion particles
  const lastPts = (()=>{
    const {w,h,pad} = canvasState;
    const maxMult = state.displayMaxMult;
    const [x,y] = curveXY(state.crashTime, state.crashPoint, maxMult, state.mode);
    return {x,y};
  })();
  for(let i=0;i<40;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 40+Math.random()*180;
    state.particles.push({
      type:'spark',
      x:lastPts.x, y:lastPts.y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      life:1, maxLife:0.8+Math.random()*0.5,
      size: 1.5+Math.random()*3,
      color: Math.random()<0.5 ? '#ffaa33' : '#ff5555',
    });
  }

  // Active slots lose
  let totalLoss = 0;
  for(const s of state.slots){
    if(s.status === 'active'){
      s.status = 'lost';
      totalLoss += s.bet;
      recordHistory({ mult:state.crashPoint, bet:s.bet, win:0, slot:s.id, mode:state.mode, date:Date.now() });
      recordRoundInUser({ win:false, bet:s.bet, win:0, mult:state.crashPoint, slot:s.id });
      state.session.losses++;
      state.session.net -= s.bet;
      state.session.streak = 0;
    }
  }
  state.session.sumCrash += state.crashPoint;
  state.session.crashCount++;

  updateAllSlotUI();
  updateStatsUI();

  // Let particles animate for a moment, then reset
  const animEnd = now() + 1400;
  const finish = ()=>{
    const dt = 0.016;
    updateParticles(dt);
    render();
    if(now() < animEnd) requestAnimationFrame(finish);
    else {
      // finalize
      setTimeout(()=>{
        dom.crashOverlay.classList.remove('show');
        for(const s of state.slots){ s.status = 'idle'; s.bet = 0; s.win = 0; s.cashedAt = 0; }
        state.phase = 'idle';
        state.particles.length = 0;
        state.displayMaxMult = 3;
        state.targetMaxMult = 3;
        updateAllSlotUI();
        render();
        maybeAutoRebet();
        checkAchievements();
        checkDaily();
        maybeAutoStop();
      }, 400);
    }
  };
  requestAnimationFrame(finish);

  // FX
  dom.multiplierDisplay.textContent = fmtX(state.crashPoint);
  dom.multiplierDisplay.style.color = '#ff7a7a';
  dom.multiplierDisplay.style.textShadow = '0 0 30px #ff5555, 0 4px 12px rgba(0,0,0,.8)';
}

function maybeAutoRebet(){
  if(state.phase !== 'idle') return;
  if(state.autoStopTriggered) return;
  let anyQueued = false;
  for(const s of state.slots){
    if(s.autoRebet && s.amount > 0 && s.amount <= state.user.balance && s.status === 'idle'){
      // Check if enough balance for both
      s.bet = s.amount;
      s.status = 'queued';
      anyQueued = true;
    }
  }
  if(anyQueued){
    updateAllSlotUI();
    startCountdown();
  }
}

function maybeAutoStop(){
  // Stop-if-profit / stop-if-loss
  const autoProfit = safeFloat($('autoStopProfit')?.value, 0);
  const autoLoss = safeFloat($('autoStopLoss')?.value, 0);
  if(autoProfit > 0 && state.session.net >= autoProfit){
    state.autoStopTriggered = true;
    toast('Auto-stop: profit target reached', 'fa-check-circle');
    for(const s of state.slots) s.autoRebet = false;
    updateAllSlotUI();
  } else if(autoLoss > 0 && state.session.net <= -autoLoss){
    state.autoStopTriggered = true;
    toast('Auto-stop: loss limit reached', 'fa-exclamation-triangle');
    for(const s of state.slots) s.autoRebet = false;
    updateAllSlotUI();
  }
}

/* ============================================================
   HISTORY & STATS
   ============================================================ */
function recordHistory(entry){
  state.history.unshift(entry);
  if(state.history.length > 100) state.history.pop();
  // Persist per-user
  if(state.user){
    state.user.crashHistory = state.user.crashHistory || [];
    state.user.crashHistory.unshift({
      mult:entry.mult, bet:entry.bet, win:entry.win, slot:entry.slot, mode:entry.mode, date:entry.date,
    });
    if(state.user.crashHistory.length > 100) state.user.crashHistory.pop();
  }
}

function recordRoundInUser(info){
  if(!state.user) return;
  const u = state.user;
  u.globalStats = u.globalStats || { totalWagered:0, totalWon:0, totalGames:0, currentStreak:0, bestStreak:0, totalWins:0 };
  u.crashStats = u.crashStats || { gamesPlayed:0, wins:0, bestMultiplier:1.0, totalBet:0, totalWin:0, biggestWin:0, totalLoss:0, avgCrash:0, sumCrash:0 };

  // counts once per round, but we record per slot on crash/cashout
  // For simplicity count each cashout/loss event
  u.crashStats.gamesPlayed += 1;
  u.crashStats.totalBet += info.bet;
  u.globalStats.totalWagered += info.bet;
  u.globalStats.totalGames += 1;

  if(info.win){
    u.crashStats.wins += 1;
    u.crashStats.totalWin += info.win;
    u.globalStats.totalWon += info.win;
    u.globalStats.totalWins = (u.globalStats.totalWins||0) + 1;
    if(info.mult > u.crashStats.bestMultiplier) u.crashStats.bestMultiplier = info.mult;
    if(info.win > u.crashStats.biggestWin) u.crashStats.biggestWin = info.win;
    u.globalStats.currentStreak = (u.globalStats.currentStreak||0) + 1;
    if(u.globalStats.currentStreak > (u.globalStats.bestStreak||0)) u.globalStats.bestStreak = u.globalStats.currentStreak;
  } else {
    u.crashStats.totalLoss = (u.crashStats.totalLoss||0) + info.bet;
    u.globalStats.currentStreak = 0;
  }
  u.crashStats.sumCrash = (u.crashStats.sumCrash||0) + info.mult;
  u.crashStats.avgCrash = u.crashStats.sumCrash / u.crashStats.gamesPlayed;

  // XP
  const xpGain = Math.max(1, Math.floor(info.bet));
  const prevLevel = levelFromXp(u.xp||0);
  u.xp = (u.xp||0) + xpGain;
  const newLevel = levelFromXp(u.xp);
  if(newLevel > prevLevel){
    SFX.levelUp();
    toast(`Level up! Now level ${newLevel}`, 'fa-star');
    checkLevelUnlocks(newLevel);
  }

  // Transactions
  u.transactions = u.transactions || [];
  u.transactions.unshift({
    desc: info.win
      ? `🚀 Crash cashout ${fmtX(info.mult)} (slot ${info.slot+1})`
      : `💥 Crash at ${fmtX(info.mult)} (slot ${info.slot+1})`,
    amount: info.win ? (info.win - info.bet) : -info.bet,
    type: info.win ? 'game_win' : 'game_loss',
    date: new Date().toISOString(),
  });
  if(u.transactions.length > 40) u.transactions.pop();

  u.gameOutcomes = u.gameOutcomes || [];
  u.gameOutcomes.unshift({
    game: 'Crash Rocket',
    result: info.win ? 'win' : 'loss',
    profit: info.win ? (info.win - info.bet) : -info.bet,
    multiplier: info.mult,
    bet: info.bet,
    win: info.win,
    date: new Date().toISOString(),
  });
  if(u.gameOutcomes.length > 60) u.gameOutcomes.pop();

  u.gamePlayCount = u.gamePlayCount || {};
  u.gamePlayCount.crash = (u.gamePlayCount.crash||0) + 1;

  // Session rounds
  state.session.rounds += 1;
  state.session.wagered += info.bet;

  saveUser();
  updateLevelUI();
}

function checkAchievements(){
  if(!state.user) return;
  const u = state.user;
  u.achievements = u.achievements || {};
  let anyNew = false;
  for(const a of ACHIEVEMENTS){
    if(!u.achievements[a.id] && a.check(u)){
      u.achievements[a.id] = Date.now();
      anyNew = true;
      toast(`Achievement unlocked: ${a.name}`, 'fa-trophy');
    }
  }
  if(anyNew){ saveUser(); }
}

function checkDaily(){
  if(!state.user) return;
  const u = state.user;
  const key = todayKey();
  if(!u.dailyChallenge || u.dailyChallenge.date !== key){
    const seed = dateSeed(key);
    const ch = DAILY_CHALLENGES[seed % DAILY_CHALLENGES.length];
    u.dailyChallenge = { date:key, id:ch.id, desc:ch.desc, target:ch.target, reward:ch.reward, metric:ch.metric, progress:0, claimed:false };
    saveUser();
  }
  // Update progress
  const dc = u.dailyChallenge;
  if(dc && !dc.claimed){
    let progress = dc.progress || 0;
    if(dc.metric === 'rounds') progress = Math.max(progress, state.session.rounds);
    else if(dc.metric === 'wins') progress = Math.max(progress, state.session.wins);
    else if(dc.metric === 'wagered') progress = Math.max(progress, state.session.wagered);
    else if(dc.metric === 'fivex') progress = (state.session.bestMult >= 5) ? 1 : progress;
    else if(dc.metric === 'triple3x'){
      // count of cashouts >= 3x
      const count = state.history.filter(h=>h.win>0 && h.mult>=3).length;
      progress = Math.max(progress, count);
    }
    dc.progress = progress;
    if(progress >= dc.target && !dc.claimed){
      // auto claim
      u.balance += dc.reward;
      dc.claimed = true;
      toast(`Daily challenge complete! +${dc.reward} GOLD`, 'fa-gift');
      saveUser();
      updateBalanceUI();
    }
  }
}

const STORAGE_KEY = 'gold_users';

function saveUser(){
  if(!state.user) return;
  try{
    const users = safeJSON(localStorage.getItem(STORAGE_KEY), {});
    users[state.user.username] = state.user;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
    const sess = safeJSON(sessionStorage.getItem('gold_current_user'), null);
    if(sess){
      sess.balance = state.user.balance;
      sess.xp = state.user.xp;
      sessionStorage.setItem('gold_current_user', JSON.stringify(sess));
    }
  }catch(e){ /* ignore */ }
}

async function loadUser(){
  const sess = sessionStorage.getItem('gold_current_user');
  if(!sess){ window.location.href = '../../sign-in.html'; return false; }
  const su = safeJSON(sess, null);
  if(!su || !su.username){ sessionStorage.removeItem('gold_current_user'); window.location.href = '../../sign-in.html'; return false; }
  const users = safeJSON(localStorage.getItem(STORAGE_KEY), {});
  const raw = users[su.username];
  if(!raw){ sessionStorage.removeItem('gold_current_user'); window.location.href = '../../sign-in.html'; return false; }

  const u = { ...raw };
  u.crashStats = u.crashStats || {};
  u.crashStats.gamesPlayed = u.crashStats.gamesPlayed || 0;
  u.crashStats.wins = u.crashStats.wins || 0;
  u.crashStats.bestMultiplier = u.crashStats.bestMultiplier || 1.0;
  u.crashStats.totalBet = u.crashStats.totalBet || 0;
  u.crashStats.totalWin = u.crashStats.totalWin || 0;
  u.crashStats.biggestWin = u.crashStats.biggestWin || 0;
  u.crashStats.totalLoss = u.crashStats.totalLoss || 0;
  u.crashStats.sumCrash = u.crashStats.sumCrash || 0;
  u.crashStats.avgCrash = u.crashStats.avgCrash || 0;

  u.globalStats = u.globalStats || {};
  u.globalStats.totalWagered = u.globalStats.totalWagered || 0;
  u.globalStats.totalWon = u.globalStats.totalWon || 0;
  u.globalStats.totalGames = u.globalStats.totalGames || 0;
  u.globalStats.currentStreak = u.globalStats.currentStreak || 0;
  u.globalStats.bestStreak = u.globalStats.bestStreak || 0;
  u.globalStats.totalWins = u.globalStats.totalWins || 0;

  u.xp = u.xp || 0;
  u.transactions = u.transactions || [];
  u.achievements = u.achievements || {};
  u.crashHistory = u.crashHistory || [];
  u.skin = u.skin || 'gold';
  u.trail = u.trail || 'default';
  u.title = u.title || 'rookie';
  u.prefs = u.prefs || {};
  u.prefs.slot0 = u.prefs.slot0 || { amount:25, autoCashEnabled:true, autoCashTarget:2.0, autoRebet:false };
  u.prefs.slot1 = u.prefs.slot1 || { amount:25, autoCashEnabled:true, autoCashTarget:2.0, autoRebet:false };
  u.prefs.mode = u.prefs.mode || 'classic';

  state.user = u;
  state.mode = u.prefs.mode;

  // load history
  state.history = (u.crashHistory || []).slice(0,100);

  // load slot prefs
  state.slots[0].amount = u.prefs.slot0.amount;
  state.slots[0].autoCashEnabled = u.prefs.slot0.autoCashEnabled;
  state.slots[0].autoCashTarget = u.prefs.slot0.autoCashTarget;
  state.slots[0].autoRebet = !!u.prefs.slot0.autoRebet;
  state.slots[1].amount = u.prefs.slot1.amount;
  state.slots[1].autoCashEnabled = u.prefs.slot1.autoCashEnabled;
  state.slots[1].autoCashTarget = u.prefs.slot1.autoCashTarget;
  state.slots[1].autoRebet = !!u.prefs.slot1.autoRebet;

  return true;
}

function buildSlotUI(idx){
  const s = state.slots[idx];
  const el = idx === 0 ? dom.slot0 : dom.slot1;
  el.innerHTML = `
    <div class="slot-head">
      <div class="slot-title">SLOT <b>${idx+1}</b></div>
      <div class="slot-status" id="slotStatus${idx}">IDLE</div>
    </div>
    <div class="amount-row">
      <input type="number" class="amount-input" id="slotAmount${idx}" value="${s.amount}" step="1" min="1" aria-label="Bet amount" />
    </div>
    <div class="pct-row">
      <button class="pct-btn" data-pct="25" data-slot="${idx}">25%</button>
      <button class="pct-btn" data-pct="50" data-slot="${idx}">50%</button>
      <button class="pct-btn" data-pct="75" data-slot="${idx}">75%</button>
      <button class="pct-btn" data-pct="100" data-slot="${idx}">MAX</button>
    </div>
    <div class="auto-row">
      <label><input type="checkbox" id="slotAutoCash${idx}" ${s.autoCashEnabled?'checked':''}> Auto cashout</label>
      <input type="number" class="auto-input" id="slotAutoTarget${idx}" value="${s.autoCashTarget.toFixed(2)}" step="0.1" min="1.01" />
      <label style="margin-left:auto"><input type="checkbox" id="slotAutoRebet${idx}" ${s.autoRebet?'checked':''}> Auto-rebet</label>
    </div>
    <button class="slot-action place" id="slotAction${idx}">Place Bet</button>
    <div class="slot-result" id="slotResult${idx}"></div>
  `;
  s.amountEl = $(`slotAmount${idx}`);
  s.statusEl = $(`slotStatus${idx}`);
  s.actionEl = $(`slotAction${idx}`);
  s.resultEl = $(`slotResult${idx}`);
  s.autoCashEl = $(`slotAutoCash${idx}`);
  s.autoTargetEl = $(`slotAutoTarget${idx}`);
  s.autoRebetEl = $(`slotAutoRebet${idx}`);

  // Wire events
  s.amountEl.addEventListener('input', ()=>{
    s.amount = safeFloat(s.amountEl.value, 0);
    savePrefs();
    updateSlotUI(idx);
  });
  s.autoCashEl.addEventListener('change', ()=>{
    s.autoCashEnabled = s.autoCashEl.checked;
    s.autoTargetEl.disabled = !s.autoCashEnabled;
    savePrefs();
  });
  s.autoTargetEl.addEventListener('input', ()=>{
    s.autoCashTarget = safeFloat(s.autoTargetEl.value, 0);
    if(s.autoCashTarget < 1.01) s.autoCashTarget = 0;
    savePrefs();
  });
  s.autoRebetEl.addEventListener('change', ()=>{
    s.autoRebet = s.autoRebetEl.checked;
    savePrefs();
  });
  s.autoTargetEl.disabled = !s.autoCashEnabled;
  el.querySelectorAll('.pct-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pct = parseInt(btn.dataset.pct,10);
      const val = Math.max(1, Math.floor(state.user.balance * pct / 100));
      s.amount = val;
      s.amountEl.value = val;
      savePrefs();
      updateSlotUI(idx);
      SFX.click();
    });
  });
  s.actionEl.addEventListener('click', ()=>{
    resumeAudio();
    if(s.status === 'idle'){
      attemptPlaceBet(idx);
    } else if(s.status === 'queued'){
      cancelBet(idx);
    } else if(s.status === 'active'){
      cashoutSlot(idx, false);
    }
  });
}

function updateSlotUI(idx){
  const s = state.slots[idx];
  const el = idx === 0 ? dom.slot0 : dom.slot1;
  if(!s.statusEl) return;
  el.classList.remove('active','cashed','lost','queued');
  if(s.status === 'active') el.classList.add('active');
  else if(s.status === 'cashed') el.classList.add('cashed');
  else if(s.status === 'lost') el.classList.add('lost');
  else if(s.status === 'queued') el.classList.add('queued');

  const statusMap = { idle:'IDLE', queued:'QUEUED', active:'ACTIVE', cashed:'CASHED', lost:'LOST' };
  s.statusEl.textContent = statusMap[s.status];
  s.statusEl.className = 'slot-status ' + (s.status === 'idle' ? '' : s.status);

  const disabled = s.status !== 'idle';
  s.amountEl.disabled = disabled;
  s.autoCashEl.disabled = disabled;
  s.autoTargetEl.disabled = disabled || !s.autoCashEnabled;
  s.autoRebetEl.disabled = disabled;

  if(s.status === 'idle'){
    s.actionEl.className = 'slot-action place';
    s.actionEl.innerHTML = `<i class="fas fa-play"></i> Place Bet`;
    s.actionEl.disabled = false;
    s.resultEl.textContent = '';
    s.resultEl.className = 'slot-result';
  } else if(s.status === 'queued'){
    s.actionEl.className = 'slot-action cancel';
    s.actionEl.innerHTML = `<i class="fas fa-times"></i> Cancel`;
    s.actionEl.disabled = false;
    s.resultEl.textContent = `Bet: ${fmt(s.bet)} GOLD`;
    s.resultEl.className = 'slot-result';
  } else if(s.status === 'active'){
    s.actionEl.className = 'slot-action cashout';
    s.actionEl.innerHTML = `<i class="fas fa-hand-holding-usd"></i> Cash Out <span class="mult">@ ${fmtX(state.currentMult)}</span>`;
    s.actionEl.disabled = false;
    s.resultEl.textContent = `Bet: ${fmt(s.bet)} GOLD · Value: ${fmt(s.bet * state.currentMult)}`;
    s.resultEl.className = 'slot-result';
  } else if(s.status === 'cashed'){
    s.actionEl.className = 'slot-action cashed-out';
    s.actionEl.innerHTML = `<i class="fas fa-check-circle"></i> Cashed @ ${fmtX(s.cashedAt)}`;
    s.actionEl.disabled = true;
    s.resultEl.textContent = `+${fmt(s.win)} GOLD`;
    s.resultEl.className = 'slot-result win';
  } else if(s.status === 'lost'){
    s.actionEl.className = 'slot-action lost-out';
    s.actionEl.innerHTML = `<i class="fas fa-times-circle"></i> Crashed`;
    s.actionEl.disabled = true;
    s.resultEl.textContent = `-${fmt(s.bet)} GOLD`;
    s.resultEl.className = 'slot-result loss';
  }
}

      <div style="font-size:.72rem;color:var(--muted)">${curXp} / ${needXp} XP</div>
    </div>
    <div class="daily-progress" style="margin-bottom:18px"><i style="width:${pct}%"></i></div>

    <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:8px">Rocket Skins</div>
    <div class="skin-grid">${skinCards}</div>

    <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:18px 0 8px">Particle Trails</div>
    <div class="skin-grid">${trailCards}</div>

    <div style="font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:18px 0 8px">Achievements</div>
    <div class="achievements-grid">${achCards}</div>
  `;

  // Wire skin/trail selection
  dom.tabBody.querySelectorAll('[data-skin]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.skin;
      const sk = SKINS.find(x=>x.id===id);
      if(!sk) return;
      if(lvl < sk.minLevel){ toast(`Unlocks at level ${sk.minLevel}`, 'fa-lock'); return; }
      state.user.skin = id;
      saveUser();
      SFX.click();
      renderProgressTab();
      toast(`${sk.name} equipped`, 'fa-rocket');
    });
  });
  dom.tabBody.querySelectorAll('[data-trail]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.trail;
      const tr = TRAILS.find(x=>x.id===id);
      if(!tr) return;
      if(lvl < tr.minLevel){ toast(`Unlocks at level ${tr.minLevel}`, 'fa-lock'); return; }
      state.user.trail = id;
      saveUser();
      SFX.click();
      renderProgressTab();
      toast(`${tr.name} equipped`, 'fa-magic');
    });
  });
}

function renderSettingsTab(){
  const prefs = state.user?.prefs || {};
  dom.tabBody.innerHTML = `
    <div class="settings-row">
      <div class="lbl">Sound<small>Play audio effects</small></div>
      <input type="checkbox" id="settingSound" ${state.soundEnabled?'checked':''} class="auto-input" style="width:32px;height:18px;text-align:center">
    </div>
    <div class="settings-row">
      <div class="lbl">Reduced motion<small>Disable particle & flash effects</small></div>
      <input type="checkbox" id="settingReduced" ${state.reducedMotion?'checked':''} class="auto-input" style="width:32px;height:18px">
    </div>
    <div class="settings-row">
      <div class="lbl">Stop if profit<small>Auto-stop auto-betting when session profit reaches this</small></div>
      <input type="number" class="settings-input" id="autoStopProfit" value="${prefs.autoStopProfit||0}" min="0" step="10" />
    </div>
    <div class="settings-row">
      <div class="lbl">Stop if loss<small>Auto-stop auto-betting when session loss reaches this</small></div>
      <input type="number" class="settings-input" id="autoStopLoss" value="${prefs.autoStopLoss||0}" min="0" step="10" />
    </div>
    <div class="settings-row">
      <div class="lbl">Reset auto-stop<small>Re-enable auto-betting after a stop</small></div>
      <button class="pct-btn" id="resetAutoStop" style="width:100px;padding:8px">Reset</button>
    </div>
    <div style="margin-top:14px;font-size:.72rem;color:var(--muted);line-height:1.6">
      <b style="color:var(--gold)">Keyboard shortcuts:</b><br>
      <b>1</b> / <b>2</b> — place or cash out slot 1 / 2<br>
      <b>Space</b> — cash out all active slots<br>
      <b>Esc</b> — cancel countdown<br>
      <b>F</b> — fullscreen
    </div>
  `;
  $('settingSound')?.addEventListener('change', e=>{
    state.soundEnabled = e.target.checked;
    localStorage.setItem('gold_sound_enabled', state.soundEnabled);
    dom.soundToggle.innerHTML = state.soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
    if(state.soundEnabled){ initAudio(); resumeAudio(); }
  });
  $('settingReduced')?.addEventListener('change', e=>{
    state.reducedMotion = e.target.checked;
    document.body.classList.toggle('reduced-motion', state.reducedMotion);
  });
  $('autoStopProfit')?.addEventListener('input', ()=>{
    if(!state.user.prefs) state.user.prefs = {};
    state.user.prefs.autoStopProfit = safeFloat($('autoStopProfit').value, 0);
    saveUser();
  });
  $('autoStopLoss')?.addEventListener('input', ()=>{
    if(!state.user.prefs) state.user.prefs = {};
    state.user.prefs.autoStopLoss = safeFloat($('autoStopLoss').value, 0);
    saveUser();
  });
  $('resetAutoStop')?.addEventListener('click', ()=>{
    state.autoStopTriggered = false;
    toast('Auto-stop cleared', 'fa-check');
  });
}

/* ============================================================
   MODE BAR
   ============================================================ */
function renderModeBar(){
  dom.modeBar.innerHTML = Object.entries(MODES).map(([k,m])=>`
    <button class="mode-btn ${k===state.mode?'active':''}" data-mode="${k}">
      <i class="fas ${m.icon}"></i> ${m.name}
    </button>
  `).join('');
  dom.modeBar.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.phase !== 'idle'){
        toast('Cannot change mode during a round', 'fa-exclamation');
        return;
      }
      const m = btn.dataset.mode;
      if(!MODES[m]) return;
      state.mode = m;
      state.user.prefs.mode = m;
      saveUser();
      dom.modeBar.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
      dom.modeTag.textContent = MODES[m].name.toUpperCase();
      SFX.click();
      toast(`Mode: ${MODES[m].name} — ${MODES[m].desc}`, 'fa-info-circle');
    });
  });
  dom.modeTag.textContent = MODES[state.mode].name.toUpperCase();
}

/* ============================================================
   GET SKIN / TRAIL
   ============================================================ */
function getSkin(){
  const u = state.user;
  const id = (u && u.skin) || 'gold';
  return SKINS.find(s=>s.id===id) || SKINS[0];
}

/* ============================================================
   EVENT BINDING
   ============================================================ */
function bindGlobalEvents(){
  // sound
  const savedSound = localStorage.getItem('gold_sound_enabled');
  if(savedSound === 'false'){
    state.soundEnabled = false;
    dom.soundToggle.innerHTML = '<i class="fas fa-volume-mute"></i>';
  }
  dom.soundToggle.addEventListener('click', ()=>{
    state.soundEnabled = !state.soundEnabled;
    dom.soundToggle.innerHTML = state.soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
    localStorage.setItem('gold_sound_enabled', state.soundEnabled);
    if(state.soundEnabled){ initAudio(); resumeAudio(); SFX.click(); }
  });

  // fullscreen
  dom.fullscreenBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });

  // menu button
  dom.menuBtn.addEventListener('click', ()=>{
    // switch to settings tab
    const settingsTab = document.querySelector('.tab[data-tab="settings"]');
    if(settingsTab) settingsTab.click();
  });

  // tabs
  dom.tabs.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      dom.tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const key = tab.dataset.tab;
      if(key === 'session') renderSessionTab();
      else if(key === 'history') renderHistoryTab();
      else if(key === 'progress') renderProgressTab();
      else if(key === 'settings') renderSettingsTab();
    });
  });

  // resize
  window.addEventListener('resize', ()=>{
    clearTimeout(window._resizeT);
    window._resizeT = setTimeout(()=>{ resizeCanvas(); }, 100);
  });

  // orientation change
  window.addEventListener('orientationchange', ()=>{ setTimeout(resizeCanvas, 300); });

  // keyboard
  window.addEventListener('keydown', (e)=>{
    if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if(e.key === '1'){ handleSlotKey(0); }
    else if(e.key === '2'){ handleSlotKey(1); }
    else if(e.key === ' '){ e.preventDefault(); cashoutAll(); }
    else if(e.key === 'Escape'){ if(state.phase === 'countdown'){ state.slots.forEach(s=>{ if(s.status==='queued'){ s.status='idle'; s.bet=0; } }); cancelCountdown(); updateAllSlotUI(); } }
    else if(e.key.toLowerCase() === 'f'){ dom.fullscreenBtn.click(); }
  });
}

function handleSlotKey(idx){
  const s = state.slots[idx];
  if(!s) return;
  if(s.status === 'idle') attemptPlaceBet(idx);
  else if(s.status === 'queued') cancelBet(idx);
  else if(s.status === 'active') cashoutSlot(idx, false);
}

function cashoutAll(){
  for(const s of state.slots){
    if(s.status === 'active') cashoutSlot(s.id, false);
  }
}

/* ============================================================
   BACKGROUND PARTICLES
   ============================================================ */
function createStars(){
  for(let i=0;i<70;i++){
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random()*2.5 + 1;
    star.style.width = size+'px';
    star.style.height = size+'px';
    star.style.left = Math.random()*100+'%';
    star.style.top = Math.random()*100+'%';
    star.style.animationDelay = (Math.random()*4)+'s';
    dom.bgParticles.appendChild(star);
  }
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  cacheDom();
  createStars();
  const ok = await loadUser();
  if(!ok) return;

  // reduced motion pref
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    state.reducedMotion = true;
    document.body.classList.add('reduced-motion');
  }

  // Set UI
  updateBalanceUI();
  updateLevelUI();
  buildSlotUI(0);
  buildSlotUI(1);
  renderModeBar();
  renderSessionTab();
  bindGlobalEvents();

  // init audio
  initAudio();
  document.addEventListener('click', ()=>{ resumeAudio(); initAudio(); }, { once:true });
  document.addEventListener('touchstart', ()=>{ resumeAudio(); initAudio(); }, { once:true });

  resizeCanvas();
  render();

  // Ensure daily challenge created
  checkDaily();
  saveUser();

  // Start on idle
  state.phase = 'idle';
  updateAllSlotUI();
}

// Kick off
init();

})();
</script>
</body>
</html>
