<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>GOLD CRASH | Royal Crash Rocket</title>
  <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --gold: #ffd966;
      --gold-bright: #ffed4e;
      --gold-deep: #f5b042;
      --bg-deep: #0a0908;
      --bg-card: rgba(20, 18, 16, 0.85);
      --border-gold: rgba(255, 217, 102, 0.25);
      --border-active: rgba(255, 217, 102, 0.7);
      --danger: #ff6b6b;
      --success: #4caf50;
      --text-muted: #9a9484;
      --radius-xl: 2rem;
      --radius-lg: 1.5rem;
      --radius-md: 1rem;
      --radius-full: 60px;
      --transition-fast: 0.15s ease;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 20% 30%, #14110c 0%, #030202 100%);
      color: #f5f0e6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.2rem;
      overflow-x: hidden;
      position: relative;
    }
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 245, 200, 0.7);
      animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.9; transform: scale(1.2); }
    }
    .game-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      z-index: 2;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 13, 11, 0.75);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-full);
      padding: 0.6rem 1.5rem;
      border: 1px solid var(--border-gold);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .back-home {
      text-decoration: none;
      color: var(--gold);
      font-weight: 600;
      background: rgba(255, 217, 102, 0.08);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .back-home:hover {
      background: rgba(255, 217, 102, 0.2);
      transform: translateX(-3px);
    }
    .balance-tag {
      background: rgba(0,0,0,0.6);
      padding: 0.4rem 1.4rem;
      border-radius: 40px;
      font-weight: 800;
      border: 1px solid rgba(255, 217, 102, 0.5);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: box-shadow 0.2s;
    }
    .sound-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--gold);
      transition: transform 0.2s;
    }
    .sound-btn:hover {
      transform: scale(1.1);
    }
    .game-card {
      background: linear-gradient(145deg, rgba(28, 25, 21, 0.96), rgba(10, 9, 7, 0.98));
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      border: 1px solid var(--border-gold);
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .graph-container {
      position: relative;
      background: rgba(0, 0, 0, 0.55);
      border-radius: var(--radius-lg);
      overflow: hidden;
      height: 260px;
      border: 1px solid rgba(255, 217, 102, 0.2);
      box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
    }
    #crashCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .rocket-overlay {
      position: absolute;
      font-size: 2rem;
      pointer-events: none;
      filter: drop-shadow(0 0 12px #ffaa33);
      z-index: 10;
      will-change: left, top, transform;
      transition: none;
    }
    .multiplier-display {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255, 217, 102, 0.9);
      background: rgba(0, 0, 0, 0.65);
      padding: 0.2rem 1.6rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(8px);
      white-space: nowrap;
      z-index: 9;
      transition: color 0.1s, text-shadow 0.1s;
    }
    .target-marker {
      position: absolute;
      left: 0;
      width: 100%;
      border-top: 2px dashed #ffaa44;
      z-index: 6;
      pointer-events: none;
      display: none;
    }
    .target-marker-label {
      position: absolute;
      right: 10px;
      top: -12px;
      background: rgba(0,0,0,0.7);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: #ffaa44;
      font-weight: bold;
    }
    .countdown-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--gold-bright);
      text-shadow: 0 0 30px gold;
    }
    .countdown-overlay.active {
      opacity: 1;
    }
    .crash-flash {
      position: absolute;
      inset: 0;
      background: rgba(255, 80, 80, 0.35);
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .crash-flash.active {
      opacity: 1;
    }
    .shake {
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 50%, 90% { transform: translateX(-6px); }
      30%, 70% { transform: translateX(6px); }
    }
    .bet-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }
    .bet-input {
      background: #1f1b17;
      border: 2px solid rgba(255, 217, 102, 0.2);
      border-radius: var(--radius-full);
      padding: 0.7rem 1rem;
      color: white;
      font-weight: 700;
      width: 120px;
      text-align: center;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .bet-input.invalid {
      border-color: var(--danger) !important;
    }
    .quick-bets {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .quick-bet {
      background: rgba(255, 217, 102, 0.1);
      border: 1px solid rgba(255, 217, 102, 0.3);
      border-radius: 40px;
      padding: 0.35rem 1rem;
      color: var(--gold);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s;
      font-size: 0.8rem;
    }
    .quick-bet:hover {
      background: rgba(255, 217, 102, 0.25);
      transform: translateY(-1px);
    }
    .quick-bet:active {
      transform: scale(0.95);
    }
    .auto-cashout {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }
    .auto-cashout input {
      width: 75px;
      background: #1f1b17;
      border: 2px solid rgba(255, 217, 102, 0.2);
      border-radius: 40px;
      padding: 0.5rem;
      color: white;
      text-align: center;
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 1rem;
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 0.9rem;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }
    .btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }
    .btn-start {
      background: linear-gradient(135deg, #f5b042, #ffd966);
      color: #1a150e;
      box-shadow: 0 4px 0 #a05f15;
    }
    .btn-cashout {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      color: white;
      box-shadow: 0 4px 0 #0a3a0a;
    }
    .btn:disabled {
      opacity: 0.5;
      transform: none;
      cursor: not-allowed;
      box-shadow: none;
    }
    .result-panel {
      background: rgba(0,0,0,0.5);
      border-radius: var(--radius-md);
      padding: 0.8rem;
      text-align: center;
      font-weight: 600;
      backdrop-filter: blur(8px);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.8rem;
      background: rgba(0, 0, 0, 0.4);
      border-radius: var(--radius-md);
      padding: 0.8rem;
    }
    .stat-value {
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--gold);
    }
    .history-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .history-badge {
      background: #2a2520;
      padding: 0.2rem 0.7rem;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .history-badge.win { color: #aaffaa; }
    .history-badge.loss { color: #ffaaaa; }
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
    @media (max-width: 620px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .multiplier-display { font-size: 1.8rem; }
      .btn { font-size: 0.9rem; padding: 0.7rem; }
      .graph-container { height: 200px; }
      .bet-row { gap: 0.5rem; }
    }
  </style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="bg-particles" id="bgParticles"></div>

<div class="game-container">
  <div class="top-nav">
    <a href=".././home.html" class="back-home"><i class="fas fa-arrow-left"></i> Lobby</a>
    <div class="balance-tag" id="balanceTag"><i class="fas fa-coins"></i> <span id="headerBalance">0</span></div>
    <button id="soundToggleBtn" class="sound-btn" aria-label="Toggle sound"><i class="fas fa-volume-up"></i></button>
  </div>

  <div class="game-card">
    <div class="graph-container" id="graphContainer">
      <canvas id="crashCanvas"></canvas>
      <div class="rocket-overlay" id="rocketIcon"><i class="fas fa-rocket"></i></div>
      <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
      <div class="target-marker" id="targetMarker"><span class="target-marker-label" id="targetMarkerLabel"></span></div>
      <div class="countdown-overlay" id="countdownOverlay"><span id="countdownNumber">3</span></div>
      <div class="crash-flash" id="crashFlash"></div>
    </div>

    <div class="bet-row">
      <label><i class="fas fa-coins"></i> Bet</label>
      <input type="number" id="betAmount" class="bet-input" value="25" step="1" min="1" aria-label="Bet amount" />
      <div class="quick-bets">
        <button class="quick-bet" data-bet="10">+10</button>
        <button class="quick-bet" data-bet="25">+25</button>
        <button class="quick-bet" data-bet="50">+50</button>
        <button class="quick-bet" data-bet="100">+100</button>
        <button class="quick-bet" id="halfBetBtn">½</button>
        <button class="quick-bet" id="maxBetBtn">MAX</button>
      </div>
      <div class="auto-cashout">
        <span>Auto</span>
        <input type="number" id="autoTarget" placeholder="x" value="2.0" step="0.1" min="1.01" aria-label="Auto cashout multiplier" />
      </div>
    </div>

    <div class="action-buttons">
      <button id="startBtn" class="btn btn-start"><i class="fas fa-play"></i> LAUNCH</button>
      <button id="cashoutBtn" class="btn btn-cashout" disabled><i class="fas fa-hand-holding-usd"></i> CASH OUT</button>
    </div>

    <div class="result-panel" id="resultMessage"><i class="fas fa-info-circle"></i> Place your bet & launch!</div>

    <div class="stats-grid">
      <div><div class="stat-value" id="gamesStat">0</div><div>Rounds</div></div>
      <div><div class="stat-value" id="winsStat">0</div><div>Cashouts</div></div>
      <div><div class="stat-value" id="bestMultStat">1.0x</div><div>Best Multi</div></div>
      <div><div class="stat-value" id="sessionPL">0</div><div>Session P/L</div></div>
    </div>

    <div class="history-container" id="crashHistoryContainer">
      <span style="color:var(--text-muted);">Recent:</span>
    </div>
  </div>
</div>

<script>
  (function() {
    /* ========== GOLD CRASH ENGINE – IMPROVED & OPTIMIZED ========== */

    // ---------- CONSTANTS & CONFIG ----------
    const GROWTH_K = 0.85;          // multiplier growth speed factor
    const GROWTH_POW = 1.65;        // growth curve exponent
    const GRAPH_POINTS = 200;       // curve resolution
    const MAX_CRASH = 500;          // hard cap for crash point
    const HOUSE_EDGE_FACTOR = 0.97; // used in provably fair distribution (simulated)

    // ---------- GAME STATE ----------
    const state = {
      currentUser: null,
      sessionProfit: 0,
      crashHistory: [],          // { mult, won }
      gameActive: false,
      gamePhase: 'idle',        // 'idle' | 'countdown' | 'running' | 'crashed' | 'cashedout'
      currentBet: 0,
      currentMultiplier: 1.0,
      crashPoint: 1.0,
      startTimestamp: 0,
      durationToCrash: 0,
      autoCashTarget: 0,
      hasCashedOut: false,
      displayMaxMult: 4.0,      // fixed Y-axis max for this round
      animationFrameId: null,
      confettiAnimId: null,
      countdownInterval: null,
      soundEnabled: true,
      audioCtx: null,
      masterGain: null,
    };

    // ---------- DOM CACHE ----------
    const dom = {
      canvas: document.getElementById('crashCanvas'),
      ctx: document.getElementById('crashCanvas').getContext('2d'),
      graphContainer: document.getElementById('graphContainer'),
      rocketEl: document.getElementById('rocketIcon'),
      multiplierDisplay: document.getElementById('multiplierDisplay'),
      targetMarker: document.getElementById('targetMarker'),
      targetMarkerLabel: document.getElementById('targetMarkerLabel'),
      countdownOverlay: document.getElementById('countdownOverlay'),
      countdownNumber: document.getElementById('countdownNumber'),
      crashFlash: document.getElementById('crashFlash'),
      startBtn: document.getElementById('startBtn'),
      cashoutBtn: document.getElementById('cashoutBtn'),
      betInput: document.getElementById('betAmount'),
      autoTargetInput: document.getElementById('autoTarget'),
      resultPanel: document.getElementById('resultMessage'),
      headerBalance: document.getElementById('headerBalance'),
      balanceTag: document.getElementById('balanceTag'),
      soundToggleBtn: document.getElementById('soundToggleBtn'),
      confettiCanvas: document.getElementById('confettiCanvas'),
      confettiCtx: document.getElementById('confettiCanvas').getContext('2d'),
      stats: {
        games: document.getElementById('gamesStat'),
        wins: document.getElementById('winsStat'),
        bestMult: document.getElementById('bestMultStat'),
        sessionPL: document.getElementById('sessionPL'),
      },
      historyContainer: document.getElementById('crashHistoryContainer'),
      bgParticles: document.getElementById('bgParticles'),
    };

    let dpr = window.devicePixelRatio || 1;

    // ---------- HELPER FUNCTIONS ----------
    function safeParseFloat(value, fallback = 0) {
      const num = parseFloat(value);
      return isNaN(num) || num < 0 ? fallback : num;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    // Multiplier from time (seconds since launch)
    function multiplierFromTime(sec) {
      return 1 + Math.pow(sec * GROWTH_K, GROWTH_POW);
    }

    // Time needed to reach a given multiplier
    function timeFromMultiplier(mult) {
      if (mult <= 1) return 0;
      return Math.pow(mult - 1, 1 / GROWTH_POW) / GROWTH_K;
    }

    // Generate crash point – balanced, provably-fair-like distribution
    function generateCrashPoint() {
      const r = Math.random();
      if (r < 0.55) {               // frequent low crashes
        return 1.0 + Math.random() * 1.0;
      } else if (r < 0.85) {        // medium
        return 2.0 + Math.random() * 3.0;
      } else if (r < 0.97) {        // high
        return 5.0 + Math.random() * 10.0;
      } else {                       // rare huge, capped
        return 15.0 + Math.random() * (MAX_CRASH - 15);
      }
    }

    // Safe storage parsing with fallback
    function safeJSONParse(str, fallback = {}) {
      try {
        return JSON.parse(str) || fallback;
      } catch (e) {
        return fallback;
      }
    }

    // ---------- AUDIO SYSTEM ----------
    async function initAudio() {
      if (!state.audioCtx && state.soundEnabled) {
        try {
          state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          state.masterGain = state.audioCtx.createGain();
          state.masterGain.gain.value = 0.6;
          state.masterGain.connect(state.audioCtx.destination);
        } catch (e) { /* ignore */ }
      }
    }

    async function resumeAudio() {
      if (state.audioCtx && state.audioCtx.state === 'suspended') {
        await state.audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!state.soundEnabled || !state.audioCtx || !state.masterGain) return;
      const now = state.audioCtx.currentTime;
      const osc = state.audioCtx.createOscillator();
      const gain = state.audioCtx.createGain();
      osc.connect(gain);
      gain.connect(state.masterGain);

      try {
        switch (type) {
          case 'launch':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1300, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now); osc.stop(now + 0.4);
            break;
          case 'cashout':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(1800, now + 0.12);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now); osc.stop(now + 0.3);
            break;
          case 'crash':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.45);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            osc.start(now); osc.stop(now + 0.6);
            break;
          case 'countdown':
            osc.type = 'sine';
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.2);
            break;
        }
      } catch (e) { /* audio may fail */ }
    }

    // ---------- CONFETTI SYSTEM (optimised) ----------
    function spawnConfetti() {
      const canvas = dom.confettiCanvas;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = dom.confettiCtx;
      const particles = [];
      const colors = ['#ffd966', '#ffb347', '#ffed4e', '#4caf50', '#ffaa33', '#ffffff'];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: -15 - Math.random() * 50,
          size: Math.random() * 6 + 3,
          speedY: Math.random() * 5 + 4,
          speedX: (Math.random() - 0.5) * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12
        });
      }

      const startTime = performance.now();
      function draw(now) {
        if (now - startTime > 2500) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          state.confettiAnimId = null;
          return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rotation += p.rotSpeed;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size / 1.5);
          ctx.restore();
        });
        state.confettiAnimId = requestAnimationFrame(draw);
      }
      if (state.confettiAnimId) cancelAnimationFrame(state.confettiAnimId);
      state.confettiAnimId = requestAnimationFrame(draw);
    }

    // ---------- CANVAS & GRAPH RENDERING ----------
    function resizeCanvas() {
      const rect = dom.graphContainer.getBoundingClientRect();
      const w = rect.width * dpr;
      const h = rect.height * dpr;
      dom.canvas.width = w;
      dom.canvas.height = h;
      dom.canvas.style.width = `${rect.width}px`;
      dom.canvas.style.height = `${rect.height}px`;
      dom.ctx.setTransform(1, 0, 0, 1, 0, 0);
      dom.ctx.scale(dpr, dpr);
      drawGraph();
    }

    // Draw the complete graph (curve, grid, crash line, target marker)
    function drawGraph() {
      if (!dom.canvas.width) resizeCanvas();
      const w = dom.canvas.width / dpr;
      const h = dom.canvas.height / dpr;
      const ctx = dom.ctx;
      ctx.clearRect(0, 0, w, h);

      const xStart = 55;
      const xEnd = w - 30;
      const yBase = h - 35;
      const graphHeight = yBase - 40;
      const maxMult = state.displayMaxMult;

      // grid lines & labels
      ctx.strokeStyle = 'rgba(255,240,180,0.1)';
      ctx.lineWidth = 1;
      ctx.font = '10px Inter';
      ctx.fillStyle = '#aa9f7a';
      const step = Math.max(1, Math.ceil(maxMult / 5));
      for (let mult = 1; mult <= maxMult + step; mult += step) {
        const y = yBase - ((mult - 1) / (maxMult - 1)) * graphHeight;
        ctx.beginPath();
        ctx.moveTo(xStart, y);
        ctx.lineTo(xEnd, y);
        ctx.stroke();
        ctx.fillText(`${mult.toFixed(0)}x`, xStart - 28, y + 3);
      }

      // crash line (if game ended)
      if (state.crashPoint > 1.0 && (state.gamePhase === 'crashed' || state.gamePhase === 'cashedout' || state.gamePhase === 'idle')) {
        const crashY = yBase - ((state.crashPoint - 1) / (maxMult - 1)) * graphHeight;
        ctx.beginPath();
        ctx.moveTo(xStart, crashY);
        ctx.lineTo(xEnd, crashY);
        ctx.strokeStyle = '#ff6666';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ff8888';
        ctx.font = 'bold 11px Inter';
        ctx.fillText('CRASH', xEnd - 48, crashY - 6);
      }

      // auto target marker
      if (state.autoCashTarget > 1.01 && state.gamePhase === 'running' && !state.hasCashedOut) {
        const targetY = yBase - ((state.autoCashTarget - 1) / (maxMult - 1)) * graphHeight;
        dom.targetMarker.style.display = 'block';
        dom.targetMarker.style.top = targetY + 'px';
        dom.targetMarkerLabel.textContent = state.autoCashTarget.toFixed(2) + 'x';
      } else {
        dom.targetMarker.style.display = 'none';
      }

      // main curve
      const isRunning = state.gamePhase === 'running';
      const maxTime = isRunning
        ? timeFromMultiplier(state.currentMultiplier)
        : (state.crashPoint > 1 ? timeFromMultiplier(state.crashPoint) : 0);
      
      ctx.beginPath();
      ctx.strokeStyle = isRunning ? '#4caf50' : '#ff7777';
      ctx.lineWidth = 3.2;
      ctx.shadowBlur = 8;
      ctx.shadowColor = isRunning ? '#4caf50' : '#ff4444';
      let first = true;
      for (let i = 0; i <= GRAPH_POINTS; i++) {
        const t = (i / GRAPH_POINTS) * maxTime;
        let mult = multiplierFromTime(t);
        if (mult > (isRunning ? state.currentMultiplier : state.crashPoint)) break;
        const x = xStart + (t / maxTime) * (xEnd - xStart);
        const y = yBase - ((mult - 1) / (maxMult - 1)) * graphHeight;
        if (first) { ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // rocket trail glow (thick transparent line behind main curve)
      if (isRunning) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 217, 102, 0.25)';
        ctx.lineWidth = 8;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffaa33';
        first = true;
        for (let i = 0; i <= GRAPH_POINTS; i++) {
          const t = (i / GRAPH_POINTS) * maxTime;
          let mult = multiplierFromTime(t);
          if (mult > state.currentMultiplier) break;
          const x = xStart + (t / maxTime) * (xEnd - xStart);
          const y = yBase - ((mult - 1) / (maxMult - 1)) * graphHeight;
          if (first) { ctx.moveTo(x, y); first = false; }
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // Update rocket DOM position and rotation
    function updateRocket() {
      if (state.gamePhase !== 'running') return;
      const w = dom.canvas.width / dpr;
      const h = dom.canvas.height / dpr;
      const xStart = 55, xEnd = w - 30, yBase = h - 35, graphHeight = yBase - 40;
      const maxMult = state.displayMaxMult;
      const elapsedSec = Math.min((Date.now() - state.startTimestamp) / 1000, state.durationToCrash);
      const x = xStart + (elapsedSec / state.durationToCrash) * (xEnd - xStart);
      const y = yBase - ((state.currentMultiplier - 1) / (maxMult - 1)) * graphHeight;
      dom.rocketEl.style.left = x + 'px';
      dom.rocketEl.style.top = y + 'px';
      const angle = Math.min(45, Math.max(-25, (state.currentMultiplier - 1) * 14));
      dom.rocketEl.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
    }

    // ---------- GAME FLOW ----------
    function updateMultiplierDisplay() {
      dom.multiplierDisplay.textContent = state.currentMultiplier.toFixed(2) + 'x';
      // dynamic colour: green -> yellow -> red as multiplier rises
      const t = clamp((state.currentMultiplier - 1) / (state.crashPoint - 1 || 1), 0, 1);
      const r = Math.min(255, Math.floor(t * 255));
      const g = Math.max(0, Math.floor(255 - t * 255));
      const color = `rgb(${r}, ${g}, 0)`;
      dom.multiplierDisplay.style.color = color;
      dom.multiplierDisplay.style.textShadow = `0 0 20px ${color}`;
    }

    function gameLoop() {
      if (state.gamePhase !== 'running') return;
      const now = Date.now();
      const elapsed = Math.min((now - state.startTimestamp) / 1000, state.durationToCrash);
      state.currentMultiplier = multiplierFromTime(elapsed);

      if (state.currentMultiplier >= state.crashPoint || elapsed >= state.durationToCrash) {
        endGameCrash();
        return;
      }

      drawGraph();
      updateRocket();
      updateMultiplierDisplay();
      dom.multiplierDisplay.style.display = 'block';

      // auto cashout check
      if (state.autoCashTarget > 1.01 && state.currentMultiplier >= state.autoCashTarget && !state.hasCashedOut) {
        performCashout();
        return;
      }

      state.animationFrameId = requestAnimationFrame(gameLoop);
    }

    async function performCashout() {
      if (!state.gameActive || state.hasCashedOut || state.gamePhase !== 'running') return;
      state.gameActive = false;
      state.hasCashedOut = true;
      state.gamePhase = 'cashedout';
      if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
      const winAmount = state.currentBet * state.currentMultiplier;
      const netProfit = winAmount - state.currentBet;
      state.currentUser.balance += winAmount;
      state.sessionProfit += netProfit;
      await recordGameResult(true, winAmount, netProfit);
      playSound('cashout');
      spawnConfetti();
      dom.resultPanel.innerHTML = `<i class="fas fa-trophy"></i> CASHED OUT! +${winAmount.toFixed(2)} GOLD (${state.currentMultiplier.toFixed(2)}x)`;
      dom.resultPanel.style.color = '#aaffaa';
      dom.cashoutBtn.disabled = true;
      dom.startBtn.disabled = false;
      dom.rocketEl.style.display = 'none';
      dom.multiplierDisplay.classList.add('crashed');
      setTimeout(() => { dom.multiplierDisplay.style.display = 'none'; dom.multiplierDisplay.classList.remove('crashed'); }, 1000);
      drawGraph();
      updateUIAfterGame();
      addHistory(state.currentMultiplier, true);
    }

    async function endGameCrash() {
      if (!state.gameActive || state.hasCashedOut || state.gamePhase !== 'running') return;
      state.gameActive = false;
      state.gamePhase = 'crashed';
      if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
      const lost = state.currentBet;
      state.sessionProfit -= lost;
      await recordGameResult(false, 0, -lost);
      playSound('crash');
      // crash animation: flash & shake
      dom.crashFlash.classList.add('active');
      dom.graphContainer.classList.add('shake');
      setTimeout(() => {
        dom.crashFlash.classList.remove('active');
        dom.graphContainer.classList.remove('shake');
      }, 500);
      dom.resultPanel.innerHTML = `<i class="fas fa-explosion"></i> CRASHED at ${state.crashPoint.toFixed(2)}x! Lost ${lost.toFixed(2)} GOLD.`;
      dom.resultPanel.style.color = '#ffaaaa';
      dom.cashoutBtn.disabled = true;
      dom.startBtn.disabled = false;
      dom.rocketEl.style.display = 'none';
      dom.multiplierDisplay.classList.add('crashed');
      dom.multiplierDisplay.textContent = state.crashPoint.toFixed(2) + 'x';
      setTimeout(() => { dom.multiplierDisplay.style.display = 'none'; dom.multiplierDisplay.classList.remove('crashed'); }, 1200);
      drawGraph();
      updateUIAfterGame();
      addHistory(state.crashPoint, false);
    }

    // Countdown before rocket launch
    function startCountdown() {
      state.gamePhase = 'countdown';
      dom.startBtn.disabled = true;
      dom.cashoutBtn.disabled = true;
      dom.rocketEl.style.display = 'none';
      dom.multiplierDisplay.style.display = 'none';
      dom.countdownOverlay.classList.add('active');
      let count = 3;
      dom.countdownNumber.textContent = count;
      playSound('countdown');
      state.countdownInterval = setInterval(() => {
        count--;
        if (count > 0) {
          dom.countdownNumber.textContent = count;
          playSound('countdown');
        } else {
          clearInterval(state.countdownInterval);
          state.countdownInterval = null;
          dom.countdownOverlay.classList.remove('active');
          launchRocket();
        }
      }, 1000);
    }

    function launchRocket() {
      state.gamePhase = 'running';
      state.gameActive = true;
      state.hasCashedOut = false;
      state.currentMultiplier = 1.0;
      state.startTimestamp = Date.now();
      state.durationToCrash = timeFromMultiplier(state.crashPoint);
      state.displayMaxMult = Math.max(state.crashPoint * 1.08, state.autoCashTarget * 1.08, 3.0);
      state.animationFrameId = requestAnimationFrame(gameLoop);
      playSound('launch');
      dom.resultPanel.innerHTML = '<i class="fas fa-rocket"></i> Rocket launched!';
      dom.resultPanel.style.color = '';
      dom.rocketEl.style.display = 'block';
      dom.multiplierDisplay.style.display = 'block';
      dom.multiplierDisplay.classList.remove('crashed');
      dom.cashoutBtn.disabled = false;
      drawGraph();
    }

    async function startGame() {
      if (state.gameActive || state.gamePhase === 'countdown') return;
      let bet = safeParseFloat(dom.betInput.value, 0);
      if (bet <= 0 || bet > state.currentUser.balance) {
        dom.resultPanel.innerHTML = '<i class="fas fa-ban"></i> Insufficient balance!';
        return;
      }
      bet = Math.floor(bet * 100) / 100;
      if (bet < 1) bet = 1;
      state.currentBet = bet;
      state.currentUser.balance -= bet;
      await saveUser();
      updateBalanceDisplay();
      state.crashPoint = generateCrashPoint();
      state.autoCashTarget = safeParseFloat(dom.autoTargetInput.value, 0);
      if (state.autoCashTarget <= 1.01) state.autoCashTarget = 0;
      state.displayMaxMult = Math.max(state.crashPoint * 1.08, state.autoCashTarget * 1.08, 3.0);
      startCountdown();
    }

    // ---------- DATA PERSISTENCE ----------
    async function saveUser() {
      const users = safeJSONParse(localStorage.getItem('gold_users'), {});
      users[state.currentUser.username] = state.currentUser;
      localStorage.setItem('gold_users', JSON.stringify(users));
      try {
        const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
        if (sess) {
          sess.balance = state.currentUser.balance;
          sessionStorage.setItem('gold_current_user', JSON.stringify(sess));
        }
      } catch (e) { /* ignore */ }
    }

    async function recordGameResult(isWin, winAmount, netProfit) {
      if (!state.currentUser) return;
      const u = state.currentUser;
      u.globalStats = u.globalStats || { totalWagered:0, totalWon:0, totalGames:0, currentStreak:0, bestStreak:0, totalWins:0 };
      u.globalStats.totalWagered += state.currentBet;
      u.globalStats.totalGames += 1;
      if (isWin) {
        u.globalStats.totalWon += winAmount;
        u.globalStats.currentStreak = (u.globalStats.currentStreak || 0) + 1;
        u.globalStats.totalWins = (u.globalStats.totalWins || 0) + 1;
        if (u.globalStats.currentStreak > (u.globalStats.bestStreak || 0)) u.globalStats.bestStreak = u.globalStats.currentStreak;
      } else {
        u.globalStats.currentStreak = 0;
      }
      u.xp = (u.xp || 0) + state.currentBet;

      u.crashStats = u.crashStats || { gamesPlayed:0, wins:0, bestMultiplier:1.0, totalBet:0, totalWin:0, biggestWin:0 };
      u.crashStats.gamesPlayed += 1;
      u.crashStats.totalBet += state.currentBet;
      if (isWin) {
        u.crashStats.wins += 1;
        u.crashStats.totalWin += winAmount;
        if (state.currentMultiplier > u.crashStats.bestMultiplier) u.crashStats.bestMultiplier = state.currentMultiplier;
        if (winAmount > u.crashStats.biggestWin) u.crashStats.biggestWin = winAmount;
      }
      u.gamePlayCount = u.gamePlayCount || {};
      u.gamePlayCount.crash = (u.gamePlayCount.crash || 0) + 1;
      u.transactions = u.transactions || [];
      u.transactions.unshift({
        desc: `🚀 Crash ${isWin ? `Cashout ${state.currentMultiplier.toFixed(2)}x` : `Crash at ${state.crashPoint.toFixed(2)}x`}`,
        amount: netProfit,
        type: isWin ? 'game_win' : 'game_loss',
        date: new Date().toISOString()
      });
      if (u.transactions.length > 35) u.transactions.pop();
      u.gameOutcomes = u.gameOutcomes || [];
      u.gameOutcomes.unshift({
        game: 'Crash Rocket',
        result: isWin ? 'win' : 'loss',
        profit: netProfit,
        multiplier: isWin ? state.currentMultiplier : state.crashPoint,
        bet: state.currentBet,
        win: winAmount,
        date: new Date().toISOString()
      });
      if (u.gameOutcomes.length > 50) u.gameOutcomes.pop();
      await saveUser();
      updateBalanceDisplay();
      updateStatsUI();
    }

    function addHistory(mult, won) {
      state.crashHistory.unshift({ mult, won });
      if (state.crashHistory.length > 12) state.crashHistory.pop();
      let html = '<span style="color:var(--text-muted);">Recent:</span> ';
      state.crashHistory.forEach(h => {
        html += `<span class="history-badge ${h.won ? 'win' : 'loss'}">${h.mult.toFixed(2)}x</span>`;
      });
      dom.historyContainer.innerHTML = html;
    }

    // ---------- UI UPDATES ----------
    function updateBalanceDisplay() {
      dom.headerBalance.textContent = state.currentUser.balance.toLocaleString();
      dom.balanceTag.classList.add('pulse');
      setTimeout(() => dom.balanceTag?.classList.remove('pulse'), 400);
      validateBet();
    }

    function updateStatsUI() {
      const cs = state.currentUser.crashStats || {};
      dom.stats.games.textContent = cs.gamesPlayed || 0;
      dom.stats.wins.textContent = cs.wins || 0;
      dom.stats.bestMult.textContent = (cs.bestMultiplier || 1.0).toFixed(2) + 'x';
      dom.stats.sessionPL.textContent = (state.sessionProfit >= 0 ? '+' : '') + state.sessionProfit.toFixed(2);
    }

    function validateBet() {
      const bet = safeParseFloat(dom.betInput.value, 0);
      dom.startBtn.disabled = (bet <= 0 || bet > state.currentUser.balance || state.gamePhase === 'running' || state.gamePhase === 'countdown');
      if (bet > state.currentUser.balance) dom.betInput.classList.add('invalid');
      else dom.betInput.classList.remove('invalid');
    }

    function updateUIAfterGame() {
      updateStatsUI();
      validateBet();
    }

    // ---------- INITIALISATION ----------
    async function loadUser() {
      const sess = sessionStorage.getItem('gold_current_user');
      if (!sess) { window.location.href = '../../sign-in.html'; return false; }
      const sessionUser = safeJSONParse(sess);
      if (!sessionUser || !sessionUser.username) { sessionStorage.removeItem('gold_current_user'); window.location.href = '../../sign-in.html'; return false; }
      const users = safeJSONParse(localStorage.getItem('gold_users'), {});
      let user = users[sessionUser.username];
      if (!user) { sessionStorage.removeItem('gold_current_user'); window.location.href = '../../sign-in.html'; return false; }
      user = { ...user };
      user.crashStats = user.crashStats || { gamesPlayed:0, wins:0, bestMultiplier:1.0, totalBet:0, totalWin:0, biggestWin:0 };
      user.globalStats = user.globalStats || { totalWagered:0, totalWon:0, totalGames:0, currentStreak:0, bestStreak:0, totalWins:0 };
      user.transactions = user.transactions || [];
      state.currentUser = user;
      state.sessionProfit = 0;
      updateBalanceDisplay();
      updateStatsUI();
      validateBet();
      return true;
    }

    function bindEvents() {
      dom.startBtn.addEventListener('click', startGame);
      dom.cashoutBtn.addEventListener('click', () => {
        if (state.gameActive && !state.hasCashedOut && state.gamePhase === 'running') performCashout();
      });
      document.querySelectorAll('.quick-bet').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.id === 'halfBetBtn') {
            let val = safeParseFloat(dom.betInput.value, 0);
            dom.betInput.value = Math.max(1, Math.floor(val / 2));
          } else if (btn.id === 'maxBetBtn') {
            dom.betInput.value = Math.floor(state.currentUser.balance);
          } else {
            let add = safeParseFloat(btn.dataset.bet, 0);
            let newVal = safeParseFloat(dom.betInput.value, 0) + add;
            if (newVal > state.currentUser.balance) newVal = state.currentUser.balance;
            dom.betInput.value = Math.max(1, Math.floor(newVal));
          }
          validateBet();
        });
      });
      dom.betInput.addEventListener('input', validateBet);
      dom.autoTargetInput.addEventListener('input', () => {
        state.autoCashTarget = safeParseFloat(dom.autoTargetInput.value, 0);
        drawGraph();
      });
      window.addEventListener('resize', () => {
        clearTimeout(window.resizedTimer);
        window.resizedTimer = setTimeout(() => {
          resizeCanvas();
          if (state.gamePhase === 'running') updateRocket();
        }, 50);
      });
      dom.soundToggleBtn.addEventListener('click', () => {
        state.soundEnabled = !state.soundEnabled;
        dom.soundToggleBtn.innerHTML = state.soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
        if (state.soundEnabled) initAudio();
        localStorage.setItem('gold_sound_enabled', state.soundEnabled);
      });
      const savedSound = localStorage.getItem('gold_sound_enabled');
      if (savedSound === 'false') {
        state.soundEnabled = false;
        dom.soundToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
      } else {
        state.soundEnabled = true;
      }
    }

    function createStars() {
      const container = dom.bgParticles;
      for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2.5 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 4 + 's';
        container.appendChild(star);
      }
    }

    async function init() {
      createStars();
      if (!(await loadUser())) return;
      bindEvents();
      initAudio();
      resizeCanvas();
      dom.rocketEl.style.display = 'none';
      dom.multiplierDisplay.style.display = 'none';
      drawGraph();
    }

    init();
  })();
</script>
</body>
