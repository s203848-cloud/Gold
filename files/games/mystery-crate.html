<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GOLD MYSTERY CRATES | Open mystery crates and find hidden treasures!</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd966;
            --gold-bright: #ffe484;
            --gold-deep: #f5b042;
            --bg-deep: #0a0908;
            --card-bg: rgba(18, 15, 12, 0.8);
            --border-gold: rgba(255, 217, 102, 0.45);
            --shadow-gold: 0 0 40px rgba(255, 217, 102, 0.25);
            --radius-lg: 2rem;
            --radius-md: 1.25rem;
            --radius-full: 60px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --glass-bg: rgba(20, 16, 10, 0.7);
            --glass-border: rgba(255, 217, 102, 0.3);
            --glass-blur: blur(18px);
            --color-common: #b0a090;
            --color-rare: #5b9bd5;
            --color-epic: #a855f7;
            --color-legendary: #f59e0b;
            --color-mythic: #ff3366;
            --neon-gold: 0 0 20px rgba(255, 200, 60, 0.7), 0 0 40px rgba(255, 180, 40, 0.4), 0 0 80px rgba(255, 160, 20, 0.25);
            --neon-common: 0 0 15px rgba(176, 160, 144, 0.5);
            --neon-rare: 0 0 20px rgba(91, 155, 213, 0.6), 0 0 45px rgba(91, 155, 213, 0.3);
            --neon-epic: 0 0 22px rgba(168, 85, 247, 0.65), 0 0 50px rgba(168, 85, 247, 0.35);
            --neon-legendary: 0 0 28px rgba(245, 158, 11, 0.75), 0 0 60px rgba(245, 158, 11, 0.4), 0 0 100px rgba(245, 158, 11, 0.2);
            --neon-mythic: 0 0 30px rgba(255, 51, 102, 0.8), 0 0 55px rgba(255, 200, 60, 0.5), 0 0 90px rgba(255, 51, 102, 0.35), 0 0 130px rgba(255, 180, 40, 0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #030202;
            color: #f5f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 25% 15%, rgba(255, 180, 40, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(255, 140, 20, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 40% 80%, rgba(200, 130, 30, 0.03) 0%, transparent 50%);
        }
        body.reduced-motion * {
            animation-duration: 0.01ms !important;
            transition-duration: 0.01ms !important;
        }

        /* ═══════════════ PARTICLES ═══════════════ */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: floatUp var(--dur, 7s) infinite ease-in;
            animation-delay: var(--delay, 0s);
            background: var(--gold);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0);
                opacity: 0;
            }
            12% {
                opacity: 0.6;
                transform: scale(1);
            }
            45% {
                transform: translateY(35vh) scale(0.5);
                opacity: 0.18;
            }
            100% {
                transform: translateY(-25vh) scale(0);
                opacity: 0;
            }
        }
        .spark-particle {
            position: fixed;
            pointer-events: none;
            z-index: 300;
            border-radius: 50%;
            animation: sparkBurst 0.9s ease-out forwards;
        }
        @keyframes sparkBurst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--sx, 40px), var(--sy, -80px)) scale(0);
                opacity: 0;
            }
        }
        .coin-particle {
            position: fixed;
            pointer-events: none;
            z-index: 250;
            font-size: 1.5rem;
            animation: coinFly 0.85s ease-out forwards;
            text-shadow: 0 0 8px gold;
        }
        @keyframes coinFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }
            70% {
                opacity: 0.75;
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx, 35px), var(--ty, -70px)) scale(1.3) rotate(var(--rot, 180deg));
            }
        }
        .red-flash {
            animation: flashRed 0.35s ease-in-out 2;
        }
        @keyframes flashRed {
            0%,
            100% {
                background-color: transparent;
                box-shadow: none;
            }
            50% {
                background-color: rgba(255, 30, 0, 0.55);
                box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
            }
        }
        .gold-flash {
            animation: flashGold 0.5s ease-in-out 1;
        }
        @keyframes flashGold {
            0%,
            100% {
                box-shadow: none;
            }
            50% {
                box-shadow: 0 0 70px rgba(255, 217, 102, 0.95), 0 0 120px rgba(255, 180, 40, 0.6);
            }
        }

        /* ═══════════════ LAYOUT ═══════════════ */
        .game-container {
            max-width: 680px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            position: relative;
            z-index: 1;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-full);
            padding: 0.6rem 1.6rem;
            border: 1px solid var(--glass-border);
            flex-wrap: wrap;
            gap: 0.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        .back-home {
            text-decoration: none;
            color: var(--gold);
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 217, 102, 0.1);
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .back-home:hover {
            background: rgba(255, 217, 102, 0.22);
            border-color: rgba(255, 217, 102, 0.4);
        }
        .balance-tag {
            background: rgba(25, 20, 12, 0.85);
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid rgba(255, 217, 102, 0.45);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .balance-tag i {
            color: var(--gold-bright);
            font-size: 1rem;
        }
        .sound-btn {
            background: rgba(255, 217, 102, 0.08);
            border: 1px solid rgba(255, 217, 102, 0.25);
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--gold-bright);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .sound-btn:hover {
            background: rgba(255, 217, 102, 0.2);
            border-color: rgba(255, 217, 102, 0.5);
        }

        /* ═══════════════ MAIN CARD ═══════════════ */
        .main-card {
            background: linear-gradient(160deg, rgba(22, 18, 13, 0.92) 0%, rgba(10, 8, 5, 0.96) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: var(--radius-lg);
            padding: 1.6rem 1.4rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.65), var(--shadow-gold), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            text-align: center;
            position: relative;
            overflow: visible;
            transition: all 0.4s ease;
        }
        .main-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 217, 102, 0.4), transparent 40%, transparent 60%, rgba(255, 217, 102, 0.25));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }
        .main-card>* {
            position: relative;
            z-index: 1;
        }
        .main-card h2 {
            color: var(--gold-bright);
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 12px rgba(255, 200, 60, 0.5);
            margin-bottom: 0.2rem;
        }
        .rarity-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
        .rarity-common {
            background: rgba(176, 160, 144, 0.25);
            color: #c5b9a8;
            border: 1px solid rgba(176, 160, 144, 0.5);
        }
        .rarity-rare {
            background: rgba(91, 155, 213, 0.25);
            color: #8cc8ff;
            border: 1px solid rgba(91, 155, 213, 0.5);
        }
        .rarity-epic {
            background: rgba(168, 85, 247, 0.25);
            color: #c49dff;
            border: 1px solid rgba(168, 85, 247, 0.5);
        }
        .rarity-legendary {
            background: rgba(245, 158, 11, 0.25);
            color: #ffc944;
            border: 1px solid rgba(245, 158, 11, 0.5);
        }
        .rarity-mythic {
            background: rgba(255, 51, 102, 0.25);
            color: #ff7b9c;
            border: 1px solid rgba(255, 51, 102, 0.5);
            animation: mythicShimmer 2s infinite;
        }
        @keyframes mythicShimmer {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 51, 102, 0.4);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 200, 60, 0.7), 0 0 40px rgba(255, 51, 102, 0.5);
            }
        }

        /* ═══════════════ CRATE STAGE ═══════════════ */
        .crate-stage {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.8rem 0;
            position: relative;
            border-radius: var(--radius-md);
            transition: all 0.3s;
        }
        .crate {
            width: 150px;
            height: 130px;
            background: linear-gradient(160deg, #5a4a30, #3a2e1e);
            border: 3px solid #c9a840;
            border-radius: 22px;
            position: relative;
            transition: all 0.25s ease;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(200, 150, 50, 0.3);
        }
        .crate::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 4%;
            width: 92%;
            height: 26px;
            background: linear-gradient(160deg, #e8c44c, #8a6d1a);
            border-radius: 10px 10px 0 0;
            border: 2px solid #ffd966;
            border-bottom: none;
        }
        .crate::after {
            content: '?';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: rgba(255, 217, 102, 0.7);
            font-family: 'Playfair Display', serif;
            text-shadow: 0 0 20px rgba(255, 200, 60, 0.5);
            transition: all 0.3s;
            pointer-events: none;
        }
        .round-live .crate:not(.open-safe):not(.trap-open) {
            animation: pulseGold 1.3s infinite ease-in-out;
            cursor: pointer;
        }
        @keyframes pulseGold {
            0% {
                box-shadow: 0 0 8px rgba(255, 217, 102, 0.4), inset 0 0 8px rgba(255, 217, 102, 0.15);
                border-color: rgba(255, 217, 102, 0.45);
            }
            50% {
                box-shadow: 0 0 35px rgba(255, 217, 102, 0.85), inset 0 0 22px rgba(255, 217, 102, 0.55);
                border-color: #ffd966;
            }
            100% {
                box-shadow: 0 0 8px rgba(255, 217, 102, 0.4), inset 0 0 8px rgba(255, 217, 102, 0.15);
                border-color: rgba(255, 217, 102, 0.45);
            }
        }
        .crate.open-safe {
            animation: crateSafeOpen 0.7s ease-out forwards;
        }
        @keyframes crateSafeOpen {
            0% {
                transform: scale(1);
            }
            35% {
                transform: scale(1.14);
            }
            100% {
                transform: scale(1);
            }
        }
        .crate.trap-open {
            animation: crateTrapShake 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        @keyframes crateTrapShake {
            0%,
            100% {
                transform: translateX(0) rotate(0deg);
                background: #5a4a30;
            }
            15% {
                transform: translateX(-16px) rotate(-4deg);
                background: #8b1a1a;
            }
            30% {
                transform: translateX(16px) rotate(4deg);
                background: #a12323;
            }
            45% {
                transform: translateX(-9px) rotate(-2.5deg);
                background: #6b1111;
            }
            60% {
                transform: translateX(9px) rotate(2.5deg);
                background: #8b1a1a;
            }
            75% {
                transform: translateX(-4px) rotate(-1deg);
            }
        }
        /* Rarity crate styles */
        .crate.rarity-c-common {
            background: linear-gradient(160deg, #6b6055, #4a4038);
            border-color: #9e8e7a;
        }
        .crate.rarity-c-rare {
            background: linear-gradient(160deg, #3d5f80, #263d55);
            border-color: #5b9bd5;
        }
        .crate.rarity-c-epic {
            background: linear-gradient(160deg, #553d70, #35244a);
            border-color: #a855f7;
        }
        .crate.rarity-c-legendary {
            background: linear-gradient(160deg, #6b4a1a, #4a3010);
            border-color: #f5b042;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
        }
        .crate.rarity-c-mythic {
            background: linear-gradient(160deg, #6b1a3a, #3a1020);
            border-color: #ff3366;
            box-shadow: 0 0 45px rgba(255, 51, 102, 0.55), 0 0 80px rgba(255, 180, 40, 0.3);
            animation: mythicCrateGlow 1.5s infinite ease-in-out;
        }
        @keyframes mythicCrateGlow {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(255, 51, 102, 0.5), 0 0 60px rgba(255, 180, 40, 0.2);
            }
            50% {
                box-shadow: 0 0 55px rgba(255, 51, 102, 0.8), 0 0 90px rgba(255, 200, 60, 0.45), 0 0 120px rgba(255, 180, 40, 0.3);
            }
        }
        .peek-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 100px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 20;
            font-family: 'Playfair Display', serif;
        }
        .peek-overlay.safe {
            background: radial-gradient(circle, rgba(76, 175, 80, 0.85), rgba(30, 100, 40, 0.75));
            opacity: 1;
            color: #fff;
            box-shadow: 0 0 40px #4caf50, inset 0 0 18px rgba(255, 255, 200, 0.7);
            text-shadow: 0 0 12px #2e7d32;
        }
        .peek-overlay.trap {
            background: radial-gradient(circle, rgba(255, 70, 70, 0.9), rgba(160, 20, 20, 0.85));
            opacity: 1;
            color: #ffcccc;
            box-shadow: 0 0 50px #ff3b3b, inset 0 0 22px darkred;
            text-shadow: 0 0 10px #a10000;
        }
        .info-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            margin: 0.6rem 0;
            border: 1px solid rgba(255, 217, 102, 0.22);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .multiplier-big {
            font-size: 2.6rem;
            font-weight: 900;
            color: var(--gold-bright);
            text-shadow: 0 0 25px rgba(255, 217, 102, 0.7);
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.03em;
        }
        .cost-row {
            display: flex;
            justify-content: center;
            gap: 1.8rem;
            flex-wrap: wrap;
            margin: 0.5rem 0;
            font-size: 0.85rem;
            color: #bfb6a4;
        }
        .action-row {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.7rem 0;
        }
        .btn {
            border: none;
            border-radius: var(--radius-full);
            font-weight: 700;
            cursor: pointer;
            padding: 0.6rem 1.4rem;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
        }
        .btn:active {
            transform: translateY(2px);
        }
        .btn:disabled {
            opacity: 0.45;
            pointer-events: none;
            filter: grayscale(30%);
        }
        .btn-cashout {
            background: linear-gradient(135deg, #4caf50, #66bb6a);
            color: #1a150e;
            box-shadow: 0 4px 0 #2e7d32, 0 6px 18px rgba(76, 175, 80, 0.3);
        }
        .btn-cashout:hover:not(:disabled) {
            box-shadow: 0 4px 0 #2e7d32, 0 8px 28px rgba(76, 175, 80, 0.55);
        }
        .btn-continue {
            background: rgba(255, 150, 80, 0.2);
            border: 1px solid rgba(255, 150, 80, 0.5);
            color: #ffb88c;
        }
        .btn-continue:hover:not(:disabled) {
            background: rgba(255, 150, 80, 0.38);
            box-shadow: 0 0 20px rgba(255, 150, 80, 0.3);
        }
        .btn-scout {
            background: rgba(100, 149, 237, 0.18);
            border: 1px solid rgba(100, 149, 237, 0.5);
            color: #b8d4ff;
        }
        .btn-scout:hover:not(:disabled) {
            background: rgba(100, 149, 237, 0.35);
            box-shadow: 0 0 20px rgba(100, 149, 237, 0.3);
        }
        .btn-auto {
            background: rgba(200, 130, 50, 0.18);
            border: 1px solid rgba(200, 130, 50, 0.5);
            color: #ffcc80;
            font-size: 0.8rem;
            padding: 0.45rem 1rem;
        }
        .btn-auto:hover:not(:disabled) {
            background: rgba(200, 130, 50, 0.35);
        }
        .btn-auto.active {
            background: rgba(255, 150, 50, 0.45);
            border-color: #ffa040;
            animation: autoPulse 1s infinite;
        }
        @keyframes autoPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 150, 50, 0.4);
            }
            50% {
                box-shadow: 0 0 22px rgba(255, 150, 50, 0.7);
            }
        }
        .btn-play {
            background: linear-gradient(135deg, #f5b042, #ffd966);
            color: #1a150e;
            box-shadow: 0 4px 0 #a05f15, 0 6px 20px rgba(245, 176, 66, 0.3);
            font-size: 1rem;
            padding: 0.65rem 1.8rem;
        }
        .btn-play:hover:not(:disabled) {
            box-shadow: 0 4px 0 #a05f15, 0 10px 30px rgba(245, 176, 66, 0.55);
        }
        .bet-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.5rem 0;
        }
        .bet-input {
            width: 100px;
            background: #0f0d0b;
            border: 2px solid var(--gold);
            border-radius: 25px;
            padding: 0.55rem 0.5rem;
            text-align: center;
            color: var(--gold-bright);
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .bet-input:focus {
            outline: none;
            border-color: #ffb840;
            box-shadow: 0 0 18px rgba(255, 180, 60, 0.5);
        }
        .bet-input:disabled {
            opacity: 0.5;
            background: #1a1410;
        }
        .message {
            text-align: center;
            font-weight: 600;
            min-height: 1.8rem;
            margin: 0.3rem 0;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .event-indicator {
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            animation: eventGlow 1s infinite ease-in-out;
            margin: 0.3rem 0;
        }
        @keyframes eventGlow {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.5);
            }
        }
        .event-golden-rush {
            background: rgba(255, 180, 40, 0.3);
            color: #ffd966;
            border: 1px solid rgba(255, 180, 40, 0.6);
        }
        .event-cursed {
            background: rgba(180, 30, 30, 0.3);
            color: #ff6666;

    <script>
        (function() {
            /* ═══════════════════════════════════════════════
               GOLD MYSTERY CRATES - PREMIUM CASINO EDITION
               Refactored & Enhanced | Vanilla JS
               ═══════════════════════════════════════════════ */

            // ──────────────── DOM REFS ────────────────
            const $ = (s) => document.querySelector(s);
            const $$ = (s) => document.querySelectorAll(s);

            const dom = {
                crateVisual: $('#crateVisual'),
                peekOverlay: $('#peekOverlay'),

                cashValueEl: $('#cashValue'),
                continueCostText: $('#continueCostText'),

                actionButtons: $('#actionButtons'),

                currentRarityBadge: $('#currentRarityBadge'),

                toastContainer: $('#toastContainer'),

                settingsModal: $('#settingsModal'),
                statsModal: $('#statsModal'),
                inventoryModal: $('#inventoryModal'),
                achievementsModal: $('#achievementsModal'),

                masterVolume: $('#masterVolume'),
