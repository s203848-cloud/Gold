                reducedMotion: $('#reducedMotion'),
                masterVolLabel: $('#masterVolLabel'),
                musicVolLabel: $('#musicVolLabel'),
                sfxVolLabel: $('#sfxVolLabel'),
            };

            // ──────────────── AUDIO ENGINE ────────────────
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.masterGain = null;
                    this.musicGain = null;
                    this.sfxGain = null;
                    this.soundEnabled = true;
                    this.masterVolume = 0.8;
                    this.musicVolume = 0.5;
                    this.sfxVolume = 0.9;
                    this.activeOscillators = [];
                    this.ambientNode = null;
                    this.initialized = false;
                }

                async init() {
                    if (this.initialized) return;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = this.masterVolume;
                        this.masterGain.connect(this.ctx.destination);
                        this.musicGain = this.ctx.createGain();
                        this.musicGain.gain.value = this.musicVolume;
                        this.musicGain.connect(this.masterGain);
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.gain.value = this.sfxVolume;
                        this.sfxGain.connect(this.masterGain);
                        this.initialized = true;
                    } catch (e) {
                        console.warn('Audio init failed:', e);
                    }
                }

                async resume() {
                    if (!this.ctx || !this.soundEnabled) return;
                    if (this.ctx.state === 'suspended') {
                        try { await this.ctx.resume(); } catch (e) {}
                    }
                }

                setMasterVolume(v) { this.masterVolume = v;
                    this.masterGain && (this.masterGain.gain.value = v); }
                setMusicVolume(v) { this.musicVolume = v;
                    this.musicGain && (this.musicGain.gain.value = v); }
                setSfxVolume(v) { this.sfxVolume = v;
                    this.sfxGain && (this.sfxGain.gain.value = v); }

                playSfx(type, rarity = 'common') {
                    if (!this.soundEnabled || !this.ctx || !this.initialized) return;
                    this.resume();
                    const now = this.ctx.currentTime;
                    const dest = this.sfxGain;
                    const cleanup = (oscs) => {
                        oscs.forEach(o => { try { o.stop(); } catch (e) {} });
                    };

                    switch (type) {
                        case 'safe': {
                            const freq = rarity === 'mythic' ? 1200 : rarity === 'legendary' ? 1050 : rarity ===
                                'epic' ? 950 : 880;
                            const o1 = this.ctx.createOscillator(),
                                g1 = this.ctx.createGain();
                            o1.connect(g1);
                            g1.connect(dest);
                            o1.type = 'sine';
                            o1.frequency.value = freq;
                            g1.gain.setValueAtTime(0.18, now);
                            g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.75);
                            o1.start(now);
                            o1.stop(now + 0.7);
                            const o2 = this.ctx.createOscillator(),
                                g2 = this.ctx.createGain();
                            o2.connect(g2);
                            g2.connect(dest);
                            o2.type = 'triangle';
                            o2.frequency.value = freq * 1.25;
                            g2.gain.setValueAtTime(0.1, now + 0.06);
                            g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
                            o2.start(now + 0.06);
                            o2.stop(now + 0.8);
                            break;
                        }
                        case 'trap': {
                            const o1 = this.ctx.createOscillator(),
                                g1 = this.ctx.createGain();
                            o1.connect(g1);
                            g1.connect(dest);
                            o1.type = 'sawtooth';
                            o1.frequency.value = 65;
                            g1.gain.setValueAtTime(0.2, now);
                            g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
                            o1.start(now);
                            o1.stop(now + 0.8);
                            const o2 = this.ctx.createOscillator(),
                                g2 = this.ctx.createGain();
                            o2.connect(g2);
                            g2.connect(dest);
                            o2.type = 'sine';
                            o2.frequency.value = 40;
                            g2.gain.setValueAtTime(0.14, now);
                            g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
                            o2.start(now);
                            o2.stop(now + 0.8);
                            break;
                        }
                        case 'scout': {
                            const o1 = this.ctx.createOscillator(),
                                g1 = this.ctx.createGain();
                            o1.connect(g1);
                            g1.connect(dest);
                            o1.type = 'sine';
                            o1.frequency.value = 1250;
                            g1.gain.setValueAtTime(0.09, now);
                            g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
                            o1.start(now);
                            o1.stop(now + 0.4);
                            const o2 = this.ctx.createOscillator(),
                                g2 = this.ctx.createGain();
                            o2.connect(g2);
                            g2.connect(dest);
                            o2.type = 'sine';
                            o2.frequency.value = 1600;
                            g2.gain.setValueAtTime(0.05, now + 0.1);
                            g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
                            o2.start(now + 0.1);
                            o2.stop(now + 0.45);
                            break;
                        }
                        case 'cashout': {
                            const o = this.ctx.createOscillator(),
                                g = this.ctx.createGain();
                            o.connect(g);
                            g.connect(dest);
                            o.type = 'sine';
                            o.frequency.setValueAtTime(900, now);
                            o.frequency.linearRampToValueAtTime(1400, now + 0.4);
                            g.gain.setValueAtTime(0.12, now);
                            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
                            o.start(now);
                            o.stop(now + 0.5);
                            break;
                        }
                        case 'jackpot': {
                            for (let i = 0; i < 4; i++) {
                                const o = this.ctx.createOscillator(),
                                    g = this.ctx.createGain();
                                o.connect(g);
                                g.connect(dest);
                                o.type = 'sine';
                                o.frequency.value = 600 + i * 200;
                                g.gain.setValueAtTime(0.1, now + i * 0.08);
                                g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.7);
                                o.start(now + i * 0.08);
                                o.stop(now + i * 0.08 + 0.65);
                            }
                            break;
                        }
                        case 'click': {
                            const o = this.ctx.createOscillator(),
                                g = this.ctx.createGain();
                            o.connect(g);
                            g.connect(dest);
                            o.type = 'sine';
                            o.frequency.value = 600;
                            g.gain.setValueAtTime(0.06, now);
                            g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
                            o.start(now);
                            o.stop(now + 0.1);
                            break;
                        }
                    }
                }

                startAmbient() {
                    if (!this.soundEnabled || !this.ctx || !this.initialized || this.ambientNode) return;
                    this.resume();
                    const now = this.ctx.currentTime;
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.connect(g);
                    g.connect(this.musicGain);
                    o.type = 'sine';
                    o.frequency.value = 55;
                    g.gain.value = 0.03;
                    o.start(now);
                    this.ambientNode = { osc: o, gain: g };
                }

                stopAmbient() {
                    if (this.ambientNode) {
                        try { this.ambientNode.osc.stop(); } catch (e) {}
                        this.ambientNode = null;
                    }
                }

                destroy() {
                    this.stopAmbient();
                    if (this.ctx) {
                        this.ctx.close().catch(() => {});
                        this.ctx = null;
                    }
                    this.initialized = false;
                }
            }

            const audio = new AudioEngine();

            // ──────────────── PARTICLE MANAGER ────────────────
            class ParticleManager {
                constructor() {
                    this.container = $('#particlesContainer');
                    this.pool = [];
                    this.initBgParticles();
                }

                initBgParticles() {
                    for (let i = 0; i < 24; i++) {
                        const p = document.createElement('div');
                        p.className = 'particle';
                        p.style.width = p.style.height = (Math.random() * 5 + 2) + 'px';
                        p.style.left = Math.random() * 100 + '%';
                        p.style.setProperty('--delay', Math.random() * 9 + 's');
                        p.style.setProperty('--dur', (Math.random() * 6 + 5) + 's');
                        p.style.background = Math.random() < 0.3 ?
                            '#ffe484' : 'var(--gold)';
                        this.container.appendChild(p);
                    }
                }

                spawnSparks(x, y, count, color = '#ffd966') {
                    for (let i = 0; i < count; i++) {
                        const spark = document.createElement('div');
                        spark.className = 'spark-particle';
                        spark.style.left = x + 'px';
                        spark.style.top = y + 'px';
                        spark.style.width = spark.style.height = (Math.random() * 6 + 3) + 'px';
                        spark.style.background = color;
                        spark.style.setProperty('--sx', (Math.random() * 120 - 60) + 'px');
                        spark.style.setProperty('--sy', -(Math.random() * 100 + 40) + 'px');
                        spark.style.boxShadow = `0 0 ${Math.random()*10+5}px ${color}`;
                        document.body.appendChild(spark);
                        setTimeout(() => spark.remove(), 950);
                    }
                }

                spawnCoins(x, y, count = 16) {
                    for (let i = 0; i < count; i++) {
                        const coin = document.createElement('div');
                        coin.className = 'coin-particle';
                        coin.innerHTML = ['🪙', '💰', '✨', '💎'][Math.floor(Math.random() * 4)];
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 60 + Math.random() * 110;
                        coin.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                        coin.style.setProperty('--ty', Math.sin(angle) * dist - 50 - Math.random() * 50 + 'px');
                        coin.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
                        coin.style.left = (x - 12) + 'px';
                        coin.style.top = (y - 12) + 'px';
                        coin.style.fontSize = (Math.random() * 1.2 + 1.2) + 'rem';
                        document.body.appendChild(coin);
                        setTimeout(() => coin.remove(), 900);
                    }
                }

                getCrateCenter() {
                    const el = dom.crateVisual;
                    if (!el) return { x: 0, y: 0 };
                    const rect = el.getBoundingClientRect();
                    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                }
            }

            const particles = new ParticleManager();

            // ──────────────── TOAST SYSTEM ────────────────
            function showToast(msg, icon = '✨') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `${icon} ${msg}`;
                dom.toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            // ──────────────── USER DATA ────────────────
            let currentUser = null;

            function getUsers() { return JSON.parse(localStorage.getItem('gold_users') || '{}'); }

            function saveUsers(users) { localStorage.setItem('gold_users', JSON.stringify(users)); }

            function initUserDefaults(u) {
                const defaults = {
                    globalStats: { totalWagered: 0, totalWon: 0, totalLosses: 0, totalGames: 0, currentStreak: 0,
                        bestStreak: 0, totalWins: 0 },
                    transactions: [],
                    gameOutcomes: [],
                    gamePlayCount: {},
                    balance: 0,
                    xp: 0,
                    level: 1,
                    prestigeLevel: 0,
                    avatar: 'fas fa-crown',
                    theme: 'theme-gold',
                    earnedAchievements: [],
                    dailyBalanceSnapshots: [],
                    mysteryCratesStats: { roundsPlayed: 0, wins: 0, losses: 0, bestMultiplier: 1.0, cratesOpened: 0,
                        totalContinuationFees: 0, totalScoutFees: 0, bestStreak: 0, highestRarityFound: 'common',
                        cratesByRarity: { common: 0, rare: 0, epic: 0, legendary: 0, mythic: 0 },
                        eventsTriggered: 0, shieldsUsed: 0, jackpotChains: 0 },
                    crateCollection: { common: 0, rare: 0, epic: 0, legendary: 0, mythic: 0 },
                    lastDailyReward: null,
                    dailyStreak: 0,
                    quests: [],
                    completedQuests: [],
                };
                for (const k in defaults) {
                    if (u[k] === undefined) u[k] = defaults[k];
                }
                if (!u.mysteryCratesStats.cratesByRarity) u.mysteryCratesStats.cratesByRarity = { common: 0, rare: 0,
                    epic: 0, legendary: 0, mythic: 0 };
                if (!u.crateCollection) u.crateCollection = { common: 0, rare: 0, epic: 0, legendary: 0, mythic: 0 };
                if (!u.level) u.level = 1;
                if (!u.prestigeLevel) u.prestigeLevel = 0;
                if (!u.quests) u.quests = [];
                if (!u.completedQuests) u.completedQuests = [];
                return u;
            }

            async function loadUser() {
                const sess = sessionStorage.getItem('gold_current_user');
                if (!sess) { window.location.href = '../../sign-in.html'; return false; }
                const sessionUser = JSON.parse(sess);
                const users = getUsers();
                let user = users[sessionUser.username];
                if (!user) { sessionStorage.removeItem('gold_current_user');
                    window.location.href = '../../sign-in.html'; return false; }
                currentUser = initUserDefaults(user);
                sessionUser.balance = currentUser.balance;
                sessionStorage.setItem('gold_current_user', JSON.stringify(sessionUser));
                return true;
            }

            function saveUser() {
                const users = getUsers();
                users[currentUser.username] = currentUser;
                saveUsers(users);
                const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
                if (sess) { sess.balance = currentUser.balance;
                    sessionStorage.setItem('gold_current_user', JSON.stringify(sess)); }
            }

            function updateBalanceDisplay() {
                dom.headerBalance.textContent = currentUser.balance.toLocaleString();
                updateStartBtnState();
            }

            function updateStartBtnState() {
                const betVal = parseInt(dom.betInput.value);
                dom.startBtn.disabled = gameState.gameActive || isNaN(betVal) || betVal < 1 || betVal > (currentUser
                    ?.balance || 0);
            }

            // ──────────────── GAME STATE ────────────────
            const RARITIES = ['common', 'rare', 'epic', 'legendary', 'mythic'];
            const RARITY_WEIGHTS = { common: 50, rare: 28, epic: 14, legendary: 6, mythic: 2 };
            const RARITY_MULTIPLIERS = { common: 1.5, rare: 2.2, epic: 3.5, legendary: 6.0, mythic: 12.0 };
            const RARITY_COLORS = { common: '#b0a090', rare: '#5b9bd5', epic: '#a855f7', legendary: '#f5b042',
                mythic: '#ff3366' };
            const RARITY_GLOWS = { common: 'var(--neon-common)', rare: 'var(--neon-rare)', epic: 'var(--neon-epic)',
                legendary: 'var(--neon-legendary)', mythic: 'var(--neon-mythic)' };
            const RARITY_ICONS = { common: '📦', rare: '💠', epic: '🔮', legendary: '👑', mythic: '💎' };
            const BASE_TRAP_PROB = 0.2;

            const gameState = {
                bet: 50,
                multiplier: 1.0,
                safeCrates: 0,
                streakCount: 0,
                continueCost: 20,
                scoutCost: 25,
                nextCrateType: null,
                nextCrateRarity: 'common',
                peekedThisCrate: false,
                gameActive: false,
                roundActive: false,
                sessionProfit: 0,
                processingAction: false,
                currentRarity: 'common',
                shieldCharges: 0,
                eventActive: null,
                eventRemaining: 0,
                autoOpenMode: false,
                autoOpenTimer: null,
                jackpotChainCount: 0,
                trapProb: BASE_TRAP_PROB,
                comboCount: 0,
            };

            function resetGameState() {
                gameState.bet = parseInt(dom.betInput.value) || 50;
                gameState.multiplier = 1.0;
                gameState.safeCrates = 0;
                gameState.streakCount = 0;
                gameState.continueCost = 20;
                gameState.scoutCost = 25;
                gameState.nextCrateType = null;
                gameState.nextCrateRarity = 'common';
                gameState.peekedThisCrate = false;
                gameState.gameActive = false;
                gameState.roundActive = false;
                gameState.processingAction = false;
                gameState.currentRarity = 'common';
                gameState.shieldCharges = 0;
                gameState.eventActive = null;
                gameState.eventRemaining = 0;
                gameState.jackpotChainCount = 0;
                gameState.trapProb = BASE_TRAP_PROB;
                gameState.comboCount = 0;
                if (gameState.autoOpenTimer) { clearTimeout(gameState.autoOpenTimer);
                    gameState.autoOpenTimer = null; }
                gameState.autoOpenMode = false;
                dom.autoOpenBtn.classList.remove('active');
                dom.autoOpenBtn.innerHTML = '<i class="fas fa-robot"></i> AUTO';
            }

            // ──────────────── RARITY SYSTEM ────────────────
            function rollRarity() {
                const totalWeight = Object.values(RARITY_WEIGHTS).reduce((a, b) => a + b, 0);
                let roll = Math.random() * totalWeight;
                for (const rarity of RARITIES) {
                    roll -= RARITY_WEIGHTS[rarity];
                    if (roll <= 0) return rarity;
                }
                return 'common';
            }

            function getRarityMultiplier(rarity) {
                return RARITY_MULTIPLIERS[rarity] || 1.5;
            }

            function applyRarityToCrate(rarity) {
                dom.crateVisual.className = 'crate';
                dom.crateVisual.classList.add('rarity-c-' + rarity);
                dom.currentRarityBadge.style.display = 'inline-block';
                dom.currentRarityBadge.textContent = rarity.toUpperCase();
                dom.currentRarityBadge.className = 'rarity-badge rarity-' + rarity;
                gameState.currentRarity = rarity;
            }

            function updateCrateGlow(rarity) {
                const glowVal = RARITY_GLOWS[rarity] || 'var(--neon-common)';
                dom.crateVisual.style.boxShadow = glowVal;
            }

            // ──────────────── RANDOM EVENTS ────────────────
            const EVENTS = ['golden_rush', 'cursed_crate', 'double_or_nothing', 'treasure_storm', 'lucky_shield'];

            function tryTriggerEvent() {
                if (gameState.eventActive) return;
                const chance = 0.08 + (gameState.safeCrates * 0.03);
                if (Math.random() < Math.min(chance, 0.35)) {
                    const evt = EVENTS[Math.floor(Math.random() * EVENTS.length)];
                    activateEvent(evt);
                }
            }

            function activateEvent(evt) {
                gameState.eventActive = evt;
                gameState.eventRemaining = 3;
                let bannerHTML = '';
                switch (evt) {
                    case 'golden_rush':
                        bannerHTML =
                            '<span class="event-indicator event-golden-rush">🌟 GOLDEN RUSH! All rarities boosted!</span>';
                        showToast('Golden Rush! Crates are more valuable!', '🌟');
                        break;
                    case 'cursed_crate':
                        bannerHTML =
                            '<span class="event-indicator event-cursed">💀 CURSED CRATE! Higher risk, higher reward!</span>';
                        gameState.trapProb = 0.4;
                        showToast('Cursed Crate! Danger ahead...', '💀');
                        break;
                    case 'double_or_nothing':
                        bannerHTML =
                            '<span class="event-indicator event-double">⚡ DOUBLE OR NOTHING! Next safe crate doubles!</span>';
                        showToast('Double or Nothing!', '⚡');
                        break;
                    case 'treasure_storm':
                        bannerHTML =
                            '<span class="event-indicator event-treasure">💎 TREASURE STORM! Guaranteed safe crates!</span>';
                        gameState.trapProb = 0.02;
                        showToast('Treasure Storm! Safe crates incoming!', '💎');
                        break;
                    case 'lucky_shield':
                        bannerHTML =
                            '<span class="event-indicator event-shield">🛡️ LUCKY SHIELD! Block one trap!</span>';
                        gameState.shieldCharges += 1;
                        showToast('Lucky Shield granted!', '🛡️');
                        break;
                }
                dom.eventBanner.innerHTML = bannerHTML;
                currentUser.mysteryCratesStats.eventsTriggered++;
                saveUser();
            }

            function deactivateEvent() {
                gameState.eventActive = null;
                gameState.eventRemaining = 0;
                gameState.trapProb = BASE_TRAP_PROB;
                dom.eventBanner.innerHTML = '';
            }

            function tickEvent() {
                if (!gameState.eventActive) return;
                gameState.eventRemaining--;
                if (gameState.eventRemaining <= 0) {
                    deactivateEvent();
                }
            }

            // ──────────────── UI HELPERS ────────────────
            function updateUI() {
                dom.multiplierDisplay.textContent = gameState.multiplier.toFixed(3) + '×';
                dom.cashValueEl.textContent = (gameState.bet * gameState.multiplier).toFixed(2);
                dom.continueCostText.textContent = gameState.continueCost + ' GOLD';
                dom.scoutCostText.textContent = gameState.scoutCost + ' GOLD';
                dom.safeCountEl.textContent = gameState.safeCrates;
                dom.streakCountEl.textContent = gameState.streakCount;

                if (gameState.shieldCharges > 0) {
                    dom.shieldStatus.style.display = 'block';
                    dom.shieldChargesEl.textContent = gameState.shieldCharges;
                } else {
                    dom.shieldStatus.style.display = 'none';
                }

                const canContinue = currentUser && currentUser.balance >= gameState.continueCost;
                const canScout = currentUser && currentUser.balance >= gameState.scoutCost && !gameState.peekedThisCrate;
                dom.continueBtn.disabled = !gameState.gameActive || !canContinue || gameState.processingAction;
                dom.scoutBtn.disabled = !gameState.gameActive || !canScout || gameState.processingAction;
                dom.cashoutBtn.disabled = !gameState.gameActive || gameState.processingAction;
                dom.autoOpenBtn.disabled = !gameState.gameActive || gameState.processingAction;
                updateSessionDisplay();
                updateStartBtnState();
            }

            function clearPeekOverlay() {
                dom.peekOverlay.className = 'peek-overlay';
                dom.peekOverlay.innerHTML = '';
            }

            function resetRoundUI() {
                dom.infoPanel.style.display = 'none';
                dom.actionButtons.style.display = 'none';
                dom.betRow.style.display = 'flex';
                dom.crateVisual.className = 'crate';
                dom.crateVisual.style.boxShadow = '';
                clearPeekOverlay();
                dom.startBtn.disabled = false;
                dom.betInput.disabled = false;
                dom.eventBanner.innerHTML = '';
                dom.currentRarityBadge.style.display = 'none';
                dom.shieldStatus.style.display = 'none';
                dom.gameContainer.classList.remove('round-live');
                dom.resultMessage.innerHTML = '';
                dom.autoOpenBtn.classList.remove('active');
            }

            function updateSessionDisplay() {
                const prof = gameState.sessionProfit;
                dom.sessionProfEl.textContent =
                    `📊 Session P/L: ${prof>=0?'+':''}${prof.toFixed(2)} GOLD`;
                dom.sessionProfEl.className = 'session-prof' + (prof > 0 ? ' positive' : prof < 0 ? ' negative' : '');
            }

            function setRoundLive(active) {
                if (active) dom.gameContainer.classList.add('round-live');
                else dom.gameContainer.classList.remove('round-live');
            }

            // ──────────────── VISUAL EFFECTS ────────────────
            function showCoinBurst(rarity = 'common') {
                const center = particles.getCrateCenter();
                const count = rarity === 'mythic' ? 35 : rarity === 'legendary' ? 28 : rarity === 'epic' ? 22 : 16;
                particles.spawnCoins(center.x, center.y, count);
            }

            function showSparkBurst(rarity = 'common') {
                const center = particles.getCrateCenter();
                const color = RARITY_COLORS[rarity] || '#ffd966';
                const count = rarity === 'mythic' ? 40 : rarity === 'legendary' ? 30 : rarity === 'epic' ? 20 : 12;
                particles.spawnSparks(center.x, center.y, count, color);
            }

            function applyRedFlash() {
                dom.crateStage.classList.add('red-flash');
                setTimeout(() => dom.crateStage.classList.remove('red-flash'), 450);
            }

            function applyGoldFlash() {
                dom.mainCard.classList.add('gold-flash');
                setTimeout(() => dom.mainCard.classList.remove('gold-flash'), 550);
            }

            function screenShake(intensity = 3) {
                if (document.body.classList.contains('reduced-motion')) return;
                const card = dom.mainCard;
                const orig = card.style.transform || '';
                const shakes = 6;
                for (let i = 0; i < shakes; i++) {
                    setTimeout(() => {
                        card.style.transform =
                            `translate(${(Math.random()-0.5)*intensity*2}px, ${(Math.random()-0.5)*intensity*2}px)`;
                    }, i * 30);
                }
                setTimeout(() => { card.style.transform = orig; }, shakes * 30 + 20);
            }

            // ──────────────── GAME LOGIC ────────────────
            function generateCrateType() {
                return Math.random() < gameState.trapProb ? 'trap' : 'safe';
            }

            function startRound() {
                if (gameState.gameActive || gameState.processingAction) return;
                const betVal = parseInt(dom.betInput.value);
                if (isNaN(betVal) || betVal < 1 || betVal > currentUser.balance) {
                    dom.resultMessage.innerHTML =
                        '<span style="color:#ff6b6b;">Invalid bet or insufficient balance.</span>';
                    return;
                }
                audio.resume();
                audio.playSfx('click');
                resetGameState();
                gameState.bet = betVal;
                currentUser.balance -= betVal;
                gameState.sessionProfit -= betVal;
                saveUser();
                updateBalanceDisplay();

                gameState.gameActive = true;
                gameState.roundActive = true;
                gameState.processingAction = false;

                dom.betRow.style.display = 'none';
                dom.infoPanel.style.display = 'block';
                dom.actionButtons.style.display = 'flex';
                dom.currentRarityBadge.style.display = 'none';
                updateUI();
                setRoundLive(true);
                openCrate(true);
            }

            function openCrate(isFree = false) {
                if (!gameState.gameActive || gameState.processingAction) return;
                clearPeekOverlay();

                let crateType = gameState.nextCrateType || generateCrateType();
                let rarity = gameState.nextCrateRarity || rollRarity();
                gameState.nextCrateType = null;
                gameState.nextCrateRarity = 'common';
                gameState.peekedThisCrate = false;

                if (!isFree) {
                    if (currentUser.balance < gameState.continueCost) {
                        dom.resultMessage.innerHTML =
                            '<span style="color:#ff6b6b;">Not enough GOLD to open!</span>';
                        return;
                    }
                    currentUser.balance -= gameState.continueCost;
                    currentUser.mysteryCratesStats.totalContinuationFees += gameState.continueCost;
                    saveUser();
                    updateBalanceDisplay();
                }

                gameState.processingAction = true;
                updateUI();
                applyRarityToCrate(rarity);
                updateCrateGlow(rarity);

                dom.crateVisual.classList.remove('open-safe', 'trap-open');
                void dom.crateVisual.offsetWidth;

                if (crateType === 'safe') {
                    dom.crateVisual.classList.add('open-safe');
                    audio.playSfx('safe', rarity);
                    showCoinBurst(rarity);
                    showSparkBurst(rarity);
                    if (rarity === 'legendary' || rarity === 'mythic') {
                        applyGoldFlash();
                        if (rarity === 'mythic') screenShake(6);
                    }

                    const rarityMult = getRarityMultiplier(rarity);
                    let effectiveMult = rarityMult;
                    if (gameState.eventActive === 'double_or_nothing') effectiveMult *= 2;
                    if (gameState.eventActive === 'golden_rush') effectiveMult *= 1.5;
                    if (gameState.jackpotChainCount > 0) effectiveMult *= (1 + gameState.jackpotChainCount * 0.5);

                    gameState.multiplier = Math.round(gameState.multiplier * effectiveMult * 1000) / 1000;
                    gameState.safeCrates++;
                    gameState.streakCount++;
                    gameState.comboCount++;
                    currentUser.mysteryCratesStats.cratesOpened++;
                    currentUser.mysteryCratesStats.cratesByRarity[rarity] =
                        (currentUser.mysteryCratesStats.cratesByRarity[rarity] || 0) + 1;
                    currentUser.crateCollection[rarity] = (currentUser.crateCollection[rarity] || 0) + 1;

                    if (rarity === 'legendary' || rarity === 'mythic') {
                        gameState.jackpotChainCount++;
                        currentUser.mysteryCratesStats.jackpotChains++;
                        if (rarity === 'mythic') {
                            audio.playSfx('jackpot');
                            showToast('💎 MYTHIC CRATE! Incredible find!', '💎');
                        }
                    } else {
                        gameState.jackpotChainCount = Math.max(0, gameState.jackpotChainCount - 1);
                    }

                    if (!isFree) gameState.continueCost *= 2;
                    gameState.scoutCost = Math.floor(gameState.scoutCost * 1.5);
                    dom.resultMessage.innerHTML =
                        `<span style="color:#aaffaa;">💰 Safe! ${RARITY_ICONS[rarity]} ${rarity.toUpperCase()} crate · ${effectiveMult.toFixed(1)}× boost!</span>`;

                    if (currentUser.mysteryCratesStats.bestMultiplier < gameState.multiplier) {
                        currentUser.mysteryCratesStats.bestMultiplier = gameState.multiplier;
                    }
                    if (currentUser.mysteryCratesStats.bestStreak < gameState.streakCount) {
                        currentUser.mysteryCratesStats.bestStreak = gameState.streakCount;
                    }
                    const highRarityOrder = ['common', 'rare', 'epic', 'legendary', 'mythic'];
                    if (highRarityOrder.indexOf(rarity) > highRarityOrder.indexOf(currentUser.mysteryCratesStats
                            .highestRarityFound)) {
                        currentUser.mysteryCratesStats.highestRarityFound = rarity;
                    }

                    tickEvent();
                    tryTriggerEvent();
                    checkAchievements();
                    saveUser();
                } else {
                    if (gameState.shieldCharges > 0) {
                        gameState.shieldCharges--;
                        currentUser.mysteryCratesStats.shieldsUsed++;
                        dom.resultMessage.innerHTML =
                            '<span style="color:#b8d4ff;">🛡️ Shield absorbed the trap!</span>';
                        gameState.trapProb = BASE_TRAP_PROB;
                        tickEvent();
                        saveUser();
                        gameState.processingAction = false;
                        setRoundLive(true);
                        updateUI();
                        updateCrateGlow(rarity);
                        setTimeout(() => {
                            if (gameState.gameActive) {
                                gameState.processingAction = false;
                                updateUI();
                            }
                        }, 500);
                        return;
                    }

                    dom.crateVisual.classList.add('trap-open');
                    audio.playSfx('trap');
                    applyRedFlash();
                    screenShake(4);
                    gameState.gameActive = false;
                    gameState.roundActive = false;
                    setRoundLive(false);
                    dom.resultMessage.innerHTML =
                        '<span style="color:#ff6b6b;">💥 TRAP! You lost everything.</span>';
                    recordRound(false);
                    gameState.processingAction = false;
                    updateUI();
                    return;
                }

                setRoundLive(true);
                updateUI();
                updateCrateGlow(rarity);

                const animTime = rarity === 'mythic' ? 700 : 550;
                setTimeout(() => {
                    if (gameState.gameActive) {
                        gameState.processingAction = false;
                        updateUI();
                        if (gameState.autoOpenMode && gameState.gameActive) {
                            scheduleAutoOpen();
                        }
                    }
                }, animTime);
            }

            function scoutPeek() {
                if (!gameState.gameActive || gameState.processingAction || gameState.peekedThisCrate || currentUser
                    .balance < gameState.scoutCost) return;
                gameState.processingAction = true;
                updateUI();

                currentUser.balance -= gameState.scoutCost;
                currentUser.mysteryCratesStats.totalScoutFees += gameState.scoutCost;
                saveUser();
                updateBalanceDisplay();

                gameState.nextCrateType = generateCrateType();
                gameState.nextCrateRarity = rollRarity();
                gameState.peekedThisCrate = true;
                dom.peekOverlay.className = 'peek-overlay ' + (gameState.nextCrateType === 'safe' ? 'safe' : 'trap');
                dom.peekOverlay.innerHTML = gameState.nextCrateType === 'safe' ?
                    RARITY_ICONS[gameState.nextCrateRarity] + ' SAFE' :
                    '💣 TRAP';
                audio.playSfx('scout');
                dom.resultMessage.innerHTML =
                    `<span style="color:#b8d4ff;">🔍 Scouted: ${gameState.nextCrateType==='safe'?RARITY_ICONS[gameState.nextCrateRarity]+' SAFE '+gameState.nextCrateRarity.toUpperCase():'💣 TRAP!'}</span>`;
                gameState.scoutCost = Math.floor(gameState.scoutCost * 2);

                setTimeout(() => {
                    if (gameState.gameActive) {
                        clearPeekOverlay();
                        dom.resultMessage.innerHTML = '';
                    }
                    gameState.processingAction = false;
                    updateUI();
                }, 1800);
            }

            function cashOut() {
                if (!gameState.gameActive || gameState.processingAction) return;
                gameState.processingAction = true;
                updateUI();
                if (gameState.autoOpenTimer) { clearTimeout(gameState.autoOpenTimer);
                    gameState.autoOpenTimer = null; }
                gameState.autoOpenMode = false;
                dom.autoOpenBtn.classList.remove('active');
                dom.autoOpenBtn.innerHTML = '<i class="fas fa-robot"></i> AUTO';

                gameState.gameActive = false;
                gameState.roundActive = false;
                setRoundLive(false);
                const winAmount = gameState.bet * gameState.multiplier;
                currentUser.balance += winAmount;
                gameState.sessionProfit += (winAmount - gameState.bet);
                saveUser();
                updateBalanceDisplay();
                audio.playSfx('cashout');
                dom.resultMessage.innerHTML =
                    `<span style="color:#aaffaa;">✅ Cashed out! ${gameState.multiplier.toFixed(3)}× = ${winAmount.toFixed(2)} GOLD</span>`;
                applyGoldFlash();

                if (gameState.peekedThisCrate && gameState.nextCrateType === 'trap') {
                    if (!currentUser.earnedAchievements.includes('crate_dodger')) {
                        currentUser.earnedAchievements.push('crate_dodger');
                        dom.resultMessage.innerHTML += '<br>🏆 Crate Dodger: Peeked a trap and wisely cashed out!';
                        showToast('Achievement Unlocked: Crate Dodger!', '🏆');
                        saveUser();
                    }
                }
                if (gameState.multiplier >= 50 && !currentUser.earnedAchievements.includes('fortune_fav')) {
                    currentUser.earnedAchievements.push('fortune_fav');
                    dom.resultMessage.innerHTML += '<br>🏆 Fortune\'s Favourite: Reached 50× multiplier!';
                    showToast('Achievement Unlocked: Fortune\'s Favourite!', '🏆');
                    saveUser();
                }

                recordRound(true);
                gameState.processingAction = false;
                updateUI();
            }

            function recordRound(won) {
                const totalWager = gameState.bet;
                currentUser.globalStats.totalGames++;
                currentUser.globalStats.totalWagered += totalWager;
                if (won) {
                    currentUser.globalStats.totalWins++;
                    currentUser.globalStats.currentStreak = (currentUser.globalStats.currentStreak || 0) + 1;
                    if (currentUser.globalStats.currentStreak > currentUser.globalStats.bestStreak)
                        currentUser.globalStats.bestStreak = currentUser.globalStats.currentStreak;
                    currentUser.mysteryCratesStats.wins++;
                    currentUser.globalStats.totalWon += (gameState.bet * gameState.multiplier);
                } else {
                    currentUser.globalStats.currentStreak = 0;
                    currentUser.mysteryCratesStats.losses++;
                }
                currentUser.xp = (currentUser.xp || 0) + Math.floor(totalWager * gameState.safeCrates * 0.5);
                checkLevelUp();
                currentUser.gamePlayCount['mystery-crates'] = (currentUser.gamePlayCount['mystery-crates'] || 0) + 1;
                currentUser.mysteryCratesStats.roundsPlayed++;
                currentUser.gameOutcomes.unshift({
                    game: 'MysteryCrates',
                    result: won ? 'win' : 'loss',
                    profit: won ? (gameState.bet * gameState.multiplier - totalWager) : -totalWager,
                    multiplier: gameState.multiplier,
                    safeCrates: gameState.safeCrates,
                    highestRarity: currentUser.mysteryCratesStats.highestRarityFound,
                    date: new Date().toISOString()
                });
                currentUser.transactions.unshift({
                    desc: `📦 Mystery Crates | Bet ${gameState.bet} → ${won?'Cashed out '+(gameState.bet*gameState.multiplier).toFixed(2):'Bust'}`,
                    amount: won ? (gameState.bet * gameState.multiplier - totalWager) : -totalWager,
                    type: won ? 'game_win' : 'game_loss',
                    date: new Date().toISOString()
                });
                saveUser();
                updateBalanceDisplay();
                updateSessionDisplay();
                updateQuests(won);

                setTimeout(() => {
                    if (!gameState.gameActive) {
                        resetRoundUI();
                        dom.resultMessage.innerHTML = '';
                        deactivateEvent();
                    }
                }, 2500);
            }

            // ──────────────── AUTO OPEN ────────────────
            function toggleAutoOpen() {
                if (!gameState.gameActive || gameState.processingAction) return;
                gameState.autoOpenMode = !gameState.autoOpenMode;
                if (gameState.autoOpenMode) {
                    dom.autoOpenBtn.classList.add('active');
                    dom.autoOpenBtn.innerHTML = '<i class="fas fa-stop"></i> STOP AUTO';
                    showToast('Auto-open mode activated', '🤖');
                    scheduleAutoOpen();
                } else {
                    dom.autoOpenBtn.classList.remove('active');
                    dom.autoOpenBtn.innerHTML = '<i class="fas fa-robot"></i> AUTO';
                    if (gameState.autoOpenTimer) { clearTimeout(gameState.autoOpenTimer);
                        gameState.autoOpenTimer = null; }
                }
            }

            function scheduleAutoOpen() {
                if (!gameState.autoOpenMode || !gameState.gameActive || gameState.processingAction) return;
                if (gameState.autoOpenTimer) clearTimeout(gameState.autoOpenTimer);
                const delay = gameState.currentRarity === 'mythic' ? 900 : gameState.currentRarity === 'legendary' ?
                    750 : 600;
                gameState.autoOpenTimer = setTimeout(() => {
                    if (gameState.autoOpenMode && gameState.gameActive && !gameState.processingAction) {
                        const canContinue = currentUser && currentUser.balance >= gameState.continueCost;
                        if (!canContinue) {
                            gameState.autoOpenMode = false;
                            dom.autoOpenBtn.classList.remove('active');
                            dom.autoOpenBtn.innerHTML = '<i class="fas fa-robot"></i> AUTO';
                            showToast('Auto-open stopped: Insufficient balance', '⚠️');
                            return;
                        }
                        openCrate(false);
                    }
                }, delay);
            }

            // ──────────────── LEVELING & PRESTIGE ────────────────
            function getXPForLevel(level) { return Math.floor(100 * Math.pow(1.5, level - 1)); }

            function checkLevelUp() {
                const xpNeeded = getXPForLevel(currentUser.level);
                if (currentUser.xp >= xpNeeded) {
                    currentUser.xp -= xpNeeded;
                    currentUser.level++;
                    showToast(`Level Up! You are now level ${currentUser.level}!`, '⬆️');
                    saveUser();
                    if (currentUser.level >= 50 && currentUser.prestigeLevel === 0) {
                        showToast('Prestige available! Check settings to prestige.', '🌟');
                    }
                }
            }

            function prestigeUser() {
                if (currentUser.level < 50) { showToast('Reach level 50 to prestige!', '⚠️'); return; }
                currentUser.prestigeLevel++;
                currentUser.level = 1;
                currentUser.xp = 0;
                currentUser.balance += 500;
                showToast(`Prestige ${currentUser.prestigeLevel}! +500 GOLD bonus!`, '🌟');
                saveUser();
                updateBalanceDisplay();
            }

            // ──────────────── ACHIEVEMENTS ────────────────
            const ALL_ACHIEVEMENTS = {
                reckless: { name: 'Reckless', desc: 'Open 5 crates without scouting', icon: '🎰' },
                crate_dodger: { name: 'Crate Dodger', desc: 'Peek a trap and cash out', icon: '👀' },
                fortune_fav: { name: "Fortune's Favourite", desc: 'Reach 50× multiplier', icon: '🍀' },
                mythic_finder: { name: 'Mythic Finder', desc: 'Find your first Mythic crate', icon: '💎' },
                chain_master: { name: 'Chain Master', desc: 'Get 3 legendary+ crates in a row', icon: '⛓️' },
                shield_saver: { name: 'Shield Saver', desc: 'Use a shield to block a trap', icon: '🛡️' },
                high_roller: { name: 'High Roller', desc: 'Bet 500+ GOLD in one round', icon: '💵' },
                marathon: { name: 'Marathon', desc: 'Play 50 rounds', icon: '🏃' },
            };

            function checkAchievements() {
                const earned = currentUser.earnedAchievements || [];
                if (gameState.safeCrates >= 5 && !earned.includes('reckless')) {
                    earned.push('reckless');
                    showToast('Achievement: Reckless!', '🏆');
                }
                if (gameState.currentRarity === 'mythic' && !earned.includes('mythic_finder')) {
                    earned.push('mythic_finder');
                    showToast('Achievement: Mythic Finder!', '💎');
                }
                if (gameState.jackpotChainCount >= 3 && !earned.includes('chain_master')) {
                    earned.push('chain_master');
                    showToast('Achievement: Chain Master!', '⛓️');
                }
                if (gameState.shieldCharges > 0 && gameState.nextCrateType === 'trap' && !earned.includes(
                    'shield_saver')) {
                    earned.push('shield_saver');
                    showToast('Achievement: Shield Saver!', '🛡️');
                }
                if (gameState.bet >= 500 && !earned.includes('high_roller')) {
                    earned.push('high_roller');
                    showToast('Achievement: High Roller!', '💵');
                }
                if (currentUser.mysteryCratesStats.roundsPlayed >= 50 && !earned.includes('marathon')) {
                    earned.push('marathon');
                    showToast('Achievement: Marathon!', '🏃');
                }
                currentUser.earnedAchievements = earned;
                saveUser();
            }

            // ──────────────── QUESTS ────────────────
            function generateDailyQuests() {
                if (currentUser.quests && currentUser.quests.length > 0) return;
                currentUser.quests = [
                    { id: 'open_10', desc: 'Open 10 crates', target: 10, progress: 0, reward: 100,
                    type: 'crates_opened' },
                    { id: 'win_3', desc: 'Win 3 rounds', target: 3, progress: 0, reward: 150, type: 'rounds_won' },
                    { id: 'rare_find', desc: 'Find 3 Rare+ crates', target: 3, progress: 0, reward: 200,
                        type: 'rare_crates' },
                ];
                saveUser();
            }

            function updateQuests(won) {
                if (!currentUser.quests || currentUser.quests.length === 0) generateDailyQuests();
                for (const q of currentUser.quests) {
                    if (q.progress >= q.target) continue;
                    if (q.type === 'crates_opened') q.progress++;
                    if (q.type === 'rounds_won' && won) q.progress++;
                    if (q.type === 'rare_crates' && ['rare', 'epic', 'legendary', 'mythic'].includes(gameState
                            .currentRarity)) q.progress++;
                    if (q.progress >= q.target && !currentUser.completedQuests.includes(q.id)) {
                        currentUser.completedQuests.push(q.id);
                        currentUser.balance += q.reward;
                        showToast(`Quest complete: ${q.desc} · +${q.reward} GOLD!`, '✅');
                        saveUser();
                        updateBalanceDisplay();
                    }
                }
                saveUser();
            }

            // ──────────────── DAILY REWARDS ────────────────
            function checkDailyReward() {
                const today = new Date().toDateString();
                if (currentUser.lastDailyReward === today) return;
                const lastDate = currentUser.lastDailyReward ? new Date(currentUser.lastDailyReward) : null;
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (lastDate && lastDate.toDateString() === yesterday.toDateString()) {
                    currentUser.dailyStreak = (currentUser.dailyStreak || 0) + 1;
                } else if (!lastDate || lastDate.toDateString() !== today) {
                    currentUser.dailyStreak = 1;
                }
                const reward = 50 + (currentUser.dailyStreak * 10);
                currentUser.balance += reward;
                currentUser.lastDailyReward = today;
                saveUser();
                updateBalanceDisplay();
                showToast(`Daily Reward: +${reward} GOLD! Streak: ${currentUser.dailyStreak} days`, '🎁');
                showDailyModal(reward);
            }

            function showDailyModal(reward) {
                dom.dailyContent.innerHTML = `
              <div style="font-size:3rem;margin:1rem;">🎁</div>
              <h4 style="color:var(--gold-bright);">Daily Reward Claimed!</h4>
              <p style="font-size:1.5rem;font-weight:700;">+${reward} GOLD</p>
              <p style="font-size:0.85rem;color:#bfb6a4;">Streak: ${currentUser.dailyStreak} day${currentUser.dailyStreak>1?'s':''}</p>
              <p style="font-size:0.8rem;color:#bfb6a4;">Come back tomorrow for more!</p>
            `;
                dom.dailyModal.style.display = 'flex';
            }

            // ──────────────── MODALS ────────────────
            function openModal(modal) { modal.style.display = 'flex'; }

            function closeModal(modal) { modal.style.display = 'none'; }

            function showStatsModal() {
                const s = currentUser.mysteryCratesStats;
                const gs = currentUser.globalStats;
                const rtp = gs.totalWagered > 0 ? ((gs.totalWon / gs.totalWagered) * 100).toFixed(2) : '0.00';
                const winRate = gs.totalGames > 0 ? ((gs.totalWins / gs.totalGames) * 100).toFixed(1) : '0.0';
                dom.statsContent.innerHTML = `
              <p>🎮 Rounds Played: <strong>${s.roundsPlayed}</strong></p>
              <p>✅ Wins: <strong>${s.wins}</strong> | ❌ Losses: <strong>${s.losses}</strong></p>
              <p>📊 Win Rate: <strong>${winRate}%</strong></p>
              <p>💰 RTP: <strong>${rtp}%</strong></p>
              <p>📦 Crates Opened: <strong>${s.cratesOpened}</strong></p>
              <p>🏆 Best Multiplier: <strong>${s.bestMultiplier.toFixed(3)}×</strong></p>
              <p>🔥 Best Streak: <strong>${s.bestStreak}</strong></p>
              <p>💎 Highest Rarity: <strong>${s.highestRarityFound.toUpperCase()}</strong></p>
              <p>🌟 Events Triggered: <strong>${s.eventsTriggered}</strong></p>
              <p>🛡️ Shields Used: <strong>${s.shieldsUsed}</strong></p>
              <p>⛓️ Jackpot Chains: <strong>${s.jackpotChains}</strong></p>
              <hr style="border-color:rgba(255,217,102,0.2);margin:0.5rem 0;">
              <p>⭐ Level: <strong>${currentUser.level}</strong> | XP: <strong>${currentUser.xp}</strong></p>
              <p>👑 Prestige: <strong>${currentUser.prestigeLevel}</strong></p>
              <p>📋 Crates by Rarity:</p>
              <p>Common: ${s.cratesByRarity.common} | Rare: ${s.cratesByRarity.rare} | Epic: ${s.cratesByRarity.epic} | Legendary: ${s.cratesByRarity.legendary} | Mythic: ${s.cratesByRarity.mythic}</p>
            `;
                openModal(dom.statsModal);
            }

            function showInventoryModal() {
                const c = currentUser.crateCollection;
                dom.inventoryContent.innerHTML = `
              <p>📦 <strong>Crate Collection</strong></p>
              <p>🟫 Common: <strong>${c.common}</strong></p>
              <p>🟦 Rare: <strong>${c.rare}</strong></p>
              <p>🟪 Epic: <strong>${c.epic}</strong></p>
              <p>🟠 Legendary: <strong>${c.legendary}</strong></p>
              <p>💖 Mythic: <strong>${c.mythic}</strong></p>
              <hr style="border-color:rgba(255,217,102,0.2);margin:0.5rem 0;">
              <p>⭐ Level: <strong>${currentUser.level}</strong> | Prestige: <strong>${currentUser.prestigeLevel}</strong></p>
              ${currentUser.level>=50?`<button class="btn btn-play" style="margin-top:0.5rem;font-size:0.8rem;" id="prestigeBtn">👑 Prestige (Level 50+)</button>`:''}
            `;
                openModal(dom.inventoryModal);
                const pBtn = $('#prestigeBtn');
                if (pBtn) pBtn.addEventListener('click', () => { prestigeUser();
                    showInventoryModal(); });
            }

            function showAchievementsModal() {
                let html = '<p><strong>Achievements</strong></p>';
                for (const [key, ach] of Object.entries(ALL_ACHIEVEMENTS)) {
                    const earned = (currentUser.earnedAchievements || []).includes(key);
                    html +=
                        `<p>${earned?'✅':'🔒'} ${ach.icon} <strong>${ach.name}</strong>: ${ach.desc} ${earned?'<span style="color:#aaffaa;">✓</span>':''}</p>`;
                }
                dom.achievementsContent.innerHTML = html;
                openModal(dom.achievementsModal);
            }

            // ──────────────── EVENT LISTENERS ────────────────
            dom.startBtn.addEventListener('click', () => { audio.init();
                startRound(); });
            dom.cashoutBtn.addEventListener('click', () => { audio.init();
                cashOut(); });
            dom.continueBtn.addEventListener('click', () => { audio.init();
                openCrate(false); });
            dom.scoutBtn.addEventListener('click', () => { audio.init();
                scoutPeek(); });
            dom.autoOpenBtn.addEventListener('click', () => { audio.init();
                toggleAutoOpen(); });

            dom.soundToggleBtn.addEventListener('click', () => {
                audio.soundEnabled = !audio.soundEnabled;
                dom.soundToggleBtn.innerHTML = audio.soundEnabled ?
                    '<i class="fas fa-volume-up"></i>' :
                    '<i class="fas fa-volume-mute"></i>';
                localStorage.setItem('gold_sound_enabled', audio.soundEnabled);
                if (!audio.soundEnabled) audio.stopAmbient();
                else audio.startAmbient();
            });

            dom.betInput.addEventListener('input', updateStartBtnState);

            // Settings modal
            dom.settingsBtn.addEventListener('click', () => openModal(dom.settingsModal));
            dom.masterVolume.addEventListener('input', () => {
                const v = parseInt(dom.masterVolume.value) / 100;
                dom.masterVolLabel.textContent = Math.round(v * 100) + '%';
                audio.setMasterVolume(v);
                localStorage.setItem('gold_master_vol', v);
            });
            dom.musicVolume.addEventListener('input', () => {
                const v = parseInt(dom.musicVolume.value) / 100;
                dom.musicVolLabel.textContent = Math.round(v * 100) + '%';
                audio.setMusicVolume(v);
                localStorage.setItem('gold_music_vol', v);
            });
            dom.sfxVolume.addEventListener('input', () => {
                const v = parseInt(dom.sfxVolume.value) / 100;
                dom.sfxVolLabel.textContent = Math.round(v * 100) + '%';
                audio.setSfxVolume(v);
                localStorage.setItem('gold_sfx_vol', v);
            });
            dom.reducedMotion.addEventListener('change', () => {
                document.body.classList.toggle('reduced-motion', dom.reducedMotion.checked);
                localStorage.setItem('gold_reduced_motion', dom.reducedMotion.checked);
            });
            $('#closeSettingsModal').addEventListener('click', () => closeModal(dom.settingsModal));

            // Stats modal
            dom.statsBtn.addEventListener('click', showStatsModal);
            $('#closeStatsModal').addEventListener('click', () => closeModal(dom.statsModal));

            // Inventory modal
            dom.inventoryBtn.addEventListener('click', showInventoryModal);
            $('#closeInventoryModal').addEventListener('click', () => closeModal(dom.inventoryModal));

            // Achievements modal
            dom.achievementsBtn.addEventListener('click', showAchievementsModal);
            $('#closeAchievementsModal').addEventListener('click', () => closeModal(dom.achievementsModal));

            // Daily modal
            dom.dailyBtn.addEventListener('click', () => {
                const today = new Date().toDateString();
                if (currentUser.lastDailyReward === today) {
                    showDailyModal(0);
                } else {
                    checkDailyReward();
                }
            });
            $('#closeDailyModal').addEventListener('click', () => closeModal(dom.dailyModal));

            // Close modals on overlay click
            [dom.settingsModal, dom.statsModal, dom.inventoryModal, dom.achievementsModal, dom.dailyModal].forEach(
            modal => {
                modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(modal); });
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !gameState.gameActive && document.activeElement === dom.betInput) {
                    startRound();
                }
                if (e.key === 'c' && gameState.gameActive && !gameState.processingAction) cashOut();
                if (e.key === 'o' && gameState.gameActive && !gameState.processingAction) openCrate(false);
                if (e.key === 's' && gameState.gameActive && !gameState.processingAction) scoutPeek();
                if (e.key === 'a' && gameState.gameActive && !gameState.processingAction) toggleAutoOpen();
                if (e.key === 'Escape') {
                    [dom.settingsModal, dom.statsModal, dom.inventoryModal, dom.achievementsModal, dom.dailyModal]
                        .forEach(m => closeModal(m));
                }
            });

            // ──────────────── INIT ────────────────
            async function init() {
                if (!(await loadUser())) return;
                await audio.init();

                // Restore settings
                const savedSound = localStorage.getItem('gold_sound_enabled');
                if (savedSound === 'false') {
                    audio.soundEnabled = false;
                    dom.soundToggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                }
                const savedMasterVol = localStorage.getItem('gold_master_vol');
                if (savedMasterVol !== null) {
                    audio.setMasterVolume(parseFloat(savedMasterVol));
                    dom.masterVolume.value = Math.round(parseFloat(savedMasterVol) * 100);
                    dom.masterVolLabel.textContent = Math.round(parseFloat(savedMasterVol) * 100) + '%';
                }
                const savedMusicVol = localStorage.getItem('gold_music_vol');
                if (savedMusicVol !== null) {
                    audio.setMusicVolume(parseFloat(savedMusicVol));
                    dom.musicVolume.value = Math.round(parseFloat(savedMusicVol) * 100);
                    dom.musicVolLabel.textContent = Math.round(parseFloat(savedMusicVol) * 100) + '%';
                }
                const savedSfxVol = localStorage.getItem('gold_sfx_vol');
                if (savedSfxVol !== null) {
                    audio.setSfxVolume(parseFloat(savedSfxVol));
                    dom.sfxVolume.value = Math.round(parseFloat(savedSfxVol) * 100);
                    dom.sfxVolLabel.textContent = Math.round(parseFloat(savedSfxVol) * 100) + '%';
                }
                const savedReducedMotion = localStorage.getItem('gold_reduced_motion');
                if (savedReducedMotion === 'true') {
                    dom.reducedMotion.checked = true;
                    document.body.classList.add('reduced-motion');
                }

                if (audio.soundEnabled) audio.startAmbient();
                generateDailyQuests();
                updateBalanceDisplay();
                updateSessionDisplay();
                resetRoundUI();

                const today = new Date().toDateString();
                if (currentUser.lastDailyReward !== today) {
                    setTimeout(() => checkDailyReward(), 1500);
                }
            }

            init();

            // Cleanup on page unload
            window.addEventListener('beforeunload', () => {
                if (gameState.autoOpenTimer) clearTimeout(gameState.autoOpenTimer);
                audio.stopAmbient();
            });

            console.log('%c🏆 GOLD MYSTERY CRATES %c| Premium Casino Edition %cLoaded',
                'color:#ffd966;font-size:1.2rem;',
                'color:#f5f0e6;',
                'color:#aaffaa;');
            console.log('%cFeatures: Rarities | Events | Auto-Open | Achievements | Quests | Daily Rewards | Prestige | Collections',
                'color:#bfb6a4;font-size:0.8rem;');
        })();
    </script>
</body>
</html>
