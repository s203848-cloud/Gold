<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GOLD SCRATCH CARD | Scratch off 3. If all match the same symbol, win.</title>
    <link rel="icon" type="image/x-icon" href="../../assets/favcon/Gold-2D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd966;
            --gold-bright: #ffe484;
            --gold-deep: #f5b042;
            --gold-dark: #b8941f;
            --bg-deep: #0a0908;
            --card-bg: rgba(20, 18, 16, 0.78);
            --border-gold: rgba(255, 217, 102, 0.4);
            --border-gold-strong: rgba(255, 217, 102, 0.65);
            --shadow-gold: 0 0 35px rgba(255, 217, 102, 0.18);
            --shadow-gold-strong: 0 0 50px rgba(255, 217, 102, 0.35);
            --radius-xl: 2rem;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --radius-sm: 0.8rem;
            --radius-full: 60px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --glass-bg: rgba(18, 15, 11, 0.72);
            --glass-blur: 18px;
            --neon-gold: 0 0 20px rgba(255, 217, 102, 0.6), 0 0 40px rgba(255, 180, 40, 0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0c0b0a 0%, #020101 100%);
            color: #f5f0e6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* ── AMBIENT PARTICLES ── */
        .particles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0;
            animation: floatUp var(--dur, 7s) infinite ease-in;
            animation-delay: var(--delay, 0s);
            box-shadow: 0 0 6px rgba(255, 217, 102, 0.5);
        }
        .particle:nth-child(odd) {
            background: var(--gold-bright);
        }
        .particle:nth-child(3n) {
            background: var(--gold-deep);
            box-shadow: 0 0 10px rgba(245, 176, 66, 0.6);
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) scale(0);
                opacity: 0;
            }
            12% {
                opacity: 0.6;
                transform: scale(1.1);
            }
            45% {
                transform: translateY(35vh) translateX(25px) scale(0.5);
                opacity: 0.18;
            }
            100% {
                transform: translateY(-25vh) translateX(-15px) scale(0);
                opacity: 0;
            }
        }
        /* ── GAME LAYOUT ── */
        .game-container {
            max-width: 620px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius-full);
            padding: 0.6rem 1.5rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.6s var(--transition-bounce);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .back-home {
            text-decoration: none;
            color: var(--gold);
            font-weight: 600;
            font-size: 0.9rem;
            background: rgba(255, 217, 102, 0.1);
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .back-home:hover {
            background: rgba(255, 217, 102, 0.2);
            border-color: rgba(255, 217, 102, 0.4);
            transform: translateX(-3px);
        }
        .balance-tag {
            background: rgba(28, 24, 18, 0.9);
            padding: 0.35rem 1.1rem;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid rgba(255, 217, 102, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: box-shadow 0.3s;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        .balance-tag i {
            color: var(--gold-bright);
            font-size: 1rem;
        }
        .balance-tag.pulse {
            animation: balancePulse 0.5s ease-out;
        }
        @keyframes balancePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 217, 102, 0.55);
            }
            100% {
                box-shadow: 0 0 0 22px rgba(255, 217, 102, 0);
            }
        }
        .sound-btn {
            background: rgba(255, 217, 102, 0.08);
            border: 1px solid rgba(255, 217, 102, 0.25);
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--gold-bright);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .sound-btn:hover {
            background: rgba(255, 217, 102, 0.2);
            border-color: rgba(255, 217, 102, 0.5);
            transform: scale(1.08);
        }
        /* ── MAIN CARD ── */
        .main-card {
            background: linear-gradient(160deg, rgba(26, 22, 17, 0.94) 0%, rgba(10, 8, 5, 0.97) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: var(--radius-xl);
            padding: 1.6rem 1.4rem 1.3rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 30px 55px rgba(0, 0, 0, 0.6), var(--shadow-gold), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            animation: fadeInUp 0.5s ease-out;
            text-align: center;
            position: relative;
            overflow: visible;
        }
        .main-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius-xl);
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 217, 102, 0.35), transparent 40%, transparent 60%, rgba(255,
                        217, 102, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 0;
        }
        .main-card>* {
            position: relative;
            z-index: 1;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gold-bright);
            letter-spacing: 0.04em;
            text-shadow: 0 2px 14px rgba(255, 200, 60, 0.5);
            margin-bottom: 0.15rem;
        }
        .game-subtitle {
            font-size: 0.78rem;
            color: #bfb6a4;
            margin-bottom: 0.6rem;
            letter-spacing: 0.03em;
        }
        /* ── SCRATCH GRID ── */
        .scratch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.7rem;
            margin: 0.8rem 0;
            justify-items: center;
        }
        .scratch-cell {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 150px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #1a1712;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 217, 102, 0.22);
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            cursor: default;
        }
        .scratch-cell:hover:not(.scratched) {
            border-color: rgba(255, 217, 102, 0.45);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 217, 102, 0.15);
            transform: translateY(-2px);
        }
        .scratch-cell.completed {
            border-color: rgba(255, 237, 78, 0.8) !important;
            box-shadow: 0 0 25px rgba(255, 217, 102, 0.4), 0 0 50px rgba(255, 180, 40, 0.2) !important;
            animation: cellCompleteGlow 0.5s ease-out;
        }
        @keyframes cellCompleteGlow {
            0% {
                box-shadow: 0 0 0 rgba(255, 217, 102, 0), 0 0 0 rgba(255, 180, 40, 0);
            }
            60% {
                box-shadow: 0 0 40px rgba(255, 237, 78, 0.7), 0 0 70px rgba(255, 180, 40, 0.4);
            }
            100% {
                box-shadow: 0 0 25px rgba(255, 217, 102, 0.4), 0 0 50px rgba(255, 180, 40, 0.2);
            }
        }
        .scratch-cell.scratched .scratch-canvas {
            pointer-events: none;
        }
        .scratch-cell.revealed .scratch-canvas {
            display: none;
        }
        .symbol-display {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: var(--gold-bright);
            filter: drop-shadow(0 0 8px rgba(255, 217, 102, 0.5));
            pointer-events: none;
            transition: transform 0.3s var(--transition-bounce);
            z-index: 1;
        }
        .scratch-cell.completed .symbol-display {
            transform: scale(1.15);
            filter: drop-shadow(0 0 14px rgba(255, 237, 78, 0.8));
        }
        .scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
            z-index: 3;
            border-radius: var(--radius-sm);
        }
        .scratch-cell.scratched .scratch-canvas {
            pointer-events: none;
            opacity: 0.35;
            transition: opacity 0.4s;
        }
        /* ── SCRATCHES LEFT ── */
        .scratches-left {
            font-size: 0.85rem;
            color: #bfb6a4;
            background: rgba(255, 217, 102, 0.07);
            padding: 0.35rem 1.1rem;
            border-radius: 30px;
            display: inline-block;
            margin: 0.3rem 0;
            font-weight: 600;
            border: 1px solid rgba(255, 217, 102, 0.2);
            transition: all 0.3s;
        }
        .scratches-left.urgent {
            color: #ffcc80;
            border-color: rgba(255, 180, 40, 0.5);
            animation: urgentPulse 0.8s infinite;
        }
        @keyframes urgentPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 180, 40, 0.2);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 180, 40, 0.5);
            }
        }
        /* ── BET CONTROLS ── */
        .bet-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.6rem 0;
        }
        .bet-label {
            color: var(--gold);
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .bet-input {
            background: #0f0d0b;
            border: 2px solid rgba(255, 217, 102, 0.3);
            border-radius: 40px;
            padding: 0.5rem 0.8rem;
            width: 100px;
            text-align: center;
            font-weight: 700;
            color: var(--gold-bright);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .bet-input:focus {
            border-color: var(--border-gold-strong);
            box-shadow: 0 0 0 4px rgba(255, 217, 102, 0.08);
        }
        .bet-input.invalid {
            border-color: #ff6b6b;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-6px);
            }
            40% {
                transform: translateX(6px);
            }
            60% {
                transform: translateX(-4px);
            }
            80% {
                transform: translateX(4px);
            }
        }
        .quick-bets {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .quick-bet {
            background: rgba(255, 217, 102, 0.08);
            border: 1px solid rgba(255, 217, 102, 0.28);
            border-radius: 30px;
            padding: 0.3rem 0.7rem;
            color: var(--gold);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .quick-bet:hover {
            background: rgba(255, 217, 102, 0.2);
            border-color: rgba(255, 217, 102, 0.5);
            transform: scale(1.06);
        }
        .quick-bet:active {
            transform: scale(0.93);
            background: rgba(255, 217, 102, 0.3);
        }
        /* ── BUTTONS ── */
        .btn {
            border: none;
            border-radius: var(--radius-full);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.3rem;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
        }
        .btn:active {
            transform: translateY(2px);
        }
        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
            filter: grayscale(30%);
            pointer-events: none;
        }
        .btn-outline {
            background: rgba(255, 217, 102, 0.08);
            border: 1px solid var(--border-gold);
            color: var(--gold);
        }
        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 217, 102, 0.2);
            border-color: var(--border-gold-strong);
        }
        .btn-play {
            background: linear-gradient(135deg, #f5b042 0%, #ffd966 40%, #ffed4e 100%);
            color: #1a150e;
            box-shadow: 0 4px 0 #a05f15, 0 6px 18px rgba(255, 180, 40, 0.3);
            font-size: 1.05rem;
            padding: 0.6rem 2rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .btn-play:hover:not(:disabled) {
            box-shadow: 0 4px 0 #a05f15, 0 10px 28px rgba(255, 180, 40, 0.5);
            transform: translateY(-2px);
        }
        .btn-play::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255, 255, 255, 0.25);
            transform: rotate(25deg);
            transition: left 0.6s;
        }
        .btn-play:hover:not(:disabled)::after {
            left: 120%;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        /* ── RESULT AREA ── */
        .result-area {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1.2rem;
            padding: 0.7rem 1rem;
            text-align: center;
            font-weight: 600;
            min-height: 3rem;
            margin: 0.6rem 0;
            border: 1px solid rgba(255, 217, 102, 0.12);
            transition: all 0.3s;
        }
        .result-area.win {
            border-color: rgba(76, 175, 80, 0.5);
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.2);
        }
        .result-area.lose {
            border-color: rgba(255, 107, 107, 0.4);
        }
        .big-win-display {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 900;
            color: var(--gold-bright);
            text-shadow: 0 0 25px rgba(255, 217, 102, 0.8), 0 0 50px rgba(255, 180, 40, 0.5);
            margin: 0.2rem 0;
            display: none;
            animation: multiPop 0.6s var(--transition-bounce);
            letter-spacing: 0.05em;
        }
        @keyframes multiPop {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }
            70% {
                transform: scale(1.12);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .session-display {
            font-size: 0.8rem;
            color: #b5afa4;
            margin-top: 0.3rem;
            font-weight: 500;
        }
        .session-display.positive {
            color: #a5d6a7;
        }
        .session-display.negative {
            color: #ffab91;
        }
        /* ── STATS BAR ── */
        .stats-mini {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: #9a9484;
            margin-top: 0.3rem;
        }
        .stats-mini span {
            background: rgba(255, 217, 102, 0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 217, 102, 0.12);
        }
        /* ── CONFETTI CANVAS ── */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        /* ── TOAST ── */
        .toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
        }
        .toast {
            background: rgba(20, 16, 10, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-gold);
            border-radius: 1rem;
            padding: 0.6rem 1.1rem;
            color: #f5f0e6;
            font-weight: 600;
            font-size: 0.8rem;
            animation: toastIn 0.4s ease-out, toastOut 0.3s ease-in 2.6s forwards;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            max-width: 300px;
            pointer-events: auto;
        }
        @keyframes toastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes toastOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(120%);
                opacity: 0;
            }
        }
        /* ── RESPONSIVE ── */
        @media (max-width: 500px) {
            .scratch-cell {
                max-width: 105px;
                border-radius: 0.6rem;
            }
            .symbol-display {
                font-size: 1.6rem;
            }
            .btn-play {
                padding: 0.5rem 1.4rem;
                font-size: 0.9rem;
            }
            .main-card {
                padding: 1.2rem 0.7rem 1rem;
                border-radius: 1.4rem;
            }
            .game-title {
                font-size: 1.2rem;
            }
            .scratch-grid {
                gap: 0.45rem;
            }
            .top-nav {
                padding: 0.5rem 1rem;
                gap: 0.3rem;
            }
            .back-home {
                font-size: 0.78rem;
                padding: 0.35rem 0.8rem;
            }
            .balance-tag {
                font-size: 0.78rem;
                padding: 0.3rem 0.8rem;
            }
            .bet-input {
                width: 80px;
                font-size: 0.85rem;
            }
            .big-win-display {
                font-size: 2rem;
            }
        }
        @media (min-width: 768px) {
            .scratch-cell {
                max-width: 155px;
                border-radius: 1rem;
            }
            .symbol-display {
                font-size: 2.8rem;
            }
            .scratch-grid {
                gap: 0.9rem;
            }
            .main-card {
                padding: 2rem 1.8rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>
    <div class="particles-container" id="particlesContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="game-container">
        <!-- TOP NAV -->
        <div class="top-nav">
            <a href=".././home.html" class="back-home"><i class="fas fa-arrow-left"></i> Lobby</a>
            <div class="balance-tag" id="balanceTag">
                <i class="fas fa-coins"></i> <span id="headerBalance">0</span> GOLD
            </div>
            <button id="soundToggleBtn" class="sound-btn" title="Toggle Sound"><i class="fas fa-volume-up"></i></button>
        </div>

        <!-- MAIN CARD -->
        <div class="main-card" id="mainCard">
            <div class="game-title"><i class="fas fa-ticket-alt"></i> SCRATCH CARD</div>
            <div class="game-subtitle">Scratch any 3 cells • Match all to win <strong>20×</strong> your bet!</div>

            <!-- SCRATCH GRID -->
            <div class="scratch-grid" id="scratchGrid"></div>

            <div class="scratches-left" id="scratchesLeft">🎯 3 scratches left</div>

            <!-- BET CONTROLS -->
            <div class="bet-row">
                <span class="bet-label"><i class="fas fa-coins"></i> BET</span>

            <!-- RESULT AREA -->
            <div class="result-area" id="resultArea">
                <span id="resultMessage">✨ Place your bet and start scratching</span>
                <div id="bigWinDisplay" class="big-win-display">20×</div>

            </div>

                <span>🎮 <strong id="gamesCount">0</strong> games</span>
                <span>🏆 <strong id="winsCount">0</strong> wins</span>

                <span>📈 RTP <strong id="rtpDisplay">0%</strong></span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            /* ═══════════════════════════════════════════════
               GOLD SCRATCH CARD · PREMIUM CASINO EDITION
               Refactored & Polished | Vanilla JS
               ═══════════════════════════════════════════════ */

            // ──────────────── AUDIO ENGINE ────────────────
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.masterGain = null;
                    this.sfxGain = null;
                    this.soundEnabled = true;
                    this.masterVolume = 0.8;
                    this.sfxVolume = 0.85;
                    this.initialized = false;
                    this.lastScratchSound = 0;
                    this.scratchCooldown = 80;
                }
                async init() {
                    if (this.initialized) return;
                    try {
                        this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                        this.masterGain = this.ctx.createGain();
                        this.masterGain.gain.value = this.masterVolume;
                        this.masterGain.connect(this.ctx.destination);
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.gain.value = this.sfxVolume;
                        this.sfxGain.connect(this.masterGain);
                        this.initialized = true;
                    } catch (e) { /* silent */ }
                }
                async resume() {
                    if (!this.ctx || !this.soundEnabled) return;
                    if (this.ctx.state === 'suspended') await this.ctx.resume();
                }
                setMaster(v) { this.masterVolume = v; if (this.masterGain) this.masterGain.gain.value = v; }
                setSFX(v) { this.sfxVolume = v; if (this.sfxGain) this.sfxGain.gain.value = v; }
                play(type) {
                    if (!this.soundEnabled || !this.initialized) return;
                    this.resume();
                    const now = this.ctx.currentTime;
                    const dest = this.sfxGain;
                    const mkTone = (freq, typeWave = 'sine', start = now, dur = 0.15, vol = 0.08) => {
                        const o = this.ctx.createOscillator();
                        const g = this.ctx.createGain();
                        o.connect(g);
                        g.connect(dest);
                        o.type = typeWave;
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(vol, start);
                        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                        o.start(start);
                        o.stop(start + dur);
                    };
                    switch (type) {
                        case 'scratch':
                            if (now * 1000 - this.lastScratchSound < this.scratchCooldown) return;
                            this.lastScratchSound = now * 1000;
                            mkTone(180 + Math.random() * 220, 'sine', now, 0.06, 0.04);
                            break;
                        case 'cell_complete':
                            mkTone(500, 'triangle', now, 0.18, 0.07);
                            mkTone(750, 'sine', now + 0.06, 0.14, 0.05);
                            break;
                        case 'win':
                            mkTone(660, 'sine', now, 0.4, 0.09);
                            mkTone(880, 'sine', now + 0.1, 0.35, 0.07);
                            mkTone(1100, 'sine', now + 0.2, 0.3, 0.06);
                            break;
                        case 'jackpot':
                            for (let i = 0; i < 5; i++) {
                                mkTone(500 + i * 180, 'sine', now + i * 0.07, 0.5, 0.08);
                                mkTone(750 + i * 200, 'triangle', now + i * 0.08, 0.45, 0.05);
                            }
                            break;
                        case 'lose':
                            mkTone(280, 'sawtooth', now, 0.35, 0.05);
                            mkTone(200, 'sine', now + 0.05, 0.3, 0.04);
                            break;
                        case 'click':
                            mkTone(550, 'sine', now, 0.05, 0.04);
                            break;
                        case 'bet_place':
                            mkTone(700, 'sine', now, 0.08, 0.05);
                            break;
                    }
                }
                destroy() {
                    if (this.ctx) { this.ctx.close().catch(() => {});
                        this.ctx = null; }
                    this.initialized = false;
                }
            }
            const audio = new AudioEngine();

            // ──────────────── TOAST SYSTEM ────────────────
            function showToast(msg, icon = '✨') {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerHTML = `${icon} ${msg}`;
                container.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            // ──────────────── CONFETTI SYSTEM ────────────────
            function triggerConfetti(intensity = 'normal') {
                const canvas = document.getElementById('confettiCanvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                const particles = [];
                const count = intensity === 'jackpot' ? 350 : 180;
                const colors = ['#ffd966', '#f5b042', '#ffed4e', '#4caf50', '#ffaa00', '#ff6b6b', '#81c784', '#ffffff',
                    '#ffe484'
                ];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: -30 - Math.random() * 250,
                        size: Math.random() * 8 + 3,
                        speedY: Math.random() * 8 + 5,
                        speedX: (Math.random() - 0.5) * 7,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        rotation: Math.random() * 360,
                        rotSpeed: (Math.random() - 0.5) * 14,
                        shape: Math.random() > 0.5 ? 'star' : 'rect',
                        wobble: Math.random() * 4,
                        opacity: 1,
                    });
                }
                let start = performance.now();
                let frame;

                function draw(now) {
                    const elapsed = now - start;
                    if (elapsed > 3200) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        cancelAnimationFrame(frame);
                        return;
                    }
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.y += p.speedY;
                        p.x += p.speedX + Math.sin(now * 0.004 + p.wobble) * 1.8;
                        p.rotation += p.rotSpeed;
                        p.speedY += 0.06;
                        p.opacity = Math.max(0, 1 - elapsed / 3200);
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.globalAlpha = p.opacity;
                        ctx.fillStyle = p.color;
                        if (p.shape === 'star') {
                            ctx.beginPath();
                            for (let i = 0; i < 5; i++) {
                                const angle = (i * 72 - 90) * Math.PI / 180;
                                const x1 = Math.cos(angle) * p.size / 2;
                                const y1 = Math.sin(angle) * p.size / 2;
                                if (i === 0) ctx.moveTo(x1, y1);
                                else ctx.lineTo(x1, y1);
                            }
                            ctx.closePath();
                            ctx.fill();
                        } else {
                            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                        }
                        ctx.restore();
                    });
                    frame = requestAnimationFrame(draw);
                }
                frame = requestAnimationFrame(draw);
            }

            // ──────────────── GAME CONFIG ────────────────
            const SYMBOLS = [
                { icon: 'fa-gem', name: 'Diamond', emoji: '💎' },
                { icon: 'fa-coins', name: 'Gold Coin', emoji: '🪙' },
                { icon: 'fa-7', name: 'Lucky 7', emoji: '7️⃣' },
                { icon: 'fa-cherries', name: 'Cherries', emoji: '🍒' },
                { icon: 'fa-lemon', name: 'Lemon', emoji: '🍋' },
                { icon: 'fa-star-of-life', name: 'Wild Star', emoji: '⭐' },
            ];
            const WIN_MULTIPLIER = 20;
            const SCRATCH_THRESHOLD = 0.65;
            const CANVAS_SIZE = 200;
            const BRUSH_RADIUS = 22;

            // ──────────────── DOM REFS ────────────────
            const $ = (s) => document.querySelector(s);
            const $$ = (s) => document.querySelectorAll(s);
            const dom = {
                scratchGrid: $('#scratchGrid'),
                betInput: $('#betAmount'),
                playBtn: $('#playBtn'),
                resultMessage: $('#resultMessage'),
                bigWinDisplay: $('#bigWinDisplay'),
                sessionDisplay: $('#sessionProfitDisplay'),
                scratchesLeftEl: $('#scratchesLeft'),
                balanceTag: $('#balanceTag'),
                headerBalance: $('#headerBalance'),
                resultArea: $('#resultArea'),
                soundBtn: $('#soundToggleBtn'),
                gamesCount: $('#gamesCount'),
                winsCount: $('#winsCount'),
                bestWinDisplay: $('#bestWinDisplay'),
                rtpDisplay: $('#rtpDisplay'),
                mainCard: $('#mainCard'),
                halfBetBtn: $('#halfBetBtn'),
                maxBetBtn: $('#maxBetBtn'),
                toastContainer: $('#toastContainer'),
            };

            // ──────────────── GAME STATE ────────────────
            let currentUser = null;
            let sessionProfit = 0;
            let sessionTotalBet = 0;
            let sessionTotalWin = 0;
            let bet = 50;
            let gameActive = false;
            let symbolsGrid = [];
            let cellsData = [];
            let scratchedCount = 0;
            let isEvaluating = false;

            // ──────────────── USER DATA ────────────────
            function initUserStats(u) {
                const defaults = {
                    globalStats: { totalWagered: 0, totalWon: 0, totalLosses: 0, totalGames: 0,
                        currentStreak: 0, bestStreak: 0, totalWins: 0 },
                    transactions: [],
                    gameOutcomes: [],
                    gamePlayCount: {},
                    balance: 0,
                    xp: 0,
                    level: 1,
                    avatar: 'fas fa-crown',
                    theme: 'theme-gold',
                    earnedAchievements: [],
                    scratchStats: { gamesPlayed: 0, wins: 0, biggestWin: 0, totalBet: 0, totalWin: 0,
                        bestStreak: 0, currentStreak: 0 },
                    lastDailyReward: null,
                    dailyStreak: 0,
                };
                for (const [k, v] of Object.entries(defaults)) {
                    if (u[k] === undefined) u[k] = v;
                }
                if (!u.scratchStats) u.scratchStats = { ...defaults.scratchStats };
                if (!u.scratchStats.bestStreak) u.scratchStats.bestStreak = 0;
                if (!u.scratchStats.currentStreak) u.scratchStats.currentStreak = 0;
                return u;
            }

            async function loadUser() {
                const sess = sessionStorage.getItem('gold_current_user');
                if (!sess) { window.location.href = '../../sign-in.html'; return false; }
                const su = JSON.parse(sess);
                const users = JSON.parse(localStorage.getItem('gold_users') || '{}');
                let user = users[su.username];
                if (!user) { sessionStorage.removeItem('gold_current_user');
                    window.location.href = '../../sign-in.html'; return false; }
                currentUser = initUserStats(user);
                su.balance = currentUser.balance;
                sessionStorage.setItem('gold_current_user', JSON.stringify(su));
                return true;
            }

            async function saveUser() {
                const users = JSON.parse(localStorage.getItem('gold_users') || '{}');
                users[currentUser.username] = currentUser;
                localStorage.setItem('gold_users', JSON.stringify(users));
                const sess = JSON.parse(sessionStorage.getItem('gold_current_user'));
                if (sess) { sess.balance = currentUser.balance;
                    sessionStorage.setItem('gold_current_user', JSON.stringify(sess)); }
            }

            function recordStats(betAmount, winAmount, matchedSymbol) {
                const net = winAmount - betAmount;
                const isWin = net > 0;
                const ss = currentUser.scratchStats;
                ss.gamesPlayed++;
                ss.totalBet += betAmount;
                ss.totalWin += winAmount;
                sessionTotalBet += betAmount;
                sessionTotalWin += winAmount;
                if (isWin) {
                    ss.wins++;
                    ss.currentStreak++;
                    if (ss.currentStreak > ss.bestStreak) ss.bestStreak = ss.currentStreak;
                    if (winAmount > ss.biggestWin) ss.biggestWin = winAmount;
                } else {
                    ss.currentStreak = 0;
                }
                currentUser.globalStats.totalGames++;
                currentUser.globalStats.totalWagered += betAmount;
                currentUser.globalStats.totalWon += winAmount;
                if (isWin) {
                    currentUser.globalStats.currentStreak = (currentUser.globalStats.currentStreak || 0) + 1;
                    if (currentUser.globalStats.currentStreak > (currentUser.globalStats.bestStreak || 0))
                        currentUser.globalStats.bestStreak = currentUser.globalStats.currentStreak;
                    currentUser.globalStats.totalWins = (currentUser.globalStats.totalWins || 0) + 1;
                } else if (net < 0) {
                    currentUser.globalStats.currentStreak = 0;
                }
                currentUser.xp = (currentUser.xp || 0) + Math.floor(betAmount * 0.6);
                checkLevelUp();
                currentUser.gamePlayCount['scratch-card'] = (currentUser.gamePlayCount['scratch-card'] || 0) + 1;
                currentUser.gameOutcomes.unshift({
                    game: 'ScratchCard',
                    result: isWin ? 'win' : 'loss',
                    profit: net,
                    multiplier: isWin ? WIN_MULTIPLIER : 0,
                    bet: betAmount,
                    win: winAmount,
                    date: new Date().toISOString(),
                });
                if (currentUser.gameOutcomes.length > 50) currentUser.gameOutcomes.pop();
                currentUser.transactions.unshift({
                    desc: `🎟️ Scratch | Bet ${betAmount} → ${isWin?'Won '+winAmount.toFixed(2):'No win'}`,
                    amount: net,
                    type: isWin ? 'game_win' : 'game_loss',
                    date: new Date().toISOString(),
                });
                if (currentUser.transactions.length > 30) currentUser.transactions.shift();
                checkAchievements(isWin, winAmount);
                saveUser();
                updateStatsMini();
            }

            function checkLevelUp() {
                const xpNeeded = Math.floor(100 * Math.pow(1.5, currentUser.level - 1));
                if (currentUser.xp >= xpNeeded) {
                    currentUser.xp -= xpNeeded;
                    currentUser.level++;
                    showToast(`Level Up! Now level ${currentUser.level}!`, '⬆️');
                    saveUser();
                }
            }

            function checkAchievements(isWin, winAmount) {
                const earned = currentUser.earnedAchievements || [];
                if (isWin && winAmount >= 5000 && !earned.includes('scratch_whale')) {
                    earned.push('scratch_whale');
                    showToast('Achievement: Scratch Whale! Won 5000+ GOLD', '🐋');
                }
                if (currentUser.scratchStats.wins >= 10 && !earned.includes('scratch_pro')) {
                    earned.push('scratch_pro');
                    showToast('Achievement: Scratch Pro! 10 wins', '🎫');
                }
                if (currentUser.scratchStats.currentStreak >= 5 && !earned.includes('scratch_streak')) {
                    earned.push('scratch_streak');
                    showToast('Achievement: Lucky Streak! 5 wins in a row', '🔥');
                }
                currentUser.earnedAchievements = earned;
            }

            function updateBalanceDisplay() {
                const el = dom.headerBalance;
                const prev = parseInt(el.textContent.replace(/,/g, '')) || 0;
                const next = currentUser.balance;
                if (prev !== next) {
                    animateNumber(el, prev, next, 400);
                    if (next > prev) {
                        dom.balanceTag.classList.add('pulse');
                        setTimeout(() => dom.balanceTag.classList.remove('pulse'), 500);
                    }
                } else {
                    el.textContent = next.toLocaleString();
                }
                validateBet();
            }

            function animateNumber(el, start, end, duration) {
                if (start === end) { el.textContent = end.toLocaleString(); return; }
                const range = end - start;
                const startTime = performance.now();

                function step(now) {
                    const progress = Math.min((now - startTime) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    el.textContent = Math.round(start + range * eased).toLocaleString();
                    if (progress < 1) requestAnimationFrame(step);
                    else el.textContent = end.toLocaleString();
                }
                requestAnimationFrame(step);
            }

            function validateBet() {
                const b = parseFloat(dom.betInput.value);
                const invalid = b > 0 && b > (currentUser?.balance || 0);
                dom.betInput.classList.toggle('invalid', invalid);
                dom.playBtn.disabled = gameActive || isEvaluating || b <= 0 || b > (currentUser?.balance || 0) || isNaN(
                    b);
            }

            function updateSessionDisplay() {
                const prof = sessionProfit;
                dom.sessionDisplay.textContent =
                    `📊 Session P/L: ${prof>=0?'+':''}${prof.toFixed(2)} GOLD`;
                dom.sessionDisplay.className = 'session-display' + (prof > 0 ? ' positive' : prof < 0 ? ' negative' : '');
            }

            function updateStatsMini() {
                const ss = currentUser.scratchStats;
                dom.gamesCount.textContent = ss.gamesPlayed || 0;
                dom.winsCount.textContent = ss.wins || 0;
                dom.bestWinDisplay.textContent = (ss.biggestWin || 0).toLocaleString();
                const rtp = ss.totalBet > 0 ? ((ss.totalWin / ss.totalBet) * 100).toFixed(1) : '0.0';
                dom.rtpDisplay.textContent = rtp + '%';
            }

            // ──────────────── SCRATCH CELL MANAGEMENT ────────────────
            function createCell(index) {
                const cell = document.createElement('div');
                cell.className = 'scratch-cell';
                cell.setAttribute('data-index', index);
                const symbolDiv = document.createElement('div');
                symbolDiv.className = 'symbol-display';
                const canvas = document.createElement('canvas');
                canvas.className = 'scratch-canvas';
                canvas.width = CANVAS_SIZE;
                canvas.height = CANVAS_SIZE;
                canvas.setAttribute('data-index', index);
                cell.appendChild(symbolDiv);
                cell.appendChild(canvas);
                const ctx = canvas.getContext('2d');
                const data = { cell, symbolDiv, canvas, ctx, scratched: false, progress: 0, index };
                setupScratchListeners(data);
                return data;
            }

            function buildGrid() {
                dom.scratchGrid.innerHTML = '';
                cellsData = [];
                for (let i = 0; i < 9; i++) {
                    const data = createCell(i);
                    dom.scratchGrid.appendChild(data.cell);
                    cellsData.push(data);
                }
            }

            function drawFoil(ctx) {
                const w = CANVAS_SIZE,
                    h = CANVAS_SIZE;
                ctx.globalCompositeOperation = 'source-over';
                ctx.clearRect(0, 0, w, h);
                // Metallic gold gradient
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#d4a843');
                grad.addColorStop(0.25, '#f5d97a');
                grad.addColorStop(0.5, '#c9a840');
                grad.addColorStop(0.7, '#ffd966');
                grad.addColorStop(0.85, '#b8941f');
                grad.addColorStop(1, '#e8c44c');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
                // Subtle diagonal lines for texture
                ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                ctx.lineWidth = 1;
                for (let i = -h; i < w + h; i += 12) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i + h, h);
                    ctx.stroke();
                }
                // Sparkle dots
                for (let i = 0; i < 50; i++) {
                    const sx = Math.random() * w;
                    const sy = Math.random() * h;
                    const sr = Math.random() * 3 + 1;
                    const sparkGrad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
                    sparkGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    sparkGrad.addColorStop(0.5, 'rgba(255,237,78,0.5)');
                    sparkGrad.addColorStop(1, 'rgba(255,200,60,0)');
                    ctx.fillStyle = sparkGrad;
                    ctx.beginPath();
                    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                    ctx.fill();
                }
                // "SCRATCH" text
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.font = 'bold 22px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('SCRATCH', w / 2, h / 2);
                // Subtle border inside
                ctx.strokeStyle = 'rgba(255,255,255,0.18)';
                ctx.lineWidth = 3;
                ctx.strokeRect(4, 4, w - 8, h - 8);
            }

            function resetAllFoils() {
                cellsData.forEach(d => {
                    d.scratched = false;
                    d.progress = 0;
                    d.cell.classList.remove('completed', 'scratched', 'revealed');
                    d.canvas.style.opacity = '1';
                    d.canvas.style.pointerEvents = 'auto';
                    d.symbolDiv.style.transform = 'scale(1)';
                    d.symbolDiv.style.filter = 'drop-shadow(0 0 8px rgba(255,217,102,0.5))';
                    drawFoil(d.ctx);
                });
                scratchedCount = 0;
                updateScratchesLeftDisplay();
            }

            function updateScratchesLeftDisplay() {
                const remaining = 3 - scratchedCount;
                dom.scratchesLeftEl.textContent =
                    `🎯 ${remaining} scratch${remaining===1?'':'es'} left`;
                dom.scratchesLeftEl.classList.toggle('urgent', remaining === 1 && gameActive);
            }

            // ──────────────── SCRATCH MECHANICS ────────────────
            function setupScratchListeners(data) {
                const canvas = data.canvas;
                let isScratching = false;

                function getPos(e) {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = CANVAS_SIZE / rect.width;
                    const scaleY = CANVAS_SIZE / rect.height;
                    let clientX, clientY;
                    if (e.touches && e.touches.length > 0) {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else if (e.changedTouches && e.changedTouches.length > 0) {
                        clientX = e.changedTouches[0].clientX;
                        clientY = e.changedTouches[0].clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }
                    return {
                        x: (clientX - rect.left) * scaleX,
                        y: (clientY - rect.top) * scaleY,
                    };
                }

                function scratchAt(e) {
                    if (!gameActive || data.scratched || isEvaluating) return;
                    e.preventDefault();
                    const pos = getPos(e);
                    const ctx = data.ctx;
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, BRUSH_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                    // Add slight randomness for natural feel
                    if (Math.random() < 0.5) {
                        ctx.beginPath();
                        ctx.arc(pos.x + (Math.random() - 0.5) * 8, pos.y + (Math.random() - 0.5) * 8,
                            BRUSH_RADIUS * 0.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    audio.play('scratch');
                }

                function startScratch(e) {
                    if (!gameActive || data.scratched || isEvaluating) return;
                    e.preventDefault();
                    isScratching = true;
                    scratchAt(e);
                    canvas.addEventListener('mousemove', scratchAt);
                    canvas.addEventListener('touchmove', scratchAt, { passive: false });
                }

                function stopScratch(e) {
                    if (!isScratching) return;
                    isScratching = false;
                    canvas.removeEventListener('mousemove', scratchAt);
                    canvas.removeEventListener('touchmove', scratchAt);
                    if (!data.scratched && gameActive && !isEvaluating) {
                        const progress = calculateScratchPercentage(data.ctx);
                        data.progress = progress;
                        if (progress >= SCRATCH_THRESHOLD) {
                            markCellCompleted(data);
                        }
                    }
                }

                canvas.addEventListener('mousedown', startScratch);
                canvas.addEventListener('touchstart', startScratch, { passive: false });
                canvas.addEventListener('mouseup', stopScratch);
                canvas.addEventListener('mouseleave', stopScratch);
                canvas.addEventListener('touchend', stopScratch);
                canvas.addEventListener('touchcancel', stopScratch);
            }

            function calculateScratchPercentage(ctx) {
                const imageData = ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                const pixels = imageData.data;
                let clearPixels = 0;
                const totalPixels = CANVAS_SIZE * CANVAS_SIZE;
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] < 128) clearPixels++;
                }
                return clearPixels / totalPixels;
            }

            function markCellCompleted(data) {
                if (data.scratched || !gameActive || isEvaluating) return;
                data.scratched = true;
                data.cell.classList.add('completed', 'scratched');
                data.canvas.style.pointerEvents = 'none';
                data.symbolDiv.style.transform = 'scale(1.15)';
                data.symbolDiv.style.filter = 'drop-shadow(0 0 14px rgba(255,237,78,0.8))';
                scratchedCount++;
                audio.play('cell_complete');
                updateScratchesLeftDisplay();
                if (scratchedCount >= 3) {
                    setTimeout(() => evaluateGame(), 350);
                }
            }

            // ──────────────── GAME LOGIC ────────────────
            function generateSymbols() {
                const arr = [];
                // Ensure at least some variety
                const allIndices = [0, 1, 2, 3, 4, 5];
                for (let i = 0; i < 9; i++) {
                    const idx = allIndices[Math.floor(Math.random() * allIndices.length)];
                    arr.push(SYMBOLS[idx]);
                }
                // Shuffle
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function startGame() {
                if (gameActive || isEvaluating) return;
                bet = parseFloat(dom.betInput.value);
                if (isNaN(bet) || bet <= 0) bet = 50;
                bet = Math.floor(bet * 100) / 100;
                if (bet < 1) bet = 1;
                if (bet > currentUser.balance) {
                    dom.resultMessage.innerHTML =
                        '<span style="color:#ff6b6b;">❌ Insufficient balance!</span>';
                    dom.resultArea.classList.add('lose');
                    setTimeout(() => dom.resultArea.classList.remove('lose'), 1500);
                    return;
                }
                // Deduct bet
                currentUser.balance -= bet;
                sessionProfit -= bet;
                saveUser().then(() => updateBalanceDisplay());
                updateSessionDisplay();
                audio.play('bet_place');

                // Generate symbols
                symbolsGrid = generateSymbols();
                cellsData.forEach((d, i) => {
                    d.symbolDiv.innerHTML =
                        `<i class="fas ${symbolsGrid[i].icon}" style="font-size:inherit;"></i>`;
                });

                // Reset foils
                resetAllFoils();
                gameActive = true;
                isEvaluating = false;
                dom.playBtn.disabled = true;
                dom.betInput.disabled = true;
                dom.resultMessage.innerHTML = '✨ Scratch any 3 cells!';
                dom.resultArea.classList.remove('win', 'lose');
                dom.bigWinDisplay.style.display = 'none';
                dom.scratchesLeftEl.classList.remove('urgent');
                updateScratchesLeftDisplay();
                validateBet();
            }

            async function evaluateGame() {
                if (isEvaluating || !gameActive) return;
                isEvaluating = true;
                gameActive = false;
                dom.betInput.disabled = false;

                // Find scratched cells
                const scratchedIndices = [];
                cellsData.forEach((d, i) => {
                    if (d.scratched) scratchedIndices.push(i);
                });
                if (scratchedIndices.length < 3) { isEvaluating = false;
                    gameActive = true; return; }

                const symbols = scratchedIndices.map(i => symbolsGrid[i]);
                const allSame = symbols.every(s => s.icon === symbols[0].icon);
                let winAmount = 0;

                if (allSame) {
                    winAmount = bet * WIN_MULTIPLIER;
                    currentUser.balance += winAmount;
                    sessionProfit += winAmount;
                    audio.play('jackpot');
                    triggerConfetti('jackpot');
                    const symName = symbols[0].name;
                    dom.resultMessage.innerHTML =
                        `<span style="color:#aaffaa;font-size:1.1rem;">🎉 JACKPOT! All ${symName}s! +${winAmount.toFixed(2)} GOLD</span>`;
                    dom.bigWinDisplay.style.display = 'block';
                    dom.bigWinDisplay.textContent = `${WIN_MULTIPLIER}×`;
                    dom.bigWinDisplay.style.animation = 'none';
                    void dom.bigWinDisplay.offsetWidth;
                    dom.bigWinDisplay.style.animation = 'multiPop 0.6s cubic-bezier(0.34,1.56,0.64,1)';
                    dom.resultArea.classList.add('win');
                    dom.resultArea.classList.remove('lose');
                    showToast(`Jackpot! Won ${winAmount.toFixed(2)} GOLD!`, '💎');
                } else {
                    audio.play('lose');
                    dom.resultMessage.innerHTML =
                        '<span style="color:#ffab91;">💔 No match. Try again!</span>';
                    dom.bigWinDisplay.style.display = 'none';
                    dom.resultArea.classList.add('lose');
                    dom.resultArea.classList.remove('win');
                }
                recordStats(bet, winAmount, allSame ? symbols[0].name : null);
                await saveUser();
                updateBalanceDisplay();
                updateSessionDisplay();
                updateStatsMini();

                // Reveal all cells after short delay
                setTimeout(() => {
                    cellsData.forEach(d => {
                        if (!d.scratched) {
                            d.ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                            d.canvas.style.opacity = '0';
                            d.canvas.style.pointerEvents = 'none';
                            d.cell.classList.add('scratched', 'revealed');
                            d.symbolDiv.style.transform = 'scale(1.05)';
                            d.symbolDiv.style.filter =
                                'drop-shadow(0 0 6px rgba(255,217,102,0.4))';
                        }
                    });
                }, 600);

                // Reset for next round
                setTimeout(() => {
                    gameActive = false;
                    isEvaluating = false;
                    dom.betInput.disabled = false;
                    dom.playBtn.disabled = false;
                    dom.scratchesLeftEl.classList.remove('urgent');
                    validateBet();
                    dom.resultArea.classList.remove('win', 'lose');
                }, 2200);
            }

            function addRipple(e, btn) {
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = e.clientX - rect.left - size / 2 + 'px';
                ripple.style.top = e.clientY - rect.top - size / 2 + 'px';
                btn.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            }

            // ──────────────── EVENT BINDINGS ────────────────
            dom.playBtn.addEventListener('click', (e) => {
                addRipple(e, dom.playBtn);
                audio.play('click');
                startGame();
            });

            dom.betInput.addEventListener('input', validateBet);
            dom.betInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !dom.playBtn.disabled) {
                    e.preventDefault();
                    startGame();
                }
            });

            dom.soundBtn.addEventListener('click', () => {
                audio.soundEnabled = !audio.soundEnabled;
                dom.soundBtn.innerHTML = audio.soundEnabled ?
                    '<i class="fas fa-volume-up"></i>' :
                    '<i class="fas fa-volume-mute"></i>';
                localStorage.setItem('gold_sound_enabled', audio.soundEnabled);
            });

            // Quick bet buttons
            $$('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (gameActive || isEvaluating) return;
                    if (btn.id === 'halfBetBtn') {
                        const cv = parseFloat(dom.betInput.value) || 50;
                        dom.betInput.value = Math.max(1, Math.floor(cv / 2));
                    } else if (btn.id === 'maxBetBtn') {
                        if (currentUser) dom.betInput.value = Math.floor(currentUser.balance);
                    } else {
                        const add = parseFloat(btn.dataset.bet);
                        const cv = parseFloat(dom.betInput.value) || 0;
                        let nv = cv + add;
                        if (currentUser && nv > currentUser.balance) nv = currentUser.balance;
                        dom.betInput.value = Math.max(1, Math.floor(nv));
                    }
                    audio.play('click');
                    validateBet();
                });
            });

            // Keyboard shortcut
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.repeat && !dom.playBtn.disabled) {
                    e.preventDefault();
                    startGame();
                }
            });

            // ──────────────── PARTICLES ────────────────
            function initParticles() {
                const container = document.getElementById('particlesContainer');
                for (let i = 0; i < 28; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const size = Math.random() * 5 + 2;
                    p.style.width = p.style.height = size + 'px';
                    p.style.left = Math.random() * 100 + '%';
                    p.style.setProperty('--delay', Math.random() * 8 + 's');
                    p.style.setProperty('--dur', (Math.random() * 6 + 5) + 's');
                    container.appendChild(p);
                }
            }

            // ──────────────── INIT ────────────────
            async function init() {
                initParticles();
                if (!(await loadUser())) return;
                buildGrid();
                updateBalanceDisplay();
                updateSessionDisplay();
                updateStatsMini();
                validateBet();

                const savedSound = localStorage.getItem('gold_sound_enabled');
                if (savedSound === 'false') {
                    audio.soundEnabled = false;
                    dom.soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                }

                await audio.init();
                document.body.addEventListener('click', () => audio.init(), { once: true });
                document.body.addEventListener('touchstart', () => audio.init(), { once: true });
                document.body.addEventListener('keydown', () => audio.init(), { once: true });
            }

            init();

            // Cleanup
            window.addEventListener('beforeunload', () => {
                audio.destroy();
            });

            console.log('%c🎟️ GOLD SCRATCH CARD %c| Premium Casino Edition %cLoaded',
                'color:#ffd966;font-size:1.1rem;',
                'color:#f5f0e6;',
                'color:#aaffaa;');
        })();
    </script>
</body>
</html>
