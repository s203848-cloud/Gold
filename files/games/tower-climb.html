                multiplier: getMultiplier(floor),
                bet: baseBet,
                date: new Date().toISOString()
            });
            if (currentUser.gameOutcomes.length > 50) currentUser.gameOutcomes.pop();
        }

        function disableButtons() {
            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('startBtn').disabled = true;
            setDifficultyButtonsEnabled(false);
        }

        function setDifficultyButtonsEnabled(enabled) {
            document.querySelectorAll('.diff-btn').forEach(btn => { btn.disabled = !enabled; });
        }

        /* ---- START ---- */
        async function startGame() {
            if (gameActive) return;
            const bet = Math.floor(parseFloat(document.getElementById('betAmount').value));
            if (isNaN(bet) || bet < 1 || bet > currentUser.balance) return;

            currentUser.balance -= bet;
            baseBet = bet;
            currentFloor = 0;
            focusFloor = 0;
            climbedColumns = [];
            generateTowerMines();
            gameActive = true;

            setDifficultyButtonsEnabled(false);
            await saveUser();
            updateBalance();

            document.getElementById('cashoutBtn').disabled = false;
            document.getElementById('startBtn').disabled = true;

            const res = document.getElementById('resultMessage');
            res.innerHTML = '<i class="fas fa-arrow-up"></i> <span>Choose a column to climb — one tile hides a mine.</span>';
            res.className = 'result-panel';

            updateMultiplierPanel();
            buildTower();
            playTone('start');
        }

        /* ---- RESET ---- */
        function resetGame() {
            gameActive = false;
            currentFloor = 0;
            focusFloor = 0;
            climbedColumns = [];
            towerMines = [];
            baseBet = 0;

            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('startBtn').disabled = false;
            setDifficultyButtonsEnabled(true);

            document.getElementById('climbCount').textContent = '0';
            document.getElementById('towerFloorPill').textContent = '1';
            document.getElementById('multiplierDisplay').textContent = '1.00×';
            const payout = document.getElementById('cashoutPreview');
            payout.textContent = '0 GOLD';
            payout.classList.remove('lit');
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('multHud').classList.remove('heat-1', 'heat-2', 'heat-3');

            const res = document.getElementById('resultMessage');
            res.innerHTML = '<i class="fas fa-info-circle"></i> <span>Select difficulty &amp; start climbing!</span>';
            res.className = 'result-panel';

            buildTower();
            validateBet();
        }

        function setDifficulty(mines) {
            if (gameActive) return;
            minesPerFloor = mines;
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.mines) === mines);
            });
            updateMultiplierPanel();
        }

        /* ============================================================
           EVENT BINDINGS
        ============================================================ */
        function bindEvents() {
            document.getElementById('startBtn').addEventListener('click', (e) => {
                addRipple(e, e.currentTarget); startGame();
            });
            document.getElementById('cashoutBtn').addEventListener('click', (e) => {
                addRipple(e, e.currentTarget); cashOut(false);
            });

            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    setDifficulty(parseInt(btn.dataset.mines));
                    playTone('click');
                });
            });

            document.querySelectorAll('.quick-bet').forEach(btn => {
                btn.addEventListener('click', () => {
                    const inp = document.getElementById('betAmount');
                    if (btn.id === 'halfBetBtn') {
                        const v = parseFloat(inp.value) || 0;
                        inp.value = Math.max(1, Math.floor(v / 2));
                    } else if (btn.id === 'maxBetBtn') {
                        if (currentUser) inp.value = Math.floor(currentUser.balance);
                    } else {
                        const add = parseFloat(btn.dataset.bet);
                        const val = parseFloat(inp.value) || 0;
                        let nv = val + add;
                        if (currentUser && nv > currentUser.balance) nv = currentUser.balance;
                        inp.value = Math.max(1, Math.floor(nv));
                    }
                    validateBet();
                    playTone('click');
                });
            });

            document.getElementById('betAmount').addEventListener('input', validateBet);

            document.getElementById('soundToggleBtn').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.getElementById('soundToggleBtn').innerHTML =
                    soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
                localStorage.setItem('gold_sound_enabled', soundEnabled);
                if (soundEnabled) initAudio();
            });

            /* keyboard shortcuts */
            document.addEventListener('keydown', (e) => {
                const tag = (e.target.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea') return;

                if (!gameActive) {
                    if (e.key === 'Enter') { e.preventDefault(); startGame(); }
                    return;
                }
                if (e.key >= '1' && e.key <= '5') {
                    const col = parseInt(e.key) - 1;
                    if (currentFloor < TOTAL_FLOORS) onCellClick(currentFloor, col);
                } else if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    cashOut(false);
                }
            });

            window.addEventListener('resize', () => {
                positionTower(focusFloor, false);
            });
        }

        /* ============================================================
           BACKGROUND DUST
        ============================================================ */
        function createSparkles() {
            const cont = document.getElementById('bgParticles');
            for (let i = 0; i < 44; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + '%';
                s.style.bottom = -(Math.random() * 20 + 5) + '%';
                s.style.animationDelay = Math.random() * 7 + 's';
                s.style.animationDuration = (Math.random() * 5 + 5) + 's';
                cont.appendChild(s);
            }
        }

        /* ============================================================
           INIT
        ============================================================ */
        async function init() {
            createSparkles();
            if (!(await loadUser())) return;

            setDifficulty(1);
            buildTower();
            bindEvents();
            updateStats();
            validateBet();

            const savedSound = localStorage.getItem('gold_sound_enabled');
            if (savedSound === 'false') {
                soundEnabled = false;
                document.getElementById('soundToggleBtn').innerHTML = '<i class="fas fa-volume-mute"></i>';
            } else {
                soundEnabled = true;
            }
        }

        init();
    })();
</script>
</body>
</html>
